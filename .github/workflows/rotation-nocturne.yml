name: Rotation nocturne PharmaVeille
on:
  schedule:
    - cron: '1,16,31,46 * * * *'   # :02/:17/:32/:47 Paris (UTC+1) — GitHub retarde souvent, ~1 run/h en pratique
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pousser TOUTES les salves dues dans la file d'injection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DUE=$(TZ='Europe/Paris' date +%Y-%m-%dT%H-%M)
          echo "Heure Paris : $DUE"
          mkdir -p candidates-queue
          PICKED=0
          for f in $(ls staging-veille/*.json 2>/dev/null | sort); do
            SLOT=$(basename "$f" .json)
            if [[ "$SLOT" > "$DUE" ]]; then break; fi
            git mv "$f" "candidates-queue/$(basename "$f")"
            PICKED=$((PICKED+1))
            echo "Salve due : $f"
            if [ "$PICKED" -ge 15 ]; then echo "Cap de 15 salves par run atteint."; break; fi
          done
          if [ "$PICKED" -eq 0 ]; then echo "Aucune salve due — staging vide ou pas encore l'heure."; exit 0; fi
          git config user.name "vibe-veille[bot]"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "file candidates: rotation nocturne — $PICKED salve(s) due(s) à $DUE"
          git push
          gh workflow run inject.yml --ref main
          echo "Injection déclenchée pour $PICKED salve(s)"
