ois (29/10/2026)","https://lanouvelletribune.info/2026/10/novo-nordisk-commercialise-le-wegovy-en-comprime-en-france-des-le-2-novembre-a-169-e-par-mois/"],["Santé Matin — Wegovy en comprimé arrive en France le 2 novembre 2026","https://www.santematin.fr/wegovy-comprime-france-2-novembre-2026-prise-patients"],["Le Moniteur des Pharmacies — Wegovy en comprimé : une option de plus, mais sans remboursement","https://www.lemoniteurdespharmacies.fr/therapeutique/medicaments/fiches-medicaments/wegovy-en-comprime-une-option-de-plus-dans-lobesite-mais-sans-remboursement"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Anticiper les questions de délivrance — prise à jeun le matin avec un gobelet d'eau et délai avant la première ingestion alimentaire (règle identique à Rybelsus, à rappeler : 30 minutes), pas de remboursement (prix libre — vérifier chaque prescription et son cadre de prise en charge), observance quotidienne à évaluer vs injection hebdomadaire, effets digestifs transitoires (nausées) et ne pas confondre avec Rybelsus (indication DT2)."},{"dom":"Diabète & Endocrinologie","type":"Alimentation","n":3,"dt":"2026-10","titre":"RESET for Remission : 54 % de rémission du DT2 diagnostiqué avant 45 ans en 6 mois par régime hypocalorique + exercice encadré (vs 4 % sous soins usuels) — essai anglo-canadien, EASD / The Lancet Regional Health","subst":"rémission DT2 · régime hypocalorique · exercice supervisé","res":"Essai randomisé international mené par McGill (Pr Kaberi Dasgupta) et Leicester : chez des adultes de moins de 45 ans atteints d'un DT2 précoce (population à haut risque de complications à vie), un programme combinant 12 semaines de régime hypocalorique (~800-900 kcal/jour) puis un exercice physique structuré et supervisé (3 séances/semaine, relais lus) a induit une rémission du diabèse chez 54 % des participants à 6 mois, contre 4 % sous soins usuels (chiffres lus : ScienceDaily du 30/10/2026 « 54 % of participants under age 45… compared with just 4 % » ; MUHC, page vue ; présenté au congrès annuel de l'EASD et publié dans The Lancet Regional Health Americas, pages vues). C'est la première fois que la combinaison régime hypocalorique + exercice structuré est testée spécifiquement dans le DT2 à début jeune.","src":[["ScienceDaily — 54 % achieve remission in just 6 months (30/10/2026)","https://www.sciencedaily.com/releases/2026/10/261029072129.htm"],["The Lancet Regional Health Americas — Low energy diet plus supervised exercise vs usual care (RESET for Remission)","https://www.thelancet.com/journals/lanam/article/PIIS2667-193X(26)00294-2/fulltext"],["MUHC — Half of young adults with type 2 diabetes reach remission","https://muhc.ca/news-and-patient-stories/news/half-young-adults-type-2-diabetes-reach-remission-through-diet-and"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message aux patients jeunes DT2 — la rémission est un objectif réel et rapide (6 mois) avec un programme intensif encadré, pas une simple « perte de poids » au comptoir ; rôle du pharmacien : repérer les candidats (DT2 récent, < 45 ans, motivé), orienter vers les programmes structurés (diététicien, sport santé sur prescription), et alerter sur les hypoglycémies si antidiabétiques en cours (les doses doivent être réajustées par le médecin pendant le programme)."},{"dom":"Diabète & Endocrinologie","type":"Alimentation","n":1,"dt":"2025-12","titre":"Rémission du DT2 sans chirurgie : la méta-analyse de référence des essais randomisés — Diabetes Care (déc. 2025)","subst":"rémission diabète de type 2 · interventions non chirurgicales","res":"Revue systématique et méta-analyse des essais randomisés non chirurgicaux sur la rémission du DT2 (recherche MEDLINE/Embase jusqu'à avril 2025, page Diabetes Care vue : « Type 2 Diabetes Remission: A Systematic Review and Meta-analysis of Nonsurgical Randomized Controlled Trials », Diabetes Care 2025;48(12):2181) : l'analyse évalue l'effet des interventions non chirurgicales sur la rémission et caractérise les composantes clés des programmes efficaces. Complément bibliographique de l'essai RESET (même jour) : ici la vue d'ensemble de toutes les approches testées en essais randomisés, là le résultat d'un programme précis.","src":[["Diabetes Care — Type 2 Diabetes Remission: A Systematic Review and Meta-analysis (2025;48(12):2181)","https://diabetesjournals.org/care/article/48/12/2181/163414/Type-2-Diabetes-Remission-A-Systematic-Review-and"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument de cadrage pour le conseil — la rémission passe par des programmes intensifs encadrés (repérage précoce, soutien diététique, activité physique), pas par un médicament ni un complément ; utile pour prioriser les messages (perte de poids précoce après le diagnostic = fenêtre d'opportunité)."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":4,"dt":"2026-01","titre":"Carence en vitamine B12 sous metformine : un facteur de risque génétique identifié (variant du gène TCN2) — Diabetologia, cohortes DPP (janv. 2026)","subst":"metformine · vitamine B12 · TCN2 (transcobalamine II)","res":"Étude de pharmacogénétique publiée dans Diabetologia (Baldwin et al., « Identification of a genetic risk factor for metformin-induced vitamin B12 deficiency », citation vue : Diabetologia 2026 Jan 15;69(4):953-965 ; texte PMC vu) menée sur les cohortes du Diabetes Prevention Program : comparaison de 487 individus avec carence en B12 induite par la metformine et 6 686 individus tolérants à la metformine — un variant du gène TCN2 (transcobalamine II, la protéine de transport de la B12 dans le sang) est identifié comme facteur de risque génétique de carence. Mécanisme connu (revues vues) : la metformine perturbe la liaison entre la B12 ingérée et le facteur intrinsèque de Castle, indispensable à son absorption ; prévalence de la carence estimée entre 5 et 30 % selon les populations (JIM, page vue).","src":[["Diabetologia — Identification of a genetic risk factor for metformin-induced vitamin B12 deficiency (2026;69(4):953-965)","https://link.springer.com/article/10.1007/s00125-025-06655-5"],["PMC — texte intégral (Diabetologia 2026)","https://pmc.ncbi.nlm.nih.gov/articles/PMC12957035/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Renforcer la vigilance B12 chez les patients sous metformine au long cours (doses élevées, sujet âgé, régime végétarien) — symptômes frustes (paresthésies des pieds, fatigue, troubles cognitifs légers) à ne pas mettre sur le seul compte du diabète ou de l'âge ; un dosage de B12 est simple à suggérer au médecin en cas de neuropathie ou d'anémie inexpliquée."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2026-06","titre":"Survodutide (double agoniste glucagon/GLP-1) : phase 3 SYNCHRONIZE-MASLD positive dans le foie gras — stéatose hépatique et poids réduits vs placebo, publié dans Nature Medicine (08/06/2026)","subst":"survodutide · MASLD/MASH · agoniste double glucagon/GLP-1","res":"Dans SYNCHRONIZE-MASLD (essai de phase 3 randomisé, en double aveugle vs placebo, adultes obèses avec stéatose hépatique associée à un dysfonctionnement métabolique), le survodutide (Boehringer Ingelheim) en injection sous-cutanée hebdomadaire a réduit la teneur en graisse hépatique et le poids vs placebo (Nature Medicine, article vu : « weekly subcutaneous injections of survodutide, a glucagon receptor/GLP-1R dual agonist, lowered liver fat content and body weight compared to placebo », résultats présentés au congrès de l'ADA) — publication mise en ligne le 8 juin 2026 (Clinical Trial Vanguard, page vue). Le laboratoire précise (page vue) : les deux critères principaux sont atteints, avec une normalisation de la graisse hépatique atteinte par 6 participants sur 10 au plus fort dosage selon les résultats détaillés présentés ; le survodutide bénéficie d'une désignation FDA Breakthrough Therapy dans le MASH non cirrhotique avec fibrose modérée à avancée. Effets indésirables les plus fréquents : diarrhée et nausées ; pas encore de preuve sur cirrhose, transplantation ou mortalité (revue vue). DISTINCT du resmétírom (déjà en base + entrée du jour : autre mécanisme, approuvé) et des agonistes GLP-1 seuls déjà en base.","src":[["Nature Medicine — Survodutide in adults with obesity and MASLD: SYNCHRONIZE-MASLD (2026)","https://www.nature.com/articles/s41591-026-04479-3"],["Clinical Trial Vanguard — SYNCHRONIZE-MASLD publié le 8 juin 2026","https://www.clinicaltrialvanguard.com/opinion/reading-the-synchronize-masld-phase-3-trial-publication-closely/"],["Boehringer Ingelheim — données détaillées de phase 3 et désignation FDA Breakthrough Therapy","https://www.boehringer-ingelheim.com/human-health/crm-health/metabolic-health/survodutide-phase-3-fat-loss-obesity-dual-agonist-data"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas encore disponible — canal d'information des patients « foie gras » : la vague thérapeutique MASH arrive (resmétírom en accès précoce en France, survodutide en phase 3), mais le socle reste la perte de poids ; prudence sur les achats en ligne de « GLP-1 pour le foie » (produits non évalués, contrefaçons)."},{"dom":"Obésité & Métabolisme","type":"Officine","n":5,"dt":"2026-02","titre":"Resmétírom (Rezdiffra) : autorisation d'accès précoce en France le 12/02/2026 dans le MASH avec fibrose F2-F3 — et entrée dans les premières recommandations européennes (J Hepatol, 28/09/2026)","subst":"resmétírom (Rezdiffra) · MASH · stéatohépatite métabolique","res":"En France, le resmétírom (Rezdiffra) a obtenu une autorisation d'accès précoce le 12 février 2026 (ameli, page vue) : agoniste du récepteur THR-β hépatique, il agit sur le métabolisme lipidique hépatique, ralentit la progression de la fibrose et est prescrit en association aux mesures hygiéno-diététiques dans la stéatohépatite associée à un dysfonctionnement métabolique (MASH) avec fibrose F2-F3. Le Vidal (actualité vue) documente ensuite son entrée dans les premières recommandations européennes de prise en charge du MASH, publiées le 28 septembre 2026 dans le Journal of Hepatology — jusqu'ici, la prise en charge reposait essentiellement sur les mesures hygiéno-diététiques.","src":[["Ameli — Traitement de la stéatose hépatique (MASLD) et MASH : resmétírom en accès précoce le 12/02/2026","https://www.ameli.fr/assure/sante/themes/steatose-hepatique/traitement"],["Vidal — MASH : le resmétírom en accès précoce en France entre dans les recommandations européennes (J Hepatol, 28/09/2026)","https://www.vidal.fr/actualites/38404-mash-le-resmetirom-en-acces-precoce-en-france-entre-dans-les-recommandations-europeennes.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Premier médicament du MASH accessible en France (l'accès précoce implique un circuit hospitalier pour l'initiation) — au comptoir : cadrer les attentes des patients « foie gras » (le traitement s'ajoute à la perte de poids, pas à sa place ; la stéatose simple sans fibrose significative n'en relève pas), vérifier les interactions à la délivrance et l'observance du suivi hépatique biologique prescrit."},{"dom":"Diabète & Endocrinologie","type":"Officine","n":5,"dt":"2026-05","titre":"Nodules thyroïdiens bénins : la thermoablation par radiofréquence s'organise en France — recommandations sur les indications/contre-indications et sur la prévention des complications (2026)","subst":"nodule thyroïdien · thermoablation · radiofréquence","res":"Deux jeux de recommandations français lus : (1) « Indications et contre-indications de la thermoablation des nodules thyroïdiens bénins » (ScienceDirect 2026, page vue : le bilan préthérapeutique repose sur l'échographie, la cytoponction, la biologie thyroïdienne et l'information du patient ; concertation pluridisciplinaire souhaitée pour les cas atypiques ; visés : nodules bénins symptomatiques ou en croissance ; contexte lu : prévalence des nodules jusqu'à 60 % de la population, bénignité de plus de 95 %) ; (2) « Recommandations sur la prévention et la prise en charge des complications des thermoablations » — Journal d'imagerie diagnostique et interventionnelle, disponible en ligne le 20 mai 2026 (EM-Consulte, page vue ; la thermoablation repose sur la radiofréquence ou d'autres sources d'énergie). Exemple de filière : le CHU de Nantes a lancé la sienne fin avril 2025, 35 patients traités (Infodujour, page vue) ; le principe (Cochin AP-HP, page vue) : réduire le volume du nodule (50-80 %) sans cicatrice au cou et en préservant la thyroïde.","src":[["ScienceDirect — Indications et contre-indications de la thermoablation des nodules thyroïdiens bénins (2026)","https://www.sciencedirect.com/science/article/pii/S2543343126000618"],["EM-Consulte — Recommandations sur la prévention et la prise en charge des complications des thermoablations (J Imagerie Diagn Interv, 20/05/2026)","https://www.em-consulte.com/article/1811395/recommandations-sur-la-prevention-et-la-prise-en-c"],["Infodujour — CHU de Nantes : filière thermoablation lancée fin avril 2025, 35 patients","https://infodujour.fr/sante/87531-nodules-thyroidiens-au-chu-de-nantes-une-technique-innovante-pour-eviter-certaines-operations"],["Cochin AP-HP — thermoablation des nodules thyroïdiens bénins par radiofréquence","https://www.radiologie-cochin.fr/nodules-thyroidiens.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Alternative mini-invasive à la chirurgie de plus en plus proposée pour les nodules bénins sélectionnés — questions attendues des patients : « vais-je être opéré(e) ? » → expliquer que la thermoablation est une option validée pour nodules bénins (pas pour cancer), sous conditions ; après la procédure : douleur cervicale transitoire possible, surveillance échographique programmée, poursuivre la lévothyroxine si elle est prescrite."},{"dom":"Rhumatologie","type":"Médicament","n":4,"dt":"2025-06","titre":"Goutte : traiter l'acide urique « aux objectifs » (treat-to-target, < 360 µmol/L) réduit les événements cardiovasculaires majeurs vs stratégie « fire-and-forget » — cohortes CPRD/VEGA, congrès EULAR 2025","subst":"goutte · acide urique · allopurinol · événements cardiovasculaires (MACE)","res":"Données présentées au congrès EULAR 2025 (Barcelone — dateline Medscape « BARCELONA ») : l'atteinte d'un acide urique < 360 µmol/L dans les 12 mois suivant la première prescription d'un traitement hypouricémiant (« treat-to-target ») est associée à une réduction du risque d'événements cardiovasculaires majeurs (MACE) à 5 ans par rapport à une stratégie « fire-and-forget » (abstract OP0005 vu : « To evaluate the effect of achieving SU <360 µmol/l within 12 months of first prescription of urate-lowering therapy (ULT) on the 5-year risk of MACE » ; cohortes : 109 504 Britanniques CPRD et 7 014 Suédois VEGA, chiffres lus sur Frequency Medicale : survie sans MACE 89,4 % dans le groupe treat-to-target). Medscape (page vue) qualifie la réduction de « modeste mais significative » ; les auteurs soulignent l'intérêt de cibles d'acide urique bien définies et d'une prévention cardiovasculaire intégrée.","src":[["Annals of the Rheumatic Diseases (abstract OP0005) — Cardiovascular outcomes of treat-to-target vs fire-and-forget urate-lowering therapy","https://www.sciencedirect.com/science/article/abs/pii/S0003496725010611"],["Frequency Medicale — Goutte : traiter l'hyperuricémie aux objectifs réduit le risque cardiovasculaire (EULAR 2025, CPRD/VEGA)","https://www.frequencemedicale.com/onco_autres/actualites/13727-Goutte-traiter-l-hyperuricemie-aux-objectifs-reduit-le-risque-cardiovasculaire"],["Medscape — Meeting Target Serum Urate Level Cuts Cardiovascular Risk in Gout (EULAR, Barcelone)","https://www.medscape.com/viewarticle/meeting-target-serum-urate-level-cuts-cardiovascular-risk-2025a1000h0c"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les patients goutteux négligent souvent le traitement de fond hors crise — message : l'hypouricémiant (allopurinol, fébuxostat) ne sert pas qu'à éviter les crises, il protège aussi le cœur ; vérifier l'observance au long cours (pas d'arrêt pendant une crise), rappeler la cible (< 360 µmol/L, parfois < 300) sur les ordonnances de suivi, et la couverture anti-crises à l'instauration (colchicine si prescrite)."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":3,"dt":"2026-01","titre":"Tirzépatide dans le diabète de type 1 : premier essai randomisé (phase 2, 12 semaines) — perte de poids et réduction des doses d'insuline — Diabetes Care (janv. 2026)","subst":"tirzépatide · diabète de type 1 (usage hors AMM)","res":"Premier essai randomisé contrôlé du tirzépatide dans le DT1 : essai de phase 2 randomisé, en double aveugle vs placebo, de 12 semaines chez des adultes atteints de DT1 avec obésité, présenté au 61e congrès de l'EASD (Vienne, 15-19 septembre 2025 — mention « Prior Presentation » lue sur la page Diabetes Care) et publié dans Diabetes Care (2026;49(1):161, citation vue : « Tirzepatide in Adults With Type 1 Diabetes: A Phase 2 Randomized Placebo-Controlled Clinical Trial », doi 10.2337/dc25-2379). Résultats lus (ReachMD, page vue) : perte de poids moyenne dans le groupe tirzépatide en adjonction à l'insuline, sans événement indésirable significatif rapporté dans le suivi ; l'amélioration du poids et de la composition corporelle et la réduction des doses d'insuline sont rapportées (Univadis EASD, vu en recherche). Le tirzépatide n'est pas approuvé dans le DT1 (aucun essai pivot d'AMM n'a inclus de patients en déficit insulinique absolu).","src":[["Diabetes Care — Tirzepatide in Adults With Type 1 Diabetes: A Phase 2 Randomized Placebo-Controlled Clinical Trial (2026;49(1):161)","https://diabetesjournals.org/care/article/49/1/161/163859/Tirzepatide-in-Adults-With-Type-1-Diabetes-A-Phase"],["ReachMD — Tirzepatide in Type 1 Diabetes: Phase 2 Trial Readout","https://reachmd.com/news/tirzepatide-in-type-1-diabetes-phase-2-trial-readout/2486814/"],["Diabetes Care — doi 10.2337/dc25-2379","https://doi.org/10.2337/dc25-2379"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Attention aux demandes de prescriptions hors AMM dans le DT1 — un essai de phase 2 de 12 semaines ne valide pas un usage en routine ; points de vigilance si un patient DT1 l'utilise malgré tout (suivi médical indispensable) : risque d'acidocétose (les GLP-1 peuvent la masquer en réduisant l'insuline, particulièrement en cas d'omission des injections), hypoglycémies si les doses d'insuline ne sont pas réajustées par le médecin."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2025-03","titre":"Codéine et tramadol : ordonnance sécurisée obligatoire depuis le 1er mars 2025 (y compris sirops antitussifs pédiatriques) — ANSM","subst":"codéine · tramadol · ordonnance sécurisée · sirops toux","res":"À partir du 1er mars 2025, tous les médicaments contenant de la codéine, de la dihydrocodéine ou du tramadol doivent être prescrits sur ordonnance sécurisée (ANSM, actualité vue : « Tramadol et codéine : les nouvelles règles de prescription et délivrance entrent en vigueur le 1er mars 2025 » ; Service-Public, page vue) ; les ordonnances non sécurisées établies avant cette date restent valables jusqu'à la fin de la durée de traitement prescrite (ANSM, lu) ; la durée de prescription du tramadol est réduite à 12 semaines (mention lue sur la page ANSM). Ces dispositions s'appliquent aussi aux sirops antitussifs des enfants : le Vidal (page toux de l'enfant, vue) rappelle que depuis le 1er mars 2025 les sirops contenant de la codéine relèvent de l'ordonnance sécurisée, et que les sirops à base de pholcodine (DIMETANE, BIOCALYPTOL, BRONC…) utilisés contre la toux ont été retirés du marché. Suite directe de la fin de la vente libre de la codéine (2017).","src":[["ANSM — Tramadol et codéine : nouvelles règles en vigueur le 1er mars 2025","https://ansm.sante.fr/actualites/tramadol-et-codeine-les-nouvelles-regles-de-prescription-et-delivrance-entrent-en-vigueur-le-1er-mars-2025"],["Service-Public — Ordonnance sécurisée désormais obligatoire pour codéine et tramadol (A17699)","https://www.service-public.gouv.fr/particuliers/actualites/A17699"],["Vidal — Les médicaments contre la toux de l'enfant (codéine sécurisée, pholcodine retirée)","https://www.vidal.fr/maladies/chez-les-enfants/toux-enfant/medicaments.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Au comptoir pédiatrique, anticiper les parents qui réclament « le sirop à la codéine » en automédication — il n'y a plus de délivrance possible sans ordonnance sécurisée ; orienter vers les alternatives validées selon l'âge (lavage de nez, miel ≥ 1 an pour la toux nocturne, hydratation), et expliquer la règle de transition pour les ordonnances antérieures au 01/03/2025."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":5,"dt":"2025-01","titre":"Vaccination obligatoire contre les méningocoques B et ACWY : en vigueur depuis le 1er janvier 2025 pour les enfants nés à partir de 2023, avec rattrapage transitoire 2-4 ans — décret et campagne","subst":"méningocoque B · ACWY · Bexsero · Menveo/Nimenrix · obligation vaccinale","res":"Le décret n° 2024-694 du 5 juillet 2024 (Légifrance, texte vu) instaure l'obligation vaccinale contre les méningocoques de type B et ACWY, entrée en vigueur le 1er janvier 2025 (notice lue) ; le ministère précise (pages vues) que ces nouvelles obligations s'appliquent à tous les enfants nés à compter du 1er janvier 2023, et qu'un rattrapage vaccinal transitoire contre les méningocoques ACWY et B est mis en place pour les jeunes enfants de 2 ans à 4 ans révolus (jusqu'au 5e anniversaire), y compris ceux déjà vaccinés contre d'autres sérogroupes. Contexte lu : face à la recrudescence des infections invasives à méningocoques, la vaccination est « la stratégie de prévention la plus efficace » (dossier ANSM vu) ; chez les adolescents de 11 à 14 ans, la vaccination ACWY est recommandée indépendamment du statut vaccinal (Vaccination Info Service, page vue) ; la prise en charge des vaccins (Nimenrix, Menveo, Bexsero) dans le rattrapage 2-4 ans relève d'arrêtés de 2026 (MesVaccins, page vue).","src":[["Ministère de la Santé — Nouvelles obligations vaccinales méningocoques B et ACWY","https://sante.gouv.fr/soins-et-maladies/maladies/maladies-de-l-enfant/article/nouvelles-obligations-vaccinales-meningocoques-b-et-acwy"],["Légifrance — Décret n° 2024-694 du 5 juillet 2024 (vigueur 01/01/2025)","https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000049888947"],["Ministère de la Santé — Le calendrier des vaccinations (rattrapage méningocoques 2-4 ans)","https://sante.gouv.fr/prevention-en-sante/preserver-sa-sante/vaccination/calendrier-vaccinal"],["ANSM — La vaccination, pilier de la prévention contre les méningocoques","https://ansm.sante.fr/dossiers-thematiques/la-vaccination-pilier-de-la-prevention-contre-les-meningocoques"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Sujet majeur de conseil — vérifier le carnet de santé à chaque délivrance pédiatrique (le pharmacien peut vacciner à partir de 11 ans pour les vaccins de calendrier), expliquer le schéma combiné B + ACWY aux parents de nourrissons nés depuis 2023, et penser au rattrapage pour les 2-4 ans avant le 5e anniversaire."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":5,"dt":"2025-09","titre":"Bronchiolite : la campagne VRS 2025-2026 a débuté le 1er septembre 2025 — deux stratégies, vaccination maternelle (Abrysvo) ou immunisation des nouveau-nés (nirsévimab)","subst":"VRS · bronchiolite · nirsévimab (Beyfortus) · vaccination maternelle Abrysvo","res":"La campagne de prévention des infections à VRS 2025-2026 a débuté le 1er septembre 2025 (MesVaccins, page vue ; ARS PACA, page vue) et repose sur deux stratégies (Vidal, actualité vue) : la vaccination maternelle contre le VRS (Abrysvo, pour les mères dont l'accouchement est attendu pendant la saison) OU l'immunisation des nouveau-nés et nourrissons par anticorps monoclonaux (nirsévimab/Beyfortus) ; à titre de rattrapage, les enfants nés entre février et août 2025 sont également concernés (Vidal, lu). L'ordre des pharmaciens (page vue) précise que l'immunisation s'adresse à l'ensemble des enfants vivant leur première saison de VRS selon les indications des RCP.","src":[["Vidal — Campagne 2025-2026 de prévention des infections à VRS : vaccin Abrysvo ou anticorps monoclonaux","https://www.vidal.fr/actualites/31448-campagne-2025-2026-de-prevention-des-infections-a-vrs-vaccin-abrysvo-ou-anticorps-monoclonaux.html"],["MesVaccins — La campagne de prévention 2025-2026 a débuté le 1er septembre","https://www.mesvaccins.net/web/news/23476-bronchiolite-du-nourrisson-la-campagne-de-prevention-2025-2026-a-debute-le-1er-septembre"],["Ordre des pharmaciens — Modalités de la campagne d'immunisation des nourrissons contre le VRS","https://www.ordre.pharmacien.fr/les-communications/focus-sur/les-actualites/modalites-de-mise-en-aeuvre-de-la-campagne-d-immunisation-des-nourrissons-et-nouveau-nes-contre-les-infections-a-virus-respiratoire-syncytial-vrs"],["Santé respiratoire — Campagne 2025 contre le VRS : comment protéger les nourrissons (01/09/2025)","https://sante-respiratoire.com/campagne-2025-contre-le-vrs-comment-proteger-les-nourrissons/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Anticiper les questions des futurs parents et des familles en automne — expliquer le double dispositif (vaccin pour la femme enceinte en fin de grossesse, anticorps pour le nourrisson), vérifier que les nourrissons de la saison ont bien reçu leur dose, et rappeler les gestes simples (lavage des mains, évitement de la foule et du tabac pour les tout-petits)."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":4,"dt":"2025-11","titre":"Nirsévimab (Beyfortus) : efficacité maintenue en population générale infantile en France après deux saisons — les souches VRS-B mutées ne compromettent pas la protection","subst":"nirsévimab · VRS-B · efficacité vie réelle France","res":"Deux saisons consécutives d'infection à VRS chez les nourrissons en France ont confirmé la haute efficacité du nirsévimab pour prévenir les visites aux urgences pédiatriques pour bronchiolite, et la prédominance récente de souches VRS-B, dont certaines mutées (résistance), ne semble pas compromettre cette protection (Frequency Medicale, article du 02/11/2025 vu, citant les travaux français ; la page ameli de prévention de la bronchiolite référence l'étude de Furgier et al. « Effectiveness of nirsevimab against hospitalisation for RSV-bronchiolitis during high RSV-B », Paris 2026). Contexte lu : le nirsévimab est recommandé en France depuis septembre 2023 ; l'étude Epi-Phare (page vue) documente par ailleurs l'efficacité du nirsévimab contre les hospitalisations liées au VRS. DISTINCT de l'entrée du jour sur le pneumocoque (autre critère de jugement, autre étude).","src":[["Frequency Medicale — Bronchiolite : efficacité maintenue en France du nirsévimab (02/11/2025)","https://www.frequencemedicale.com/20/actualites/14028-Bronchiolite-efficacite-maintenue-en-France-du-nirsevimab-en-population-generale-infantile"],["Ameli — Prévenir la bronchiolite (référence Furgier et al., 2026)","https://www.ameli.fr/assure/sante/themes/bronchiolite/prevention"],["Epi-Phare — Efficacité du nirsévimab contre les hospitalisations liées au VRS","https://www.epi-phare.fr/rapports-detudes-et-publications/efficacite-nirsevimab/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Réponse rassurante aux parents inquiets des « souches mutées » — la protection hospitalière et sur les urgences se maintient en vie réelle ; l'enjeu reste la couverture : tous les nourrissons de la saison doivent recevoir leur immunisation, y compris en rattrapage."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":4,"dt":"2026-07","titre":"Beyfortus au-delà du VRS : l'immunisation par nirsévimab est associée à un moindre risque de maladie invasive à pneumocoque chez les nourrissons — étude française, Lancet Infectious Diseases (21/07/2026)","subst":"nirsévimab · pneumocoque (IPD) · bénéfice au-delà du VRS","res":"Étude française rétrospective (Fafi, Valtuille, Kaguelidou, Levy, Cohen, Angoulvant et al.) publiée dans The Lancet Infectious Diseases en ligne le 21 juillet 2026 (citation PubMed vue : « 2026 Jul 21:S1473-3099(26)00253-7 », online ahead of print) : l'immunisation par le nirsévimab chez les enfants de moins de 12 mois est associée à un risque plus faible de maladie invasive à pneumocoque (IPD) pendant au moins 6 mois suivant l'immunisation (résumé The Lancet, vu : « Nirsevimab immunisation in children younger than 12 months was associated with a lower risk of IPD for at least 6 months following immunisation »). Interprétation des auteurs (Medscape, page vue) : le nirsévimab pourrait réduire le fardeau des IPD au-delà des vaccins antipneumococciques conjugués — un bénéfice supplémentaire de la stratégie d'immunisation contre le VRS, possiblement lié à la réduction des infections virales facilitantes.","src":[["The Lancet Infectious Diseases — Effectiveness of nirsevimab immunisation on invasive pneumococcal disease (abstract)","https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(26)00253-7/abstract"],["PubMed — Fafi et al. (2026 Jul 21, online ahead of print)","https://pubmed.ncbi.nlm.nih.gov/42480569/"],["Medscape — Nirsevimab Immunization Reduces Hospitalizations for Invasive Pneumococcal Disease","https://www.medscape.com/viewarticle/nirsevimab-immunization-reduces-hospitalizations-invasive-2026a1000qgo"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument supplémentaire de conviction vaccinale pour les parents hésitants sur le Beyfortus — le bénéfice ne se limite pas à la bronchiolite ; ne pas modifier les calendriers antipneumococciques (le nirsévimab ne remplace pas le Prevenar)."},{"dom":"Pédiatrie officinale","type":"Médicament","n":5,"dt":"2026-10","titre":"Awiqli (insuline icodec) : la FDA autorise la première insuline basale hebdomadaire chez l'enfant — diabète de type 2 dès 10 ans (23/10/2026)","subst":"insuline icodec (Awiqli) · DT2 pédiatrique · insuline hebdomadaire","res":"Le 23 octobre 2026, la FDA a approuvé Awiqli (insuline icodec-abae), analogue d'insuline basale à action ultra-prolongée, comme la première et seule insuline basale hebdomadaire pour les enfants de 10 ans et plus atteints de diabète de type 2, en adjonction au régime alimentaire et à l'exercice (communiqué FDA, page vue ; Biospace, communiqué Novo du 23/10/2026 vu) ; Santé Matin (page vue) confirme l'extension et note que la mise à disposition européenne reste à évaluer. Contexte : l'icodec est déjà autorisée chez l'adulte dans plusieurs régions ; la France attend toujours la commercialisation d'Awiqli (aucune trace de remboursement retrouvée à ce jour). Signal pédiatrique : le DT2 de l'enfant progresse avec l'obésité pédiatrique — l'arrivée d'une insuline hebdomadaire (52 injections basales par an au lieu de 365) cible explicitement l'observance des adolescents.","src":[["FDA — Approves First Once-Weekly Insulin for Type 2 Diabetes in Pediatric Patients (23/10/2026)","https://www.fda.gov/drugs/news-events-human-drugs/fda-approves-first-once-weekly-insulin-type-2-diabetes-mellitus-pediatric-patients"],["BioSpace — Novo's Awiqli reçoit l'approbation FDA, première insuline hebdomadaire pour les enfants ≥ 10 ans","https://www.biospace.com/press-releases/novos-awiqli-receives-fda-approval-as-the-first-and-only-once-weekly-insulin-for-children-10-years-of-age-and-older-with-type-2-diabetes"],["Santé Matin — DT2 : les États-Unis autorisent une insuline hebdomadaire dès 10 ans (23/10/2026)","https://www.santematin.fr/diabete-enfants-insuline-hebdomadaire-awiqli-fda-europe-octobre-2026"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Information à cadrer — pas encore disponible en France ; l'observance des adolescents insulinés reste un enjeu quotidien (stylos oubliés, réticence à l'injection à l'école) : une insuline hebdomadaire changerait l'accompagnement, à suivre côté européen."},{"dom":"Infectiologie & Vaccins","type":"Alerte","n":4,"dt":"2026-07","titre":"Antibiorésistance de l'enfant : la première surveillance mondiale (106 000 prélèvements, 82 pays) montre une résistance en hausse partout, portée par les bactéries Gram-négatives — JAMA Pediatrics (20/07/2026)","subst":"antibiorésistance pédiatrique · Gram-négatifs · antibiotiques Watch/Reserve","res":"Première plateforme mondiale dédiée à l'antibiorésistance de l'enfant : étude transversale publiée en ligne le 20 juillet 2026 dans JAMA Pediatrics (« Childhood Antimicrobial Resistance With Global Forecasts », Hu, Qiu, Harwell, Bryant — PMC vu : « Published Online: July 20, 2026 », doi 10.1001/jamapediatrics.2026.2808), conduite par le Murdoch Children's Research Institute avec l'université de Sydney, la Clinton Health Access Initiative et l'université chinoise de Hong Kong : analyse de plus de 106 000 prélèvements d'infection chez des enfants de 0 à 18 ans dans 82 pays, montrant que la résistance aux antibiotiques a augmenté dans toutes les régions entre 2004 et 2022 (communiqué EurekAlert, lu). Points lus : l'augmentation est portée en grande partie par les bactéries Gram-négatives responsables de septicémies et pneumonies ; la résistance progresse le plus vite pour les antibiotiques « Watch » et « Reserve » de l'OMS (ceux qu'on doit préserver) ; les nourrissons et enfants en réanimation et les pays disposant de moins de ressources sanitaires sont les plus touchés ; les chercheurs prévoient une aggravation d'ici 2035 pour les antibiotiques de dernier recours.","src":[["PMC — Childhood Antimicrobial Resistance With Global Forecasts (JAMA Pediatrics, 20/07/2026)","https://pmc.ncbi.nlm.nih.gov/articles/PMC13386309/"],["EurekAlert — Last-line antibiotics at risk as children's resistance rises (MCRI)","https://www.eurekalert.org/news-releases/1136523"],["JAMA Pediatrics — doi 10.1001/jamapediatrics.2026.2808","https://dx.doi.org/10.1001/jamapediatrics.2026.2808"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message concret aux parents — les antibiotiques de l'enfant « ne sont pas un dû » : attendre 48-72 h pour une otite bien tolérée, ne pas réclamer d'amoxicilline pour une rhinite virale, et finir le traitement prescrit ; la résistance qui monte chez l'enfant, c'est celle que nos patients subiront à l'âge adulte."},{"dom":"Psychiatrie","type":"Officine","n":5,"dt":"2026-01","titre":"Méthylphénidate (TDAH) : retour progressif des spécialités LP entre avril et juin 2026 après les tensions d'approvisionnement — points de situation ANSM (08/01/2026, juin 2026)","subst":"méthylphénidate (Ritaline, Concerta) · TDAH · pénurie","res":"L'ANSM a publié le 8 janvier 2026 son point de situation sur l'approvisionnement en médicaments psychotropes (page vue, 11e réunion avec les parties prenantes — Ordre des pharmaciens, page vue) : malgré les décalages évoqués lors du point de décembre 2025, la reprise des livraisons de méthylphénidate est effective depuis le début 2026, conformément aux annonces des laboratoires. Suivi lu (Pharm'actu, juin 2026, page vue) : l'ANSM confirme le retour de plusieurs spécialités LP — Concerta LP 54 mg (rétabli le 5 mai 2026), Concerta LP 18 mg (12 mai), Méthylphénidate EG LP 54 mg (20 avril), Méthylphénidate Viatris LP (27 avril) — mais des tensions persistent sur certaines doses ; les difficultés d'approvisionnement du méthylphénidate (TDAH, narcolepsie) sont documentées depuis fin 2024 (page ANSM vue).","src":[["ANSM — Point de situation sur l'approvisionnement en psychotropes au 8 janvier 2026","https://ansm.sante.fr/actualites/point-de-situation-sur-lapprovisionnement-en-medicaments-psychotropes-en-france-au-8-janvier-2026"],["Ordre des pharmaciens — Point de situation ANSM du 08/01/2026","https://www.ordre.pharmacien.fr/les-communications/focus-sur/les-actualites/point-de-situation-sur-l-approvisionnement-en-medicaments-psychotropes-en-france-au-8-janvier-2026"],["Pharm'actu — Méthylphénidate : retour des spécialités LP, tensions persistantes (juin 2026)","https://pharmactu.fr/articles/methylphenidate-remise-disposition-ansm-tensions-tdah-juin-2026"],["ANSM — Difficultés d'approvisionnement en méthylphénidate (dossier)","https://ansm.sante.fr/actualites/impression/4649"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Situation douloureuse vécue par les familles — anticiper les ruptures de dosage (prévenir le prescripteur pour substitution par dosages disponibles fractionnés, suivi ANSM), ne jamais conseiller d'interrompre brutalement un traitement du TDAH, et expliquer que la disponibilité s'améliore progressivement ; parler du retard de prise à la reprise (le méthylphénidate n'est pas un traitement à effet retard sur la journée oubliée)."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":2,"dt":"2025-10","titre":"FLUNITY-HD : le vaccin grippe à haute dose protège mieux que la dose standard contre l'hospitalisation du sujet âgé (analyse poolée, Lancet 17/10/2025)","subst":"grippe | haute dose | FLUNITY-HD | Efluelda | hospitalisation","res":"Analyse prédéfinie poolée au niveau individuel de deux grands essais randomisés comparant le vaccin inactivé grippe haute dose (HD-IIV) à la dose standard (SD-IIV) chez les 65 ans et plus : protection supérieure contre l'hospitalisation pour grippe ou pneumonie, et réduction des hospitalisations cardio-respiratoires, des hospitalisations toutes causes et des grippes confirmées (résultats lus dans le résumé Lancet). Date vérifiée : communiqué Sanofi du 20/10/2025 précisant la publication dans The Lancet le 17/10/2025 ; analyse commentée par CIDRAP et ACC (20/11/2025).","src":[["Sanofi — communiqué (20/10/2025)","https://www.sanofi.com/en/media-room/press-releases/2025/2025-10-20-05-00-00-3169062"],["The Lancet — FLUNITY-HD pooled analysis","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(25)01742-8/abstract?rss=yes"],["CIDRAP — analyses haute dose vs standard","https://www.cidrap.umn.edu/influenza-vaccines/analyses-high-dose-flu-vaccine-better-protects-against-hospitalization-infection"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument fort pour proposer systématiquement le vaccin haute dose aux patients de 65 ans et plus quand il est disponible."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":2,"dt":"2025-12","titre":"Essai pragmatique danois (>330 000 seniors, 3 saisons) : vaccin grippe haute dose vs dose standard sur les hospitalisations (NEJM 11/12/2025)","subst":"grippe | haute dose | essai pragmatique | Danemark | hospitalisation","res":"Essai randomisé pragmatique en ouvert au Danemark sur les saisons 2022-2023 à 2024-2025 chez des adultes de 65 ans et plus, haute dose vs dose standard du vaccin inactivé : hospitalisation pour grippe 0,06 % dans le groupe haute dose vs 0,11 % dans le groupe standard (chiffres lus dans l'extrait du PDF NEJM). À confronter à FLUNITY-HD : deux essais de haut grade, messages complémentaires sur la sévérité des critères. Date vérifiée : « n engl j med 393;23 nejm.org December 11, 2025 » lu dans l'extrait du PDF NEJM.","src":[["NEJM — DOI 10.1056/NEJMoa2509907 (PDF vu en extrait, 11/12/2025)","https://www.nejm.org/doi/pdf/10.1056/NEJMoa2509907"],["Contagion Live — essai danois","https://www.contagionlive.com/view/high-dose-influenza-vaccine-vs-standard-dose-hospitalization-outcomes-in-older-adults"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le débat haute dose est tranché sur les formes graves — la dose standard reste correctement protectrice ; ne pas retarder une vaccination pour attendre une présentation précise."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":4,"dt":"2026-02","titre":"Efficacité vaccinale grippe 2025-2026 en Europe : neuf études pendant la prédominance du sous-clade dérivé A(H3N2) K, septembre 2025–janvier 2026 (Euro Surveill)","subst":"grippe | efficacité vaccinale | H3N2 sous-clade K | Europe | mismatch","res":"Communication rapide d'Eurosurveillance (2026;31(5):2600068, PMID 41645799) réunissant neuf études d'efficacité vaccinale de neuf pays européens pendant une saison dominée par un sous-clade A(H3N2) K génétiquement dérivé de la souche vaccinale : préoccupation d'une efficacité réduite contre l'infection, mais les études restent à interpréter avec les données de fin de saison. Date vérifiée par l'extrait de citation « Euro Surveill 2026;31(5):2600068 » (numéro 5 d'un hebdomadaire ≈ février 2026) et par le commentaire PMC de mars 2026 renvoyant à l'étude.","src":[["Euro Surveill — DOI 10.2807/1560-7917.ES.2026.31.5.2600068","https://doi.org/10.2807/1560-7917.ES.2026.31.5.2600068"],["PMC — commentaire associé (Euro Surveill 2026;31(11):260319c)","https://pmc.ncbi.nlm.nih.gov/articles/PMC12924001/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message clé de la saison — un vaccin partiellement décalé protège encore contre les formes graves ; ne pas utiliser le « mismatch » comme argument antivaccinal."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":4,"dt":"2026-03","titre":"Estimations intérimaires d'efficacité du vaccin grippe 2025-2026 aux États-Unis, septembre 2025–février 2026 (MMWR, 12/03/2026)","subst":"grippe | efficacité vaccinale | MMWR | saison 2025-2026","res":"MMWR du 12/03/2026 (75(9);116-123, PMID 41818161) : estimations intérimaires d'efficacité vaccinale grippale calculées sur les consultations et hospitalisations pour maladie respiratoire aiguë ; saison marquée par au moins 26 millions de cas, 340 000 hospitalisations et 21 000 décès attribués à la grippe (chiffres lus sur la page CDC/MMWR ouverte). Page ouverte et datée : « Weekly / March 12, 2026 / 75(9);116-123 ».","src":[["MMWR — 12/03/2026, 75(9);116-123","https://www.cdc.gov/mmwr/volumes/75/wr/mm7509a2.htm"],["PubMed 41818161","https://pubmed.ncbi.nlm.nih.gov/41818161/"],["CDC — preliminary VE data 2025-2026","https://www.cdc.gov/flu-vaccines-work/php/effectiveness-studies/2025-2026.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Données de terrain de la saison écoulée — la vaccination restait protectrice malgré la dérive antigénique ; useful pour l'argumentaire de la prochaine campagne."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":4,"dt":"2025-05","titre":"Zona : efficacité du vaccin recombinant adjuvanté (Shingrix) maintenue jusqu'à 11 ans après la vaccination — analyse finale de ZOE-LTFU (eClinicalMedicine, mai 2025)","subst":"zona | zoster | Shingrix | RZV | ZOE-LTFU | durée de protection","res":"Analyse finale du suivi à long terme ZOE-LTFU (NCT02723773) incluant 11 ans de suivi après la vaccination primaire par le vaccin recombinant contre le zona (RZV) : l'objectif était la persistance de l'efficacité contre le zona et ses complications (design décrit d'après le résumé, chiffres d'efficacité non cités ici car non lus intégralement). Dates vérifiées : « EClinicalMedicine. 2025 May 9;83:103241 » lu dans l'extrait ClinicalTrials.gov et « Collection date 2025 May » lu sur PMC.","src":[["eClinicalMedicine — ZOE-LTFU final analysis","https://www.thelancet.com/journals/eclinm/article/PIIS2589-5370(25)00173-7/fulltext"],["PMC12235393","https://pmc.ncbi.nlm.nih.gov/articles/PMC12235393/"],["ClinicalTrials.gov NCT02723773","https://clinicaltrials.gov/study/NCT02723773"]],"coi":"À vérifier","fin":"Financement non lisib des résultats topline positifs de phase 3 pour la forme SOUS-CUTANÉE via injecteur porté (réduction de la proptose > 3 mm, communiqué PRNewswire lu) — promesse d'une administration sans perfusion. Première entrée orbitopathie de Basedow de la base.","src":[["Frontiers in Endocrinology — teprotumumab TED meta-analysis (13 February 2026, page ouverte)","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2026.1735660/full"],["Amgen — topline phase 3 TEPEZZA sous-cutané (06/04/2026)","https://www.prnewswire.com/news-releases/amgen-announces-positive-topline-phase-3-results-for-subcutaneous-tepezza-in-adults-living-with-moderate-to-severe-active-thyroid-eye-disease-302734375.html"],["Ophthalmology Advisor — Subcutaneous teprotumumab meets phase 3 endpoints in active TED","https://www.ophthalmologyadvisor.com/news/subcutaneous-teprotumumab-meets-phase-3-endpoints-in-active-ted/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Patients Basedow sous Tepezza (perfusions hospitalières) — surveiller glycémie (risque d'hyperglycémie), audition (acouphènes), et sécheresse oculaire (larmes artificielles, paupières) ; ne jamais arrêter le traitement thyroïdien associé sans avis."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":1,"dt":"2026-06","titre":"Lévothyroxine liquide/gélule molle vs comprimé après thyroïdectomie totale : méta-analyse systématique — la forme galénique compte pour les patients athyréotiques (World Journal of Clinical Cases, 06/06/2026)","subst":"lévothyroxine | liquide | softgel | gélule | athyréose | thyroïdectomie | résorption","res":"Revue systématique et méta-analyse (World J Clin Cases 2026;14(16):119700 — couverture de numéro « June 6, 2026 » lue sur le PDF Baishideng, URL article vue en résultats, DOI 10.12998/wjcc.v14.i16.119700) comparant lévothyroxine liquide ou gélule molle vs comprimé chez l'adulte athyréotique après thyroïdectomie totale : question de l'absorption chez les
