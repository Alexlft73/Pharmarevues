ients randomisés ; résultats complets publiés dans le NEJM et présentés au congrès ERS de Barcelone, septembre 2026) : le tozorakimab en add-on au traitement inhalé réduit significativement le taux annuel d'exacerbations modérées à sévères de BPCO (jusqu'à −34 % selon les analyses relayées) ; premier biologique de la BPCO à atteindre ce critère dans une large population, dossier en revue prioritaire à la FDA.","off":"Un nouveau médicament injectable réduit les poussées de BPCO chez les patients qui en font malgré leurs inhalers : encore en attente d'autorisation.","src":[["AstraZeneca","https://www.astrazeneca.com/media-centre/press-releases/2026/tozorakimab-demonstrated-statistically-significant-highly-clinically-meaningful-reduction-copd-exacerbations-oberon-titania-phase-iii-trials.html"],["NEJM","https://www.nejm.org/doi/abs/10.1056/NEJMoa2606998"],["ClinicalTrials.gov","https://clinicaltrials.gov/study/NCT05166889"]],"coi":"Industrie","fin":"Essais financés par AstraZeneca ; critère principal atteint dans les deux essais répliqués."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2025-05","titre":"BATURA : salbutamol-budésonide à la demande dans l'asthme léger","subst":"salbutamol-budésonide","res":"Essai de phase 3b BATURA (résultats publiés dans le NEJM et présentés à l'ATS, communiqué du 19 mai 2025) : le combo anti-inflammatoire de secours salbutamol/budésonide (Airsupra) améliore tous les critères primaires et secondaires vs salbutamol seul dans l'asthme léger, avec une réduction de 47 % du risque d'exacerbations sévères rapportée dans les relais.","off":"Utiliser un inhalateur de secours qui contient aussi un corticoïde (et pas seulement du Ventoline) réduit les crises d'asthme léger : demandez conseil à votre médecin ou pharmacien.","src":[["AstraZeneca","https://www.astrazeneca.com/media-centre/press-releases/2025/statistically-significant-clinically-meaningful-batura-phase-iii-trial-provide-evidence-airsupra-standard-care-as-needed-rescue-treatment-asthma.html"],["HCPLive","https://www.hcplive.com/view/as-needed-rescue-treatment-with-albuterol-budesonide-mild-asthma-with-monica-kraft-md"]],"coi":"Industrie","fin":"Essai sponsorisé par AstraZeneca ; bénéfice cohérent avec la stratégie AIR (reliever anti-inflammatoire)."},{"dom":"Néphrologie","type":"Médicament","n":4,"dt":"2026-07","titre":"Finérénone dans les maladies glomérulaires (FIND-CKD, analyse exploratoire)","subst":"finérénone","res":"Essai randomisé FIND-CKD (JAMA, 21 juillet 2026 ; 336(3):224-235, en ligne le 5 juin 2026) : le finérénone, antagoniste non stéroïdien du récepteur minéralocorticoïde, ralentit la baisse de fonction rénale dans la MRC non diabétique ; l'analyse préspecifiée des sous-groupes glomérulaires suggère un bénéfice selon le sous-type de néphropathie.","off":"Un médicament déjà utilisé dans le diabète et le cœur montre aussi un effet protecteur des reins dans certaines maladies du rein : décision à prendre avec le néphrologue.","src":[["JAMA","https://jamanetwork.com/journals/jama/fullarticle/2850124"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/42246414/"]],"coi":"Industrie","fin":"Essai sponsorisé par Bayer ; analyse de sous-groupes exploratoire donc génératrice d'hypothèses, pas une preuve définitive par sous-type."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2026-06","titre":"TRACK : rivaroxaban à faible dose dans la maladie rénale avancée","subst":"rivaroxaban","res":"Essai randomisé TRACK (JAMA, publié en ligne le 4 juin 2026 ; doi 10.1001/jama.2026.9379) : le rivaroxaban à faible dose dans la maladie rénale avancée, présenté avec les actualités néphrologiques du scan ACC de juin 2026 ; les résultats sur les événements cardiovasculaires et le risque hémorragique sont détaillés dans l'essai.","off":"Un anticoagulant à faible dose est évalué chez les patients dont les reins fonctionnent très peu : n'adaptez jamais seul votre dose d'anticoagulant.","src":[["ACC Journal Scan","https://www.acc.org/latest-in-cardiology/journal-scans/2026/06/08/17/44/ckd-studies-spotlight-gfr-measurement"]],"coi":"À vérifier","fin":"Chiffres d'efficacité non lisibles dans les extraits → design et contexte décrits sans inventer les résultats."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2026-10","titre":"Povetacicept (RAINIER) : −52 % de protéinurie dans la néphropathie à IgA","subst":"povetacicept","res":"Essai de phase 3 RAINIER (résultats publiés dans le NEJM et présentés au Kidney Week 2026 de Denver ; communiqué Vertex du 23 octobre 2026) : le povetacicept (BAFF/APRIL) réduit la protéinurie (UPCR) de 52,0 % à la semaine 36 vs 4,3 % sous placebo (réduction vs placebo 49,8 %, p<0,0001), 77,4 % de réduction rapportée sur un critère secondaire ; PDUFA FDA le 30 novembre 2026.","off":"Un traitement injectable expérimental très prometteur réduit la protéinurie de la maladie de Berger ; attendre les autorisations avant d'en parler comme une option disponible.","src":[["Vertex Pharmaceuticals","https://news.vrtx.com/news-releases/news-release-details/phase-3-rainier-results-supporting-best-class-potential"],["AJMC","https://www.ajmc.com/view/kidney-week-2026-recap-igan-advances-value-based-care-ckd-care-gaps"]],"coi":"Industrie","fin":"Essai sponsorisé par Vertex Pharmaceuticals ; phase 3 en aveugle poursuit jusqu'à 104 semaines."},{"dom":"Douleur & Migraine","type":"Médicament","n":2,"dt":"2025-05","titre":"UNITE : frémanezumab dans la migraine avec dépression majeure","subst":"frémanezumab","res":"Essai randomisé UNITE (JAMA Neurology, mai 2025 ; 82(6):560-569, en ligne le 5 mai 2025) : le frémanezumab (anti-CGRP) améliore les jours de migraine et les symptômes dépressifs chez l'adulte migraineux avec trouble dépressif majeur caractérisé, vs placebo.","off":"Chez le patient migraineux aussi déprimé, un traitement préventif de la migraine (injection mensuelle) améliore aussi l'humeur dans l'essai UNITE : les deux ne se traitent pas séparément.","src":[["JAMA Neurology","https://jamanetwork. est cliniquement utile et économiquement favorable.","src":[["JACCP (Wiley)","https://accpjournals.onlinelibrary.wiley.com/doi/10.1002/jac5.70166"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/42009512/"]],"coi":"À vérifier","fin":"Revue canadienne (Dalhousie/McMaster) ; angle économique complémentaire des entrées cliniques déprescription déjà en base."},{"dom":"Dermatologie & peau","type":"Médicament","n":2,"dt":"2026-01","titre":"Ivermectine orale vs perméthrine 5 % en crème dans la gale commune : essai randomisé en clusters","subst":"ivermectine vs perméthrine","res":"ECR multicentrique, en clusters (foyers), avec évaluateurs en aveugle (BMJ 2026;392:e086277, publié le 6 janvier 2026) : cas index avec gale commune confirmée en dermoscopie randomisés 1:1 ivermectine orale vs perméthrine crème ; 132 clusters analysés sous ivermectine, 127 sous perméthrine, chaque membre du foyer recevant le même traitement que le cas index (résultats chiffrés non lisibles dans les extraits : design décrit sans invention ; article corrigé le 8 avril 2026).","off":"La gale se traite efficacement et tout le foyer doit être traité en même temps ; la crème de perméthrine et le comprimé d'ivermectine sont les deux options de référence — suivez le schéma exact (application corps entier, renouvellement à J8) et lavez le linge des 3 derniers jours.","src":[["BMJ 2026;392:e086277","https://www.bmj.com/content/392/bmj-2025-086277"],["PubMed (via extraits)","https://pubmed.ncbi.nlm.nih.gov/"]],"coi":"À vérifier","fin":"Essai académique multicentrique publié par le BMJ ; financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2026-07","titre":"Ivermectine vs perméthrine pour la gale : revue systématique et méta-analyse actualisée","subst":"ivermectine vs perméthrine","res":"Méta-analyse comparative (BMC Infectious Diseases 2026, version of record du 2 juillet 2026, 10.1186/s12879-026-13451-y) sur l'efficacité comparative ivermectine orale vs perméthrine topique dans la gale, maladie tropicale négligée à forte charge mondiale (résultats chiffrés non lisibles dans les extraits : question et design décrits sans invention).","off":"Il existe désormais de solides travaux comparant comprimé et crème contre la gale ; les deux restent valides — le choix dépend de l'âge, de la grossesse et de la facilité d'application pour toute la famille.","src":[["BMC Infectious Diseases","https://link.springer.com/article/10.1186/s12879-026-13451-y"],["PMC13326149","https://pmc.ncbi.nlm.nih.gov/articles/PMC13326149/"]],"coi":"À vérifier","fin":"Revue systématique à comité (BMC/Springer Nature) ; financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2025-07","titre":"Traitements d'origine végétale des poux de tête : revue systématique et méta-analyse","subst":"poux de tête (traitements végétaux vs pyréthrinoïdes)","res":"SR/MA (PLOS Global Public Health, publié le 17 juillet 2025) : 20 études (13 ECR, 7 non randomisées) sur les traitements végétaux de la pédiculose capitis, 9 ECR quantitativement poolés ; contexte de résistance croissante à la perméthrine et au malathion ; critère principal = taux de guérison 1-14 jours après le dernier traitement (chiffres poolés non lisibles dans les extraits : design décrit sans invention).","off":"Face aux poux, les produits « naturels » existent et sont étudiés, mais les résistances aux insecticides classiques poussent surtout à alterner les familles de produits et à bien peigner les cheveux mouillés — demandez conseil à votre pharmacien.","src":[["PLOS Global Public Health","https://journals.plos.org/globalpublichealth/article?id=10.1371%2Fjournal.pgph.0004841"],["PMC12270178","https://pmc.ncbi.nlm.nih.gov/articles/PMC12270178/"]],"coi":"À vérifier","fin":"Méta-analyse académique en accès libre ; financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Médicament","n":3,"dt":"2025-05","titre":"Éfinaconazole 10 % topique chez le sujet âgé : analyse post hoc de deux essais de phase 3","subst":"éfinaconazole (onychomycose)","res":"Analyse post hoc (Mycoses 2025;68(5):e70069) de deux ECR de phase 3 du éfinaconazole 10 % solution topique dans l'onychomycose de l'ongle du pied chez le sujet âgé : patients difficiles à traitre (croissance unguéale lente, ongles épais, comorbidités, polymédication), pour qui les traitements oraux se heurtent aux contre-indications et interactions — la voie topique y est une option sûre (chiffres d'efficacité non lisibles dans les extraits : design décrit sans invention).","off":"Pour un champignon d'ongle chez une personne âgée qui prend déjà plusieurs médicaments, un vernis/solution antifongique locale évite les interactions ; c'est un traitement long, régulier, de plusieurs mois.","src":[["Mycoses (Wiley)","https://onlinelibrary.wiley.com/doi/10.1111/myc.70069"],["PubMed 40396391","https://pubmed.ncbi.nlm.nih.gov/40396391/"],["PMC12093445","https://pmc.ncbi.nlm.nih.gov/articles/PMC12093445/"]],"coi":"Industrie","fin":"Analyse post hoc d'essais sponsorisés par le titulaire de l'éfinaconazole ; auteurs incluant des employés/consultants du laboratoire (à vérifier dans le texte intégral)."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2025-06","titre":"Taux de résistance aux antibiotiques de Cutibacterium acnes dans l'acné : revue systématique et méta-analyse","subst":"acné (résistance antibiotiques)","res":"SR/MA (Frontiers in Microbiology, publié le 4 juin 2025) des taux de résistance aux antibiotiques de C. acnes isolé chez des patients acnéiques : les recherches couvrent les études de prévalence de résistance, dans un contexte où les recommandations récentes découragent les antibiotiques en monothérapie et privilégient les associations fixes avec peroxyde de benzoyle (taux poolés non lisibles dans les extraits : question et design décrits sans invention).","off":"Les antibiotiques contre l'acné perdent de leur efficacité car la bactérie devient résistante : ne prenez jamais d'antibiotique seul sur la peau, il doit être associé au peroxyde de benzoyle, à dose et durée précises.","src":[["Frontiers in Microbiology","https://www.frontiersin.org/journals/microbiology/articles/10.3389/fmicb.2025.1565111/full"]],"coi":"À vérifier","fin":"Méta-analyse chinoise à comité de lecture ; financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Alimentation","n":1,"dt":"2025-12","titre":"Perte de poids et sévérité du psoriasis : revue systématique et méta-analyse","subst":"perte de poids (psoriasis)","res":"SR/MA (Journal of the European Academy of Dermatology and Venereology, epub 19 décembre 2025, 10.1111/jdv.70247) : preuves de certitude élevée suggérant que les interventions de perte de poids améliorent la sévérité du psoriasis et la qualité de vie, et devraient faire partie du traitement de routine (conclusion lue dans l'extrait PubMed 41416383).","off":"En cas de psoriasis avec surpoids, perdre du poids améliore la peau en plus des traitements : c'est un véritable levier thérapeutique, à discuter sans jugement.","src":[["PubMed 41416383","https://pubmed.ncbi.nlm.nih.gov/41416383/"],["BJD (congrès 2025)","https://academic.oup.com/bjd/article/193/Supplement_1/ljaf085.078/8162276"]],"coi":"À vérifier","fin":"Méta-analyse académique britannique (équipe BJD/Oxford) ; financement non lisible dans les extraits ; epub ahead of print."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2025-09","titre":"Écrans solaires et risque de mélanome : revue systématique et méta-analyse","subst":"écrans solaires (prévention mélanome)","res":"SR/MA (Anticancer Research 2025;45(9):3595-3603, septembre 2025) comparant l'utilisation d'écran solaire « jamais vs au moins une fois » sur le risque de mélanome malin, à partir de PubMed (question posée alors que l'incidence du mélanome continue d'augmenter malgré la sensibilisation ; résultats poolés non lisibles dans les extraits : design décrit sans invention).","off":"La crème solaire fait partie de la protection solaire avec le vêtement, le chapeau et l'ombre ; appliquez-la généreusement et renouvelez-la, sans vous croire totalement protégé.","src":[["Anticancer Research","https://ar.iiarjournals.org/content/45/9/3595"],["PubMed 40876975","https://pubmed.ncbi.nlm.nih.gov/40876975/"]],"coi":"À vérifier","fin":"Méta-analyse allemande (Hombourg/Sarre) ; financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2026-08","titre":"Gel de silicone associé au laser pour les cicatrices : revue systématique et méta-analyse","subst":"silicone (cicatrices)","res":"Méta-analyse d'ECR (Plastic and Reconstructive Surgery – Global Open 14(8):e8021, août 2026 ; recherche jusqu'au 6 février 2025) comparant gel de silicone + thérapie laser vs l'une ou l'autre monothérapie dans la prise en charge des cicatrices : la combinaison montre une efficacité et une tolérance supérieures aux monothérapies, avec des bénéfices cohérents entre sous-groupes (conclusion lue dans l'extrait PubMed 42603050).","off":"Sur une cicatrice récente, le gel de silicone reste la base ; il peut être complété par des séances de laser en cas de cicatrice épaisse — massage régulier et patience font le reste.","src":[["PRS Global Open","https://journals.lww.com/prsgo/fulltext/10.1097/gox.0000000000008021~efficacy-and-safety-of-silicone-gel-plus-laser-therapy-for"],["PubMed 42603050","https://pubmed.ncbi.nlm.nih.gov/42603050/"],["PMC13475933","https://pmc.ncbi.nlm.nih.gov/articles/PMC13475933/"]],"coi":"Indépendant","fin":"Auteurs sans intérêt financier déclaré, soutien public (Guangzhou Science) selon l'extrait PubMed ; certitude limitée par l'hétérogénéité des protocoles laser."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2024-08","titre":"Osimertinib après chimioradiothérapie dans le NSCLC stade III EGFR+ : LAURA change la donne","subst":"Osimertinib (Tagrisso) — inhibiteur EGFR de 3e génération","res":"Essai de phase 3 international, randomisé en double aveugle (NEJM, août 2024) : 216 patients avec NSCLC de stade III irrésécable EGFR-muté, sans progression après chimioradiothérapie, randomisés vers osimertinib (143) ou placebo (73). Survie sans progression médiane 39,1 mois vs 5,6 mois, HR 0,16 (IC95 % 0,10–0,24 ; p<0,001). Survie globale encore immature (20 % de maturité). Événements indésirables de grade ≥3 : 35 % vs 12 % ; pneumonite radique (majorité grades 1–2) rapportée chez 48 % vs 38 %. Pas de nouveau signal de sécurité.","off":"Pour certains cancers du poumon avec mutation EGFR, un comprimé ciblé pris après la radiochimiothérapie multiplie par 7 le temps sans progression — une avancée majeure dans un stade jusqu’ici orphelin de traitement d’entretien.","src":[["NEJM 2024 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/38828946/"]],"coi":"Industrie","fin":"Essai financé par AstraZeneca, fabricant de l’osimertinib (Tagrisso)."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2025-11","titre":"Ribociclib adjuvant dans le cancer du sein HR+/HER2− : le bénéfice se confirme à 4 ans (NATALEE)","subst":"Ribociclib (Kisqali) — inhibiteur CDK4/6 en adjuvant","res":"Analyse exploratoire à 4 ans de l’essai de phase 3 NATALEE (JAMA Oncology, nov. 2025) : 5 101 patients avec cancer du sein précoce HR+/HER2− de stade IIA à III, tous ayant terminé le ribociclib. Survie sans maladie invasive : HR 0,72 (IC95 % 0,61–0,84) ; iDFS à 4 ans 88,5 % sous ribociclib + anti-aromatase vs 83,6 % (différence 4,9 points), suivi médian 44,2 mois. Survie globale encore immature (HR 0,83 ; 0,64–1,07). Incidence des effets indésirables restée stable après l’arrêt du traitement.","off":"Un comprimé pris pendant 3 ans en plus de l’hormonothérapie réduit davantage les récidives — un traitement long, où l’accompagnement de l’observance par l’officine compte vraiment.","src":[["JAMA Oncology 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40996773/"]],"coi":"Industrie","fin":"Essai sponsorisé par Novartis, fabricant du ribociclib (Kisqali) ; liens d’intérêts industriels multiples déclarés par les auteurs."},{"dom":"Oncologie","type":"Médicament","n":5,"dt":"2026-03","titre":"Anticorps-médicaments conjugués (ADC) : de la conception moléculaire à la clinique","subst":"Anticorps conjugués (ADC) — classe en expansion","res":"Revue de synthèse (Lancet Regional Health – Europe, mars 2026) couvrant l’ensemble du parcours des ADC en oncologie : conception moléculaire (cible antigénique, linker, charge cytotoxique), développement clinique et implémentation en pratique. Ressource de fond pour comprendre une classe qui s’étend d’une tumeur à l’autre ; résumé non indexé dans PubMed — texte en accès libre chez l’éditeur.","off":"Les « chimiothérapies guidées par anticorps » arrivent au comptoir : un anticorps qui transporte une cytotoxine — d’où des effets indésirables qui ne ressemblent à aucune chimio classique.","src":[["Lancet Reg Health Eur 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42099878/"]],"coi":"Mixte","fin":"Revue en accès libre ; liens d’intérêts mixtes déclarés (honoraires et subventions de nombreux laboratoires, auteurs académiques)."},{"dom":"Oncologie","type":"Médicament","n":5,"dt":"2026-09","titre":"Toxicités des immunothérapies (irAE) : une prise en charge fondée sur les preuves","subst":"Inhibiteurs de points de contrôle — gestion des irAE","res":"Revue (Critical Reviews in Oncology/Hematology, sept. 2026) consacrée à la prise en charge fondée sur les preuves des événements indésirables liés aux inhibiteurs de points de contrôle : reconnaissance, gradation, hiérarchie des traitements et coordination pluriprofessionnelle. À l’ère des survies longues, la gestion de ces toxicités devient une compétence chronique. Résumé non indexé dans PubMed : texte complet chez l’éditeur.","off":"Fièvre, diarrhée, éruption ou fatigue inhabituelle sous immunothérapie : ce n’est jamais banal — avis médical rapide ; l’automédication risque de masquer les signes d’alerte.","src":[["Crit Rev Oncol Hematol 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42442518/"]],"coi":"À vérifier","fin":"Revue chez éditeur commercial ; déclaration de conflits d’intérêts ambiguë dans l’extrait PubMed — à contrôler avant diffusion."},{"dom":"Oncologie","type":"Médicament","n":1,"dt":"2025-06","titre":"Neutropénie fébrile : 90 modèles prédictifs passés au crible, tous fragiles (revue systématique)","subst":"Modèles prédictifs de neutropénie fébrile et de ses issues","res":"Revue systématique (Supportive Care in Cancer, 2025) : 5 919 articles identifiés, 90 études de modèles prédictifs retenues (25 prédisant la neutropénie fébrile, 65 ses issues, dont 28 la mortalité). Verdict PROBAST : les 90 études sont classées à haut risque de biais — définitions variables de la FN, validation externe rare, cohortes hétérogènes ; 8 études seulement utilisent l’apprentissage automatique. Conclusion des auteurs : promesse réelle côté machine learning et dossiers médicaux électroniques, mais aucun modèle prêt pour la routine.","off":"Rien de nouveau à délivrer : la prévention de la neutropénie fébrile repose toujours sur les facteurs de risque classiques — pas d’outil prédictif fiable utilisable en pratique aujourd’hui.","src":[["Support Care Cancer 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40467900/"]],"coi":"Indépendant","fin":"Revue systématique sans financement industriel ; les auteurs ne déclarent aucun conflit d’intérêts."},{"dom":"Oncologie","type":"Médicament","n":1,"dt":"2025-09","titre":"Olanzapine et nausées-vomissements de chimiothérapie : une efficacité dose-dépendante","subst":"Olanzapine 2,5–10 mg/jour — prévention du CINV","res":"Revue systématique et méta-analyse (Anticancer Research, sept. 2025) : 24 études analysées sur l’efficacité de l’olanzapine à 5 et 10 mg/jour dans la prévention du CINV selon le niveau émétogène de la chimiothérapie, avec évaluation de la dose basse 2,5 mg/jour. Efficacité dose-dépendante documentée ; le détail des taux de réponse complète par niveau émétogène est dans le texte.","off":"Un antipsychotique à faible dose est un antiémétique reconnu de la chimiothérapie — la dose la plus faible efficace se discute avec l’équipe oncologique ; jamais en automédication.","src":[["Anticancer Res 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40876984/"]],"coi":"À vérifier","fin":"Méta-analyse ; conflits d’intérêts non lisibles dans l’extrait PubMed disponible."},{"dom":"Oncologie","type":"Médicament","n":1,"dt":"2025-11","titre":"Toxicité cutanée sous immunothérapie : le « mauvais » signe qui annonce le bon (méta-analyse)","subst":"Événements cutanés (cirAE) et pronostic sous inhibiteurs de points de contrôle","res":"Revue systématique et méta-analyse (Frontiers in Oncology, nov. 2025) : 45 études, 26 817 patients sous inhibiteurs de points de contrôle. La survenue d’événements cutanés liés à l’immunité est associée à une meilleure survie globale, notamment pour le vitiligo et le rash. Un marqueur pronostique discuté — pas une raison de banaliser la toxicité : elle signale une activation immunitaire à suivre médicalement.","off":"Une éruption (ou un vitiligo) qui apparaît sous immunothérapie peut accompagner une meilleure réponse — mais elle impose toujours un avis médical, pas un simple conseil dermo-cosmétique.","src":[["Front Oncol 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/41278277/"]],"coi":"Indépendant","fin":"Méta-analyse d’études observationnelles (niveau de preuve limité, hétérogénéité probable) ; les auteurs déclarent l’absence de relation commerciale ou financière."},{"dom":"Oncologie","type":"Médicament","n":5,"dt":"2025-10","titre":"Prévenir la cardiotoxicité des traitements du cancer : pharmacologie et hygiène de vie","subst":"Cardiotoxicité — anthracyclines et thérapies ciblées","res":"Revue narrative (Frontiers in Cardiovascular Medicine, oct. 2025) sur les stratégies actuelles de prévention de la cardiotoxicité : en pharmacologique, le blocage du système rénine-angiotensine-aldostérone ressort comme socle ; en non pharmacologique, l’activité physique et le contrôle des facteurs de risque ; approches émergentes en développement. Message central : une approche cardio-oncologique intégrée et multidisciplinaire, la survie étant devenue la règle. Méthode non systématique assumée par les auteurs.","off":"Cœur et cancer : surveiller tension, poids et cholestérol pendant et après le traitement est devenu un objectif de santé à part entière — la survie se joue aussi sur le cardiovasculaire.","src":[["Front Cardiovasc Med 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/41210341/"]],"coi":"Indépendant","fin":"Revue narrative (recherche non systématique) ; les auteurs déclarent l’absence de relation commerciale ou financière."},{"dom":"Oncologie","type":"Officine","n":5,"dt":"2026-08","titre":"Anticancéreux oraux : effets alimentaires et interactions, le terrain du pharmacien","subst":"Interactions pharmacocinétiques et prise alimentaire des anticancéreux oraux","res":"Revue (Pharmaceutics, août 2026) sur les effets alimentaires, les interactions pharmacocinétiques et l’optimisation clinique des anticancéreux oraux. Thème directement officinal : ces spécialités passent au comptoir, et la prise en compte du repas, du pH gastrique et des co-médications conditionne l’exposition réelle au médicament. Résumé non indexé dans PubMed — texte en accès libre (MDPI).","off":"Un comprimé anticancéreux se prend souvent à heure fixe, avec ou sans repas selon la spécialité : relire la notice avec le patient, chaque détail de prise compte.","src":[["Pharmaceutics 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42797257/"]],"coi":"Indépendant","fin":"Revue en accès libre (MDPI) ; l’auteur déclare aucun conflit d’intérêts."},{"dom":"Soins primaires & Officine","type":"Officine","n":3,"dt":"2026-05","titre":"Anticancéreux oraux en ville : 384 interventions de pharmaciens, la moitié « significative ou pire »","subst":"Analyse d’ordonnances — antinéoplasiques oraux en officine","res":"Étude observationnelle rétrospective japonaise (Journal of Pharmaceutical Health Care Sciences, mai 2026) : sur 184 688 ordonnances d’anticancéreux oraux (sept. 2023 – mars 2025), 384 demandes de clarification (0,2 %) soumises par les officines à un centre anticancéreux. Modification de l’ordonnance dans 77 % des cas (295). Motifs principaux : durée de traitement erronée (23 %), ajustement pour reliquats (20 %), erreurs de dose (16 %). 49 % des cas classés erreurs potentiellement létales, graves ou significatives ; 49 % jugés d’une valeur de service significative ou supérieure. Conclusion : le pharmacien de ville est un authentique filet de sécurité de la chimiothérapie orale.","off":"Relire les ordonnances d’anticancéreux oraux (dose, durée, reliquats) évite des erreurs graves — un rôle officinal désormais documenté chiffres à l’appui.","src":[["J Pharm Health Care Sci 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42098840/"]],"coi":"Indépendant","fin":"Étude hospitalo-officinale académique (National Cancer Center japonais), accès libre ; les auteurs ne déclarent aucun conflit d’intérêts."},{"dom":"Dermatologie & peau","type":"Médicament","n":3,"dt":"2025-06","titre":"Psoriasis : le biméquizumab tient le PASI 100 sur 3 ans (BE RADIANT)","subst":"Biméquizumab (Bimzelx) — anticorps anti-IL-17A/F","res":"Extension en ouvert à 3 ans de l’essai de phase IIIb BE RADIANT (British Journal of Dermatology, 2025) : 336 patients randomisés vers biméquizumab et 318 vers sécukinumab à l’inclusion. En année 1, PASI 100 atteint par 74,9 % (biméquizumab) vs 52,8 % (sécukinumab) ; à 3 ans, le taux se maintient à 68,8 % sous biméquizumab continu, et rejoint 68,8 % chez les patients passés du sécukinumab au biméquizumab.","off":"Dans le psoriasis sévère, une réponse « peau quasi nette » durable existe : trois ans de données confirment la tenue du bénéfice — la question du choix se discute avec le médecin.","src":[["Br J Dermatol 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/39862230/"]],"coi":"Industrie","fin":"Essai BE RADIANT conduit par le fabricant du biméquizumab (UCB) ; liens d’intérêts industriels multiples déclarés par les auteurs."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2025-06","titre":"Alopécie areata sévère : ritlecitinib vs baricitinib en comparaison indirecte","subst":"Ritlecitinib (Litfulo) vs baricitinib (Olumiant) — inhibiteurs JAK","res":"Revue systématique avec comparaisons de traitement indirectes (JEADV, juin 2025) confrontant ritlecitinib et baricitinib dans l’alopécie areata, en l’absence d’essais comparatifs directs. Résumé non disponible dans PubMed : les conclusions chiffrées sont à lire dans le texte — la méthode indirecte impose de garder un niveau de preuve fragile.","off":"Deux traitements oraux existent désormais pour l’alopécie sévère ; pas de match direct entre eux — le choix se fait selon le profil du patient, l’AMM et la tolérance.","src":[["JEADV 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/39445776/"]],"coi":"Industrie","fin":"Analyse conduite avec des consultants rémunérés par Pfizer (fabricant des deux molécules) ; plusieurs auteurs salariés ou actionnaires de sociétés liées à Pfizer."},{"dom":"Dermatologie & peau","type":"Médicament","n":4,"dt":"2025-05","titre":"Vitiligo : crème de ruxolitinib — la repigmentation faciale tient à 1 an (TRuE-V)","subst":"Ruxolitinib crème 1,5 % (Opzelura) — inhibiteur JAK topique","res":"Analyse post hoc poolée des essais de phase 3 TRuE-V1/TRuE-V2 (Dermatologic Therapy, 2025 ; 674 patients ≥ 12 ans, vitiligo non segmentaire) : à la semaine 52, le F-VASI75 (amélioration ≥ 75 % du score facial) est atteint par 50,3 % des patients ayant appliqué la crème de ruxolitinib d’emblée (176/350) vs 28,2 % de ceux passés du véhicule au ruxolitinib après la semaine 24 (46/163). Réponses observées dans tous les sous-groupes (âge, sexe, phototype, durée de la maladie).","off":"Une crème qui fait revenir la pigmentation du visage existe, avec des réponses chez l’adolescent comme chez l’adulte — traitement d’entretien long, la régularité d’application est la clé.","src":[["Dermatol Ther 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40156697/"]],"coi":"Industrie","fin":"Analyse post hoc des essais TRuE-V conduits par Incyte, fabricant de la crème de ruxolitinib (Opzelura) ; liens d’intérêts industriels multiples déclarés."},{"dom":"Dermatologie & peau","type":"Médicament","n":3,"dt":"2026-05","titre":"Dupilumab en vie réelle : efficacité et sécurité durables (79 patients, 52 semaines)","subst":"Dupilumab (Dupixent) — dermatite atopique modérée à sévère","res":"Étude rétrospective monocentrique (JAAD, mai 2026) de 79 patients traités par dupilumab (janv. 2022 – mai 2024) : à 16 semaines, améliorations significatives de l’EASI (15,65 → 5,94), du score de sévérité (46,62 → 25,22) et du prurit (7,41 → 3,73 sur échelle numérique ; p<0,001 pour tous). Réponses EASI-50 et EASI-75 : 72,15 % et 44,3 %. Le groupe « réponse longue » présente une période moyenne sans rechute nettement plus longue (159,55 jours vs 66,40 et 48,17) ; la rechute dépend des IgE de base, du sous-type et de l’ancienneté. 4 effets indésirables spontanément résolutifs, aucun arrêt de traitement.","off":"Dans la vraie vie, le dupilumab confirme ses essais : la peau et le prurit s’améliorent nettement et durablement — un traitement d’entretien à observer dans la durée, pas une cure courte.","src":[["JAAD 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/41478500/"]],"coi":"Indépendant","fin":"Étude rétrospective monocentrique académique ; les auteurs ne déclarent aucun conflit d’intérêts."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2024-09","titre":"Finérénone dans l'insuffisance cardiaque à FE préservée ou légèrement réduite (FINEARTS-HF)","subst":"Finérénone — IC symptomatique avec FE > 40 % (ICpEF / ICmrEF)","res":"Essai de phase 3 (NEJM, sept. 2024, présenté en Hot Line ESC 2024) : dans l'insuffisance cardiaque symptomatique avec FE > 40 %, la finérénone réduit significativement le composite « aggravation de l'IC + décès cardiovasculaire » vs placebo. L'antiminéralocortéroïde non stéroïdien étend ainsi son territoire au-delà du diabète/MRC (FIDELIO-DKD, FIGARO-DKD) et de la MRC non diabétique (FIND-CKD).","off":"Si le prescripteur initie la finérénone dans l'IC à FE préservée : contrôle de la kaliémie et de la fonction rénale à l'initiation, comme pour toute la classe.","src":[["NEJM 2024","https://www.nejm.org/doi/abs/10.1056/NEJMoa2407107"],["PubMed 39225278","https://pubmed.ncbi.nlm.nih.gov/39225278/"],["ACC — Clinical Trials FINEARTS-HF","https://www.acc.org/latest-in-cardiology/clinical-trials/2024/08/29/20/16/finearts-hf"]],"coi":"Industrie","fin":"Essai sponsorisé et analysé par Bayer, fabricant de la finérénone ; résultats présentés en Hot Line ESC 2024."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2025-06","titre":"CagriSema chez l'adulte en surpoids/obèse avec diabète de type 2 (REDEFINE 2)","subst":"Cagrilintide + sémaglutide (CagriSema) — population surpoids/obésité avec DT2","res":"Essai de phase 3a (NEJM, publié en ligne le 22 juin 2025) : la combinaison hebdomadaire cagrilintide 2,4 mg + sémaglutide 2,4 mg entraîne une perte de poids significativement supérieure au placebo chez l'adulte en surpoids ou obésité vivant avec un DT2. Complète REDEFINE 1 (obésité sans diabète, déjà en base) : l'association amyline + GLP-1 fait ses preuves aussi dans la population diabétique.","off":"Produit en développement, pas encore disponible : ne pas laisser le patient anticiper une « injection miracle » — la prise en charge reste hygiène de vie et traitements actuels.","src":[["NEJM 2025","https://www.nejm.org/doi/abs/10.1056/NEJMoa2502082"],["PubMed 40544432","https://pubmed.ncbi.nlm.nih.gov/40544432/"],["ACC — Journal Scan REDEFINE 1 et 2","https://www.acc.org/latest-in-cardiology/journal-scans/2025/07/02/14/43/redefine-1-and-redefine-2"]],"coi":"Industrie","fin":"Essai sponsorisé par Novo Nordisk, fabricant du CagriSema."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-10","titre":"Sémaglutide 2,4 mg : le bénéfice cardiovasculaire ne dépend pas du poids initial (analyse SELECT, Lancet)","subst":"Sémaglutide 2,4 mg — obésité sans diabète avec maladie cardiovasculaire établie (SELECT)","res":"Analyse prédéfinie de SELECT (Lancet, oct. 2025) : la réduction de 20 % des MACE sous sémaglutide 2,4 mg s'observe quel que soit le niveau d'adiposité initial (poids, tour de taille) ; la réduction précoce du tour de taille n'explique qu'environ un tiers du bénéfice — l'effet cardiaque déborde la seule perte de poids.","off":"Pour le patient sous sémaglutide avec antécédent cardiovasculaire : le bénéfice cardiaque ne dépend pas d'une perte de poids spectaculaire — l'observance compte même si la perte de poids reste modeste.","src":[["The Lancet 2025","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(25)01375-3/fulltext"],["PubMed 41138739","https://pubmed.ncbi.nlm.nih.gov/41138739/"],["News-Medical (26/10/2025)","https://www.news-medical.net/news/20251026/Semaglutide-protects-the-heart-beyond-weight-loss-SELECT-trial-shows.aspx"]],"coi":"Industrie","fin":"Analyse de l'essai SELECT, sponsorisé par Novo Nordisk."},{"dom":"Cardiologie","type":"Médicament","n":3,"dt":"2025-05","titre":"Lepodisiran : une dose unique réduit la Lp(a) de ~94 % pendant des mois (ALPACA)","subst":"Lepodisiran — ARN interférent longue durée visant la Lp(a)","res":"Essai de phase 2 (NEJM, 1er mai 2025 ;392(17):1673-1683) : une dose unique de 400 mg de lepodisiran (petit ARN interférent) réduit la Lp(a) d'environ 94 % en moyenne entre J60 et J180 chez l'adulte avec Lp(a) élevée. La baisse lipidique est profonde, mais l'essai de phase 3 sur les événements CV est encore en cours : le bénéfice clinique n'est pas prouvé — à la différence du pelacarsen (Lp(a)HORIZON), négatif sur les événements.","off":"Rien à délivrer aujourd'hui : piste pour les patients à Lp(a) élevée, à ne pas survendre tant que le bénéfice clinique n'est pas démontré.","src":[["NEJM 2025","https://www.nejm.org/doi/full/10.1056/NEJMoa2415818"],["NEJM 2025;392(17):1673-1683 (Ovid)","https://www.ovid.com/journals/nejm/fulltext/10.1056/nejmoa2415818~lepodisiran-a-long-duration-small-interfering-rna-targeting"],["Communiqué Lilly (30/03/2025)","https://investor.lilly.com/news-releases/news-release-details/lillys-lepodisiran-reduced-levels-genetically-inherited-heart"]],"coi":"Industrie","fin":"Essai sponsorisé par Eli Lilly, développeur du lepodisiran."},{"dom":"Cardiologie","type":"Médicament","n":1,"dt":"2025-07","titre":"Colchicine en prévention secondaire vasculaire : la méta-analyse au long cours confirme (EHJ)","subst":"Colchicine 0,5 mg/j — prévention secondaire cardiovasculaire","res":"Méta-analyse des essais de longue durée (European Heart Journal, 7 juillet 2025 ;46(26):2552-2563) : la colchicine à faible dose en prévention secondaire réduit les événements vasculaires — l'hypothèse anti-inflammatoire de l'athérosclérose se confirme, au-delà de la goutte.","off":"Si ordonnance de colchicine 0,5 mg/j à visée CV : vérifier les interactions (macrolides, inhibiteurs CYP3A4/P-gp dont atorvastatine forte dose) et la fonction rénale, et expliquer que l'objectif diffère de la crise de goutte.","src":[["Eur Heart J 2025 (méta-analyse)","https://academic.oup.com/eurheartj/article/46/26/2552/8123897"],["PubMed 40314333","https://pubmed.ncbi.nlm.nih.gov/40314333/"]],"coi":"Indépendant","fin":"Méta-analyse académique ; financement des essais sources non précisé dans les extraits consultés."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-09","titre":"Mavacamten inefficace dans la cardiomyopathie hypertrophique NON obstructive (ODYSSEY-HCM)","subst":"Mavacamten — CMH non obstructive (essai négatif)","res":"Essai de phase 3 multinational (201 centres ; communiqué BMS avril 2025, résultats détaillés à l'ESC 2025, page d'essai ACC du 23/09/2025) : le mavacamten n'améliore significativement ni le pic de VO2 ni le statut de santé vs placebo dans la CMH non obstructive symptomatique — échec des critères primaires.","off":"Le mavacamten (Camzyos) garde son indication dans la CMH obstructive : pas d'usage hors-AMM dans les formes non obstructives.","src":[["ACC — ODYSSEY-HCM (23/09/2025)","https://www.acc.org/latest-in-cardiology/clinical-trials/2025/09/23/16/55/odyssey-hcm"],["Communiqué BMS","https://news.bms.com/news/details/2025/Bristol-Myers-Squibb-Provides-Update-on-Phase-3-ODYSSEY-HCM-Trial/default.aspx"],["ESC (communiqué)","https://www.escardio.org/news/press/press-releases/No-improvements-with-mavacamten-in-symptomatic-nonobstructive-hypertrophic-cardiomyopathy/"]],"coi":"Industrie","fin":"Essai sponsorisé par Bristol-Myers Squibb, titulaire du mavacamten."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2026-04","titre":"Ablation par champ pulsé en 1re intention dans la FA persistante (AVANT GUARD)","subst":"Ablation par champ pulsé (PFA) — fibrillation auriculaire persistante","res":"Essai randomisé 2:1 (388 patients, NEJM publié en ligne le 25 avril 2026) : chez des patients avec FA persistante jamais traitée, la PFA en première intention réduit significativement la récidive d'arythmie auriculaire à 12 mois vs antiarythmique.","off":"Pour le patient chez qui une ablation est évoquée dès le diagnostic : la PFA devient une option initiale crédible — la décision reste cardiologique, mais bien informer aide à comprendre le parcours.","src":[["NEJM 2026","https://www.nejm.org/doi/abs/10.1056/NEJMoa2600929"],["ACC — Journal Scan AVANT GUARD (25/04/2026)","https://www.acc.org/latest-in-cardiology/journal-scans/2026/05/04/11/24/avant-guard"],["Cleveland Clinic Newsroom (25/04/2026)","https://newsroom.clevelandclinic.org/2026/04/25/cleveland-clinic-led-trial-shows-pulsed-field-ablation-procedure-more-effective-than-medications-for-persistent-atrial-fibrillation"]],"coi":"Industrie","fin":"Essai sponsorisé par Boston Scientific (système de champ pulsé)."},{"dom":"Diabète & Endocrinologie","type":"Officine","n":4,"dt":"2025-10","titre":"Micro-cancers papillaires thyroïdiens : la surveillance active tient à long terme (JAMA Surgery)","subst":"Surveillance active — carcinomes papillaires thyroïdiens à faible risque","res":"Étude à long terme (JAMA Surgery 2025;160(10):1117-1124) : la surveillance active des petits carcinomes papillaires thyroïdiens à faible risque est une stratégie durable, particulièrement chez les sujets plus âgés — une alternative validée à la chirurgie d'emblée, dans l'esprit de l'abstention surveillée déjà documentée pour l'otite.","off":"Rassurer le patient pour qui une surveillance (plutôt qu'une opération) est proposée : c'est une option validée, pas un renoncement aux soins — l'observance du suivi échographique est essentielle.","src":[["JAMA Surgery 2025 (doi)","https://doi.org/10.1001/jamasurg.2025.2957"],["AuntMinnie (20/08/2025)","https://www.auntminnie.com/clinical-news/ultrasound/article/15753388/active-thyroid-surveillance-effective-beneficial-for-older-patients"]],"coi":"Indépendant","fin":"Étude académique (JAMA Surgery) ; pas de financement industriel identifié dans les sources consultées."},{"dom":"Psychiatrie","type":"Médicament","n":2,"dt":"2025-07","titre":"Esketamine en monothérapie dans la dépression résistante : essai randomisé de phase 4 (JAMA Psychiatry)","subst":"esketamine","res":"Chez l'adulte avec dépression résistante (TRD), l'esketamine nasale en MONOTHÉRAPIE (56 ou 84 mg) réduit significativement les symptômes dépressifs vs placebo, avec amélioration dès 24 h après la première prise (essai de phase 4, Janssen/J&J, JAMA Psychiatry 2025;82(9):877-887, doi 10.1001/jamapsychiatry.2025.1317 ; couverture Medscape 15/07/2025 et Psych News juillet 2025 ; FDA : monothérapie esketamine approuvée le 21/01/2025).","src":[["JAMA Psychiatry (doi 10.1001/jamapsychiatry.2025.1317)","https://jamanetwork.com/journals/jamapsychiatry/fullarticle/2836115"],["PubMed 40601310","https://pubmed.ncbi.nlm.nih.gov/40601310/"],["Medscape (15/07/2025)","https://www.medscape.com/viewarticle/esketamine-monotherapy-safe-effective-resistant-depression-2025a1000inq"],["Healio (18/07/2025)","https://www.healio.com/news/psychiatry/20250718/esketamine-nasal-spray-monotherapy-reduces-symptoms-in-treatmentresistant-depression"]],"coi":"Industrie","fin":"Essai financé par Janssen/Janssen (J&J).","off":"Spravato reste administré au cabinet médical, jamais délivrable en officine."},{"dom":"Psychiatrie","type":"Médicament","n":2,"dt":"2025-04","titre":"Varénicline pour l'arrêt du vapotage nicotinique chez les jeunes : essai randomisé (JAMA)","subst":"varénicline","res":"Chez 261 jeunes de 16-25 ans vapoteurs quotidiens sans tabagisme régulier, 12 semaines de varénicline + counselling court (sessions hebdomadaires de 20 min) augmentent significativement l'abstinence au vapotage vs placebo+counselling ou soins usuels (essai randomisé 3 bras, Mass General Brigham, JAMA, résultats parus le 23/04/2025, PMID 40266580 ; NIH Research Matters : « Trial results appeared in JAMA on April 23, 2025 »). Usage À l'","src":[["JAMA (essai)","https://jamanetwork.com/journals/jama/fullarticle/2833137"],["PubMed 40266580","https://pubmed.ncbi.nlm.nih.gov/40266580/"],["NIH Research Matters (avril 2025)","https://beta.nih.gov/news-events/nih-research-matters/smoking-cessation-pill-may-help-youth-quit-vaping"],["Mass General Brigham (communiqué)","https://www.massgeneralbrigham.org/en/about/newsroom/press-releases/smoking-cessation-drug-helps-young-adults-quit-vaping"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le vapotage n'est pas un « moindre mal » à banaliser chez l'adolescent."},{"dom":"Psychiatrie","type":"Médicament","n":1,"dt":"2025-01","titre":"Antidépresseurs vs placebo dans le trouble d'anxiété généralisée : revue Cochrane (Kopcalic 2025)","subst":"antidépresseurs (TAG)","res":"La revue Cochrane (version publiée le 30/01/2025, CD012942.pub2) conclut avec une confiance élevée que les antidépresseurs (ISRS/IRSNa en tête) sont plus efficaces que le placebo dans le TAG ; incertitudes persistantes sur la durée du traitement et la comparaison directe avec les psychothérapies (Medscape 07/02/2025 : « We have high confidence that antidepressants are more effective than placebo »). La base n'a aucune entrée pharmacothérapie de l'anxiété (magnésium/ashwagandha = compléments, entrées distinctes) : la voilà.","src":[["Cochrane Library CD012942.pub2","https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD012942.pub2/full"],["Cochrane (page vulgarisée)","https://www.cochrane.org/evidence/CD012942_antidepressants-generalised-anxiety-disorder"],["Medscape (07/02/2025)","https://www.medscape.com/viewarticle/confirmed-antidepressants-effective-generalized-anxiety-2025a100032i"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un ISRS traite l'anxiété sur le fond en 2-4 semaines — pas une benzodiazépine d'appoint au long cours."},{"dom":"Seniors & polymédication","type":"Médicament","n":1,"dt":"2025-12","titre":"Traitement pharmacologique de l'anxiété du sujet âgé : revue systématique et méta-analyse (Lancet Psychiatry)","subst":"anxiété du sujet âgé (pharmacothérapie)","res":"Méta-analyse d'ECR (Lancet Psychiatry, Vol 12, Issue 12, 2025, S2215036625001002) : les ISRS/IRSNa constituent le traitement pharmacologique de première intention de l'anxiété du sujet âgé, avant les benzodiazépines — dont la balance bénéfice/risque (chutes, cognition) reste défavorable (consensus rapporté par Psych News Alert, mai 2025 : « antidepressants should be the first-line pharmacological treatment » ; revue utilisée par le Canadian Coalition for Seniors' Mental Health). Complète la","src":[["The Lancet Psychiatry (abstract)","https://www.thelancet.com/journals/lanpsy/article/PIIS2215-0366(25)00100-2/abstract"],["ScienceDirect (Vol 12, Issue 12, 2025)","https://www.sciencedirect.com/science/article/abs/pii/S2215036625001002"],["Psychiatric News Alert (mai 2025)","https://alert.psychnews.org/2025/05/ssris-and-snris-may-be-best-frontline.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Psychiatrie","type":"Médicament","n":3,"dt":"2025-03","titre":"Daridorexant (antagoniste double des récepteurs de l'orexine) dans l'insomnie chronique avec nycturie : essai croisé randomisé (Journal of Sleep Research)","subst":"daridorexant","res":"Chez 60 patients ≥55 ans avec insomnie chronique (ISI ≥13) et ≥3 mictions nocturnes, le daridorexant 50 mg améliore sur 4 semaines les critères subjectifs de sommeil ET la nycturie vs placebo, avec bonne tolérance (essai croisé en double aveugle, Journal of Sleep Research, jsr.70002 ; publication annoncée par Idorsia le 14/03/2025). premier antagoniste de l'orexine de la base. Utile","src":[["Journal of Sleep Research (jsr.70002)","https://onlinelibrary.wiley.com/doi/10.1111/jsr.70002"],["Communiqué Idorsia (14/03/2025)","https://www.globenewswire.com/news-release/2025/03/14/3042734/0/en/Idorsia-announces-the-publication-of-positive-data-with-daridorexant-in-patients-with-chronic-insomnia-and-nocturia.html"],["Psychiatry Advisor","https://www.psychiatryadvisor.com/news/daridorexant-improves-sleep-comorbid-nocturia-with-insomnia/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le patient qui « se réveille pour aller aux toilettes » peut d'abord être un insomniaque."},{"dom":"Douleur & Migraine","type":"Médicament","n":2,"dt":"2025-05","titre":"Ubrogepant 100 mg pendant la phase prodromale de la migraine : essai de phase 3 PRODROME (Nature Medicine)","subst":"ubrogepant","res":"Pris pendant le prodrome (avant la céphalée), l'ubrogepant 100 mg atténue les symptômes prodromaux fréquents dès 1 h après la prise (analyse exploratoire de l'essai croisé de phase 3 PRODROM mer's & Dementia: DADM)","subst":"lecanemab · donanemab (vie réelle)","res":"Dans une cohorte rétrospective de 172 patients amyloïde-positif traités en vie réelle (lecanemab n=89, donanemab n=83), les ARIA surviennent chez 11,2 % (lecanemab) et 13,3 % (donanemab) — moins que dans les essais pivots — et les réactions à la perfusion chez 9-12 % ; les patients souvent EXCLUS des essais y tolèrent les traitements sous les intervalles IRM approuvés par la FDA (Alzheimer's Dement (Amst) 2026 Aug 26;18(3):e70404, PMID 42661728, Hakim et al.). Nouveau vs l'entrée base « lecanemab et donanemab approuvés en Europe » : ici le suivi de sécurité en pratique, utile pour rassurer patients et aidants sur le monitorage IRM.","src":[["PubMed 42661728 (2026 Aug 26;18(3):e70404)","https://pubmed.ncbi.nlm.nih.gov/42661728/"],["Wiley (doi 10.1002/dad2.70404)","https://alz-journals.onlinelibrary.wiley.com/doi/full/10.1002/dad2.70404"],["AuntMinnie (donanemab vie réelle)","https://www.auntminnie.com/clinical-news/mri/article/15833230/mri-detects-aria-in-21-of-realworld-donanemab-patients"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Neurologie","type":"Médicament","n":4,"dt":"2025-06","titre":"Sécurité et efficacité à long terme de la fenfluramine dans le syndrome de Dravet (Epilepsia, extension ouverte)","subst":"fenfluramine","res":"L'analyse à long terme de la fenfluramine (Fintepla) chez l'enfant et l'adulte avec syndrome de Dravet confirme une efficacité maintenue et un profil de sécurité stable sur la durée (étude d'extension ouverte, Epilepsia 2025;66(6):1919-1932, Scheffer et al., doi 10.1111/epi.18342 ; UCB). Contexte historique lu dans les extraits : fenfluramine retirée en 1997 pour valvulopathie, aujourd'hui réenregistrée à faibles doses comme anti-épileptique. Aucune entrée épilepsie/Dravet en base (vorasidenib = gliome, exénatide = Parkinson).","src":[["Epilepsia (doi 10.1111/epi.18342)","https://onlinelibrary.wiley.com/doi/10.111 éraliser).","src":[["breastcancer.org — FDA approval May 1, 2026","https://www.breastcancer.org/treatment/hormonal-therapy/vepdegestrant"],["Arvinas — communiqué FDA approval VEPPANU","https://ir.arvinas.com/news-releases/news-release-details/arvinas-announces-fda-approval-veppanu-vepdegestrant-treatment"],["Drugs.com — Veppanu approval history","https://www.drugs.com/history/veppanu.html"],["AJMC — first heterobifunctional protein degrader","https://www.ajmc.com/view/fda-approves-vepdegestrant-for-esr1-mutated-er-positive-her2-negative-advanced-breast-cancer"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Oncologie","type":"Médicament","n":5,"dt":"2026-06","titre":"Sarclisa sous-cutané : premier traitement anticancéreux administré par injecteur portable (on-body injector) — approbation UE du 8 juin 2026, myélome multiple","subst":"isatuximab (Sarclisa) SC","res":"Le 8 juin 2026, la Commission européenne a approuvé la formulation sous-cutanée de l'isatuximab (Sarclisa, Sanofi) dans le myélome multiple : premier traitement anticancéreux de l'UE administré via un injecteur portable on-body (système enFuse) ou injection SC manuelle, avec la flexibilité d'administration à domicile ou en ambulatoire (communiqué Sanofi du 08/06/2026 vue + dépêche AFP « approuvé par l'UE » datée). Avis CHMP favorable de mars 2026, fondé sur l'étude de phase 3 IRAKLIA et études supportrices (Myeloma Patients Europe — page vue). Pas de doublon : l'isatuximab n'est pas en base (daratumumab et belantamab oui, autres molécules/indications).","src":[["Sanofi — communiqué du 8 juin 2026","https://www.sanofi.com/en/media-room/press-releases/2026/2026-06-08-05-00-00-3307781"],["AFP (dépêche du 08/06/2026) — injecteur portable approuvé par l'UE","news-afp-20260608-50a41b17"],["Myeloma Patients Europe — avis CHMP mars 2026 / IRAKLIA","https://www.mpeurope.org/european-commission-approves-subcutaneous-isatuximab-for-the-treatment-of-multiple-myeloma/"],["Myeloma.org — EU approves SC isatuximab","https://www.myeloma.org/news-events/multiple-myeloma-news/eu-approves-subcutaneous-isatuximab-body-injector"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Sujet d'éducation — administration hors hôpital, dispositif portable, observance."},{"dom":"Oncologie","type":"Médicament","n":5,"dt":"2026-09","titre":"CERVINO (topline, phase 3) : etentamig, engageur bi-spécifique de cellules T, améliore taux de réponse et SSP dans le myélome multiple en rechute/refractaire","subst":"etentamig (bi-spécifique BCMA)","res":"Le 3 septembre 2026, AbbVie a annoncé des résultats topline positifs de l'essai de phase 3 CERVINO : l'etentamig (anticorps bi-spécifique engageur de cellules T, cible BCMA, investigational) améliore significativement le taux de réponse et la survie sans progression vs bras contrôle chez les patients avec myélome multiple en rechute/refractaire — résultats présentés à l'International Myeloma Society Annual Meeting 2026 (Glasgow, 23-26 septembre), discussions en cours avec les autorités réglementaires (communiqué AbbVie du 03/09/2026 — page vue). Topline uniquement : pas de chiffres publiés dans les extraits — pas d'invention. Veille hémato : la vague des bi-spécifiques du myélome se confirme après teclistamab/talquetamab.","src":[["AbbVie — communiqué topline CERVINO (3 sept. 2026)","https://news.abbvie.com/2026-09-03-AbbVie-Announces-Positive-Topline-Results-from-the-Phase-3-CERVINO-Trial-Showing-Etentamig-Significantly-Improved-Response-Rate-and-Progression-Free-Survival-in-Patients-with-Relapsed-Refractory-Multiple-Myeloma"],["Fierce Biotech — couverture de l'essai de phase 3","https://www.fiercebiotech.com/biotech/abbvies-bispecific-t-cell-engager-shows-promise-in-ph-3-multiple-myeloma-trial"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-09","titre":"Chimiothérapies orales à
