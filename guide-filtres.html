nal est l'accompagnement du rendez-vous d'injection (carnet/rappel, jamais de « ça peut attendre ») et la cohérence de la prévention combinée (IST, contraception) ; un retard prolongé doit re-déclencher la question d'une couverture orale avec le prescripteur."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-04","titre":"Cannabis médical en France : la lettre de couverture prolonge l'accès des patients de l'expérimentation, le projet de décret de généralisation en route vers le Conseil d'État","subst":"cannabis médical · généralisation · décret · lettre de couverture · ANSM","res":"Actualité réglementaire datée : la ministre de la Santé Stéphanie Rist a signé la lettre de couverture garantissant la continuité d'accès au cannabis médical pour les patients encore suivis dans l'expérimentation (Le Quotidien du Pharmacien, « Publié le 07/04/2026 » — date lue ; franceinfo : la lettre « court jusqu'au 31 mars » avant prolongation, Newsweed : accès potentiellement jusqu'au 1er trimestre 2027). Le projet de décret sur l'évaluation, le remboursement et la tarification des médicaments à base de cannabis a été présenté aux parties prenantes le 18 février 2026 par la DGS et la DSS (icmf.fr, article daté du 30/04/2026), transmis au Conseil d'État le 2 juillet 2026 selon Medscape (relais L'Essentiel de l'Éco) ; l'ANSM a par ailleurs prorogé jusqu'au 31 décembre 2026 le comité scientifique temporaire chargé du suivi de l'expérimentation (icmf.fr, 30/04/2026).","src":[["Le Quotidien du Pharmacien — Publié le 07/04/2026 (lettre de couverture Rist)","https://www.lequotidiendupharmacien.fr/medicament-parapharmacie/cannabis-medical-lacces-aux-traitements-prolonge-pour-les-patients-de-lexperimentation"],["icmf.fr — Cannabis médical en France : où en est-on (30/04/2026, décret 18/02/2026, prorogation CST 31/12/2026)","https://icmf.fr/cannabis-medical-en-france-ou-en-est-on-depuis-2026/"],["franceinfo — Décret présenté au Conseil d'État d'ici fin juin (lettre de couverture)","https://www.franceinfo.fr/sante/drogue-addictions/cannabis/les-autorites-de-sante-fixent-le-calendrier-pour-la-mise-en-place-du-cannabis-therapeutique-dici-2027_7818329.html"],["L'Essentiel de l'Éco — transmission au Conseil d'État le 02/07/2026 (selon Medscape)","https://lessentieldeleco.fr/8929-cannabis-medical-lacces-reste-ferme-aux-nouveaux-malades"],["Newsweed — accès prolongé jusqu'au T1 2027","https://www.newsweed.fr/france-prolonge-acces-cannabis-medical-2027/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le cannabis médical reste indisponible hors cadre expérimental — aucune délivrance possible pour de nouveaux patients ; les ~1 700 patients encore inclus poursuivent via les pharmacien(ne)s habilité(e)s de l'expérimentation, et la généralisation (droit commun, remboursement) attend la publication des décrets au JO — à ce jour aucun médicament de cannabis n'est en droit commun français."},{"dom":"Autorisations & Sécurité","type":"Officine","n":5,"dt":"2026-06","titre":"Expérimentation française du cannabis médical : l'ANSM publie son rapport de janvier 2026 et une analyse Inserm/Université de Bordeaux rapporte des effets positifs, dont une réduction de la consommation d'opioïdes dans les 4 indications","subst":"cannabis médical · expérimentation ANSM · Inserm Bordeaux · opioïdes","res":"Bilan de l'expérimentation française (mars 2021 – clôture des inclusions 31/12/2024, ~3 209 patients inclus selon L'Essentiel de l'Éco) : l'ANSM a partagé son rapport de janvier 2026 sur l'usage médical du cannabis en France pour dessiner les contours d'une généralisation (Le Moniteur des pharmacies, vu en résultats ; relais Principes actifs). Une analyse publiée par Inserm et l'Université de Bordeaux rapporte des effets « positifs » chez les participants, dont une réduction de l'usage d'opioïdes dans les quatre indications de l'expérimentation (cannabishealthnews, article daté du 24/06/2026 ; internationalcbc ; businessofcannabis — publication primaire non consultée, chiffres non inventés).","src":[["Principes actifs — relais « ce que révèle le dernier rapport » ANSM (rapport de janvier 2026)","https://www.principesactifs.org/cannabis-medical-en-france-ce-que-reve-le-dernier-rapport/"],["cannabishealthnews — 24/06/2026, réduction des opioïdes dans 4 indications","https://cannabishealthnews.co.uk/2026/06/24/france-sets-july-deadline-for-medical-cannabis-regulations-as-study-shows-opioid-reductions/"],["internationalcbc — analyse Inserm/Université de Bordeaux, effets « positifs »","https://internationalcbc.com/french-medical-cannabis-experiment-yields-positive-effects/"],["businessofcannabis — étude non publiée, réductions d'opioïdes","https://businessofcannabis.com/france-sets-july-deadline-for-medical-cannabis-regulations-as-withheld-study-shows-opioid-reductions/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ces données alimentent le dossier de généralisation mais ne créent aucun droit à délivrer — pas de cannabis en officine hors expérimentation ; pour un patient douloureux chronique sous opioïdes demandant du cannabis, la réponse reste l'orientation médicale, pas l'automédication (CBD ou produit récréatif ≠ extrait standardisé)."},{"dom":"Ophtalmologie","type":"Alerte","n":5,"dt":"2026-07","titre":"Tensions d'approvisionnement sur les collyres : l'ANSM demande aux officines de délivrer au strict nécessaire (23 juillet 2026)","subst":"collyres · tensions d'approvisionnement · Excelvision · contingentement · ANSM","res":"Alerte de l'ANSM du 23 juillet 2026 (date lue : Pharmactu « l'ANSM publie le 23 juillet 2026 » ; dépêche AFP du 23/07/2026 « indiqué jeudi ») : plusieurs collyres connaissent des tensions d'approvisionnement persistantes en France, aggravées par les difficultés du site français de production d'Excelvision ; sont concernés notamment fluorescéine, tropicamide, phényléphrine, diclofénac ophtalmique et ciclosporine (Pharmactu, vu en résultats), principalement sous forme unidose. L'ANSM demande aux médecins et pharmaciens de réserver ces traitements aux situations indispensables, de recourir aux importations et aux alternatives disponibles (Le Moniteur des pharmacies, Vidal, Pharma365 — tous vus en résultats).","src":[["Pharmactu — alerte ANSM du 23/07/2026 (spécialités concernées)","https://pharmactu.fr/articles/tensions-collyres-excelvision-ansm-2026"],["AFP — « problèmes d'approvisionnement persistants sur les collyres », 23/07/2026","news-afp-20260723-6262c2d6"],["Vidal — Alerte ANSM : tensions en collyres","https://www.vidal.fr/actualites/38127-alerte-de-l-ansm-tensions-en-collyres.html"],["Pharma365 — l'ANSM demande aux officines de délivrer au strict nécessaire","https://www.pharma365.fr/je-m-informe/cote-medicament/penuries-de-collyres-lansm-demande-aux-officines-de-delivrer-au-strict-necessaire/"],["Le Moniteur des pharmacies — tensions en collyres, stocks sous pression","https://www.lemoniteurdespharmacies.fr/therapeutique/vigilances/collyres-de-nouvelles-tensions-mettent-les-stocks-sous-pression"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Délivrance au strict nécessaire, privilégier les alternatives disponibles et les multi-doses conservées quand le RCP le permet, expliquer au patient la conservation après ouverture (28 jours pour les multi-doses avec conservateur) pour éviter le gaspillage, et anticiper les ordonnances de renouvellement des traitements chroniques (glaucome, sécheresse oculaire)."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-04","titre":"Ontozry (cénobamate) : le PRAC impose des bilans hépatiques après des cas de lésions hépatiques sévères — DHPC approuvée lors de la réunion PRAC du 7-10 avril 2026","subst":"cénobamate · Ontozry · hépatotoxicité · PRAC · DHPC · épilepsie","res":"Sécurité européenne datée : lors de sa réunion du 7-10 avril 2026, le PRAC de l'EMA a approuvé une communication directe aux professionnels de santé (DHPC) au sujet de cas d'atteintes hépatiques sévères sous cénobamate (Ontozry, antiépileptique) — page EMA « Meeting highlights PRAC 7-10 April 2026 » (vue) : « PRAC agrees on communication to healthcare professionals about cases of severe liver injury with epilepsy medicine ; Ontozry (cenobamate): new requirements ». Relayée par Medscape (avril 2026) : les cliniciens européens doivent désormais réaliser des tests de fonction hépatique avant l'instauration et pendant le traitement ; la lettre d'information aux professionnels de santé est arrivée en France (Le Moniteur des pharmacies, vu en résultats).","src":[["EMA — Meeting highlights PRAC 7-10 April 2026 (page vue, 10 April 2026)","https://www.ema.europa.eu/en/news/meeting-highlights-pharmacovigilance-risk-assessment-committee-prac-7-10-april-2026"],["EMA — DHPC Ontozry (cénobamate)","https://www.ema.europa.eu/en/medicines/dhpc/ontozry"],["Medscape — EMA Tightens Liver Safety Rules for Epilepsy Drug (avril 2026)","https://www.medscape.com/viewarticle/ema-tightens-liver-safety-rules-epilepsy-drug-2026a1000bcw"],["Le Moniteur des pharmacies — « Ontozry : la lettre d'information aux professionnels de santé est arrivée »","https://www.lemoniteurdespharmacies.fr/therapeutique/vigilances/ontozry-la-lettre-dinformation-aux-professionnels-de-sante-est-arrivee"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Patient sous Ontozry = signaler immédiatement ictère, urines foncées, douleur abdominale droite, nausées persistantes (arrêt et contact prescripteur) ; vérifier les interactions (inducteurs/inhibiteurs enzymatiques) et la contraception obligatoire, et s'assurer que le bilan hépatique de suivi a bien été prescrit."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-09","titre":"Fers injectables : le PRAC ouvre une revue européenne sur l'hypophosphatémie et le risque osseux (ostéomalacie) — réunion du 31 août au 3 septembre 2026","subst":"fer injectable · carboxymaltose ferrique · Ferinject · hypophosphatémie · ostéomalacie · PRAC","res":"Le PRAC de l'EMA a ouvert le 31 août-3 septembre 2026 une procédure d'évaluation (referral) sur les médicaments à base de fer injectable, après des rapports d'hypophosphatémie grave — dont des cas d'ostéomalacie après seulement une ou deux doses et chez des patients sans facteur de risque identifié (page EMA « Parenteral iron-containing medicinal products - referral » vue, reliée aux highlights PRAC 31 août-3 septembre 2026 ; Medscape fr vu en résultats). L'hypophosphatémie est un effet indésirable déjà connu du carboxymaltose ferrique (Ferinject), classée fréquente (jusqu'à 1 patient sur 10, lu sur Medscape fr) ; le PRAC évalue si les garde-fous actuels suffisent. L'ANSM a publié un « Retour d'information sur le PRAC de septembre 2026 » (page vue) soulignant que les symptômes de l'hypophosphatémie (fatigue, douleurs musculaires et osseuses) peuvent être confondus avec ceux de la carence martiale elle-même.","src":[["EMA — Parenteral iron-containing medicinal products, referral (PRAC 31/08-03/09/2026)","https://www.ema.europa.eu/en/medicines/human/referrals/parenteral-iron-containing-medicinal-products"],["EMA — Meeting highlights PRAC 31 August - 3 September 2026","https://www.ema.europa.eu/en/news/meeting-highlights-pharmacovigilance-risk-assessment-committee-prac-31-august-3-september-2026"],["ANSM — Retour d'information sur le PRAC de septembre 2026 (page vue)","https://ansm.sante.fr/actualites/retour-dinformation-sur-le-prac"],["Medscape FR — Risques osseux et fer injectable : l'EMA lance une enquête","https://francais.medscape.com/viewarticle/risques-osseux-et-fer-injectable-lema-lance-enqu%C3%AAte-2026a1000x6n"],["Pharmactu — PRAC EMA fer injectable hypophosphatémie/ostéomalacie 2026","https://pharmactu.fr/articles/prac-ema-fer-injectable-hypophosphatemie-osteomalacie-2026"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les fers injectables sont administrés en structure de soins, mais le patient se réapprovisionne à l'officine — expliquer qu'une fatigue ou des douleurs osseuses persistantes après une injection de fer justifient un dosage de phosphatémie (le prescripteur peut négliger ce point), et ne pas systématiser les cures répétées de fer IV sans contrôle phosphoré."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-10","titre":"Deanxit (flupentixol/melitracen) : le PRAC ouvre une revue après des effets neurologiques et psychiatriques graves, parfois persistants après l'arrêt — 26-29 octobre 2026","subst":"Deanxit · flupentixol · melitracen · troubles du mouvement · PRAC","res":"Le PRAC a ouvert le 16 octobre 2026 une revue de Deanxit (association fixe flupentixol/melitracen, indiquée dans la dépression et l'anxiété) après des rapports d'effets indésirables neurologiques et psychiatriques graves : troubles du mouvement (tremblements, rigidité, akathisie, mouvements involontaires) et troubles de la mémoire et de la pensée, certains cas persistant après l'arrêt du traitement (page EMA « Meeting highlights PRAC 26-29 October 2026 » vue, datée du 30/10/2026 ; relais KELO/Reuters : revue déclenchée par 23 rapports spontanés graves reçus par l'agence belge entre 2024 et 2026 ; clinicaltrialvanguard : « launched Oct 16, 2026 »). La procédure concerne les pays où Deanxit est commercialisé (SanteMatin : sept pays).","src":[["EMA — Meeting highlights PRAC 26-29 October 2026 (page vue, 30/10/2026)","https://www.ema.europa.eu/en/news/meeting-highlights-pharmacovigilance-risk-assessment-committee-prac-26-29-october-2026"],["Relais KELO-FM/Reuters — 23 rapports belges 2024-2026 (30/10/2026)","https://kelofm.com/2026/10/30/ema-starts-review-of-deanxit-after-reports-about-side-effects/"],["Clinical Trial Vanguard — revue PRAC lancée le 16/10/2026","https://www.clinicaltrialvanguard.com/opinion/emas-prac-october-2026-review-of-deanxit-signals-tightened-scrutiny-on-fixed-dose-cns-combination-products/"],["SanteMatin — l'Europe enquête sur des troubles neurologiques parfois persistants (octobre 2026)","https://www.santematin.fr/deanxit-ema-enquete-troubles-neurologiques-octobre-2026"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Deanxit est délivré en France — chez un patient sous flupentixol/melitracen, tout tremblement, rigidité, agitation motrice ou trouble mnésique nouveau doit être rapporté et signalé au prescripteur (déclaration de pharmacovigilance possible par le pharmacien) ; ne pas banaliser ces signes comme « du stress », et ne jamais conseiller de poursuivre en automédication."},{"dom":"Soins primaires & Officine","type":"Officine","n":2,"dt":"2025-09","titre":"Bilan de médication structuré type 2a réalisé en officine chez les polymédiqués « tout-venant » : essai randomisé contrôlé en double aveugle dans 14 officines viennoises (Frontiers in Medicine)","subst":"bilan de médication type 2a · officine · polymédication · essai randomisé · Vienne","res":"Essai multicentrique randomisé, en aveugle (patient et évaluateur), en groupes parallèles (Bischof, Schoergenhofer et al., Frontiers in Medicine, publié le 3 septembre 2025 — date lue sur la page : « Front. Med., 03 September 2025 », doi 10.3389/fmed.2025.1656595 ; PubMed 40969807) : 14 officines viennoises, adultes ambulatoires prenant ≥ 8 médicaments, tous profils confondus (all-comers). L'intervention était un bilan de médication type 2a — évaluation structurée de la pharmacothérapie fondée sur l'historique médicamenteux et un entretien face à face — avec randomisation 1:1 après recensement des problèmes liés aux médicaments (DRP) à l'inclusion (méthode lue dans l'abstract ; chiffres de résultat non lus dans les extraits → décrits sans invention). Distinct des entrées en base : MEDREV (hôpital, sujet âgé), déprescription BMC Geriatrics/JAMA (programmes de déprescription ciblée) — ici le bilan complet en OFFICINE chez tout polymédiqué.","src":[["Frontiers in Medicine — publié le 03/09/2025 (page ouverte)","https://www.frontiersin.org/journals/medicine/articles/10.3389/fmed.2025.1656595/full"],["PubMed 40969807 — essai randomisé, 14 officines, ≥8 médicaments","https://pubmed.ncbi.nlm.nih.gov/40969807/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Valider l'entretien structuré (analyse d'ordonnance + entretien face à face) comme cœur du métier sur la polymédication (≥ 8 médicaments = seuil d'alerte simple à retenir au comptoir), documenter les problèmes détectés pour le prescripteur."},{"dom":"Soins primaires & Officine","type":"Officine","n":1,"dt":"2025-05","titre":"Erreurs médicamenteuses en officine : revue systématique internationale de 73 études — la prévention doit cibler prescription et délivrance (PLOS One)","subst":"erreurs médicamenteuses · officine · délivrance · revue systématique · sécurité du patient","res":"Revue systématique (El Hajj, Asiri, Husband, Todd et al., PLOS ONE 2025;20(5):e0322392 — citation datée lue : « PLOS One. 2025;20(5):e0322392 » et en-tête PDF ResearchGate « May 20, 2025 ») : 56 898 études identifiées, 73 incluses (littérature janvier 1995-décembre 2023). Messages lus dans l'abstract : la plupart des études provenaient d'Europe/Asie centrale et d'Amérique du Nord ; l'essentiel porte sur les erreurs de prescription et de délivrance, moins sur les autres étapes du processus ; la variabilité des taux et définitions entre régions empêche un taux mondial, très peu d'études évaluent la sévérité ; biais de sélection et d'identification fréquents ; plaidoyer pour un cadre de notification standardisé.","src":[["PLOS ONE — Medication errors in community pharmacies (revue systématique, 73 études)","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0322392"],["ResearchGate — PDF, en-tête « May 20, 2025 »","https://www.researchgate.net/publication/391907750_Medication_errors_in_community_pharmacies_a_systematic_review_of_the_international_literature"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La délivrance est l'une des deux étapes les plus documentées — le double contrôle et le conseil systématique au comptoir restent les barrières les plus sûres ; en France, toute erreur avérée mérite une déclaration (erreur médicamenteuse = critère de vigilance ANSM, déclaration possible par le pharmacien)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":4,"dt":"2025-04","titre":"Ginkgo biloba et interactions médicamenteuses : étude rétrospective sur le risque hémorragique et les profils de coagulation (PLOS One)","subst":"Ginkgo biloba · interactions · risque hémorragique · antiagrégants · anticoagulants","res":"Étude observationnelle rétrospective (PLOS ONE 2025, doi 10.1371/journal.pone.0321804 — en-tête PDF ResearchGate « April 8, 2025 » ; période janvier 2022-décembre 2023 dans un hôpital international) évaluant la prévalence et les implications cliniques des interactions médicamenteuses impliquant l'extrait de Ginkgo biloba sur le risque hémorragique et les profils de coagulation (méthode lue ; résultats chiffrés non lus dans les extraits → décrits sans invention). Aucune entrée Ginkgo en base (le millepertuis et la curcumine y sont, pas le Ginkgo) : NOUVEAU complément en base.","src":[["PLOS ONE — Impact of Ginkgo biloba drug interactions on bleeding risk","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0321804"],["ResearchGate — PDF, « April 8, 2025 », période 2022-2023","https://www.researchgate.net/publication/390595492_Impact_of_Ginkgo_biloba_drug_interactions_on_bleeding_risk_and_coagulation_profiles_A_comprehensive_analysis"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ginkgo = plante « mémoire » très demandée au comptoir — la question systématique est « prenez-vous un anticoagulant ou un antiagrégant (AVK, AOD, aspirine, clopidogrel) ou un AINS ? » ; en cas d'association, déconseiller et proposer au patient d'en parler à son médecin, car l'interaction potentialise le risque de saignement."},{"dom":"Soins primaires & Officine","type":"Officine","n":5,"dt":"2025-11","titre":"Modèles d'intervention pharmaceutique dans la gestion des interactions médicamenteuses : revue des pratiques (Pharmacy, MDPI)","subst":"interactions médicamenteuses · pharmacien · modèles d'intervention · revue","res":"Revue (Pharmacy 2025, 13(6):167, doi 10.3390/pharmacy13060167 — dates lues sur la page MDPI : « Submission received: 15 September 2025 / Accepted: 5 November 2025 / Published: 17 November 2025 ») sur les modèles d'intervention des pharmaciens dans la gestion des interactions médicament-médicament (DDI) au sein de la pharmacothérapie prescrite — les DDI sont l'un des problèmes les plus fréquents de l'administration médicamenteuse, et les pharmaciens y occupent une position charnière (extraits lus). Résultats détaillés non lus dans les extraits → décrits sans invention.","src":[["MDPI Pharmacy — 13(6):167, Published 17 November 2025","https://doi.org/10.3390/pharmacy13060167"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Cadrage utile pour structurer la réponse officinale face à une interaction détectée : évaluer la sévérité ET la clinique (dose, durée, fonction rénale/hépatique, âge), hiérarchiser (critique = contact prescripteur immédiat ; modérée = adaptation proposée ; mineure = information et surveillance), et tracer l'intervention (documentation = protection du patient et du pharmacien)."},{"dom":"Allergologie","type":"Médicament","n":1,"dt":"2026-11","titre":"Conjonctivite allergique : revue systématique et méta-analyse en réseau des formulations topiques d'olopatadine","subst":"olopatadine · conjonctivite allergique · collyre antihistaminique · NMA","res":"Revue systématique et méta-analyse en réseau (Frontiers in Pharmacology, article 10.3389/fphar.2026.1914064, « Published: 02 November 2026 » vu sur le PDF ; recherche PubMed/Embase/CENTRAL jusqu'au 1er mai 2026) comparant les formulations et concentrations d'olopatadine en collyre dans la conjonctivite allergique : les différentes formulations d'olopatadine restent la référence topique la mieux évaluée de l'allergie oculaire, avec des différences de rapidité d'action et de tolérance selon la force et le véhicule. Première entrée « allergie oculaire » de la base (la base ne contenait ni olopatadine ni conjonctivite allergique — grep vérifié).","src":[["Frontiers in Pharmacology — NMA olopatadine (PDF, « Published 02 November 2026 »)","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1914064/pdf"],["Frontiers in Pharmacology — page article","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1914064/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Face à un œil rouge qui gratte au printemps, le collyre antihistaminique (type olopatadine) se prend à heure fixe pendant toute la saison pollinique, s'associe à des lavages au sérum physiologique, et une douleur, une baisse d'acuité visuelle ou une photophobie marquée ne sont PAS une allergie → orientation médecin/ophtalmo."},{"dom":"Urologie & santé masculine","type":"Médicament","n":1,"dt":"2025-12","titre":"Vessie hyperactive : les anticholinergiques urinaires associés à un surrisque de démence vs mirabégron (revue systématique et méta-analyse)","subst":"anticholinergiques urinaires · vessie hyperactive · démence · mirabégron · bêta-3 agoniste","res":"Revue systématique et méta-analyse (Neurological Sciences, PMID 41066055, esummary « 2025 Dec » ; extrait PubMed : les patients traités par anticholinergiques urinaires pour vessie hyperactive ont un risque accru de démence, à la fois vs absence de traitement médicamenteux et vs traitement par mirabégron). Message cohérent avec la charge anticholinergique déjà documentée en base chez le senior, mais 1re entrée dédiée au couple « vessie hyperactive – cognition ».","src":[["PubMed 41066055 — Neurological Sciences (esummary : 2025 Dec)","https://pubmed.ncbi.nlm.nih.gov/41066055/"],["Springer — Neurological Sciences (page article)","https://link.springer.com/article/10.1007/s10072-025-08546-4"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Chez un senior sous anticholinergique urinaire (oxybutynine, solifénacine…) qui se plaint de mémoire, ne pas arrêter seul — signaler au prescripteur l'existence d'alternatives non anticholinergiques (mirabégron, bêta-3 agonistes) et rappeler la révision annuelle de l'ordonnance."},{"dom":"Ophtalmologie","type":"Médicament","n":4,"dt":"2026-01","titre":"Larmes artificielles sans conservateur vs conservées : supériorité des unithères sur l'épithélium cornéen (J Ophthalmol)","subst":"larmes artificielles · conservateur · sécheresse oculaire · unidose · MS-39","res":"Étude comparative prospective (Nassar et al., Journal of Ophthalmology 2026;2026:9923353, « 2026 Jan 8 » vu sur PMC) : chez des patients en sécheresse oculaire, les larmes artificielles sans conservateur augmentent davantage l'épaisseur épithéliale cornéenne (cartographie MS-39) et améliorent davantage le score OSDI que les formes conservées (extrait PubMed : supériorité subjective et objective des préservatifs-free ; « Revised 2025 Dec 11 ; Accepted 2025 Dec 15 »). Différenciation nette avec l'entrée oméga-3/sécheresse de la base (complément, autre question).","src":[["PMC — J Ophthalmol 2026 Jan 8;2026:9923353","https://pmc.ncbi.nlm.nih.gov/articles/PMC12780744/"],["PubMed 41522238","https://pubmed.ncbi.nlm.nih.gov/41522238/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Privilégier les collyres en unidose sans conservateur au long cours — le conservateur (benzalkonium) abîme la surface oculaire quand les gouttes sont prises tous les jours ; en pot multimdose pour usage court, l'unithère dès que la prise dépasse ~4/jour ou au-delà de quelques semaines."},{"dom":"Urologie & santé masculine","type":"Médicament","n":1,"dt":"2025-06","titre":"Éjaculation précoce : revue parapluie des traitements pharmacologiques (Journal of Sexual Medicine)","subst":"éjaculation précoce · dapoxétine · IELT · revue parapluie · santé masculine","res":"Revue parapluie (umbrella review) des méta-analyses d'essais randomisés (The Journal of Sexual Medicine, vol 22, n° 6, juin 2025, p. 1014-1023, DOI 10.1093/jsxmed/qdaf094 — citation complète vue sur la page Oxford) : hiérarchie d'efficacité des traitements pharmacologiques de l'éjaculation précoce sur le temps de latence (IELT) et leur tolérance. 1re entrée « éjaculation précoce » de la base (grep vérifié).","src":[["The Journal of Sexual Medicine — Vol 22, Issue 6, June 2025, pp. 1014-1023","https://academic.oup.com/jsm/article-abstract/22/6/1014/8125521"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Sujet fréquent au comptoir et rarement avoué — la dapoxétine est un médicament sur ordonnance à prendre 1-3 h avant le rapport (pas un produit de complément), et aucune « pilule naturelle » n'a de preuve sérieuse ; oser la phrase d'ouverture « c'est un trouble fréquent et traitable » puis orienter vers le médecin."},{"dom":"ORL & stomatologie","type":"Médicament","n":3,"dt":"2025-05","titre":"Épistaxis : oxymétazoline supérieure à l'acide tranexamique et à l'adrénaline-lidocaïne pour l'hémostase rapide (Am J Emerg Med)","subst":"épistaxis · oxymétazoline · acide tranexamique · vasoconstricteur nasal · saignement de nez","res":"Essai comparatif (American Journal of Emergency Medicine, vol 91, p. 104-109, 2025, PMID 40023137, esummary « 2025 May » ; extrait PubMed : l'oxymétazoline est supérieure à l'acide tranexamique topique et à l'association adrénaline-lidocaïne pour obtenir une hémostase rapide et réduire les récidives ; accessibilité et effet rapide plaident pour son usage pratique). 1re entrée « épistaxis » de la base (grep vérifié).","src":[["PubMed 40023137 — Am J Emerg Med (esummary : 2025 May)","https://pubmed.ncbi.nlm.nih.gov/40023137/"],["ScienceDirect — Am J Emerg Med, vol 91, pp. 104-109","https://www.sciencedirect.com/science/article/abs/pii/S0735675725001445"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour un saignement de nez antérieur : moucher doucement, compression ferme de l'aile du nez 10 min penché en avant, coton/glacière possible — et le vasoconstricteur nasal type oxymétazoline (accessible, en pulvérisation côté du saignement) aide à tarir ; un saignement qui dure > 20 min, postérieur, ou sous anticoagulant avec fatigue = avis médical."},{"dom":"Santé publique","type":"Officine","n":1,"dt":"2025-09","titre":"Stewardship antibiotique : les équipes de pharmacie communautaire passées au crible (revue de portée, JAC-Antimicrobial Resistance)","subst":"stewardship · antibiorésistance · pharmacie communautaire · bon usage · revue de portée","res":"Revue de portée (scoping review) des interventions de stewardship impliquant les équipes de pharmacie de ville (JAC-Antimicrobial Resistance 2025 Sep 11;7(5):dlaf156 — citation vue sur PMC ; études surtout de pays à revenu élevé, dont 2 françaises : extraits vus « France(56,57) ») : délivrance de conseils, reportciblage des antibiotiques, durées courtes, tests rapides — l'équipe officinale est un levier documenté du bon usage, avec des formats variés selon les pays. 1re entrée « stewardship » dédiée de la base (le livre AWaRe rétro couvre l'OMS, pas la pharmacie).","src":[["PMC — JAC Antimicrob Resist. 2025 Sep 11;7(5):dlaf156","https://pmc.ncbi.nlm.nih.gov/articles/PMC12455195/"],["JAC-Antimicrobial Resistance — page Oxford Academic","https://academic.oup.com/jacamr/article/7/5/dlaf156/8251591"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le réflexe stewardship au comptoir = ne jamais délivrer d'antibiotique sans ordonnance, questionner l'indication et la durée (5 jours suffisent souvent, cf. revue parapluie déjà en base), et décaler la 1re demande de renouvellement atypique au prescripteur."},{"dom":"Seniors & polymédication","type":"Officine","n":1,"dt":"2026-05","titre":"Canicule et médicaments du senior : revue de portée des effets des médicaments sur le risque lié à la chaleur (Pharmacy)","subst":"canicule · chaleur · médicaments · senior · diurétiques · anticholinergiques","res":"Revue de portée (Pharmacy 2026, 14(3), 74, DOI 10.3390/pharmacy14030074 — « 17 May 2026 » vu sur la page du numéro MDPI) : les vagues de chaleur exposent le senior aux pathologies liées à la chaleur (hyperthermie, déshydratation, désordres hydro-électrolytiques) et certains médicaments aggravent le risque — diurétiques, IEC/ARA2, anticholinergiques, neuroleptiques, lithium (avec l'OMS et les alertes été), sédatifs — via déshydratation, altération de la thermorégulation ou de la soif. Complémentaire des entrées « charge anticholinergique » déjà en base (autre question : la chaleur).","src":[["MDPI — Pharmacy 2026, 14(3), 74 — « 17 May 2026 » (page du numéro)","https://www.mdpi.com/2226-4787/14/3"],["PMC — article complet","https://pmc.ncbi.nlm.nih.gov/articles/PMC13214780/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Avant l'été, repasser l'ordonnance du senior : stocks d'eau conseillés, éviter les sorties aux heures chaudes, ne pas « couper le diurétique » seul mais alerter le médecin si diarrhée/vomissements/forte chaleur (risque d'insuffisance rénale aiguë sous IEC-diurétique), et rappeler que la sensation de soif diminue avec l'âge."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2026-09","titre":"SINGLE-AF : anticoaguler la fibrillation auriculaire à risque intermédiaire d'AVC — les AOD gagnent vs pas d'anticoagulation (NEJM)","subst":"fibrillation auriculaire · risque intermédiaire · AOD · SINGLE-AF · anticoagulation","res":"Essai randomisé coréen (NEJM 2026;395(12):1155-1165, esummary PMID 42663303 « 2026 Sep 24 » ; présenté ESC 2026, ACC vu) : chez les patients en FA à risque INTERMÉDIAIRE d'AVC, l'anticoagulation orale directe (AOD) réduit le critère composite AVC/embolie systémique/hémorragie majeure/décès CV à 24 mois par rapport à l'absence d'anticoagulation (extrait PubMed : « DOAC therapy led to a lower risk … at 24 months than no anticoagulation »). Question fréquente au comptoir : « mon médecin dit que je suis entre deux ».","src":[["NEJM — SINGLE-AF (2026;395(12):1155-1165, PMID 42663303)","https://www.nejm.org/doi/full/10.1056/NEJMoa2607978"],["PubMed 42663303 (esummary : 2026 Sep 24)","https://pubmed.ncbi.nlm.nih.gov/42663303/"],["ACC — Arrhythmia trials ESC 2026","https://www.acc.org/Latest-in-Cardiology/Articles/2026/10/09/15/06/Arrhythmia-Related-Trials-Featured-at-ESC-Congress-2026"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ne jamais conseiller l'arrêt d'un anticoagulant pour FA ; la zone grise du risque intermédiaire penche désormais vers l'anticoagulation — la décision reste médicale, mais le patient doit savoir que « risque intermédiaire » n'est plus une raison d'attendre."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2026-03","titre":"CHAMPION-AF : fermeture de l'appendice auriculaire gauche non inférieure aux AOD dans la FA (NEJM, ACC 2026)","subst":"appendice auriculaire gauche · Watchman · CHAMPION-AF · AOD · fibrillation auriculaire","res":"Essai randomisé (CHAMPION-AF, NEJM DOI 10.1056/NEJMoa2517213, présenté à l'ACC le 28/03/2026 — communiqué ACC « simultaneously published online in the New England Journal of Medicine » vu) : chez les candidats à l'anticoagulation, la fermeture percutanée de l'appendice auriculaire gauche est NON INFÉRIEURE au traitement par AOD sur le composite décès/AVC/hémorragie majeure (extrait NEJM vu). La base avait l'essai OPTION (post-ablation) — CHAMPION-AF élargit à la FA générale, sans restriction aux saigneurs.","src":[["NEJM — CHAMPION-AF (NEJMoa2517213)","https://www.nejm.org/doi/abs/10.1056/NEJMoa2517213"],["ACC — communiqué presse 28/03/2026","https://www.acc.org/about-acc/press-releases/2026/03/28/14/32/left-atrial-appendage-closure-noninferior-to-blood-thinners-for-lowering-stroke-risk-death-in-some-patients-with-afib"],["PCR online — couverture ACC 2026","https://www.pcronline.com/News/Congress-coverages/ACC/2026/CHAMPION-AF-LAAC-vs-oral-anticoagulation-in-atrial-fibrillation"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un patient porteur de Watchman™ après fermeture réussie reste sous traitement antithrombotique selon le protocole de son centre (souvent 3-6 mois d'anticoagulant/antiagrégant) — ne jamais conseiller l'arrêt de « l'anticoagulant » parce qu'il a un « parapluie », suivre la lettre du centre."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2026-11","titre":"SIMPLAAFY : après fermeture de l'appendice auriculaire, une monothérapie suffit (essai randomisé, TCT 2026)","subst":"SIMPLAAFY · appendice auriculaire · monothérapie · antiagrégant · Watchman FLX","res":"Essai randomisé SIMPLAAFY (Boston Scientific, news du 02/11/2026 vu ; présenté à TCT 2026, couverture Healio du 05/11/2026 vue ; page JAMA vue) : après une fermeture d'appendice auriculaire gauche sans complication, les monothérapies (AOD à dose réduite OU aspirine seule) sont non inférieures à la double antiagrégation à 6 mois sur le composite décès/AVC/hémorragie majeure (extrait Boston Scientific/Healio : « both post-implant monotherapies achieved non-inferiority compared to dual antiplatelet therapy »).","src":[["Boston Scientific — news SIMPLAAFY (02/11/2026)","https://news.bostonscientific.com/2026-11-02-SIMPLAAFY-study-of-the-WATCHMAN-FLX-TM-Pro-Left-Atrial-Appendage-Closure-Device-meets-primary-endpoints"],["JAMA — page article SIMPLAAFY","https://jamanetwork.com/journals/jama/fullarticle/2856271"],["Healio — couverture TCT 2026 (05/11/2026)","https://www.healio.com/news/cardiology/20261105/data-support-monotherapy-approach-after-uncomplicated-left-atrial-appendage-closure"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Simplification attendue des traitements post-implant — mais la durée et le choix de la monothérapie relèvent du centre implantateur ; vérifier la lettre de sortie avant toute substitution et ne pas banaliser la phase des 3 premiers mois."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2024-10","titre":"EARLY TAVR : TAVI précoce vs surveillance dans le rétrécissement aortique serré ASYMPTOMATIQUE (NEJM)","subst":"EARLY TAVR · rétrécissement aortique · asymptomatique · TAVI · surveillance","res":"Essai randomisé (NEJM, DOI 10.1056/NEJMoa2405880 ; présenté TCT 2024 le 28/10/2024, communiqués ACC/CRF vus datés octobre 2024 ; extrait NEJM vu : « early TAVR was superior to clinical surveillance in reducing the incidence of death, stroke, or unplanned hospitalization ») : chez le patient ASYMPTOMATIQUE à rétrécissement aortique serré, le TAVI précoce surpasse la surveillance clinique sur décès/AVC/hospitalisations — l'ère du « attendre les symptômes » s'achève pour les opérables. La base avait TAVI vs PCI et PROGRESS (RA modéré) mais pas EARLY TAVR.","src":[["NEJM — EARLY TAVR (NEJMoa2405880)","https://www.nejm.org/doi/full/10.1056/NEJMoa2405880"],["ACC — page essai EARLY TAVR (TCT 2024, octobre 2024)","https://www.acc.org/latest-in-cardiology/clinical-trials/2024/10/24/14/42/early-tavr"],["CRF — communiqué (28/10/2024)","https://www.crf.org/crf/news-and-events/news/news/3948-study-finds-early-tavr-can-be-beneficial-for-patients-with-asymptomatic-severe-aortic-stenosis"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un patient « faussement asymptomatique » qui ralentit le pas, s'essouffle à la montée des escaliers ou dort la tête surélevée doit le signaler — le suivi des remplacements valvulaires en attente s'accélère ; anticoagulants et endocardite (carte de prévention) restent les réflexes conseil."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-05","titre":"Sotatercept (Winrevair) dans l'HTAP à haut risque de décès : ZENITH réduit le composite mort/greffe/dégradation clinique (NEJM)","subst":"sotatercept · HTAP · ZENITH · activated signalling · haut risque","res":"Essai randomisé de phase 3 ZENITH (NEJM, esummary PMID 40167274 « 2025 May 29 » ; présenté ACC.25, mars 2025, ACC vu) : chez l'adulte en hypertension artérielle pulmonaire à HAUT risque de décès sous traitement de fond maximal, l'ajout de sotatercept (anticorps fusion anti-activine, sous-cutané toutes les 3 semaines) réduit le composite décès toute cause/greffe/dégradation clinique vs placebo (extrait PubMed vu). La base ne comptait aucune entrée HTAP (grep vérifié).","src":[["PubMed 40167274 — ZENITH (esummary : 2025 May 29)","https://pubmed.ncbi.nlm.nih.gov/40167274/"],["ACC — couverture ACC.25 ZENITH","https://www.acc.org/Latest-in-Cardiology/Clinical-Trials/2025/03/28/02/58/zenith"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le sotatercept est un traitement hospitalier prescrit en centre spécialisé — au comptoir, penser aux signes d'aggravation d'une HTAP connue (syncope, œdèmes, lipothymies) = urgence centre HTAP ; le médicament augmente l'hémoglobine, surveiller la numération avec l'équipe prescriptrice."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-10","titre":"Sotatercept dès la première année après diagnostic d'HTAP : HYPERION réduit l'aggravation clinique de 76 % (NEJM)","subst":"sotatercept · HYPERION · HTAP · diagnostic récent · ERS 2025","res":"Essai randomisé de phase 3 HYPERION (NEJM, esummary PMID 41025556 « 2025 Oct 23 » ; communiqué Merck vu : « reduced the risk of clinical worsening events by 76 % », présenté ERS 2025) : chez les adultes diagnostiqués depuis MOINS D'UN AN, l'ajout du sotatercept au traitement de fond réduit l'aggravation clinique vs placebo (extrait PubMed vu). Complément de ZENITH (haut risque) : le bénéfice vaut aussi tôt dans la maladie.","src":[["PubMed 41025556 — HYPERION (esummary : 2025 Oct 23)","https://pubmed.ncbi.nlm.nih.gov/41025556/"],["Merck — communiqué HYPERION (ERS 2025)","https://www.merck.com/news/winrevair-sotatercept-csrk-reduced-the-risk-of-clinical-worsening-events-by-76-compared-to-placebo-in-patients-recently-diagnosed-with-pah-on-background-therapy-in-phase-3-hyperion-trial/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Même message — dépistage précoce de la dyspnée inexpliquée chez la femme jeune/moyenne (le délai moyen de diagnostic de l'HTAP reste de ~2 ans) : une dyspnée d'effort inhabituelle avec lipothymies mérite un avis, pas un « manquez de sport »."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2026-06","titre":"Aprocitentan (dual ERA) : réduction significative et durable de l'albuminurie dans l'HTA résistante (PRECISION, post hoc Hypertension)","subst":"aprocitentan · HTA résistante · albuminurie · PRECISION · endothéline","res":"Analyse post hoc de l'essai de phase 3 PRECISION (Hypertension — journal AHA, page article vue ; annoncée par Idorsia le 01/06/2026, communiqué BioSpace daté vu) : chez les patients en HTA résistante, l'aprocitentan (antagoniste dual des récepteurs de l'endothéline, oral une fois par jour, 4e ligne) réduit significativement et durablement l'albuminurie, marqueur de risque rénal et CV (extrait communiqué : « significant and sustained reduction in albuminuria » ; une autre analyse portait sur les patients IRC — page Hypertension vue). 1re entrée aprocitentan de la base.","src":[["Hypertension (AHA) — Aprocitentan in CKD and resistant hypertension","https://www.ahajournals.org/doi/10.1161/HYPERTENSIONAHA.125.25563"],["BioSpace — communiqué Idorsia (01/06/2026)","https://www.biospace.com/press-releases/new-analysis-of-idorsias-aprocitentan-demonstrates-significant-and-sustained-reduction-in-albuminuria-in-patients-with-uncontrolled-resistant-hypertension"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"HTA résistante = 3 classes dont diurétique à doses pleines non contrôlée — vérifier l'observance ET le sel avant de parler de résistance ; les rétinides/ERA sont tératogènes : contraception obligatoire chez la femme en âge de procréer, vérifiée à chaque délivrance."},{"dom":"Cardiologie","type":"Médicament","n":4,"dt":"2026-06","titre":"Inclisiran en vie réelle : baisse de LDL-C confirmée en prévention secondaire hors essais (cohorte espagnole, Clin Invest Arterioscler)","subst":"inclisiran · LDL-C · vie réelle · prévention secondaire · PCSK9 ARNi","res":"Étude observationnelle rétrospective espagnole (120 adultes en prévention secondaire traités par inclisiran entre 12/2023 et 08/2025 ; Clin Investig Arterioscler Thromb Vasc Biol, esummary PMID 42248700 « 2026 Jun 5 ») : en pratique réelle, l'inclisiran (ARN interférent anti-PCSK9, 2 injections/an) confirme la réduction de LDL-C chez les patients en athérosclérose établie. NOUVELLE DONNÉE par rapport aux pivots ORION-10/11 (2020) déjà en base : la vie réelle valide les essais.","src":[["PubMed 42248700 — Clin Investig Arterioscler (esummary : 2026 Jun 5)","https://pubmed.ncbi.nlm.nih.gov/42248700/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le patient sous inclisiran garde ses statines (l'inclisiran est un ADD-on, pas un remplacement), les injections se font en centre/hôpital (ou infirmier formé) à J0, J90 puis tous les 6 mois — un rendez-vous manqué ne se « rattrape » pas par double dose, on reprend le rythme."},{"dom":"Cardiologie","type":"Médicament","n":4,"dt":"2026-09","titre":"Bempédoïque acide en vie réelle : efficace et bien toléré chez l'intolérant aux statines (cohorte espagnole, J Clin Lipidol)","subst":"bempédoïque acide · intolérance statine · LDL-C · vie réelle · persistance","res":"Étude observationnelle espagnole (Journal of Clinical Lipidology, esummary PMID 42580964 « 2026 Sep » ; extrait PubMed : « effective and generally well-tolerated lipid-lowering therapy, particularly in patients with statin intolerance ») : en vie réelle, le bempédoïque acide (ACL inhibiteur oral) abaisse le LDL-C avec une bonne tolérance et une persistance correcte, en particulier chez les intolérants aux statines — la promesse de CLEAR Outcomes (pivot déjà en base) se vérifie hors essais.","src":[["PubMed 42580964 — J Clin Lipidol (esummary : 2026 Sep)","https://pubmed.ncbi.nlm.nih.gov/42580964/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'« intolérance aux statines » mérite d'être requalifiée au comptoir — beaucoup de myalgies relèvent d'attentes négatives (nocebo) ; une vraie intolérance ne veut pas dire « sans traitement hypolipémiant » : bempédoïque/ézétimibe existent, et le médecin peut réintroduire une statine à faible dose de façon alternée."},{"dom":"Rhumatologie","type":"Médicament","n":2,"dt":"2026-07","titre":"Abatacept vs adalimumab en tête-à-tête dans la PR précoce doublement séropositive (Ann Rheum Dis)","subst":"abatacept · adalimumab · polyarthrite rhumatoïde précoce · tête-à-tête · ACPA","res":"Essai randomisé de tête-à-tête (Ann Rheum Dis, esummary PMID 42425800 « 2026 Jul 9 ») : comparaison directe abatacept (inhibiteur de la costimulation T) vs adalimumab (anti-TNF) chez l'adulte en PR PRÉCOCE, insuffisant au méthotrexate, doublement séropositif (ACPA+/FR+) — population à haut risque d'érosions. 1re comparaison directe de ces deux classes en PR précoce séropositive (grep vérifié : aucune entrée abatacept en base).","src":[["PubMed 42425800 — Ann Rheum Dis (esummary : 2026 Jul 9)","https://pubmed.ncbi.nlm.nih.gov/42425800/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les deux sont des biothérapies sous-cutanées que le patient s'injecte — vérifier la chaîne du froid, la rotation des sites d'injection et l'absence d'infection en cours (fièvre = suspendre et appeler le rhumatologue) ; pas de vaccin vivant sous biothérapie."},{"dom":"Rhumatologie","type":"Médicament","n":2,"dt":"2026-03","titre":"APIPPRA : l'abatacept retarde l'apparition de la polyarthrite rhumatoïde pendant jusqu'à 4 ans chez les sujets à risque (Lancet Rheumatology)","subst":"abatacept · APIPPRA · prévention PR · arthralgies ACPA · préclinique","res":"Suivi à long terme de l'essai de phase 2b APIPPRA (Lancet Rheumatology, esummary PMID 41576971 « 2026 Mar » ; 213 participants ACPA+ avec arthralgies sans synovite ; couverture RheumLive vue : « Abatacept May Delay RA Onset for Up to 4 Years ») : un an d'abatacept chez les individus À RISQUE (ACPA+, arthralgies) retarde la survenue d'une PR clinique de plusieurs années. Première entrée « prévention de la PR » de la base.","src":[["PubMed 41576971 — Lancet Rheumatology (esummary : 2026 Mar)","https://pubmed.ncbi.nlm.nih.gov/41576971/"],["RheumLive — APIPPRA long-term","https://www.rheum-live.com/view/abatacept-may-delay-ra-onset-4-years-at-risk-individuals-cope-md"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les arthralgies inexpliquées chez un patient avec antécédents familiaux de PR méritent un avis médical précoce plutôt qu'un simple antalgique au long cours — le traitement au stade préclinique devient un concept réel."},{"dom":"Douleur & Migraine","type":"Médicament","n":2,"dt":"2026-01","titre":"TNX-102 SL (cyclobenzaprine sublinguale au coucher) : la fibromyalgie traitée par le sommeil non réparateur — phase 3 positif (Pain Medicine)","subst":"TNX-102 SL · cyclobenzaprine sublinguale · fibromyalgie · sommeil non réparateur","res":"Essai de phase 3 (Pain Medicine 27(1):86, esummary PMID 40627411 « 2026 Jan 1 » ; extrait PubMed : « Bedtime TNX-102 SL treatment was associated with significant improvements in fibromyalgia symptoms and function and was well tolerated ») : la cyclobenzaprine EN SUBLINGUAL à dose faible, prise au coucher (ciblant le sommeil non réparateur), améliore douleur, fatigue et fonction dans la fibromyalgie. 1re entrée « fibromyalgie » de la base (grep vérifié) — jusqu'ici aucune option médicamenteuse nouvelle validée.","src":[["PubMed 40627411 — Pain Medicine (esummary : 2026 Jan 1)","https://pubmed.ncbi.nlm.nih.gov/40627411/"],["Pain Medicine — page article (Oxford)","https://academic.oup.com/painmedicine/article/27/1/86/8193722"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La fibromyalgie se traite d'abord par le sommeil et l'activité physique adaptée ; les formulations faiblement dosées au coucher (à venir) : attention à la somnolence et à ne jamais doubler une dose oubliée ; les opioïdes n'ont PAS leur place."},{"dom":"Rhumatologie","type":"Médicament","n":4,"dt":"2026-07","titre":"Romosozumab vs teriparatide : moindre mortalité toutes causes en vie réelle (Osteoporos Int)","subst":"romosozumab · teriparatide · mortalité · ostéoporose · vie réelle","res":"Étude de vie réelle (Osteoporos International, esummary PMID 41961089 « 2026 Jul » ; extrait PubMed : romosozumab associé à un risque significativement plus faible de mortalité toutes causes que le teriparatide) : dans les données réelles, l'ostéoanabolique romosozumab (anti-sclérostine, 12 mois puis antirésorbeur) est associé à une moindre mortalité que le teriparatide, particulièrement chez les plus âgés — une donnée d'efficacité comparative, à prendre avec les limites de l'observationnel. La base avait la méta vitamine D/calcium et K2 mais aucune entrée ostéoanabolique (grep vérifié).","src":[["PubMed 41961089 — Osteoporos Int (esummary : 2026 Jul)","https://pubmed.ncbi.nlm.nih.gov/41961089/"],["Springer — page article","https://link.springer.com/article/10.1007/s00198-026-07968-w"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Sous romosozumab ou teriparatide, ce sont des INJECTEURS auto-administrés (sous-cutané) — conserver au frigo, ne jamais laisser à température ambiante > 24 h, et s'assurer de l'adhésion quotidienne/mensuelle : c'est une « cure » séquentielle suivie d'un antirésorbeur, pas un traitement isolé."},{"dom":"Rhumatologie","type":"Médicament","n":3,"dt":"2026-11","titre":"Icotrokinra (ICOTYDE) : le peptide oral anti-IL-23 réussit sa phase 3 dans le rhumatisme psoriasique (topline ACR 2026)","subst":"icotrokinra · rhumatisme psoriasique · IL-23 oral · ICONIC-PsA · peptide","res":"Résultats topline de la phase 3 ICONIC-PsA 1 (communiqué Johnson & Johnson du 07/11/2026, PRNewswire/jnj.com vus ; présenté en late-breaking à l'ACR Convergence 2026) : chez les adultes bio-naïfs en rhumatisme psoriasique actif, 58 % des patients sous icotrokinra (peptide ORAL quotidien ciblant le récepteur de l'IL-23) atteignent ACR20 vs 41 % sous placebo. Perspective officinale : le premier « biologique oral » de la famille IL-23 — un espoir d'observance simplifiée vs injections, encore expérimental.","src":[["PRNewswire — J&J icotrokinra ICONIC-PsA (07/11/2026)","https://www.prnewswire.com/news-releases/johnson--johnson-announces-icotyde-icotrokinra-delivers-significant-improvement-in-psoriatic-arthritis-disease-activity-among-biologic-naive-patients-with-once-daily-targeted-oral-peptide-302932455.html"],["J&J — communiqué officiel","https://www.jnj.com/media-center/press-releases/johnson-johnson-announces-icotyde-icotrokinra-delivers-significant-improvement-in-psoriatic-arthritis-disease-activity-among-biologic-naive-patients-with-once-daily-targeted-oral-peptide"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Rien à délivrer aujourd'hui — mais retenir le nom pour les patients psoriasis/PsA qui demandent « quand un comprimé ? » ; les traitements oraux à venir ne remplaceront ni l'arrêt du tabac ni la gestion du surpoids, facteurs d'aggravation du PsA."},{"dom":"Rhumatologie","type":"Médicament","n":3,"dt":"2026-08","titre":"Sonelokimab (IL-17A/F nanobody) : phase 3 IZAR-1 positive dans le rhumatisme psoriasique (topline)","subst":"sonelokimab · IZAR-1 · rhumatisme psoriasique · nanobody · IL-17A/F","res":"Résultats topline de la phase 3 IZAR-1 (MoonLake Immunotherapeutics, communiqué GlobeNewswire du 10/08/2026, vu) : le sonelokimab (anticorps bi-spécifique « nanobody » IL-17A/IL-17F, sous-cutané) atteint tous les critères cliniques à 16 semaines chez les patients bio-naïfs — ACR50 (critère principal) atteint avec 42,1 % (extrait IR vu), profil de sécurité cohérent avec les études précédentes. Ajoute une option IL-17 de nouvelle génération au pipeline PsA.","src":[["GlobeNewswire — MoonLake IZAR-1 topline (10/08/2026)","https://www.globenewswire.com/news-release/2026/08/10/3341679/0/en/moonlake-announces-positive-topline-results-from-the-phase-3-izar-1-trial-of-sonelokimab-in-psoriatic-arthritis-demonstrating-significant-improvements-across-all-clinical-endpoints.html"],["IR MoonLake — page communiqué","https://ir.moonlaketx.com/news-releases/news-release-details/moonlake-announces-positive-topline-results-phase-3-izar-1-trial"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les candidats IL-17 (comme l'ixékizumab/secukinumab déjà connus) = attention aux candidoses et herpès récurrents à signaler au rhumatologue ; jamais d'arrêt spontané avant une chirurgie sans accord du spécialiste."},{"dom":"Rhumatologie","type":"Médicament","n":3,"dt":"2025-08","titre":"Sjögren : l'ianalumab (anti-BAFF/R) réussit les DEUX phases 3 — première réduction prouvée de l'activité de la maladie (Novartis)","subst":"ianalumab · NEPTUNUS · Sjögren · BAFF · syndrome sec","res":"Annonce Novartis du 11/08/2025 (communiqué Basel daté, vu) : les deux essais de phase 3 NEPTUNUS-1 et NEPTUNUS-2 de l'ianalumab (anticorps anti-BAFF-R, sous-cutané) atteignent leur critère principal — PREMIÈRE réduction statistiquement significative de l'activité systémique de la maladie de Sjögren jamais démontrée en phase 3 mondiale (extraits : « first ever global phase III trials to demonstrate statistically significant reduction in disease activity »). La base ne comptait aucune entrée Sjögren (grep vérifié).","src":[["Novartis — communiqué NEPTUNUS (Basel, 11/08/2025)","https://www.novartis.com/news/media-releases/novartis-announces-both-ianalumab-phase-iii-clinical-trials-met-primary-endpoint-patients-sjogrens-disease"],["Sjögren's Foundation — couverture (2025)","https://sjogrens.org/news/2025/first-ever-global-phase-iii-trials-to-demonstrate-statistically-significant-reduction-in"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour la patiente Sjögren, le quotidien reste l'hydratation — larmes artificielles SANS conservateur au long cours, salives artificielles, gels, hydratation buccale et prévention caries (fluor) ; un traitement de fond systémique arrive enfin, il restera hospitalier."},{"dom":"Douleur & Migraine","type":"Officine","n":2,"dt":"2026-09","titre":"Lombalgie chronique : les « visites médicales de groupe en pleine conscience » réduisent douleur et consommation d'opioïdes (JAMA Internal Medicine)","subst":"lombalgie chronique · pleine conscience · MBSR · opioïdes · non médicamenteux","res":"Essai randomisé (JAMA Internal Medicine, esummary PMID 42371634 « 2026 Sep 1 ») : un programme de groupe en pleine conscience (mindfulness-based group medical visits) chez des personnes en lombalgie chronique améliore la douleur et la fonction vs soins usuels, avec une réduction de l'usage d'opioïdes rapportée dans l'essai. Complémentaire des entrées lombalgie déjà en base (paracétamol/opioïdes décevants, ceinture, cannabis) : cette fois le bras NON médicamenteux validé par ECR.","src":[["PubMed 42371634 — JAMA Intern Med (esummary : 2026 Sep 1)","https://pubmed.ncbi.nlm.nih.gov/42371634/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La lombalgie chronique ne se soigne pas que par la boîte de gel — orienter vers les programmes d'éducation/reprise d'activité (active-based) et rappeler que les antalgiques seuls entretiennent l'inactivité ; réduire les opioïdes = objectif partagé avec le médecin, jamais un arrêt brutal."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":4,"dt":"2024-06","titre":"Multivitamines quotidiennes et mortalité (Loftfield et al., JAMA Network Open 2024;7(6):e2418729)","subst":"multivitamines;mortalité;non-efficacité","res":"Cohorte NIH-AARP / 3 cohortes américaines, 390 124 adultes suivis > 20 ans (relais ScienceDaily 26/06/2024, MDLinx, pages vues). Usage quotidien de multivitamines NON associé à un bénéfice en termes de mortalité totale ; à l'inverse, les utilisateurs quotidiens présentaient ~4 % de risque de mortalité plus élevé vs non-utilisateurs (à interpréter : biais d'indication probable, pas de causalité). NON-EFFICACITÉ.","src":[["ScienceDaily — relais JAMA Netw Open 2024;7(6):e2418729 (26/06/2024)","https://www.sciencedaily.com/releases/2024/06/240626152205.htm"],["MDLinx — Multivitamins: mortality and longevity","https://www.mdlinx.com/article/multivitamins-mortality-and-longevity-growing-data-for-the-ongoing-debate/pXqmVafzIMA5HcnDqRy46"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas de multivitamine « pour la santé » sans carence identifiée ; priorité à une alimentation variée ; réserver les multivitamines aux situations à risque de carence documenté."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-05","titre":"Extrait de thé vert et indices d'obésité/adipokines (GRADE SR/MA d'ECR, Int J Food Sci Nutr 2025;76(4), DOI 10.1080/09637486.2025.2496400)","subst":"thé vert;poids;adiposité","res":"SR/MA d'ECR en dose-réponse, cadre GRADE, protocole PROSPERO CRD42024506739, publié en ligne le 06/05/2025 (pages Taylor & Francis et ResearchGate vues, résultats lus). Résultats lus : la supplémentation en thé vert réduit l'adiposité (masse grasse % : WMD −0,92 ; 95 % CI −1,71 à −0,14 lu dans le texte) sans modifier l'adiponectine (WMD 0,20 µg/ml ; 95 % CI −0,17 à 0,57) ; conclusion des auteurs : « effective in reducing excess adiposity ». DISTINCTE de l'entrée « thé alimentaire/mortalité » déjà en base (ici extrait de thé vert et poids).","src":[["Taylor & Francis — Int J Food Sci Nutr, DOI 10.1080/09637486.2025.2496400 (Publié en ligne 06/05/2025)","https://www.tandfonline.com/doi/full/10.1080/09637486.2025.2496400"],["ResearchGate — texte intégral (conclusion lue)","https://www.researchgate.net/publication/391486816_Effects_of_green_tea_supplementation_on_obesity_indices_and_adipokines_in_adults_a_grade-assessed_systematic_review_and_dose-response_meta-analysis_of_randomised_controlled_trials"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message mesuré — le thé vert a un effet modeste sur la masse grasse, pas un « brûle-graisse » ; attention aux extraits concentrés (hépatotoxicité déjà documentée)."},{"dom":"Psychiatrie","type":"Complément alimentaire","n":1,"dt":"2025-05","titre":"Efficacité comparée des nutraceutiques dans la dépression : SR et NMA (Psychological Medicine, Cambridge, publié en ligne 02/05/2025)","subst":"dépression;nutraceutiques;NMA","res":"SR + network meta-analysis des nutraceutiques (oméga-3, SAMe, curcumine, safran…) dans la dépression, seule ou en association aux antidépresseurs (page Cambridge ouverte, résultat lu). Résultats lus : EPA+DHA, SAMe et curcumine performants en monothérapie ou en association ; curcumine (0,62 ; IC −0,17 à 1,40) et safran (0,69 ; IC 0,34 à 1,04) performants vs placebo ; tolérabilité globalement comparable au placebo.","src":[["Cambridge Core — Psychological Medicine (Publié en ligne 02/05/2025)","https://www.cambridge.org/core/journals/psychological-medicine/article/comparative-efficacy-and-tolerability-of-nutraceuticals-for-depressive-disorder-a-systematic-review-and-network-metaanalysis/5799A126D0B5677764562824C452D545"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"En cas de refus/attente d'antidépresseur, certaines options nutraceutiques (oméga-3 EPA+DHA, safran, curcumine, SAMe) ont des données comparatives sérieuses — jamais en substitution d'un traitement indiqué, et signaler la dépression au médecin."},{"dom":"Psychiatrie","type":"Complément alimentaire","n":1,"dt":"2025-03","titre":"Safran vs ISRS dans la dépression et l'anxiété : méta-analyse d'ECR (Nutrition Reviews 2025;83(3):e751-e761)","subst":"safran;dépression;ISRS","res":"Méta-analyse de 8 ECR comparant le safran aux ISRS (pages OUP et ResearchGate vues, résultats lus). Résultats lus : différence NON significative entre safran et ISRS sur les symptômes dépressifs (SMD 0,10 ; IC 95 % −0,09 à 0,29) ; moins d'effets indésirables rapportés sous safran. DISTINCTE de l'essai SAFFRON (oncologie) déjà en base — ici usage psychiatrique.","src":[["Oxford Academic — Nutr Rev 2025;83(3):e751-e761 (résumé vu)","https://academic.oup.com/nutritionreviews/article-abstract/83/3/e751/7697880"],["ResearchGate — texte intégral","https://www.researchgate.net/publication/381668372_Effect_of_Saffron_Versus_Selective_Serotonin_Reuptake_Inhibitors_SSRIs_in_Treatment_of_Depression_and_Anxiety_A_Meta-analysis_of_Randomized_Controlled_Trials"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le safran fait partie des nutraceutiques dépressifs les mieux documentés (voir aussi NMA Psychological Medicine 2025) ; discuter en relais/adjonction, jamais en arrêt d'ISRS."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-07","titre":"Gingembre (Zingiber officinale) : umbrella review de méta-analyses 2010-2025 (Front Pharmacol, 30/07/2025)","subst":"gingembre;inflammation;DT2;nausées","res":"Umbrella review des méta-analyses publiées 2010-2025 sur le gingembre (page Frontiers ouverte, résultats lus). Résultats lus : réduction des marqueurs inflammatoires (CRP, hsCRP, TNF-α), réduction du stress oxydatif (MDA) ; chez le diabétique de type 2 : baisse de l'HbA1c et de la glycémie à jeun ; les nausées et vomissements de la grossesse (NVP) sont évoqués parmi les usages évalués.","src":[["Frontiers in Pharmacology — 30/07/2025","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2025.1619655/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le gingembre est l'un des compléments les plus documentés (nausées de grossesse, régulation glycémique, inflammation) — modeste mais réel ; rappel dosage/interactions anticoagulantes."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-11","titre":"Ail et tension artérielle : umbrella review (Front Nutr, 28/11/2025)","subst":"ail;HTA;tension","res":"Umbrella review des essais sur l'ail et la tension (page Frontiers ouverte, résultats lus). Résultats lus : réduction de la PAS de −4,21 mmHg (IC −5,74 à −2,69) et de la PAD de −3,13 mmHg (IC −4,42 à −1,84) ; HDL +0,31 ; TNF-α −0,38 ; effet plus marqué chez les personnes obèses et dans la tranche 50-60 ans ; impact global jugé limité ; effets indésirables digestifs possibles ; fourchette de dose optimale de 0,5-1,5 mg lue dans l'article.","src":[["Frontiers in Nutrition — 28/11/2025","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1656809/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'ail a un effet tension réel mais modeste — en soutien hygiéno-diététique, jamais en remplacement d'un antihypertenseur."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":5,"dt":"2025-09","titre":"Levure de riz rouge et sécurité : monacoline K = lovastatine ; alerte EFSA (avis EFSA adopté le 29/01/2025 + revue World J Clin Cases 26/09/2025)","subst":"levure de riz rouge;monacoline K;statine;hépatotoxicité;rhabdomyolyse","res":"Revue publiée dans le World Journal of Clinical Cases le 26/09/2025 (page vue) + avis de sécurité de l'EFSA adopté le 29/01/2025 (résumé Wiley vu, ResearchGate vu). Points lus : la monacoline K de la levure de riz rouge est chimiquement identique à la lovastatine ; les doses de monacoline K varient fortement selon les marques ; effets indésirables rares mais réels (musculaires type rhabdomyolyse, hépatiques) ; l'EFSA rapporte des réactions indésirables sévères dès 3 mg/jour de monacoline K (lu).","src":[["World Journal of Clinical Cases — revue (26/09/2025)","https://www.wjgnet.com/2307-8960/full/v13/i27/105415.htm"],["EFSA — Scientific Opinion monacolins, adoptée 29/01/2025","https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2025.9276"],["ResearchGate — texte de l'avis EFSA","https://www.researchgate.net/publication/389417594_Scientific_Opinion_on_additional_scientific_data_related_to_the_safety_of_monacolins_from_red_yeast_rice_submitted_pursuant_to_Article_84_of_Regulation_EC_No_19252006"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La levure de riz rouge n'est pas un complément anodin — elle est une statine à dose variable ; déconseillée si déjà sous statine (dose cumulative), chez la femme enceinte et en cas de douleurs musculaires ou trouble hépatique ; orienter vers le médecin avant substitution d'une statine."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-01","titre":"Resvératrol et diabète de type 2 : inflammation et stress oxydatif (Front Endocrinol, 13/01/2025)","subst":"resvératrol;DT2;inflammation","res":"SR/MA sur le resvératrol dans le DT2 (page Frontiers ouverte, résultats lus). Résultats lus : amélioration « modérée » (« to some extent ») des marqueurs inflammatoires et du stress oxydatif chez les diabétiques de type 2 ; niveau de preuve jugé très faible par les auteurs ; davantage d'essais nécessaires.","src":[["Frontiers in Endocrinology — 13/01/2025","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2024.1463027/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas de promotion du resvératrol comme « anti-diabétique » ; effet biologique plausible mais non cliniquement démontré."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":3,"dt":"2024-07","titre":"Extrait de Boswellia serrata dans la gonarthrose : RCT multicentrique (Front Pharmacol, 18/07/2024) — financement industriel à noter","subst":"boswellia;gonarthrose;arthrose;COI industriel","res":"RCT 3 bras multicentrique (extrait de Boswellia serrata vs comparateurs ; produit Boswellin® Super), critères WOMAC, VAS, indice de Lequesne, test de marche 6 min à J30/J60/J90 (page Frontiers ouverte). Résultats lus : améliorations rapportées dès 5 jours (« improvements within five days »), jugé sûr et efficace sur douleur/fonction ; célécoxib 200 mg autorisé en secours ; CONFLIT D'INTÉRÊTS : auteurs liés au fabricant Sabinsa/Sami-Sabinsa (financement industriel, lu).","src":[["Frontiers in Pharmacology — RCT 18/07/2024","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2024.1428440/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La boswellia a des essais positifs sur l'arthrose du genou mais plusieurs sont sponsorisés par l'industrie — en mentionner en soutien, pas en vedette absolue."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":5,"dt":"2026-06","titre":"Harpagophytum procumbens (griffe du diable) : mécanismes d'action et place vs AINS (revue Front Pharmacol, 17/06/2026)","subst":"harpagophytum;rhumatisme;AINS","res":"Revue des données pharmacologiques de l'harpagophytum (page Frontiers ouverte). Points lus : mécanismes d'action anti-inflammatoires suggérés par les études précliniques (voie COX-2 / NF-κB) ; les auteurs soulignent que ces données mécanistiques restent des preuves INDIRECTES ; place thérapeutique vs AINS discutée.","src":[["Frontiers in Pharmacology — 17/06/2026","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1839470/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Option naturelle fréquente en rhumatologie — argumenter sur des données précliniques + essais cliniques existants sans survendre une équivalence avec un AINS."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-03","titre":"NMA des compléments dans la gonarthrose (recherche jusqu'à mai 2023) : glucosamine et chondroïtine dominées par d'autres extraits (Front Nutr, 07/03/2025)","subst":"arthrose;compléments;NMA;NEM;Aflapin","res":"Network meta-analysis des compléments alimentaires dans l'arthrose du genou, recherche jusqu'à mai 2023 (page Frontiers ouverte, résultats lus). Résultats lus : les meilleurs scores vs placebo vont à NEM (membrane de coquille d'œuf — raideur), Aflapin (Boswellia + lécithine — douleur) et E-OA-07 (fonction + WOMAC total) ; glucosamine et chondroïtine s'en sortent mal dans la hiérarchie.","src":[["Frontiers in Nutrition — NMA 07/03/2025","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1556133/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Utile pour hiérarchiser le rayon arthrose — les stars du comptoir (glucosamine/chondroïtine) ne sont pas les mieux classées par la NMA."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2024-12","titre":"Glucosamine en association (oméga-3, ibuprofène) dans la gonarthrose : NMA (J Clin Med 2024;13(23):7444, publié 06/12/2024)","subst":"glucosamine;arthrose;association","res":"Network meta-analysis des associations de glucosamine (page MDPI ouverte). Ré ltats contradictoires entre essais ; peu d'essais ; forte hétérogénéité des préparations. NON-EFFICACITÉ partielle.","src":[["MDPI — J Clin Med 2025;14(21):7710 (Publié : 30/10/2025)","https://www.mdpi.com/2077-0383/14/21/7710"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le théanine « focus/concentration » du rayon formé n'a pas de preuve cognitive robuste ; argument valable surtout pour la détente/le sommeil (moins d'arguments dans le champ cognitif)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-09","titre":"Rhodiola rosea et endurance physique : méta-analyse (Front Nutr, 25/09/2025)","subst":"rhodiola;endurance;sport","res":"Méta-analyse des effets de la Rhodiola rosea sur la performance physique (page Frontiers ouverte, résultats lus). Résultats lus : effet positif sur VO2max (ES 0,32 ; 11 études), temps jusqu'à épuisement (ES 0,38 ; 7 études), time-trial (ES −0,40 ; 5 études) ; amélioration de la capacité antioxydante (TAC 0,59 ; SOD 1,16) et baisse du MDA (−1,21). Hétérogénéité entre essais soulignée.","src":[["Frontiers in Nutrition — 25/09/2025","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1645346/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La rhodiola figure parmi les plantes « adaptogènes » avec de vraies données ergogènes — mais hétérogènes ; message sobre pour le client sportif."},{"dom":"Neurologie","type":"Complément alimentaire","n":1,"dt":"2025-02","titre":"Ginkgo biloba EGb 761 et démence légère : méta-analyse (World J Biol Psychiatry, fév. 2025) — COI industriel Schwabe à noter","subst":"ginkgo;démence;EGb 761;COI industriel","res":"Méta-analyse de sous-groupes d'essais EGb 761 dans la démence légère (relais HerbalGram issue 759 vu + page Cambridge/European Psychiatry vue ; auteurs Riepe, Hoerr, Schlaefke, doi 10.1080/15622975.2024.2446830). Résultats lus : améliorations de la cognition, des activités de la vie quotidienne, de l'évaluation globale et de la qualité de vie chez les patients avec démence légère ; tolérabilité bonne ; CONFLIT D'INTÉRÊTS : travail lié au fabricant Schwabe (producteur de l'EGb 761). NB : la base contient déjà « ginkgo interactions » (usage anticoagulant) — ICI usage démence, nouvel usage.","src":[["HerbalGram (ABC) — relais WJBP 2025, issue 759","https://www.herbalgram.org/resources/herbclip/issues/2025/issue-759/ginkgo-biloba-mild-dementia/"],["Cambridge Core / European Psychiatry — méta EGb 761","https://www.cambridge.org/core/journals/european-psychiatry/article/metaanalysis-of-ginkgo-biloba-extract-egb-761-in-the-treatment-of-mild-dementia/3F8378FA31433709F91DEEA6A5EEAD2C"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ginkgo = plantes des deux tableaux — arguments cognitifs (controversés, souvent industriels) ET risques d'interactions avec anticoagulants/antiagrégants : vérifier systématiquement le traitement du patient."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-06","titre":"NMN/NR et fonction musculaire chez les seniors : SR/MA — pas d'effet significatif (J Cachexia Sarcopenia Muscle 2025;16(3):e13799)","subst":"NMN;nicotinamide;sarcopénie;non-efficacité","res":"SR/MA des ECR sur la supplémentation NMN/NR chez les personnes âgées (citation lue : J Cachexia Sarcopenia Muscle 2025 Jun;16(3):e13799, Prokopidis ; page Wiley vue, relais vu). Résultats lus : PAS d'effet significatif sur la masse musculaire, la force de préhension, la vitesse de marche ni le test lever de chaise chez les seniors. NON-EFFICACITÉ.","src":[["Wiley — J Cachexia Sarcopenia Muscle 2025;16(3):e13799","https://onlinelibrary.wiley.com/doi/10.1002/jcsm.13799"],["The Whole Health Practice — relais avec citation complète (2025 Jun;16(3):e13799)","https://www.thewholehealthpractice.com/post/nicotinamide-mononucleotide-nmn-supplementation-metabolic-effects-individual-va
