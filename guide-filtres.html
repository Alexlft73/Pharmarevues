 non lisible dans les sources consultées."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-12","titre":"Omadacycline vs moxifloxacine dans la PAC nécessitant une hospitalisation (OPTIC-2, essai de phase 3b de non-infériorité)","subst":"omadacycline","res":"OPTIC-2 : essai de phase 3b randomisé, en double aveugle, multicentrique, de non-infériorité, comparant l'omadacycline IV (100 mg q12h ×2 doses puis 100 mg/j, relais oral possible après ≥2 jours) à la moxifloxacine IV 400 mg/j chez des patients avec PAC classes PSI III-IV (eClinicalMedicine, publié en décembre 2025 selon le communiqué Paratek daté du 16/04/2026). Sponsor Paratek, financement partiel de fonds fédéraux US (HHS). Chiffres d'efficacité non lus dans les extraits — design décrit sans invention.","src":[["PubMed — OPTIC-2 (PMID 41340860)","https://pubmed.ncbi.nlm.nih.gov/41340860/"],["Paratek/GlobeNewswire (16/04/2026, « published in December 2025 »)","https://www.globenewswire.com/news-release/2026/04/16/3275224/0/en/paratek-pharmaceuticals-to-present-new-data-on-nuzyra-omadacycline-at-escmid-global-2026.html"],["eClinicalMedicine — article OPTIC-2","https://www.thelancet.com/journals/eclinm/article/PIIS2589-5370(25)00590-5/fulltext"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Pneumologie","type":"Vaccin","n":2,"dt":"2026-07","titre":"MV130, vaccin sublinguel à immunité entraînée : réduction des exacerbations de BPCO — essai randomisé de phase 3 (ERJ)","subst":"MV130","res":"Essai randomisé de phase 3 publié en ligne dans l'ERJ le 16/07/2026 (page ERS vue) : MV130, vaccin muqueux sublingual polyvalent à base de bactéries entières inactivées (Inmunotek), réduit les exacerbations modérées et sévères de BPCO — conclusion de l'abstract (« MV130 reduces moderate and severe COPD exacerbations, suggesting its potential role as an adjunct preventive therapy »). Rationnel : les infections respiratoires sont le premier déclencheur des exacerbations. Chiffres détaillés non extraits — pas d'invention.","src":[["ERJ — MV130 phase 3 (early, 16/07/2026)","https://publications.ersnet.org/content/erj/early/2026/07/16/1399300300027-2026"],["PubMed — PMID 42492956","https://pubmed.ncbi.nlm.nih.gov/42492956/"],["HCPLive — MV130 reduces COPD exacerbations","https://www.hcplive.com/view/mv130-mucosal-vaccine-reduces-copd-exacerbations-phase-3-trial"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Infectiologie & Vaccins","type":"Complément alimentaire","n":3,"dt":"2026-11","titre":"Lactobacillus crispatus M247 oral en complément de prophylaxie des cystites récidivantes de la femme — essai pilote randomisé","subst":"Lactobacillus crispatus M247","res":"Essai pilote randomisé, ouvert, prospectif (Fondazione Policlinico Gemelli, Rome ; Frontiers in Nutrition, publié le 12/11/2026 — date lue sur la page) : 84 femmes randomisées, toutes analysées, supplément oral L. crispatus M247 + E. faecium L3 + B. lactis BB-12 en complément d'une prophylaxie raccourcie, objectif réduire l'exposition antibiotique des cystites récidivantes. Essai pilote ouvert de faible effectif — preuve PRÉLIMINAIRE, à ne pas survendre ; nouveau usage probiotiques (base : probiotiques = diarrhée sous antibiotique uniquement).","src":[["Frontiers in Nutrition — essai pilote randomisé","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2026.1969675/full"],["Bioengineer — communiqué sur l'essai","https://bioengineer.org/oral-probiotic-regimen-reduces-recurrent-cystitis-in-randomized-clinical-pilot-trial/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Allergologie","type":"Médicament","n":1,"dt":"2025-09","titre":"Immunothérapie allergénique dans la rhinite allergique de l'enfant et de l'adulte — revue parapluie des méta-analyses","subst":"immunothérapie allergénique (AIT)","res":"Revue parapluie (Frontiers in Immunology, 2025 Sep 25:16:1658826 — date lue dans le snippet PubMed) évaluant l'efficacité des différentes immunothérapies allergéniques (sublinguales/sous-cutanées) pour la rhinite allergique chez l'enfant et l'adulte. Angle nouveau vs les 2 entrées SLIT déjà en base (NMA gouttes/index de réactivité ; synthèse SLIT essais+vie réelle) : vue transversale toutes voies/âges. Chiffres non lus dans les extraits — pas d'invention.","src":[["PubMed — PMID 41080605 (2025 Sep 25)","https://pubmed.ncbi.nlm.nih.gov/41080605/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-09","titre":"Contraception désogestrel/étonogestrel : notices révisées et lettre personnalisée aux patientes sur le très faible risque de méningiome — ANSM","subst":"désogestrel / étonogestrel","res":"Information ANSM en deux temps, dates lues sur les pages de l'agence : actualité « Contraception à base de désogestrel et étonogestrel : les notices évoluent pour mieux informer sur le risque rare de méningiome » publiée le 11/08/2026 (Q&R ANSM vu : « PUBLIÉ LE 11/08/2026 »), puis lettre personnalisée diffusée aux femmes le 10/09/2026 (« PUBLIÉ LE 10/09/2026 — l'ANSM diffuse une lettre personnalisée pour informer les femmes du très faible risque de méningiome associé à la contraception à base de désogestrel »). Points lus sur l'information de sécurité ANSM : l'utilisation prolongée est associée à une faible augmentation du risque (Le Moniteur des Pharmacies, vu) ; le risque peut être plus élevé en cas d'exposition antérieure aux progestatifs déjà connus pour un risque accru de méningiome — à prendre en compte avant l'instauration ; si un méningiome est diagnostiqué, arrêt du contraceptif. Aucune entrée méningiome/contraception en base (l'Epi-Phare progestatifs 2024 porte sur les progestatifs prescrits, pas spécifiquement désogestrel-contraception).","src":[["ANSM — Actualité : notices révisées sur le risque rare de méningiome","https://ansm.sante.fr/actualites/contraception-a-base-de-desogestrel-et-etonogestrel-les-notices-evoluent-pour-mieux-informer-sur-le-risque-rare-de-meningiome"],["ANSM — Questions-réponses (lettre du 10/09/2026, actualité du 11/08/2026)","https://ansm.sante.fr/actualites/contraception-a-base-de-desogestrel-et-risque-de-meningiome-questions-reponses"],["ANSM — Information de sécurité : contraceptifs désogestrel/étonogestrel","https://ansm.sante.fr/informations-de-securite/contraceptifs-a-base-de-desogestrel-et-detonogestrel-risque-de-meningiome-et-mesures-pour-minimiser-le-risque"],["Le Moniteur des Pharmacies — le risque de méningiome se précise","https://www.lemoniteurdespharmacies.fr/therapeutique/vigilances/desogestrel-et-etonogestrel-le-risque-de-meningiome-se-precise"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Questions en hausse à la délivrance des pilules micro-progestatives (Cerazette et génériques, implants) — message : très faible risque, ne pas arrêter brutalement sans alternative, orienter vers le médecin/prescripteur en cas de céphalées inhabituelles, troubles visuels ou acouphènes ; l'ANSM privilégie l'information plutôt que l'arrêt de prescription."},{"dom":"Gynécologie","type":"Médicament","n":4,"dt":"2026-07","titre":"Progestatifs de contraception et méningiome : l'étude danoise JAMA Network Open retrouve un risque accru avec le lévonorgestrel (pilules et DIU les plus dosés) et le désogestrel","subst":"lévonorgestrel · désogestrel · méningiome","res":"Étude cas-témoins nichée danoise, population nationale sur 25 ans (1er janvier 2000 - 31 décembre 2024), 3 millions de femmes de 15 à 59 ans (descriptif lu dans les extraits Ovid) : « Contraceptive Progestogens and Incident Meningioma », JAMA Network Open 2026;9(7):e2622603, doi 10.1001/jamanetworkopen.2026.22603 (citation vue) — Hasselblad Lundstrøm et al. Les pilules au lévonorgestrel et les DIU au lévonorgestrel les plus dosés sont associés à un risque accru de méningiome (APMnews, 16 juillet 2026 — dépêche vue) ; des odds élevés sont aussi observés avec le désogestrel, ce qui « renforce l'intérêt d'un counseling individualisé » (Pharmacy Times, vu). À nuancer avec les données françaises : l'ANSM avait indiqué qu'aucune augmentation n'était retrouvée avec les DIU au lévonorgestrel dans son analyse Epi-Phare (19/12/2024, relais CRPV Île-de-France vu) — la divergence porte sur les DIU fortement dosés (52 mg), population où l'étude danoise retrouve un signal. DISTINCT de l'alerte ANSM désogestrel (id ci-dessus) : ici l'étude épidémiologique primaire, toutes molécules progestatives de contraception.","src":[["JAMA Network Open — Contraceptive Progestogens and Incident Meningioma (2026;9(7):e2622603)","https://jamanetwork.com/doi/10.1001/jamanetworkopen.2026.22603"],["PMC — texte intégral (Copyright 2026)","https://pmc.ncbi.nlm.nih.gov/articles/PMC13329708/"],["APMnews — pilules et stérilets au lévonorgestrel concernés (16/07/2026)","https://www.apmnews.com/nostory?objet=439032"],["Pharmacy Times — counseling individualisé (désogestrel aussi concerné)","https://www.pharmacytimes.com/view/study-links-several-progestogen-contraceptives-to-rare-meningioma-risk-reinforcing-individualized-patient-counseling"],["CRPV Île-de-France — contexte Epi-Phare progestatifs/méningiome","https://www.pharmacovigilance-iledefrance.fr/d%C3%A9tails-dune-br%C3%A8ve/contraception-et-risque-de-meningiome-le-levonorgestrel-est-concerne-aussi"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Anticiper les questions sur stérilets et micro-pilules — le niveau de preuve reste celui d'une association epidemiologique, le risque absolu reste rare, aucune conduite à tenir officinale sans avis prescripteur."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":4,"dt":"2025-05","titre":"Fézolinetant (Veoza/Veozah) contre les bouffées de chaleur : lésions hépatiques rares mais graves — encadré FDA (12/2024) et courrier ANSM aux professionnels (05/05/2025)","subst":"fézolinetant (Veoza)","res":"Alerte en deux temps, dates lues : la FDA émet une première mise en garde le 12/09/2024 après un cas d'atteinte hépatique significative après ~40 jours de traitement (Pharmacy Times, lu : « On September 12, 2024, the FDA issued an initial safety warning… after taking the drug for approximately 40 days »), puis ajoute un encadré (Boxed Warning) le 16/12/2024 (page FDA Drug Safety Communication, lu : « 12-16-2024 Update: FDA adds a Boxed Warning, our most prominent warning, to highlight the known risk of rare but ser[ious] »). En France, l'ANSM publie une information de sécurité avec courrier destiné aux professionnels de santé daté du 05/05/2025 (page ANSM, lu) : nouvelles recommandations de surveillance de la fonction hépatique avant et pendant le traitement, et le fézolinétant doit être arrêté dans les situations énumérées (page ANSM). Contexte : le fézolinetant, antagoniste oral des récepteurs de la neurokinine 3, est l'alternative non hormonale aux bouffées vasomotrices (l'elinzanetant, autre NK-1/3/4, est déjà en base).","src":[["FDA — Drug Safety Communication : boxed warning (mise à jour du 16/12/2024)","https://www.fda.gov/drugs/drug-safety-communications/fda-adds-warning-about-rare-occurrence-serious-liver-injury-use-veozah-fezolinetant-hot-flashes-due"],["ANSM — Information de sécurité Veoza (courrier du 05/05/2025)","https://ansm.sante.fr/informations-de-securite/veoza-fezolinetant-risque-de-lesion-hepatique-et-nouvelles-recommandations-concernant-la-surveillance-de-la-fonction-hepatique-avant-et-pendant-le-traitement"],["Pharmacy Times — chronologie de l'alerte FDA (initiale 12/09/2024)","https://www.pharmacytimes.com/view/fda-issues-boxed-warning-for-fezolinetant-over-rare-but-serious-liver-injury-risk"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Patientes sous Veoza — vérifier la compréhension du suivi biologique hépatique prescrit, expliquer les signes d'alerte (nausées persistantes, vomissements, fatigue intense, ictère, urines foncées, douleur abdominale droite) et l'arrêt immédiat + contact médecin si survenue."},{"dom":"Gynécologie","type":"Officine","n":3,"dt":"2026-09","titre":"IVG en France : 259 416 interruptions en 2025 (+2,9 %), 81 % médicamenteuses, 1 400 après téléconsultation délivrées dans 516 pharmacies — bilan annuel Drees","subst":"IVG · mifépristone · télémédecine","res":"La Drees a publié son bilan annuel le 22 septembre 2026 (date lue sur France Info et corroborée : « le 22 septembre 2026, la Drees a publié son enquête annuelle ») : 259 416 IVG enregistrées en France en 2025, soit 7 219 actes de plus sur un an, une hausse de 2,9 % (chiffres lus). Le Moniteur des Pharmacies (vu) : « En 2025, 81 % des interventions sont médicamenteuses » ; 1 400 IVG médicamenteuses ont été réalisées après une téléconsultation et les médicaments ont été délivrés dans 516 pharmacies ; les sages-femmes libérales assurent 54 % des IVG réalisées en ville, devant les médecins généralistes et les gynécologues. Première entrée IVG en base.","src":[["Le Moniteur des Pharmacies — IVG en 2025 : 81 % médicamenteuses, 516 pharmacies","https://www.lemoniteurdespharmacies.fr/profession/interpro/ivg-en-2025-81-des-interventions-sont-medicamenteuses"],["France Info — bilan Drees du 22/09/2026 (259 416 IVG, +2,9 %)","https://www.franceinfo.fr/societe/ivg/le-nombre-d-ivg-en-hausse-de-pres-de-3-en-2025-en-france-avec-259-416-avortements-pratiques_8204375.html"],["Drees (relais) — chiffres 2025 et recours selon les profils","https://www.lesnouveauxparents.com/ivg-en-france-ce-que-revelent-les-chiffres-2025-de-la-drees/"],["ivg.gouv.fr — parcours et télémédecine","https://ivg.gouv.fr/comment-realiser-des-ivg-medicamenteuses-en-teleconsultation"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La pharmacie est un maillon identifié du parcours IVG médicamenteuse (délivrance mifépristone + misoprostol de la trousse) — connaître le circuit local (centres de planification, sages-femmes), remettre la fiche conseil si fournie, diriger vers ivg.gouv.fr ; réserve de confidentialité et de non-jugement."},{"dom":"Gynécologie","type":"Médicament","n":2,"dt":"2024-01","titre":"GDF15 : l'hormone qui cause les nausées et vomissements de la grossesse (dont l'hyperémèse gravidique) — Nature","subst":"GDF15 · hyperémèse gravidique","res":"Étude publiée dans Nature (Fejzo et al., Nature 2024;625(7996):760-767, PMID 38092039, doi 10.1038/s41586-023-06921-9 — citation vue dans le registre de l'université de Glasgow : « Nature, 625(7996), pp. 760-767 ») : des taux anormalement élevés de GDF15 et une sensibilité accrue à cette hormone sont les principaux facteurs contribuant à l'hyperémèse gravidique (HER Foundation — page vue reprenant l'étude). Le GDF15 est une hormone du stress métabolique agissant sur le cerveau (centre du vomissement) — le mécanisme explique pourquoi la sévérité varie selon les femmes et ouvre vers des traitements ciblés (revue MSD « Dernière mise à jour : déc. 2025 » vue pour la définition clinique : déshydratation, perte de poids, cétose). Aucune entrée nausées/hyperémèse en base.","src":[["Nature (via PubMed) — GDF15 linked to maternal risk of nausea and vomiting during pregnancy (PMID 38092039)","https://pubmed.ncbi.nlm.nih.gov/38092039/"],["Université de Glasgow — citation complète (Nature 625:760-767)","https://eprints.gla.ac.uk/317371/"],["HER Foundation — la cause de l'hyperémèse gravidique identifiée","https://www.hyperemesis.org/news/nature2023/"],["MSD Manuel professionnel — hyperémèse gravidique (maj déc. 2025)","https://www.msdmanuals.com/fr/professional/gyn%C3%A9cologie-et-obst%C3%A9trique/complications-pr%C3%A9natales/hyperemesis-gravidarum"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message utile aux patientes — les nausées sévères de la grossesse ne sont pas « psychosomatiques », c'est une base hormonale identifiée ; premier recours : adapter l'alimentation, doxylamine-pyridoxine si prescrit (Xonvea), et signaux d'orientation : impossibilité de boire, perte de poids, cétonurie."},{"dom":"Gynécologie","type":"Vaccin","n":4,"dt":"2024-06","titre":"Aucun cancer du col détecté chez les femmes entièrement vaccinées contre le HPV en Écosse — JNCI 2024 (suivi de la vaccination bivalente)","subst":"vaccin HPV · cancer du col","res":"Étude écossaise de Santé publique Scotland avec les universités de Strathclyde et d'Édimbourg : aucun cas de cancer du col de l'utérus détecté chez les femmes entièrement vaccinées après la vaccination contre le HPV (communiqué PHS, janvier 2024 — page vue) ; publication primaire : Palmer et al., « Invasive cervical cancer incidence following bivalent human papillomavirus vaccination », JNCI 2024 Jun 7;116(6):857-865 (citation PubMed vue : « 2024 Jun 7;116(6):857-865 »), avec éditorial compagnon JNCI 2024;116(6):775-778. Le rapport d'experts écossais « Cervical Cancer Elimination » (décembre 2025, page gov.scot vue) documente la poursuite du programme.","src":[["JNCI (via PubMed) — Palmer et al. 2024;116(6):857-865","https://pubmed.ncbi.nlm.nih.gov/38247547/"],["Public Health Scotland — communiqué janvier 2024","https://publichealthscotland.scot/news/2024/january/no-cervical-cancer-cases-detected-in-vaccinated-women-following-hpv-immunisation/"],["Gouvernement écossais — rapport Cervical Cancer Elimination (décembre 2025)","https://www.gov.scot/publications/cervical-cancer-elimination-scotland-expert-group-final-report/"],["Gavi — le vaccin contre le VPH fait disparaître les cancers liés au papillomavirus","https://www.gavi.org/fr/vaccineswork/vaccin-contre-vph-fait-disparaitre-cancers-lies-papillomavirus-preuve-chiffres"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument massue pour les parents et jeunes adultes hésitants — la vaccination HPV des 11-14 ans (rattrapage jusqu'à 19 ans) marche, les cancers disparaissent chez les vaccinées."},{"dom":"Gynécologie","type":"Médicament","n":2,"dt":"2025-04","titre":"SOPK : l'exposition à l'hormone AMH pendant la « mini-puberté » augmente le risque, ouvrant une piste thérapeutique anti-AMH — Cell Metabolism / Inserm","subst":"AMH · SOPK (syndrome des ovaires polykystiques)","res":"Communiqué Inserm du 11 avril 2025 (date lue : « 11 Avr 2025 ») relayant une étude publiée le 11 avril dans la revue Cell Metabolism (équipe Lille Inserm, Prevot/Giacobini) : chez la souris, des injections importantes d'AMH (hormone anti-müllérienne) durant la « mini-puberté » — fenêtre transitoire peu après la naissance — conduisent à l'âge adulte à des symptômes de SOPK (infertilité, troubles métaboliques, prise de poids) ; l'étude confirme la mini-puberté comme période à risque, en plus de l'exposition fœtale déjà documentée (citations Inserm vues). Perspective : bloquer l'activité de l'AMH constitue une piste prometteuse pour traiter le SOPK (Fondation pour la recherche médicale — page vue), mais l'administration chez l'humain n'est pas envisageable dans l'immédiat (diagnostic du SOPK seulement après les premières règles ; conséquences à long terme d'un blocage à étudier — citation Inserm vue). À noter (page Inserm vue) : le SOPK a été renommé « syndrome métabolique ovarien polyendocrinien » (SMOP) en mai 2026. Aucune entrée SOPK en base.","src":[["Inserm — communiqué du 11 avril 2025 (Cell Metabolism)","https://presse.inserm.fr/sopk-une-nouvelle-piste-therapeutique-contre-lune-des-principales-causes-dinfertilite-feminine/70315/"],["Inserm — dossier SOPK/SMOP (renommé en mai 2026)","https://www.inserm.fr/dossier/syndrome-ovaires-polykystiques-sopk/"],["FRM — bloquer l'AMH, piste prometteuse contre le SOPK","https://www.frm.org/fr/actualites/agir-contre-le-syndrome-des-ovaires-polykystiques-sopk"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le SOPK touche ~10 % des femmes — les questions concernent la metformine, l'inositol, le poids ; cette recherche ne change pas la pratique mais valide l'origine développementale du syndrome."},{"dom":"Gynécologie","type":"Médicament","n":3,"dt":"2025-01","titre":"Yselty (linzagolix) : l'approbation européenne de l'indication endométriose (janvier 2025) — antagoniste oral de la GnRH, données EDELWEISS et évaluation G-BA","subst":"linzagolix (Yselty) · endométriose","res":"La Commission européenne a approuvé en janvier 2025 une extension d'indication pour Yselty (linzagolix choline, Theramex), antagoniste oral de la GnRH, pour le traitement symptomatique de l'endométriose chez les femmes en âge de procréer (Medthority, section news 2025/1 — page vue ; confirmation dans le dossier G-BA du 05/06/2025 : « Yselty is indicated in adult women of reproductive age for symptomatic treatment of endometriosis in women with a history of previous medical [or surgical treatment] », PDF daté 2025-06-05). Données d'efficacité : EDELWEISS, essai de phase 3 randomisé vs placebo — linzagolix 200 mg/j avec add-back therapy (estradiol 1 mg + acétate de noréthistérone 0,5 mg) améliore les douleurs pelviennes non menstruelles et la dysménorrhée (Univadis, page vue ; citation complète vue : Hum Reprod 2024 Jun 3;39(6):1208-1221, EDELWEISS 3) ; l'EMA note deux études principales totalisant 1 109 femmes (overview EMA PDF vu). Dosage lu (gyneco-online, vue) : 75 mg maintient l'estradiol entre 20 et 60 pg/mL (sans add-back), 200 mg le supprime sous 20 pg/mL (avec add-back) — deux schémas possibles. DISTINCT de RYEQO/rélugolix (entrée RECO du jour) : autre antagonist GnRH oral, autre laboratoire, développement endométriose séparé — la base n'a aucun des deux.","src":[["Medthority — EC approves Yselty (linzagolix) for endometriosis (janvier 2025)","https://www.medthority.com/news/2025/1/european-commission-approves-yselty-linzagolix-for-the-symptomatic-treatment-of-endometriosis.-theramex"],["G-BA — dossier linzagolix (PDF du 05/06/2025)","https://www.g-ba.de/downloads/40-1465-11536/2025-06-05_AM-RL-XII_Linzagolix_D-1147_TrG_EN.pdf"],["Univadis — Efficacité et sécurité du linzagolix (EDELWEISS)","https://www.univadis.fr/viewarticle/efficacit%C3%A9-et-s%C3%A9curit%C3%A9-du-linzagolix-2024a1000aby"],["Human Reproduction — EDELWEISS 3 (2024 Jun 3;39(6):1208-1221)","https://academic.oup.com/humrep/article/39/6/1208/7656387"],["EMA — Yselty overview (EPAR)","https://www.ema.europa.eu/en/medicines/human/EPAR/yselty"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Traitement oral de l'endométriose en arrivée — anticiper la gestion des bouffées de chaleur (200 mg), l'add-back à respecter, et la question os (BMD) selon schéma ; France : mise à disposition/délivrance à suivre selon l'avis HAS."},{"dom":"Gynécologie","type":"Médicament","n":2,"dt":"2026-05","titre":"VIBRANT : biothérapeutique vaginal multi-souches de Lactobacillus crispatus — 3 à 7 jours suffisent pour recoloniser après antibiothérapie de la vaginose (phase 1, Cell Host & Microbe)","subst":"Lactobacillus crispatus vaginal · vaginose bactérienne","res":"Essai VIBRANT (Vaginal lIve Biotherapeutic RANdomized Trial) : phase 1 randomisée menée aux États-Unis et en Afrique du Sud, publiée dans Cell Host & Microbe en 2026 (page abstract vue ; PubMed PMID 41856107 ; preprint medRxiv DOI 10.1101/2025.09.18.25336053 vu) : un biothérapeutique vaginal multi-souches de L. crispatus administré seulement 3 à 7 jours après le traitement antibiotique réintroduit des bactéries protectrices (Potloane et al. — abstract lu). Chiffres lus dans le relais Daily Science du 21 mai 2026 : 90 participantes (Afrique du Sud/États-Unis) ; microbiome vaginal des deux tiers (66 %) contenant des lactobacilles protecteurs dès les 5 premières semaines ; près de la moitié encore colonisée à 12 semaines — contre 11 semaines de traitement nécessaires pour le produit du premier essai. L'équipe prévoit d'autres essais et l'autorisation de fabrication. DISTINCT de la candidate 21h « inf-crispatus-m247-2026 » (L. crispatus M247 ORAL pour les cystites récidivantes) : ici administration VAGINALE, indication vaginose bactérienne, produit multi-souches expérimental.","src":[["Cell Host & Microbe — VIBRANT (abstract)","https://www.cell.com/cell-host-microbe/abstract/S1931-3128(26)00084-3"],["PubMed — VIBRANT (PMID 41856107)","https://pubmed.ncbi.nlm.nih.gov/41856107/"],["medRxiv — preprint VIBRANT (10.1101/2025.09.18.25336053)","https://www.medrxiv.org/content/10.1101/2025.09.18.25336053v1"],["Daily Science — Contrer la récidive de la vaginose bactérienne (21/05/2026)","https://dailyscience.be/21/05/2026/38416/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La récidive de vaginose après métronidazole est un motif récurrent — pour l'instant, conseils officiels (éviter douches vaginales, saines habitudes), pas de biothérapeutique disponible ; les probiotiques « gynéo » du commerce ne sont pas ces souches étudiées — ne pas survendre."},{"dom":"Gynécologie","type":"Officine","n":3,"dt":"2024-01","titre":"Dépistage organisé du cancer du col : le test HPV-HR aux côtés de la cytologie (arrêté du 16 janvier 2024) et autotests HPV adressés aux femmes non-participantes (expérimentations)","subst":"dépistage HPV-HR · autotest HPV","res":"L'arrêté du 16 janvier 2024 relatif aux programmes de dépistage organisé des cancers (Legifrance, texte vu) précise que les tests du programme de dépistage du cancer du col de l'utérus sont l'examen cytologique et le test HPV-HR, nécessitant un prélèvement cervico-utérin de préférence en milieu de conservation adapté. Le test HPV en première intention chez les femmes de 30 à 65 ans est confirmé par les laboratoires (Synlab, page vue : « la recherche d'HPV par PCR est maintenant recommandée en première intention chez les femmes de 30 à 65 ans »). Actualité 2025 (Le Moniteur des Pharmacies, page vue) : les dépistages évoluent avec les autotests HPV directement adressés à certaines patientes — la Cnam précise les modalités de mise à disposition dans le cadre de deux expérimentations ; les coordonnateurs rappellent que l'auto-prélèvement vaginal est une modalité alternative, pas de première intention (centre de coordination du dépistage, page vue : « L'APV ne peut pas se [substituer au prélèvement réalisé par un professionnel] », envoi potentiel en 2025).","src":[["Legifrance — Arrêté du 16 janvier 2024 (dépistages organisés)","https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000049025603"],["Le Moniteur des Pharmacies — Endométriose, HPV, néonatal : les dépistages qui évoluent en 2025","https://www.lemoniteurdespharmacies.fr/therapeutique/medicaments/recherche-et-innovation/endometriose-hpv-neonatal-cancer-les-depistages-qui-evoluent-en-2025"],["Synlab — test HPV recommandé en première intention 30-65 ans","https://www.synlab.fr/espace-professionnels-de-sante/informations-medicales/depistage-cancer-col-de-uterus/"],["Centre de coordination Centre-Val de Loire — place de l'auto-prélèvement","https://www.depistage-cancer.fr/centre/depistage-du-cancer-du-col-de-luterus/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Sujet récurrent — « ai-je besoin d'un gynéco pour mon frottis ? » ; réponse : invitation triennale/quinquennale selon l'âge, prélèvement possible chez médecin généraliste ou sage-femme, et pour les non-répondantes l'autotest HPV arrive progressivement ; le test HPV positif ne signifie pas cancer (précision utile : la plupart des infections régressent, la cytologie oriente ensuite)."},{"dom":"Gynécologie","type":"Complément alimentaire","n":2,"dt":"2025-12","titre":"Quelle dose d'acide folique autour de la grossesse ? Étude BMJ Open comparant différentes doses de supplémentation sur les issues de grossesse","subst":"acide folique","res":"Étude publiée dans BMJ Open le 29 décembre 2025 (citation PubMed vue : « 2025 Dec 29;15(12):e108858. Cai Liu et al. ») : « Effects of different folic acid supplementation doses on subsequent pregnancy outcomes », comparant l'effet de différentes doses d'acide folique sur les issues de grossesse ultérieures. Contexte lu dans les extraits : les données antérieures suggèrent qu'un apport élevé (≥800 µg/jour) pourrait être associé à un risque réduit de fausse-couche, mais l'impact d'une dose de 800 µg sur les issues de grossesse restait à évaluer — les conclusions détaillées de l'étude n'étaient pas lisibles dans les extraits consultés (pas d'invention, design documenté). Contexte de référence : le BNM/NICE 2025 (nutrition maternelle — GPnotebook, janvier 2025, vu) maintient la supplémentation péri-conceptionnelle standard ; la recommandation française usuelle reste 400 µg/j à débuter dès le projet de grossesse (5 mg si antécédents). Aucune entrée acide folique grossesse en base.","src":[["BMJ Open (via PubMed) — 2025 Dec 29;15(12):e108858 (PMID 41469059)","https://pubmed.ncbi.nlm.nih.gov/41469059/"],["GPnotebook — acide folique préconceptionnel et grossesse (NICE janvier 2025)","https://gpnotebook.com/fr/pages/gynecologie/acide-folique-pendant-la-periode-preconceptionnelle-et-la-grossesse"],["Cochrane — suppléments d'acide folique avant la conception et au 1er trimestre","https://www.cochrane.org/fr/CD007950/PREG_les-supplements-dacide-folique-avant-la-conception-et-au-debut-de-la-grossesse-jusqua-12-semaines"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Rappeler le timing (le tube neural se ferme à J28, souvent avant le test positif → proposer l'acide folique dès l'arrêt d'une contraception chez une femme en projet), la dose usuelle 400 µg, et l'existence de questionnements sur les doses hautes — la recherche en cours est exactement là."},{"dom":"Gynécologie","type":"Médicament","n":3,"dt":"2026-02","titre":"Aspirine 162 mg « universelle » dès la première consultation prénatale dans une population à haut risque : réduction des prééclampsies sévères — AJOG/SMFM 2026","subst":"aspirine · prééclampsie","res":"Équipe américaine — essai d'expérience « universal dispensation » publié dans l'American Journal of Obstetrics & Gynecology (2026, ScienceDirect S0002937826004618, © 2026 Elsevier ; présenté comme late-breaking oral au congrès SMFM de Las Vegas le 11 février 2026 — citation ScienceDirect vue) : la délivrance universelle d'aspirine 162 mg/jour dès la première consultation prénatale dans une population à fort taux de troubles hypertensifs a été associée à une réduction à l'échelle de la population du développement de prééclampsie avec signes de gravité (conclusion PubMed lue : « Universal dispensation of 162mg aspirin daily at the first prenatal visit in a population with a high rate of hypertensive disorders was associated with a population-level reduction in the development of preeclampsia with severe features » — PMID 42660215). Position actuelle en France : dépistage des facteurs de risque et aspirine 100-162 mg le soir dès 12-16 SA chez les femmes à risque (pratique encadrée, pas de dispensation universelle).","src":[["AJOG (via PubMed) — Universal Aspirin Dispensation (PMID 42660215)","https://pubmed.ncbi.nlm.nih.gov/42660215/"],["AJOG — ScienceDirect (présentation SMFM Las Vegas, 11/02/2026)","https://www.sciencedirect.com/science/article/abs/pii/S0002937826004618"],["SMFM — communiqué congrès (Las Vegas)","https://www.smfm.org/news/new-studyroutine-aspirin-therapypreventsseverepreeclampsiainat-risk-populations"],["News-Medical — Routine aspirin therapy associated with lower rate of severe preeclampsia (11/02/2026)","https://www.news-medical.net/news/20260211/Routine-aspirin-therapy-associated-with-lower-rate-of-developing-severe-preeclampsia.aspx"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Beaucoup de patientes enceintes se voient prescrire de l'aspirine à faible dose (Kardegic/Aspégic 100 mg) — message clé : ce n'est pas un antidouleur mais un traitement préventif à heures régulières (le soir), à ne pas arrêter sans avis, et pas d'AINS en automédication en parallèle (ibuprofène contre-indiqué à partir du 6e mois)."},{"dom":"Gynécologie","type":"Officine","n":2,"dt":"2026-04","titre":"PMA et dons de gamètes en France : plus de 12 000 demandes de don de spermatozoïdes en 2025 (≈ 6× avant la loi), 22 mois d'attente moyen pour un don d'ovocytes — Agence de la biomédecine (14/04/2026)","subst":"PMA · don d'ovocytes · don de spermatozoïdes","res":"L'Agence de la biomédecine a publié ses résultats d'activité le 14 avril 2026 (date lue : « l'ABM publie ce 14 avril » ; 14 avril 2026 était un mardi, corroboré) : la demande d'AMP avec don de spermatozoïdes reste à un niveau élevé avec plus de 12 000 demandes enregistrées en 2025 de la part de couples de femmes et de femmes seules, soit un volume environ six fois supérieur à celui observé avant l'ouverture de la PMA à toutes (communiqué ABM, PDF vu) ; pour l'AMP avec don d'ovocytes, les délais restent longs avec une moyenne de 22 mois (page ABM, vue) ; plus de 2 700 personnes restent en attente d'une prise en charge à fin 2025, un niveau proche de celui de l'année précédente ; le niveau d'activité AMP reste élevé (page ABM : « un niveau toujours élevé en 2025 »). Contexte : quatre ans après la loi de bioéthique ouvrant la PMA aux couples de femmes et femmes seules. Aucune entrée PMA/fertilité en base.","src":[["Agence de la biomédecine — résultats d'activité nationale AMP (page, publié le 14/04/2026)","https://www.agence-biomedecine.fr/fr/assistance-medicale-a-la-procreation/publication-des-derniers-resultats-d-activite-nationale-en-amp-un-niveau-toujours-eleve-en-2025"],["ABM — communiqué de presse chiffres 2025 (PDF)","https://back.agence-biomedecine.fr/uploads/ABM_CP_Chiffres_activite_AMP_2025_b491882bcc.pdf"],["Gènéthique — ABM publie ce 14 avril (relais daté)","https://genethique.org/pma-pour-toutes-face-a-la-demande-labm-encore-et-toujours-a-la-recherche-de-donneurs/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Questions fréquentes des patientes en parcours PMA (traitements hormonaux délivrés en ville : agonistes GnRH, FSH…) — l'attente des dons se joue en amont ; orientation possible vers les campagnes de don d'ovocytes (information à contre-courant : beaucoup de candidates potentielles ignorent que le don est possible)."},{"dom":"Gynécologie","type":"Officine","n":2,"dt":"2026-10","titre":"OMS : feuille de route mondiale 2026-2035 contre l'hypertension pendant la grossesse, première cause de décès maternels et néonatals","subst":"HTA gravidique · prééclampsie (santé publique)","res":"L'OMS a lancé le 8 octobre 2026 une feuille de route mondiale relative aux troubles hypertensifs de la grossesse pour la période 2026-2035 et au-delà (page OMS vue : « new global roadmap launched to tackle hypertension in pregnancy, a leading cause of maternal and newborn deaths »), présentée lors de la conférence mondiale de la Society for Maternal-Fetal Medicine. Les troubles hypertensifs de la grossesse (HTA chronique, HTA gestationnelle, prééclampsie/éclampsie) restent une cause majeure de morbi-mortalité maternelle et néonatale (ScienceDirect « Prise en charge de l'HTA de la grossesse », 2025, aperçu vu). Complément français : consensus d'experts SFHTA « HTA et grossesse » (PDF sfcardio, 2025/02, vu) qui détaille le suivi opérationnel.","src":[["OMS — feuille de route mondiale 2026-2035 (communiqué du 08/10/2026)","https://www.who.int/fr/news/item/08-10-2026-new-global-roadmap-launched-to-tackle-hypertension-in-pregnancy-a-leading-cause-of-maternal-and-newborn-deaths"],["SFHTA — consensus HTA et grossesse (PDF, février 2025)","https://www.sfcardio.fr/wp-content/uploads/2025/02/HTA-et-grossesse-SFHTA.pdf"],["ScienceDirect — Prise en charge de l'HTA de la grossesse (2025)","https://www.sciencedirect.com/science/article/pii/S2666479825000928"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Mesurer la tension lors de la délivrance des traitements de la grossesse fait partie des gestes de prévention simples ; rappeler les signes de la prééclampsie (œdèmes du visage, céphalées, phosphènes, douleur épigastrique) = consultation immédiate ; antihypertenseurs compatibles (labétalol, nicardipine, méthyldopa) — jamais d'AINS en automédication à partir du 6e mois de grossesse."},{"dom":"Gynécologie","type":"Médicament","n":3,"dt":"2025-02","titre":"Laser vaginal fractionné CO2 pour le syndrome génito-urinaire de la ménopause : la revue Climacteric fait le point — les essais contre procédure factice ne soutiennent pas son efficacité propre","subst":"laser CO2 vaginal · syndrome génito-urinaire de la ménopause (GSM)","res":"Revue publiée dans Climacteric (Li FG et al., « Laser for genitourinary syndrome of menopause: what we know and what we need to know » — Climacteric 2025 Aug;28(4):414-422, Epub 19 février 2025, doi 10.1080/13697137.2025.2455186 — citations vues sur PubMed et Taylor & Francis « Published online: 19 Feb 2025 ») : avec la disponibilité des données de sept essais randomisés en double aveugle contre procédure factice (sham), la conclusion lue (tronquée dans les extraits : « the evidence does not su… ») ne soutient pas une efficacité propre du laser — le niveau de preuve reste insuffisant par rapport à une procédure factice pour les traitements par énergie (laser CO2 fractionné). Un protocole d'essai comparant laser CO2 vs radiofréquence est en cours (Trials 2026, PubMed PMID 42400086, vu). Contexte : le GSM (sécheresse vaginale, dyspareunie, symptômes urinaires) concerne une grande partie des femmes post-ménopausées ; l'ospémifène, SERM oral, apparaît comme une option non œstrogénique (ResearchGate, sélection des patientnes, vu).","src":[["Climacteric (via PubMed) — 2025 Aug;28(4):414-422, Epub 19/02/2025 (PMID 39968760)","https://pubmed.ncbi.nlm.nih.gov/39968760/"],["Taylor & Francis — texte intégral (Published online 19 Feb 2025)","https://www.tandfonline.com/doi/full/10.1080/13697137.2025.2455186"],["Trials (via PubMed) — protocole laser CO2 vs radiofréquence (2026)","https://pubmed.ncbi.nlm.nih.gov/42400086/"],["ResearchGate — ospémifène pour le GSM : sélection des patientes","https://www.researchgate.net/publication/381194881_Ospemifene_for_Genitourinary_Syndrome_of_Menopause_Patient_Selection"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les patientes demandent le « laser vaginal » (souvent non remboursé, séances payantes) — informer honnêtement : les traitements de première intention (hydratants/moisturisers non hormonaux, puis œstrogènes locaux faiblement dosés) ont fait leurs preuves ; le laser n'a pas démontré de bénéfice propre vs procédure factice dans les essais rigoureux."},{"dom":"Gynécologie","type":"Complément alimentaire","n":3,"dt":"2026-10","titre":"« Ruée vers l'or » de la ménopause : phytoœstrogènes, testostérone, applis et glaçons électroniques — Inserm Canal Détox fait le point (1er octobre 2026)","subst":"compléments ménopause · isoflavones · testostérone","res":"L'Inserm publie le 1er octobre 2026 (date lue : « Le 01 Oct 2026 ») un article Canal Détox : « Coachings, compléments alimentaires, testostérone… ces astuces pour atténuer les symptômes de la ménopause fonctionnent-elles vraiment ? ». Points lus sur la page : face au manque d'information s'est développé un marché florissant de la ménopause, au point que des chercheurs de l'University College London évoquent une « ruée vers l'or » ; sur les compléments aux phytoœstrogènes (isoflavones de soja, trèfle rouge) : certaines études suggèrent une légère réduction des bouffées de chaleur chez certaines femmes, mais l'effet reste « modeste et inconstant » et n'est pas retrouvé dans l'ensemble des travaux ; sur la testostérone « pour booster la libido » : aucun médicament à base de testostérone destiné aux femmes ne dispose d'une AMM en France (les produits existants sont conçus pour les hommes à doses non adaptées), avec renvoi au tool du British Menopause Society « Testosterone replacement in menopause » (janvier 2026, références [10] et [12] citées par l'Inserm, vues) ; les glaçons électroniques et autres dispositifs « high-tech » sont également passés en revue. Aucune entrée « marché/compléments ménopause » en base (le THM EPI-PHARE et MENOPRAT portent sur les traitements encadrés).","src":[["Inserm — Canal Détox, 1er octobre 2026","https://presse.inserm.fr/canal-detox/coachings-complements-alimentaires-testosterone-ces-astuces-pour-attenuer-les-symptomes-de-la-menopause-fonctionnent-elles-vraiment/"],["British Menopause Society — Testosterone replacement in menopause (tool clinicien, janvier 2026)","https://thebms.org.uk/publications/"],["Santé.fr — testostérone et ménopause : produit miracle ou fausse promesse ?","https://www.sante.fr/decryptage/nos-reponses/la-testosterone-un-produit-miracle-contre-les-symptomes-de-la-menopause"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"CADRER les attentes sur les compléments « ménopause » (isoflavones = effet au mieux modeste), vérifier les interactions (phytoœstrogènes et tamoxifène : prudence, ne pas associer sans avis), et orienter vers un avis médical structuré (THM si indiqué) plutôt que vers l'automédication prolongée."},{"dom":"Neurologie","type":"Médicament","n":2,"dt":"2026-03","titre":"Sémaglutide oral et maladie d'Alzheimer : échec des essais de phase 3 EVOKE et EVOKE+ — pas de ralentissement du déclin cognitif (Lancet / AD-PD, mars 2026)","subst":"sémaglutide · maladie d'Alzheimer (piste GLP-1)","res":"Les essais jumeaux EVOKE et EVOKE+ (Novo Nordisk) — sémaglutide oral jusqu'à 14 mg/j vs placebo dans la maladie d'Alzheimer amyloïde-confirmée au stade précoce (55-85 ans, troubles cognitifs légers ou démence légère) — n'ont pas atteint leurs critères principaux : pas de ralentissement significatif du déclin cognitif et fonctionnel (topline relayée par Alzheimer Europe, page vue ; présentation au congrès AD/PD 2026 le 19 mars — Clinical Trials Arena, page vue). Publication primaire dans The Lancet (2026, page article vue : « Efficacy and safety of oral semaglutide 14 mg (flexible dose) in early-stage symptomatic Alzheimer's disease (evoke and evoke+): two phase 3, randomised, placebo-controlled trials » ; résumé en langage simple vu sur PMC). Sécurité cohérente avec le profil connu du sémaglutide (nausées, perte d'appétit — point de vigilance chez le sujet âgé dénutrissable).","src":[["The Lancet — EVOKE et EVOKE+ (publication primaire, 2026)","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00459-9/fulltext"],["Clinical Trials Arena — AD/PD 2026, présentation du 19/03/2026","https://www.clinicaltrialsarena.com/analyst-comment/ad-pd-2026-novo-nordisk-semaglutide-early-alzheimers/"],["Alzheimer Europe — topline results EVOKE/EVOKE+","https://www.alzheimer-europe.org/news/novo-nordisk-announces-topline-results-evoke-and-evoke-trials-semaglutide-early-ad?language_content_entity=en"],["PMC — plain language summary des essais evoke(+)","https://pmc.ncbi.nlm.nih.gov/articles/PMC13390525/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Recadrer les attentes « Ozempic pour la mémoire » — la piste GLP-1/Alzheimer, suggérée par des données observationnelles, n'est pas validée par ces deux essais de phase 3 ; pas de changement pour les patients DT2 traités, l'échec est spécifique à l'indication Alzheimer."},{"dom":"Diabète & Endocrinologie","type":"Officine","n":5,"dt":"2025-10","titre":"Lévothyrox : l'ancienne formule (Euthyrox) restera disponible en France jusqu'à fin 2028 pour accompagner les patients — ANSM (01/10/2025)","subst":"lévothyroxine · Euthyrox","res":"L'ANSM a annoncé le 1er octobre 2025 la prolongation de la mise à disposition de l'ancienne formule du Levothyrox (Euthyrox) jusqu'à fin 2028 (20 Minutes et France 24 du )","subst":"téplizumab (Teizeild) · diabète de type 1 stade 2","res":"La Commission européenne a approuvé Teizeild (téplizumab, Sanofi) le 12 janvier 2026 pour retarder l'apparition du DT1 de stade 3 chez les adultes et enfants ≥ 8 ans atteints d'un DT1 de stade 2 (communiqué Sanofi du 12/01/2026, lu : rapport de risque pour le diagnostic de DT1 de 0,41 [IC à 95 % : 0,22-0,78 ; p = 0,006] vs placebo) ; l'EMA avait rendu un avis positif le 14 novembre 2025 (page EMA vue, news actualisée le 20/11/2025 pour la liste des effets indésirables fréquents). En France, la HAS a octroyé une autorisation d'accès précoce (AP577) : avis de la CT du 16 avril 2026, mis en ligne le 22/04/2026 (page HAS vue ; indication lue : DT1 de stade 2 confirmé par au moins deux auto-anticorps anti-îlots pancréatiques + tolérance au glucose altérée définie par deux HGPO anormales confirmées). Déclaration de commercialisation au 15/06/2026 (fiche BNM vue). Premier traitement modificateur de l'histoire naturelle du DT1.","src":[["Sanofi — communiqué : Teizeild approuvé dans l'UE (12/01/2026)","https://www.sanofi.com/fr/media-room/communiques-de-presse/2026/2026-01-12-06-00-00-3216525"],["HAS — TEIZEILD : décision d'accès précoce (AP577, CT du 16/04/2026)","https://www.has-sante.fr/jcms/p_3957005/fr/teizeild-teplizumab-diabete-de-type-1-adulte-/-adolescent-/-enfant-8-ans"],["EMA — First-in-class treatment to delay onset of type 1 diabetes","https://www.ema.europa.eu/en/news/first-class-treatment-delay-onset-type-1-diabetes"],["EMA — Teizeild (EPAR)","https://www.ema.europa.eu/en/medicines/human/EPAR/teizeild"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'initiation est hospitalière (cycle de perfusions sur 14 jours consécutifs) — les questions viendront des familles : dépistage des apparentés du 1er degré (auto-anticorps), compréhension des stades du DT1 (stade 2 = présymptomatique), effets indésirables attendus (éruption cutanée, lymphopénie — liste EMA révisée 11/2025)."},{"dom":"Soins primaires & Officine","type":"Officine","n":5,"dt":"2025-06","titre":"Ozempic et Victoza : fin des restrictions d'approvisionnement — les initiations reprennent pour tous les patients DT2 depuis le 5 juin 2025 (ANSM)","subst":"sémaglutide (Ozempic) · liraglutide (Victoza) · pénurie","res":"Après plus d'un an de tensions majeures, l'ANSM a annoncé la remise à disposition normale d'Ozempic en France depuis début mai 2025, puis la fin des restrictions (La Tribune, page vue) : depuis le 5 juin 2025, Ozempic 0,25 mg (sémaglutide) et Victoza (liraglutide) sont de nouveau disponibles sans restriction et les médecins peuvent reprendre ou initier le traitement chez l'ensemble des patients DT2 conformément aux AMM (Pharma365 et Santé-sur-le-net, pages vues : « Depuis le 5 juin 2025… »). La page ANSM « Diabète de type 2 et tensions d'approvisionnement en aGLP-1 » (vue) documente la levée progressive des mesures et le cadrage des recommandations. La Tribune note que « les dérives persistent » malgré le retour à la normale (usages esthétiques, canaux parallèles).","src":[["ANSM — DT2 et tensions d'approvisionnement en aGLP-1 : perspectives et recommandations","https://ansm.sante.fr/actualites/diabete-de-type-2-et-tensions-dapprovisionnement-en-aglp-1-perspectives-devolution-de-la-situation-et-des-recommandations"],["Pharma365 — Ozempic et Victoza : fin des restrictions, initiations pour tous (05/06/2025)","https://www.pharma365.fr/je-m-informe/cote-medicament/ozempic-et-victoza-fin-des-restrictions-les-initiations-reprennent-pour-tous-les-patients/"],["Santé-sur-le-net — reprise des traitements Ozempic et Victoza (05/06/2025)","https://www.sante-sur-le-net.com/traitements-ozempic-victoza-patients-diabetiques/"],["La Tribune — approvisionnement de l'Ozempic : retour à la normale, dérives persistantes","https://www.latribune.fr/entreprises-finance/industrie/chimie-pharmacie/approvisionnement-de-l-ozempic-retour-a-la-normale-mais-les-derives-persistent-1024602.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ne plus différer systématiquement les initiations, mais rester vigilant — vérifier l'indication DT2 sur l'ordonnance (l'usage esthétique est hors AMM), refuser les ordonnances douteuses ou anciennes réutilisées, et signaler tout soupçon de contrefaçon ou d'achat en ligne."},{"dom":"Économie de la Santé","type":"Économie","n":5,"dt":"2026-06","titre":"Obésité : Wegovy et Mounjaro remboursés par l'Assurance maladie depuis le 15 juin 2026 dans un cadre contrôlé — arrêtés JO du 28/05/2026, avis HAS (mai 2026)","subst":"tirzépatide (Mounjaro) · sémaglutide (Wegovy) · remboursement obésité","res":"Deux médicaments contre l'obésité sont remboursés par l'Assurance maladie depuis le 15 juin 2026 (Service-Public, page vue : publié le 01/06/2026, mis à jour le 15/06/2026) — la mesure vient d'être confirmée par plusieurs arrêtés parus au Journal officiel le 28 mai 2026 et répond aux recommandations de la HAS alors qu'en 2025, 17,4 % des adultes étaient en situation d'obésité (page vue). Le Vidal précise les conditions de prise en charge de Wegovy (sémaglutide) et Mounjaro (tirzépatide) à partir du 15/06/2026, sous conditions (actualité vue, avec la règle de l'IMC initial mesuré à l'initiation du traitement) ; pour Mounjaro, l'avis CT de la HAS du 06/05/2026 (page vue) est favorable au remboursement uniquement dans le DT2 insuffisamment contrôlé (bithérapie/trithérapie selon l'AMM) ; un formulaire d'accompagnement à la prescription existe pour le tirzépatide dans le DT2 (document ameli vu). Rappel du cadre (Service-Public, page vue) : les aGLP-1 ne doivent pas être prescrits à des fins esthétiques chez des personnes ne présentant pas les critères.","src":[["Service-Public — Deux médicaments contre l'obésité remboursés depuis le 15 juin 2026","https://www.service-public.gouv.fr/particuliers/actualites/A18932"],["Vidal — Prise en charge de Wegovy et Mounjaro à partir du 15
