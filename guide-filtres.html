 extraits consultés — le secteur K2 a intérêt à ce message, d'où la prudence."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-09","titre":"Bêta-alanine : petit effet réel sur les efforts intenses répétés — pas un produit santé","subst":"Bêta-alanine (précurseur de la carnosine musculaire)","res":"Méta-analyse à trois niveaux (BMC Sports Science, Medicine and Rehabilitation, sept. 2026) : 14 ECR, 268 athlètes de sports collectifs — effet petit mais réel sur la performance d'efforts intermittents de haute intensité (g de Hedges ≈ 0,33) ; une méta-analyse 2024 chez l'adulte entraîné confirme des gains sur les exercices maximaux. Mécanisme : la carnosine tamponne l'acidité musculaire. Utile pour des efforts soutenus de 1 à 10 minutes ; inefficace pour la force pure ou l'endurance longue ; paresthésies transitoires fréquentes (picotements) sans gravité. Le conseil : au comptoir sportif, pas comme « complément santé ».","off":"La bêta-alanine donne un petit gain réel sur les efforts très intenses et répétés (sports collectifs) — pas un produit miracle, et inutile pour la santé ou la perte de poids. Des picotements transitoires sont fréquents et sans danger.","src":[["BMC Sports Sci Med Rehabil 2026","https://link.springer.com/article/10.1186/s13102-026-02101-0"],["IJSNEM 2024 (méta-analyse)","https://journals.humankinetics.com/view/journals/ijsnem/34/6/article-p397.xml"]],"coi":"Indépendant","fin":"Méta-analyses académiques sans financement industriel identifié."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-06","titre":"Protéines et muscle : l'heure de la prise compte peu — le total quotidien et l'entraînement, si","subst":"Protéines (whey, caséine, végétales) — timing et renforcement musculaire","res":"Méta-analyse (Nutrients, juin 2025) : consommer ses protéines avant ou après l'entraînement change peu les adaptations — un léger avantage au leg press pour la prise pré-entraînement n'est pas confirmé en analyse de sous-groupes. Une méta-analyse en réseau (2024-2025) compare les sources de protéines sur la force et la masse maigre ; chez le senior, la whey associée au renforcement améliore composition corporelle et fonction (J Nutr 2025). Message officinal simple : viser le total de protéines sur la journée et la régularité de l'entraînement plutôt que l'horloge ou la « fenêtre anabolique ».","off":"Pour le muscle, ce qui compte c'est le total de protéines sur la journée et l'entraînement régulier — pas l'horloge : avant ou après la séance, les résultats se valent.","src":[["Nutrients 2025 (timing)","https://pubmed.ncbi.nlm.nih.gov/40647175/"],["NMA sources de protéines","https://pubmed.ncbi.nlm.nih.gov/41635649/"],["J Nutr 2025 (seniors)","https://jn.nutrition.org/article/S0022-3166(25)00024-0/fulltext"]],"coi":"Indépendant","fin":"Synthèses académiques sans financement industriel identifié dans les extraits consultés."},{"dom":"Psychiatrie","type":"Médicament","n":3,"dt":"2025-04","titre":"Sémaglutide et alcool : premier essai randomisé positif dans le trouble de l'usage (JAMA Psychiatry)","subst":"Sémaglutide — trouble de l'usage de l'alcool","res":"Essai randomisé, double aveugle vs placebo (JAMA Psychiatry, 2025;82(4):395-405) : sémaglutide hebdomadaire 0,25-0,5 mg chez des adultes avec trouble de l'usage de l'alcool → réduction de la consommation d'alcool et du craving, bien toléré. Première donnée randomisée concordante avec les signaux précliniques et pharmacoépidémiologiques sur les GLP-1. Rien d'approuvé : piste de recherche prometteuse, pas une indication — le Counsel officinal reste « pas d'automédication par GLP-1 ».","off":"Un médicament GLP-1 a montré, dans un premier essai, qu'il réduisait la consommation d'alcool — c'est de la recherche, pas une indication : n'essayez pas sans médecin, et surtout pas des produits achetés en ligne.","src":[["JAMA Psychiatry 2025","https://jamanetwork.com/journals/jamapsychiatry/fullarticle/2829811"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/39937469/"]],"coi":"Mixte","fin":"Essai académique ; les conflits d'intérêts des auteurs incluent des liens avec des laboratoires GLP-1 — jugés gérés par le comité éditorial."},{"dom":"Psychiatrie","type":"Officine","n":1,"dt":"2026-02","titre":"Exercice et dépression/anxiété : la plus grande synthèse « méta-méta » confirme l'effet propre (BJSM)","subst":"Activité physique — dépression et anxiété","res":"Revue parapluie avec méta-méta-analyse (British Journal of Sports Medicine, 2026;60(8):590-599) compilant les méta-analyses jusqu'à mi-2025 : l'exercice réduit significativement les symptômes de dépression et d'anxiété chez l'adulte ; chez l'enfant et l'adolescent, une revue parapluie 2025 (JAACAP) conclut pareillement. L'activité physique est un composant de traitement à part entière — à prescrire aux côtés des soins, à dose « régulière », pas « parfaite ». C'est probablement le conseil le plus rentable du comptoir.","off":"Bouger fait vraiment du bien à l'humeur : les synthèses les plus solides montrent que l'exercice réduit les symptômes de dépression et d'anxiété. En plus des soins, pas à leur place.","src":[["BJSM 2026 (méta-méta-analyse)","https://bjsm.bmj.com/content/early/2026/02/02/bjsports-2025-110301"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41667154/"],["JAACAP 2025 (enfants/ados)","https://www.jaacap.org/article/S0890-8567(25)00208-4/fulltext"]],"coi":"Indépendant","fin":"Synthèses académiques en accès libre, sans financement industriel identifié."},{"dom":"Neurologie","type":"Médicament","n":2,"dt":"2025-02","titre":"Parkinson : le grand espoir GLP-1 s'arrête — l'exénatide ne modifie pas la maladie (phase 3, Lancet)","subst":"Exénatide — maladie de Parkinson (Exenatide-PD3)","res":"Premier essai de phase 3 d'un agoniste GLP-1 en neurodégénérescence (Lancet, 2025;405(10479)) : exénatide hebdomadaire vs placebo, multicentrique britannique chez des Parkinson modérés (194 patients) — aucun signal de traitement modificateur de maladie ; en revanche sûr et bien toléré. Un négatif utile : il cadre l'engouement « GLP-1 pour tout » et recentre la recherche sur d'autres pistes (meilleur engagement de cible, sous-groupes).","off":"L'idée qu'un médicament du diabète (GLP-1) ralentirait Parkinson a été testée dans un grand essai : non, il ne ralentit pas la maladie — la recherche continue ailleurs.","src":[["Lancet 2025","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(24)02808-3/fulltext"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/39919773/"],["Commentaire (Parkinson's UK)","https://www.parkinsons.org.uk/news/2025/results-phase-3-trial-exenatide-published"]],"coi":"À vérifier","fin":"Essai académique britannique financé par des associations et fonds publics ; les auteurs déclarent des liens variés, gérés par la revue."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":2,"dt":"2025-12","titre":"Vaccin HPV : une seule dose protège aussi bien que deux, même dans l'essai randomisé (ESCUDDO, NEJM)","subst":"Vaccin HPV (bivalent, nonavalent) — schéma à dose unique","res":"Essai ESCUDDO (NEJM, 3 déc. 2025) : 20 330 filles de 12-16 ans au Costa Rica randomisées entre une ou deux doses de vaccin HPV bivalent ou nonavalent — non-infériorité de la dose unique contre l'infection HPV à haut risque persistante sur ~5 ans, avec une efficacité vaccine > 95 % quel que soit le schéma. La plus grande preuve randomisée à l'appui de la recommandation OMS d'une dose unique chez les jeunes filles — un levier de simplification pour la couverture vaccinale.","off":"Le vaccin contre le HPV (qui protège du cancer du col de l'utérus) fonctionne aussi avec une seule dose chez les jeunes filles — une simplification déjà recommandée par l'OMS dans le monde.","src":[["NEJM 2025 (essai ESCUDDO)","https://www.nejm.org/doi/full/10.1056/NEJMoa2506765"],["Éditorial NEJM","https://www.nejm.org/doi/full/10.1056/NEJMe2515387"],["NIH Research Matters","https://www.nih.gov/news-events/nih-research-matters/one-dose-hpv-vaccine-effective-two"]],"coi":"Indépendant","fin":"Essai de santé publique costaricien financé par les instituts publics américains (NCI/NIH), sans sponsor industriel."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":2,"dt":"2025-09","titre":"Grippe et insuffisance cardiaque : vacciner à l'hôpital améliore la survie à 12 mois (PANDA II, Lancet)","subst":"Vaccination antigrippale — insuffisance cardiaque aiguë","res":"Essai randomisé en grappes (Lancet, 2025;406:1611-1624) dans des hôpitaux chinois : proposer la vaccination antigrippale gratuite pendant l'hospitalisation pour insuffisance cardiaque aiguë améliore la survie et réduit les réhospitalisations sur les 12 mois suivants. La grippe est un déclencheur majeur de décompensation cardiaque — un argument de plus pour que l'officine vaccine (et rappelle le rappel) les cardiaques chaque automne.","off":"Si vous avez une insuffisance cardiaque, le vaccin contre la grippe n'est pas une option : il protège le cœur. Un essai montre qu'il améliore même la survie à un an.","src":[["Lancet 2025 (PANDA II)","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(25)01485-0/abstract"],["Nature Medicine (brève)","https://www.nature.com/articles/d41591-025-00058-0"]],"coi":"À vérifier","fin":"Essai chinois multicentrique ; financement détaillé non consulté — résultats d'abord présentés en session ESC 2025."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":3,"dt":"2025-04","titre":"Covid long : le Paxlovid ne soulage pas les symptômes persistants (PAX LC, phase 2, Lancet ID)","subst":"Nirmatrelvir-ritonavir — Covid long (PAX LC)","res":"Essai de phase 2 randomisé, décentralisé, en double aveugle (Lancet Infectious Diseases, 3 avr. 2025) : 15 jours de nirmatrelvir-ritonavir vs placebo-ritonavir chez des adultes très symptomatiques de Covid long → pas d'amélioration significative des symptômes. Convergent avec STOP-PASC (JAMA Intern Med 2024), négatif lui aussi sur les critères principaux. L'hypothèse « persistance virale traitable par un antiviral » ne tient pas pour l'instant — utile pour répondre aux patients qui demandent « un traitement pour mon Covid long ».","off":"Le Paxlovid a été testé contre le Covid long : il ne soulage pas les symptômes. Aucun médicament n'est encore validé pour ça — les prises en charge actuelles soignent les symptômes un par un.","src":[["Lancet Infect Dis 2025 (PAX LC)","https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(25)00073-8/fulltext"],["STOP-PASC (JAMA IM 2024)","https://www.amjmed.com/article/S0002-9343(24)00271-7/fulltext"],["Brève (medicalxpress)","https://medicalxpress.com/news/2025-04-paxlovid-ineffective-covid-symptoms-trial.html"]],"coi":"Indépendant","fin":"Essais académiques américains (Yale, NIH) sur fonds publics, sans sponsor industriel."},{"dom":"Soins primaires & Officine","type":"Officine","n":1,"dt":"2026-08","titre":"Sevrage tabagique : les cigarettes électroniques avec nicotine battent les patchs, certitude élevée (Cochrane 2026)","subst":"Cigarettes électroniques nicotiniques — arrêt du tabac","res":"La mise à jour 2026 de la Cochrane (CD010216, 80 essais) confirme avec une certitude élevée que les e-cigarettes nicotiniques augmentent les taux d'arrêt vs substituts nicotiniques : environ 4 arrêtés de plus pour 100 fumeurs ; +2 vs e-cigarettes sans nicotine. L'essai E3 (2025) montre aussi qu'une e-cigarette de 12 semaines aide même sans soutien comportemental intensif. Nuances officinales : outil d'arrêt (avec un projet d'arrêt et idéalement un accompagnement), pas un produit de récréation à double usage — et interdit aux non-fumeurs et mineurs.","off":"Pour arrêter de fumer, la cigarette électronique avec nicotine marche mieux que les patchs seuls (environ 4 arrêts de plus sur 100) — si c'est pour arrêter complètement, avec de l'aide. Jamais pour un non-fumeur.","src":[["Cochrane 2026 (revue)","https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD010216.pub11/full"],["Cochrane (communiqué)","https://www.cochrane.org/about-us/news/vapes-help-more-people-quit-smoking-other-methods"],["Essai E3 (2025)","https://www.sciencedirect.com/science/article/pii/S2772963X25002522"]],"coi":"Indépendant","fin":"Revue Cochrane indépendante ; l'essai E3 canadien est académique — certains essais inclus ont reçu des produits de fabricants d'e-cigarettes, gérés par la méthodologie."},{"dom":"Soins primaires & Officine","type":"Alerte","n":1,"dt":"2026-03","titre":"Compléments des sportifs : 9 à 15 % contiennent des substances interdites non déclarées (revue systématique)","subst":"Compléments alimentaires des sportifs — dopage involontaire, adultérants","res":"Revue systématique (Frontiers in Sports and Active Living, mars 2026) sur la contamination des compléments : environ 9 à 15 % des produits testés dans les études empiriques contiennent des substances interdites (WADA) ou des adultérants pharmacologiques non déclarés — stéroïdes, sibutramine, stimulants. Conséquence : dopage involontaire des sportifs contrôlés, et risques sanitaires pour tous. Réflexe officinal : orienter le sportif vers des marques au programme de contrôle de lots (tier-certifié), se méfier des produits « brûle-graisse » ou « anabolisants » vendus en ligne, déclarer tout complément en cas de contrôle.","off":"Si vous êtes sportif (même amateur) : jusqu'à 1 complément sur 10 peut contenir des produits dopants ou des médicaments cachés. Ne prenez que des marques contrôlées par lots, méfiez-vous des sites en ligne, et dites tout ce que vous prenez.","src":[["Frontiers Sports Act Living 2026","https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2026.1740663/full"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41908212/"]],"coi":"Indépendant","fin":"Revue systématique académique sans financement industriel identifié."},{"dom":"Rhumatologie","type":"Médicament","n":4,"dt":"2025-09","titre":"Goutte : pour prévenir les crises au démarrage du traitement de fond, la colchicine est plus sûre pour le cœur que les AINS","subst":"Colchicine vs AINS — prophylaxie des crises de goutte","res":"Émulations d'essai cible sur données américaines (Arthritis & Rheumatology, 2025;77(12):1767-1777) : chez les patients goutteux démarrant un uricosurique (allopurinol), la prophylaxie par AINS est associée à un risque d'événements cardiovasculaires indésirables plus élevé que la colchicine. Un renfort pour les recommandations qui placent la colchicine à faible dose comme agent prophylactique préféré des « crises paradoxales » — d'autant que les goutteux cumulent souvent les risques CV. Rappel officinal : ajuster la colchicine si insuffisance rénale, éviter l'association macrolides + colchicine, et rappeler la lenteur d'action du traitement de fond.","off":"Quand on démarre un traitement de fond de la goutte, une petite dose de colchicine protège des crises — et elle est plus sûre pour le cœur que les anti-inflammatoires.","src":[["Arthritis Rheumatol 2025","https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/art.43259"],["Healio (analyse)","https://www.healio.com/news/rheumatology/20250911/nsaid-use-for-gout-flares-linked-to-increased-cardiovascular-risk"],["Medscape (analyse)","https://www.medscape.com/viewarticle/nsaids-may-pose-greater-heart-risks-than-colchicine-gout-2025a1000fmx"]],"coi":"À vérifier","fin":"Émulations d'essai cible sur données d'assurance américaines ; financement non détaillé dans les extraits consultés — observation robuste mais non randomisée."},{"dom":"Rhumatologie","type":"Médicament","n":5,"dt":"2025-10","titre":"Hydroxychloroquine : l'AAO met à jour le dépistage de la rétinopathie (OCT + autofluorescence chaque année)","subst":"Hydroxychloroquine (Plaquenil) — rétinopathie, dépistage ophtalmologique","res":"La révision 2025 des recommandations de l'American Academy of Ophthalmology (ratifiée en octobre 2025, publiée dans Ophthalmology) : dépistage annuel par OCT maculaire + autofluorescence du fond d'œil pendant toute la durée du traitement, pouvant être différé pendant les 5 premières années en l'absence de facteurs de risque majeurs (dose > 5 mg/kg/j, durée longue, insuffisance rénale, obésité sévère). Après l'arrêt, une rétinopathie légère progresse rarement, une sévère peut s'aggraver des années. Le pharmacien officinal a un vrai rôle : rappeler l'examen ophtalmologique annuel aux lupus/polyarthrite sous Plaquenil, et signaler les doses cumulées élevées.","off":"Sous Plaquenil depuis des années (lupus, polyarthrite) : un contrôle ophtalmologique chaque année protège votre vue — les lésions de rétine se dépistent avant qu'on ne les ressente.","src":[["AAO (recommandations)","https://www.aao.org/education/clinical-statement/revised-recommendations-on-screening-chloroquine-h"],["Ophthalmology 2025 (article)","https://www.sciencedirect.com/science/article/pii/S0161642025007092"],["Synthèse (Guideline Central)","https://www.guidelinecentral.com/guideline/4972106/"]],"coi":"Indépendant","fin":"Recommandations d'une société savante (AAO), sans financement industriel."},{"dom":"Cardiologie","type":"Officine","n":2,"dt":"2025-08","titre":"Fibrillation auriculaire : le dépistage au patch ECG par courrier détecte plus de FA — mais modestement (AMALFI, JAMA)","subst":"Dépistage de la fibrillation auriculaire asymptomatique — patch ECG","res":"Essai randomisé AMALFI (JAMA, epub août 2025, session ESC) chez des seniors à risque d'AVC modéré à élevé : un programme de dépistage postal par patch ECG continu augmente modestement le diagnostic de FA et l'exposition aux anticoagulants à long terme vs soins usuels. À rapprocher de GUARD-AF (≈ 12 000 seniors, patch 14 jours, sans réduction d'AVC). Pour l'officine : la palpation du pouls reste un réflexe simple au comptoir — toute irrégularité inexplorée chez un senior mérite un ECG, et l'automesure de tension qui détecte une FA mérite une orientation médicale.","off":"Après 65 ans, un pouls irrégulier qui n'a jamais été expliqué : faites-le vérifier — une fibrillation auriculaire silencieuse peut causer un AVC, et elle se soigne.","src":[["JAMA 2025 (AMALFI)","https://jamanetwork.com/journals/jama/fullarticle/2838482"],["Communiqué ESC","https://www.escardio.org/news/press/press-releases/Remote-atrial-fibrillation-screening-using-an-ECG-patch-demonstrates-modest-benefits/"],["ACC (GUARD-AF et digital)","https://www.acc.org/Latest-in-Cardiology/Articles/2025/12/02/11/11/Digital-Technologies-For-Atrial-Fibrillation-in-Older-Adults"]],"coi":"Indépendant","fin":"Essais académiques présentés à l'ESC 2025, financements publics britanniques et américains (NIH), sans sponsor industriel."},{"dom":"Autorisations & Sécurité","type":"Médicament","n":5,"dt":"2025-02","titre":"Testostérone : après TRAVERSE, la FDA retire l'avertissement cardiovasculaire (février 2025) — mais c'est un traitement médicalisé","subst":"Testostérone (traitement substitutif) — sécurité cardiovasculaire, réglementation","res":"Après l'essai TRAVERSE (NEJM, 5 246 hommes hypogonadiques, non-infériorité cardiovasculaire vs placebo), la FDA a retiré en février 2025 l'encadré d'avertissement cardiovasculaire des médicaments à base de testostérone ; en décembre 2025, un panel d'experts réunis par l'agence discutait un élargissement de l'accès sous conditions (Urology Times). Position officinale : la testostérone reste un traitement médicalisé — diagnostic biologique confirmé, suivi (hématocrite, PSA), et un risque réel de dépendance aux produits achetés en ligne, souvent dosés à l'aveugle. Pas un « complément forme et énergie ».","off":"La testostérone n'est pas un produit de forme : c'est un vrai médicament, avec dosage, contrôle et suivi. Les sites qui la vendent en ligne sans examen ne vérifient rien — ni vous, ni votre cœur.","src":[["Urology Times (FDA, déc. 2025)","https://www.urologytimes.com/view/experts-urge-fda-to-revisit-labeling-for-testosterone-replacement-therapy-in-men"],["TRAVERSE (NEJM 2023)","https://www.nejm.org/doi/full/10.1056/NEJMoa2215025"],["Revue 2025 (Trends Urol Men Health)","https://onlinelibrary.wiley.com/doi/10.1002/tre.70016"]],"coi":"Mixte","fin":"Décision réglementaire FDA relayée par la presse spécialisée ; les auteurs de la revue déclarent des liens avec l'industrie andrologique, jugés gérés par la revue."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-05","titre":"Nitrates alimentaires (jus de betterave) : effets ergogènes réels mais modérés (revue parapluie de 20 méta-analyses, Sports Medicine)","subst":"Nitrates alimentaires (jus de betterave concentré) — performance sportive","res":"La revue parapluie (Sports Medicine, mai 2025 ; 55(5):1213-1231, epub 14 mars 2025) compile 20 méta-analyses publiées sur les nitrates alimentaires (NO3−) et l'exercice. Des effets ergogènes sont observés, notamment sur la distance totale parcourue lors d'exercices d'endurance, mais ils restent modestes et dépendants de la dose, du type d'exercice et de la population (plus nets chez les moins entraînés). Au comptoir : un argument honnête pour le jus de betterave concentré chez les sportifs d'endurance occasionnels — pas une pilule magique.","off":"Le jus de betterave concentré (riche en nitrates) peut légèrement améliorer l'endurance, surtout si vous n'êtes pas très entraîné — l'effet reste modeste et ne remplace pas l'entraînement.","src":[["Sports Medicine 2025 (Springer)","https://link.springer.com/article/10.1007/s40279-025-02194-6"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40085422/"],["Texte intégral (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC12106159/"]],"coi":"À vérifier","fin":"Revue parapluie académique ; financement non détaillé dans les extraits consultés. Effets d'ampleur modeste : ne pas survendre."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":1,"dt":"2025-06","titre":"Aspartame et glycémie : peu d'effets aigus sur la glycémie et l'insuline (revue systématique + méta-analyses, Advances in Nutrition)","subst":"Aspartame (édulcorant intense) — réponses glycémiques et hormonales","res":"La revue systématique avec méta-analyses (Advances in Nutrition, juin 2025 ; Boxall et al., Bournemouth) compile les études croisées aiguës : peu d'effets de l'aspartame sur la glycémie et l'insuline par rapport au véhicule ou aux autres édulcorants, et des concentrations plus basses qu'avec les sucres et autres glucides. Les études restent hétérogènes (sujets sains, sensibles ou avec glycémie altérée ; doses et comparateurs variables). Sur le plan aigu, substituer le sucre par l'aspartame ne dégrade pas la glycémie ; les données à long terme sur les issues cliniques restent débattues.","off":"Remplacer le sucre par l'aspartame ne fait pas monter la glycémie juste après le repas — c'est plutôt l'inverse par rapport au sucre. Les études à long terme continuent d'être évaluées.","src":[["Advances in Nutrition 2025 (ScienceDirect)","https://www.sciencedirect.com/science/article/pii/S2161831325000857"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40381807/"],["Synthèse News-Medical (25 juin 2025)","https://www.news-medical.net/news/20250625/Is-aspartame-safe-for-blood-sugar-Study-answers"]],"coi":"À vérifier","fin":"Équipe universitaire (Bournemouth, Royaume-Uni) ; financements non détaillés dans les extraits. Études aiguës majoritaires : ne pas extrapoler au long terme."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":2,"dt":"2025-06","titre":"Café et thé : réduction de risque de mortalité la plus nette à 1-4 tasses de café ou 2 tasses de thé par jour (méta-analyse, Frontiers in Nutrition)","subst":"Café et thé (consommation habituelle) — mortalité et maladies cardiovasculaires","res":"La méta-analyse dose-réponse (Frontiers in Nutrition, 2 juin 2025 ; 12:1570644) regroupe 17 articles de cohortes (2003-2025). La relation avec la mortalité toutes causes est non linéaire : la réduction de risque la plus marquée s'observe autour de 1 à 4 tasses de café par jour, et jusqu'à 2 tasses de thé par jour. Données observationnelles de qualité variable : un message rassurant au comptoir, pas une ordonnance.","off":"Le café (1 à 4 tasses par jour) et le thé (jusqu'à 2 tasses) sont associés à un risque de mortalité un peu plus faible dans les grandes études d'observation — sans excès.","src":[["Frontiers in Nutrition 2025","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1570644/full"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40525136/"]],"coi":"À vérifier","fin":"Cohortes observationnelles (Newcastle-Ottawa) : associations, pas de causalité ; financement non détaillé dans les extraits."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":1,"dt":"2025-06","titre":"Jeûne intermittent vs restriction calorique continue : efficacité comparable, pas de supériorité (méta-analyse en réseau d'ECR, BMJ)","subst":"Stratégies de jeûne intermittent (5:2, jours alternés, restriction temporelle) — poids et risque cardiométabolique","res":"La revue systématique avec méta-analyse en réseau d'ECR (BMJ, 18 juin 2025 ; 389:e082007) compare les stratégies de jeûne intermittent à la restriction calorique continue et aux régimes ad libitum. Résultat principal : sur le poids et les marqueurs cardiométaboliques, le jeûne intermittent fait aussi bien que la restriction calorique continue — sans avantage net d'une stratégie sur l'autre. Le meilleur régime reste celui que le patient tient dans la durée : une réponse utile à la mode du jeûne.","off":"Le jeûne intermittent aide à perdre du poids, mais pas plus qu'un régime classique moins contraignant : choisissez la méthode que vous pouvez tenir longtemps.","src":[["BMJ 2025","https://www.bmj.com/content/389/bmj-2024-082007"],["Texte intégral (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC12175170/"],["Synthèse BMJ Group","https://bmjgroup.com/intermittent-fasting-comparable-to-traditional-diets-for-weight-loss/"]],"coi":"À vérifier","fin":"Équipe académique (Université de Glasgow) ; analyse GRADE/CINeMA ; financement non détaillé dans les extraits consultés."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":2,"dt":"2025-05","titre":"Régimes végétaliens : carence en iode fréquente, et risque d'excès via les algues (mini revue, Frontiers in Endocrinology)","subst":"Iode — statut nutritionnel des régimes végans et végétariens","res":"La mini revue (Frontiers in Endocrinology, 8 mai 2025 ; Croce, Rotondi, Ruggeri) résume le statut iodé des personnes véganes et végétariennes : carence possible (absence de poisson, produits laitiers et œufs ; sel non iodé), surtout chez les femmes et dans les pays sans programmes d'iode — mais aussi excès via les algues (kelp) et compléments d'algues. Deux messages de comptoir : ne pas négliger l'iode chez les végans (femmes en âge de procréer en particulier) et éviter les algues en automédication à doses répétées.","off":"Si vous êtes végan, l'iode peut manquer (pas de poisson ni produits laitiers) — ne compensez pas avec de grandes quantités d'algues, elles peuvent en apporter trop : il existe des compléments correctement dosés, parlez-en.","src":[["Frontiers in Endocrinology 2025","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2025.1537208/full"],["Épub (date de publication)","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2025.1537208/epub"],["Texte intégral (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC12094987/"]],"coi":"À vérifier","fin":"Revue narrative d'endocrinologues universitaires italiens ; pas de méta-analyse, message de prudence plutôt que de preuve d'intervention."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-04","titre":"Spiruline et Chlorella au sport : effets modestes et conditionnels (revue systématique, Nutrients)","subst":"Spiruline, Chlorella et autres microalgues — performance et récupération","res":"La revue systématique (Nutrients, 19 avril 2026 ; 18(8):1289) sur les algues et microalgées en sport conclut que les compléments d'algues — spiruline et chlorella en tête — peuvent améliorer modestement la performance aérobie et atténuer les dommages musculaires induits par l'exercice, dans certaines conditions seulement : les effets dépendent de l'espèce d'algue, de la dose, de la durée d'intervention et du type d'entraînement. Les auteurs appellent des ECR multicentriques de qualité. Au comptoir : ramener les promesses marketing à cette réalité mesurée.","off":"La spiruline peut apporter un petit bénéfice sur l'endurance et la récupération, mais les preuves restent modestes et dépendent de la dose et de l'entraînement — l'essentiel reste une alimentation équilibrée.","src":[["Nutrients 2026 (accès ouvert)","https://www.mdpi.com/2072-6643/18/8/1289"]],"coi":"À vérifier","fin":"Revue systématique académique en accès ouvert (MDPI) ; financements non détaillés dans les extraits consultés."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":3,"dt":"2025-11","titre":"Kéfir : ECR sur la santé digestive, le sommeil et le bien-être mental de jeunes adultes (Journal of Nutrition)","subst":"Kéfir (boisson lactée fermentée) — santé digestive, sommeil, bien-être","res":"Essai randomisé contrôlé (Journal of Nutrition, epub 26 nov. 2025 ; 2026;156(1):101247 ; Bakırhan et al.) chez de jeunes adultes sains : consommation de kéfir évaluée sur la santé gastro-intestinale, des paramètres biochimiques, le sommeil et le bien-être mental. Les résultats détaillés n'étaient pas lisibles dans les extraits consultés — l'entrée documente le design et la question, à compléter à la lecture du texte intégral. Le kéfir reste un aliment fermenté de choix, avec des preuves cliniques globales encore hétérogènes.","off":"Le kéfir est un laitage fermenté agréable pour le transit — les preuves sur le sommeil et le moral ne font que commencer à s'accumuler.","src":[["Journal of Nutrition (ScienceDirect)","https://www.sciencedirect.com/science/article/abs/pii/S0022316625007138"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41314291/"]],"coi":"À vérifier","fin":"ECR universitaire turc ; population d'adultes jeunes sains — généralisation limitée."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-08","titre":"Colopathie (SII) : les fibres améliorent la réponse clinique, le psyllium en tête (méta-analyse de 30 ECR, Gastroenterology)","subst":"Psyllium et autres fibres solubles — syndrome de l'intestin irritable","res":"La revue systématique avec méta-analyse (Gastroenterology, en ligne 14 août 2026 ; doi:10.1053/j.gastro.2026.07.027 ; Staudacher et al., Monash) compile 30 ECR (1 904 patients) : plus de la moitié des patients sous fibres obtiennent une réponse clinique contre 44 % sous placebo, et le psyllium (6 ECR) est associé à une réponse supérieure aux autres fibres (son de blé, inuline, fructanes…). Un des conseils les plus solides du rayon digestion : proposer le psyllium en première intention dans le SII, en augmentant progressivement la dose.","off":"Pour le syndrome de l'intestin irritable, le psyllium est la fibre la mieux prouvée : commencez par de petites doses avec beaucoup d'eau et augmentez progressivement.","src":[["Gastroenterology 2026","https://www.gastrojournal.org/article/S0016-5085(26)07147-7/fulltext"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/42600900/"],["ScienceDirect","https://www.sciencedirect.com/science/article/pii/S0016508526071477"]],"coi":"À vérifier","fin":"Équipe universitaire (Monash, Australie) ; revue en accès ouvert ; financements non détaillés dans les extraits consultés."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-10","titre":"Caféine et musculation : améliore la vitesse d'exécution et la puissance en résistance (revue systématique + méta-analyse, Frontiers in Nutrition)","subst":"Caféine (prise aiguë pré-entraînement) — vitesse et puissance en exercice de résistance","res":"La revue systématique avec méta-analyse (Frontiers in Nutrition, 7 oct. 2025 ; 12:1686283) examine les effets d'une prise aiguë de caféine sur la vitesse de mouvement et la puissance de sortie pendant les exercices de résistance (recherche jusqu'au 10 juin 2025). La caféine améliore significativement ces paramètres (relation charge-vitesse) ; les auteurs notent que les réponses spécifiques au sexe restent à clarifier. Conseil comptoir pour les clients « muscu » : la caféine reste l'ergogène le plus documenté, à individualiser selon la tolérance et l'horaire d'entraînement.","off":"Un café avant la séance de musculation améliore la puissance et la vitesse d'exécution ; évitez la caféine en fin de journée pour préserver le sommeil.","src":[["Frontiers in Nutrition 2025","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1686283/full"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41127092/"],["Texte intégral (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC12537405/"]],"coi":"Indépendant","fin":"Financement public (Key Lab of Exercise and Health Sciences, Shanghai University of Sport) ; les auteurs déclarent l'absence de relations commerciales (déclaration de l'article)."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2026-05","titre":"GLP-1 et muscle : la perte de masse maigre ne doit pas freiner le traitement, mais surveiller qualité musculaire, os et apports (revue Metabolites + méta-analyse IJO)","subst":"Agonistes GLP-1 (sémaglutide, tirzépatide) — préservation de la masse et de la qualité musculaires","res":"Deux travaux 2026 cadrant le débat « GLP-1 = fonte musculaire ? » : (1) la méta-analyse d'ECR (International Journal of Obesity 2026 ; Laverde et al.) sur les agonistes GLP-1 aux doses obésité conclut que la proportion de masse maigre rapportée au poids total s'améliore — effet possiblement amplifié avec le sémaglutide — et que la perte de masse maigre ne doit pas être considérée comme une limite à l'usage ; (2) la revue (Metabolites, 27 mai 2026 ; 16(6):364) plaide pour évaluer au-delà du poids : qualité et fonction musculaires, os, adéquation nutritionnelle, avec suivi BIA en pratique courante. Au comptoir : rassurer (la fonte est proportionnelle à la perte de poids), et vérifier apports protéiques et activité de renforcement.","off":"Sous traitement type Ozempic/Wegovy/Mounjaro, une partie de la perte de poids est du muscle — c'est proportionnel, pas dangereux en soi : mangez assez de protéines et gardez une activité de renforcement.","src":[["Metabolites 2026 (revue)","https://www.mdpi.com/2218-1989/16/6/364"],["International Journal of Obesity 2026 (méta-analyse)","https://www.nature.com/articles/s41366-026-02118-y"],["PubMed (méta IJO)","https://pubmed.ncbi.nlm.nih.gov/42321502/"]],"coi":"À vérifier","fin":"Revue en accès ouvert et méta-analyse d'ECR ; financements non détaillés dans les extraits consultés."},{"dom":"Soins primaires & Officine","type":"Officine","n":3,"dt":"2024-07","titre":"Entretiens pharmaceutiques à l'officine : 56 % des pharmaciens enquêtés les pratiquent (enquête nationale, Thérapies)","subst":"Entretiens pharmaceutiques (nouvelles missions officinales) — déploiement en France","res":"L'enquête par questionnaire (Thérapies, juillet-août 2024 ; 79(4):443-451 ; dépôt HAL hal-04803333) dresse l'état des lieux de la mise en place des entretiens pharmaceutiques en officine : 94 pharmaciens de 8 régions ont répondu, et 56 % déclaraient pratiquer les entretiens pharmaceutiques — avec des freins organisationnels (temps, formation, rémunération) et des leviers identifiés. Source française publiée dans une revue à comité de lecture : l'activité existe mais reste inégalement déployée, et sa rémunération a depuis été renforcée par l'Assurance maladie.","off":"L'entretien pharmaceutique est une mission officinale reconnue (AVK/AOD, asthme…) : demandez-le à votre pharmacie, il est pris en charge par l'Assurance maladie.","src":[["Thérapies 2024 (PDF via HAL)","https://hal.science/hal-04803333v1/document"],["SFPT — sommaire juillet-août 2024","https://sfpt-fr.org/actualites-de-la-revue/2048-therapies-sommaire-juillet-aout-2024"]],"coi":"À vérifier","fin":"Enquête académique française publiée dans la revue de la Société française de pharmacologie et de thérapeutique ; échantillon de convenance (94 répondants) — généralisation limitée."},{"dom":"Dermatologie & peau","type":"Médicament","n":4,"dt":"2025-10","titre":"Corticophobie des aidants : score TOPICOP chez des enfants avec et sans dermatite atopique","subst":"dermocorticoïdes","res":"Étude transversale thaïlandaise (Skin Health and Disease 2025;5(5):372-377) mesurant la corticophobie des aidants d'enfants atteints ou non de dermatite atopique avec le score TOPICOP : la peur des dermocorticoïdes est fréquente chez les aidants et peut compromettre l'observance (chiffres de prévalence non lisibles dans les extraits).","off":"Une crème corticoïde bien utilisée, à la dose et la durée indiquées, reste le traitement de référence de l'eczéma ; la peur des « hormones » fait souvent arrêter le traitement trop tôt — parlez-en à votre pharmacien avant de réduire.","src":[["Skin Health and Disease (OUP)","https://doi.org/10.1093/skinhd/vzaf056"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; cohorte hospitalière universitaire thaïlandaise."},{"dom":"Dermatologie & peau","type":"Officine","n":4,"dt":"2025-10","titre":"Conseil des pharmaciens communautaires sur les dermocorticoïdes dans la dermatite atopique (enquête)","subst":"dermocorticoïdes","res":"Enquête transversale multi-pays (International Journal of Pharmacy Practice 2025;33(5):501-507) : le conseil des pharmaciens porte surtout sur le mode d'administration, la fréquence et la durée ; bonne connaissance de l'unité de phalange terminale (FTU) mais rarement expliquée en pratique ; les auteurs plaident pour plus de formation sur les effets indésirables des dermocorticoïdes.","off":"À l'officine, demandez la quantité exacte à appliquer (en « bouts de doigts ») et la durée prévue : c'est la clé de l'efficacité sans risque.","src":[["Int J Pharm Pract (OUP)","https://academic.oup.com/ijpp/article/33/5/501/8184499"],["PubMed 40607873","https://pubmed.ncbi.nlm.nih.gov/40607873/"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Médicament","n":4,"dt":"2025-04","titre":"Rechute de l'acné et nouvelle cure d'isotrétinoïne : étude de cohorte","subst":"isotrétinoïne","res":"Cohorte rétrospective (JAMA Dermatology 2025;161(4):367-374) évaluant les taux de rechute de l'acné après une première cure d'isotrétinoïne et les facteurs associés à une nouvelle cure (chiffres non lisibles dans les extraits : design décrit sans invention).","off":"L'acné peut réapparaître quelques mois après l'arrêt de l'isotrétinoïne ; c'est connu et une seconde cure peut être proposée — ne reprenez jamais ce médicament sans avis médical (grossesse strictement interdite).","src":[["JAMA Dermatology","https://jamanetwork.com/journals/jamadermatology/fullarticle/2829255"]],"coi":"À vérifier","fin":"Cohorte américaine sur données de santé réelles ; financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Médicament","n":2,"dt":"2025-09","titre":"Émollients pour prévenir l'eczéma du nourrisson : essai randomisé (consortium CASCADE)","subst":"émollients","res":"ECR américain (JAMA Dermatology 2025;161(9):957-965) chez des nourrissons NON sélectionnés sur risque : l'application quotidienne d'émollient sur tout le corps dès l'âge de 9 semaines réduit significativement l'incidence cumulée de dermatite atopique à 24 mois, d'après les synopses publiés (AAP Grand Rounds, novembre 2025).","off":"Hydrater la peau de votre bébé tous les jours dès les premières semaines avec un émollient simple, sans parfum, peut réduire le risque d'eczéma.","src":[["JAMA Dermatology","https://jamanetwork.com/journals/jamadermatology/fullarticle/2836819"],["AAP Grand Rounds","https://publications.aap.org/aapgrandrounds/article-abstract/54/5/53/205262/Emollients-to-Prevent-Atopic-Dermatitis"]],"coi":"À vérifier","fin":"Essai académique américain (OHSU et consorts) ; financement non lisible dans les extraits."},{"dom":"Dermatologie & peau","type":"Alerte","n":4,"dt":"2024-04","titre":"Effets indésirables des cosmétiques en vie réelle : plaidoyer pour la cosmétovigilance","subst":"cosmétovigilance","res":"Étude observationnelle (Drug Research 2024;74(4):164-170) : la majorité des réactions signalées concernent le savon (21 %) puis le shampoing (17 %) ; différence statistiquement significative entre sexes pour les soins de la peau ; les auteurs appellent à une large diffusion de la cosmétovigilance et à la déclaration communautaire des effets indésirables des cosmétiques.","off":"Une rougeur, démangeaison ou irritation après un produit cosmétique doit être signalée (en France : nutrivigilance/cosmétovigilance via ANSM ou votre pharmacien) et le produit arrêté.","src":[["Drug Research (Thieme)","https://www.thieme-connect.de/products/ejournals/abstract/10.1055/a-2251-6655"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; enquête communautaire indienne."},{"dom":"Pédiatrie officinale","type":"Médicament","n":1,"dt":"2024-10","titre":"Paracétamol + ibuprofène vs monothérapie dans la fièvre de l'enfant : méta-analyse en réseau","subst":"paracétamol + ibuprofène","res":"NMA de 31 ECR (5 009 enfants ; Pediatrics 2024;154(4):e2023065390) : l'association ibuprofène + paracétamol en une prise réduit davantage la fièvre à court terme que chaque molécule seule (NNT 3-4 pour le bénéfice à court terme selon l'AFP POEM 2025 ;111(5):474) ; le bénéfice porte sur la température à court terme, pas sur l'inconfort ni la sécurité au long cours, qui restent mal évalués.","off":"Faire baisser le nombre sur le thermomètre n'est pas un objectif en soi : on traite surtout l'inconfort de l'enfant ; en cas de fièvre mal tolérée, l'association ponctuelle peut être plus efficace, à doses exactes et sans jamais multiplier les prises sans avis.","src":[["Pediatrics (AAP)","https://publications.aap.org/pediatrics/article/154/4/e2023065390/199451/Short-term-Dual-Therapy-or-Mono-Therapy-With"],["AFP POEM","https://www.aafp.org/pubs/afp/issues/2025/0500/poems-fever-in-children.html"]],"coi":"À vérifier","fin":"NMA académique ; financement non lisible dans les extraits ; bénéfice limité au court terme."},{"dom":"Pédiatrie officinale","type":"Médicament","n":4,"dt":"2025-12","titre":"Abstention surveillée (« watchful waiting ») de l'otite moyenne aiguë de l'enfant en pratique réelle","subst":"antibiothérapie (otite moyenne aiguë)","res":"Étude de pratique réelle multicentrique (Journal of the Pediatric Infectious Diseases Society 2025;14(12):piaf104, réseau DISPEAR) : sur 140 579 consultations pédiatriques pour otite moyenne aiguë, l'abstention surveillée (prescription différée) a été utilisée dans 15,6 % des cas et était associée à des taux d'échec de traitement faibles et comparables à ceux traités d'emblée.","off":"Beaucoup d'otites guérissent sans antibiotique : le médecin peut proposer d'attendre 48-72 h avec un traitement de la douleur ; l'antibiotique n'est pas automatique.","src":[["J Pediatr Infect Dis Soc (OUP)","https://academic.oup.com/jpids/article/14/12/piaf104/8321658"]],"coi":"À vérifier","fin":"Réseau de recherche américain sur données réelles ; financement non lisible dans les extraits."},{"dom":"Pédiatrie officinale","type":"Médicament","n":3,"dt":"2024-09","titre":"Gouttes nasales de sérum salin hypertonique dans le rhume du jeune enfant : essai ELVIS-Kids","subst":"sérum salin hypertonique nasal","res":"ECR britannique (présenté au congrès ERS, Vienne, 8 septembre 2024) chez des enfants de 0-6 ans avec infection respiratoire : les gouttes nasales de sérum hypertonique à 2,6 % raccourcissent la durée du rhume d'environ 2 jours et réduisent la transmission intrafamiliale (résultats de congrès ; publication journal à confirmer avant citation définitive).","off":"Quelques gouttes de sérum salin dans le nez, plusieurs fois par jour dès les premiers symptômes, peuvent raccourcir le rhume du tout-petit : simple, peu coûteux et sans danger.","src":[["ERS (communiqué)","https://www.ersnet.org/news-and-features/news/saline-nasal-drops-reduce-the-duration-of-the-common-cold-in-young-children-by-two-days/"],["ERJ Abstract OA1985","https://publications.ersnet.org/content/erj/64/suppl68/oa1985"]],"coi":"Indépendant","fin":"Essai académique présenté à l'ERS ; résultats de congrès donc à confirmer par la publication finale."},{"dom":"Ophtalmologie","type":"Complément alimentaire","n":4,"dt":"2025-01","titre":"AREDS2 : antioxydants oraux et lutéine/zéaxanthine ralentissent la progression de l'atrophie géographique vers la fovéa","subst":"AREDS2 (lutéine, zéaxanthine, antioxydants, zinc)","res":"Analyse des cohortes AREDS/AREDS2 (Ophthalmology 2025;132(1):14-29, NIH) : chez les yeux présentant une atrophie géographique non centrale, la progression vers le centre de la macula était plus lente sous antioxydants oraux (≈ 36 % de différence dans AREDS) et, dans AREDS2, sous lutéine/zéaxanthin (formule sans bêta-carotène) ; bénéfice observé à un stade avancé de DMLA sèche.","off":"Dans certaines formes avancées de DMLA sèche, la formule de vitamines AREDS2 (sans bêta-carotène) peut ralentir l'extension de la lésion — elle ne guérit pas et ne sert pas à titre préventif ; l'avis de l'ophtalmologiste prime.","src":[["Ophthalmology (AAO)","https://www.aaojournal.org/article/S0161-6420(24)00425-1/fulltext"],["UW Ophthalmology scan","https://www.ophth.wisc.edu/blog/2025/01/01/oral-antioxidant-and-lutein-zeaxanthin-supplements-slow-geographic-atrophy-progression-to-the-fovea-in-age-related-macular-degeneration/"]],"coi":"Indépendant","fin":"Analyse des essais publics du National Eye Institute (NIH) ; pas de financement industriel signalé."},{"dom":"ORL & stomatologie","type":"Médicament","n":5,"dt":"2025-01","titre":"Traitements de la stomatite aphteuse récurrente : revue de la littérature (2013-2023)","subst":"aphtes (traitements topiques)","res":"Revue narrative des ECR des 10 dernières années (Dentistry Journal 2025;13(2):66, publié le 31 janvier 2025) : aucun traitement ne guérit les aphtes récurrents ; les options visent la douleur et la cicatrisation (corticoïdes topiques, antiseptiques, laser notamment), avec des niveaux de preuve hétérogènes.","off":"Les aphtes guérissent spontanément ; les bains de bouche et gels anesthésiques soulagent en attendant. Des aphtes très fréquents ou atypiques doivent faire consulter.","src":[["Dentistry Journal (MDPI)","https://www.mdpi.com/2304-6767/13/2/66"]],"coi":"À vérifier","fin":"Revue narrative italienne ; financement non lisible dans les extraits."},{"dom":"ORL & stomatologie","type":"Médicament","n":5,"dt":"2026-02","titre":"Avancées dans le traitement de la stomatite aphteuse récurrente : médicaments, phytothérapie et nouveaux vecteurs","subst":"aphtes (traitements topiques)","res":"Revue (Frontiers in Pharmacology, publiée le 13 février 2026) sur les traitements pharmacologiques de synthèse, naturels et les systèmes d'administration novateurs (vecteurs locaux) des aphtes récurrents ; pas de thérapie définitive, la recherche se concentre sur l'analgésie et la cicatrisation locale.","off":"Pour les aphtes à répétition, des pansements locaux et gels adaptés peuvent raccourcir la douleur ; aucune piste ne supprime définitivement les poussées pour l'instant.","src":[["Frontiers in Pharmacology","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1715554/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; revue chinoise à comité de lecture."},{"dom":"ORL & stomatologie","type":"Médicament","n":3,"dt":"2025-12","titre":"Bain de bouche à base de plantes vs chlorhexidine dans la gingivite expérimentale (cross-over)","subst":"chlorhexidine vs bain de bouche à base de plantes","res":"ECR en cross-over (Dentistry Journal 2025;13(12):608, University of Iowa) comparant un bain de bouche/rinçage à base de plantes (StellaLife) à la chlorhexidine dans un modèle de gingivite expérimentale, avec mesures des indices gingival et de plaque ; l'objectif est une alternative à la chlorhexidine sans coloration dentaire ni altération du goût (résultats chiffrés non lisibles dans les extraits : design décrit sans invention).","off":"La chlorhexidine reste le bain de bouche de référence, mais elle tache les dents et altère le goût à long terme ; des alternatives existent pour un usage prolongé — demandez conseil à votre pharmacien ou dentiste.","src":[["Dentistry Journal (MDPI)","https://www.mdpi.com/2304-6767/13/12/608"]],"coi":"À vérifier","fin":"Étude universitaire ; le produit testé est commercialisé, indépendance à vérifier dans le texte intégral."},{"dom":"ORL & stomatologie","type":"Médicament","n":3,"dt":"2025-01","titre":"Chlorhexidine + vitamine C en bain de bouche en parodontite non chirurgicale : ECR","subst":"chlorhexidine + vitamine C","res":"ECR turc (Scientific Reports 2025;15:3703, Gazi University) comparant un bain de bouche chlorhexidine + vitamine C à la chlorhexidine seule et à des bains antiseptiques à base de phénol sur l'accumulation de plaque et la gingivite en parodontologie non chirurgicale (résultats chiffrés non lisibles dans les extraits : design décrit sans invention).","off":"Les bains de bouche antiseptiques ne remplacent ni le brossage ni le détartrage ; au comptoir, préférez des durées courtes et demandez conseil si vous avez la gorge ou les gencives sensibles.","src":[["Scientific Reports","https://www.nature.com/articles/s41598-025-88100-6"],["ResearchGate (janvier 2025)","https://www.researchgate.net/publication/388497093_Evaluating_the_effects_of_chlorhexidine_and_vitamin_c_mouthwash_on_oral_health_in_non-surgical_periodontal_therapy_a_randomized_controlled_clinical_trial"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; date de publication (janvier 2025) vérifiée via la fiche ResearchGate, à recouper sur la page Nature à l'injection."},{"dom":"Seniors & polymédication","type":"Officine","n":4,"dt":"2024-07","titre":"Pharmacien « chutes » en communauté : impact sur l'optimisation des médicaments des personnes âgées à risque de chute","subst":"FRIDs (falls risk-increasing drugs)","res":"Étude quantitative nord-irlandaise (BMC Geriatrics 2024;24:604, publiée le 23 juillet 2024 selon The Pharmaceutical Journal) : le rôle de pharmacien dédié aux chutes augmente la pertinence des prescriptions chez les patients âchés à risque de chute et apparaît comme un moyen efficace et coût-efficace d'optimiser les médicaments dans cette population ; ciblage des FRIDs (médicaments augmentant le risque de chute) et de la charge anticholinergique.","off":"Certains somnifères, antidépresseurs ou antalgiques peuvent augmenter le risque de chute : votre pharmacien peut relire votre ordonnance avec vous et en parler à votre médecin.","src":[["BMC Geriatrics (Springer)","https://link.springer.com/article/10.1186/s12877-024-05189-6"],["The Pharmaceutical Journal","https://pharmaceutical-journal.com/article/news/a-community-falls-pharmacist-is-effective-and-cost-efficient-in-optimising-medicines-among-older-patients-study-results-suggest"]],"coi":"À vérifier","fin":"Étude académique (Queen's University Belfast) ; financement non lisible dans les extraits."},{"dom":"Seniors & polymédication","type":"Médicament","n":1,"dt":"2025-05","titre":"Déprescription chez les personnes âgées vivant à domicile : revue systématique et méta-analyse d'ECR","subst":"déprescription","res":"SR/MA d'essais randomisés (JAMA Network Open 2025;8(5):e259375, 8 mai 2025) : les interventions de déprescription réduisent le nombre de médicaments et de médicaments potentiellement inappropriés chez les personnes âgées vivant à domicile (chiffres d'efficacité non lisibles dans les extraits : bénéfice documenté sur les critères médicamenteux).","off":"Réduire ou arrêter un médicament devenu inutile est parfois le meilleur traitement : cela se fait toujours progressivement et avec l'accord du médecin et du pharmacien.","src":[["JAMA Network Open","https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2833713"],["LWW citation","https://journals.lww.com/02093599-202505000-00059"]],"coi":"À vérifier","fin":"Méta-analyse académique ; financement non lisible dans les extraits."},{"dom":"Seniors & polymédication","type":"Alerte","n":5,"dt":"2025-06","titre":"IATROPREV 2 : expérimentation article 51 contre l'iatrogénie médicamenteuse de la personne âgée (arrêté du 3 juin 2025)","subst":"IATROPREV 2 (iatrogénie, parcours de soins)","res":"Arrêté du 3 juin 2025 (Légifrance) lançant la phase 2 de l'expérimentation IATROPREV : optimisation des prescriptions médicamenteuses dans le parcours de soins de la personne âgée polymédiquée ou à risque iatrogénique, initiée pendant le séjour hospitalier et prolongée en ville (dont officines), dans l'objectif de réduire le risque iatrogène ; expérimentation inter-régions avec cahier des charges ministériel.","off":"Après une hospitalisation, votre liste de médicaments mérite d'être reprise : n'hésitez pas à demander un point médication à votre pharmacien, surtout si vous prenez beaucoup de médicaments.","src":[["Légifrance (arrêté du 3 juin 2025)","https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000051773440"],["Cahier des charges IATROPREV 2","https://www.ebola.sante.gouv.fr/IMG/pdf/iatroprev_2_cahier_des_charges_juin_2025.pdf"],["Geroscopie","https://www.geroscopie.fr/l-experimentation-iatroprev-2-lancee-dans-quatre-regions-idm-43-ids-33404"]],"coi":"Indépendant","fin":"Dispositif public français (ministère de la Santé, expérimentation article 51)."},{"dom":"Santé du voyageur","type":"Alerte","n":5,"dt":"2026-11","titre":"Vaccination du voyageur : élargissement aux pharmaciens à l'étude — la ministre saisit la HAS (lettre de cadrage)","subst":"vaccination du voyageur (pharmacien)","res":"Actualité de novembre 2026 (AFP, 4 novembre) : la ministre de la Santé Stéphanie Rist a saisi la HAS via une lettre de cadrage pour évaluer « l'opportunité d'étendre les compétences vaccinales » des pharmaciens (et infirmiers, sages-femmes) aux vaccinations recommandées pour les voyages à l'étranger ; le syndicat USPO plaide pour prescrire et administrer les vaccins du voyageur et prescrire les traitements de prévention du paludisme ; recommandations HAS attendues d'ici fin 2027, selon Egora et Le Pharmacien de France ; un sondage rapporte 76 % de Français favorables (Moniteur des pharmacies).","off":"Pour un voyage à l'étranger, pensez aux vaccins et à la prévention du paludisme plusieurs semaines avant le départ : demandez conseil dès la réservation — d'ici 2027, votre pharmacien pourra probablement s'en occuper directement.","src":[["AFP (4 nov. 2026)","news-afp-20261104-23fbc2a7"],["Egora","https://www.egora.fr/actus-pro/acces-aux-soins/confier-la-vaccination-des-voyageurs-aux-pharmaciens-la-ministre-saisit"],["Le Pharmacien de France","https://lepharmaciendefrance.fr/bientot-la-vaccination-du-voyageur-en-officine/"],["Le Moniteur des pharmacies","https://www.lemoniteurdespharmacies.fr/nouvelles-missions/vaccination/vaccination-du-voyage-76-des-francais-prets-a-passer-par-leur-pharmacien"]],"coi":"Indépendant","fin":"Actualité professionnelle et institutionnelle (AFP, HAS, syndicats) ; pas de financement privé en jeu."},{"dom":"Allergologie","type":"Médicament","n":1,"dt":"2025-06","titre":"Immunothérapie sublinguale en gouttes (index de réactivité) dans la rhinoconjonctivite allergique : revue systématique et méta-analyse","subst":"immunothérapie sublinguale (SLIT)","res":"SR/MA d'études randomisées (Frontiers in Allergy 2025;6:1597003, publié le 5 juin 2025) sur la SLIT liquide indexée en réactivité dans la rhinoconjonctivite allergique : synthèse des données d'efficacité et de sécurité de la voie sublinguale en gouttes (chiffres non lisibles dans les extraits : design synthétisé sans invention).","off":"Les gouttes sous la langue contre les allergies agissent comme un « entraînement » du système immunitaire : c'est un traitement de fond de plusieurs mois, à prendre régulièrement, pas un médicament de crise.","src":[["Frontiers in Allergy","https://www.frontiersin.org/journals/allergy/articles/10.3389/falgy.2025.1597003/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; revue à comité de lecture ouverte."},{"dom":"Allergologie","type":"Médicament","n":5,"dt":"2026-09","titre":"Immunothérapie allergénique sublinguale : synthèse des preuves d'essais randomisés, études de vie réelle et méta-analyses","subst":"immunothérapie sublinguale (SLIT)","res":"Revue (Frontiers in Allergy 2026;7:1940709, publié le 14 septembre 2026, topic « Real-World Evidence and Digital Tools for Optimising Allergen Immunotherapy Outcomes ») : la SLIT a démontré une efficacité et un profil de sécurité favorable dans l'allergie respiratoire IgE-dépendante ; la revue fait le point sur les données d'essais randomisés, de vie réelle et les outils numériques d'optimisation de l'observance.","off":"Le comprimé ou les gouttes contre l'allergie doit être pris chaque jour, sans oubli, pendant toute la durée prescrite (souvent plusieurs années) pour être efficace : les rappels sur téléphone aident.","src":[["Frontiers in Allergy","https://www.frontiersin.org/journals/allergy/articles/10.3389/falgy.2026.1940709/full"]],"coi":"À vérifier","fin":"Revue à comité de lecture ouverte ; financement non lisible dans les extraits (topic partiellement soutenu par l'industrie en immunothérapie : à vérifier dans le texte intégral)."},{"dom":"Urologie & santé masculine","type":"Médicament","n":2,"dt":"2026-02","titre":"Dutastéride + tadalafil en association fixe vs monothérapies dans l'HBP : essai randomisé de phase III","subst":"dutastéride + tadalafil (HBP)","res":"ECR multicentrique coréen de phase 3 (BJU International, publié en février 2026, doi 10.1111/bju.70163) : patients randomisés (1:1:1) vers dutastéride 0,5 mg + tadalafil 5 mg en association fixe, dutastéride seul ou tadalafil seul pendant 48 semaines, stratification sur le score IPSS initial ; critères : symptômes du bas appareil urinaire et débit urinaire maximum (résultats détaillés non lisibles dans les extraits : design décrit sans invention).","off":"Pour la prostate, il existe des traitements qui soulagent vite et d'autres qui réduisent le volume sur plusieurs mois : ils peuvent être combinés — ne changez jamais la prise de votre heure (tadalafil à heure fixe) sans avis médical.","src":[["BJU International (Wiley)","https://bjui-journals.onlinelibrary.wiley.com/doi/10.1111/bju.70163"],["ResearchGate (février 2026)","https://www.researchgate.net/publication/400651473_Combined_therapy_with_dutasteride_and_tadalafil_vs_dutasteride_or_tadalafil_monotherapy_in_benign_prostatic_hyperplasia_a_randomised_phase_III_trial"]],"coi":"À vérifier","fin":"Essai académique multicentrique coréen ; financement non lisible dans les extraits."},{"dom":"Urologie & santé masculine","type":"Officine","n":1,"dt":"2025-05","titre":"Incontinence urinaire de la personne âgée fragile : prise en charge conservatrice non médicamenteuse (SR/MA)","subst":"incontinence urinaire (soins conservateurs)","res":"SR/MA d'ECR (PLOS ONE 2025;20(5):e0322742, publié le 14 mai 2025) sur les interventions conservatrices non pharmacologiques de l'incontinence urinaire chez les personnes âgées vivant avec de la fragilité : rééducation périnéale, modifications comportementales et prise en charge globale, très fréquentes dans cette population à haut risque d'institutionnalisation (chiffres d'effet non lisibles dans les extraits : design décrit sans invention).","off":"Les fuites urinaires ne sont pas une fatalité de l'âge : des exercices de périnée et de simples habitudes (boire sans excès, aller aux toilettes à heures régulières) peuvent nettement améliorer le quotidien — parlez-en sans gêne à votre pharmacien.","src":[["PLOS ONE","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0322742"],["PDF PLOS (14 mai 2025)","https://journals.plos.org/plosone/article/file?id=10.1371%2Fjournal.pone.0322742&type=printable"]],"coi":"À vérifier","fin":"Synthèse académique australienne ; financement non lisible dans les extraits."},{"dom":"Urologie & santé masculine","type":"Officine","n":1,"dt":"2025-05","titre":"Prise en charge conservatrice moderne de l'incontinence urinaire d'effort féminine : revue systématique","subst":"incontinence urinaire d'effort (traitement conservateur)","res":"Revue systématique (Journal of Clinical Medicine 2025;14(10):3268) des traitements non chirurgicaux de l'incontinence urinaire d'effort féminine : rééducation périnéale en première intention, dispositifs et stratégies conservatrices, avec hétérogénéité méthodologique des études relevée par les auteurs (chiffres non lisibles dans les extraits : design synthétisé sans invention).","off":"Avant d'envisager la chirurgie, la rééducation du périnée (souvent avec kinésithérapeute) est la première étape contre les fuites à l'effort.","src":[["Journal of Clinical Medicine (MDPI)","https://doi.org/10.3390/jcm14103268"],["PMC","https://pmc.ncbi.nlm.nih.gov/articles/PMC12112232/"]],"coi":"À vérifier","fin":"Revue académique roumaine ; financement non lisible dans les extraits."},{"dom":"Gynécologie & Ménopause","type":"Alerte","n":4,"dt":"2026-06","titre":"THM en France : près de 500 000 femmes traitées en 2025, une hausse depuis 2022 (étude EPI-PHARE)","subst":"traitement hormonal de la ménopause (THM)","res":"Étude pharmaco-épidémiologique française (rapport EPI-PHARE GIS ANSM-Cnam, publié le 25 juin 2026 sur ansm.sante.fr) sur l'utilisation du THM entre 2012 et 2025 : diminution continue du nombre d'utilisatrices entre 2012 et 2022, puis hausse ; près de 500 000 femmes traitées en 2025 ; la HAS a confirmé en 2025 la place du THM dans les troubles climatériques modérés à sévères et la prévention de l'ostéoporose chez les femmes à risque fracturaire, avec réévaluation a minima annuelle.","off":"Le traitement hormonal de la ménopause connaît un regain d'intérêt en France : il est réservé aux troubles gênants du climatère ou à la prévention de l'ostéoporose, à réévaluer chaque année avec le médecin.","src":[["ANSM (actualité + rapport)","https://ansm.sante.fr/actualites/traitement-hormonal-de-la-menopause-pres-de-500-000-femmes-traitees-en-2025-une-hausse-des-utilisations-depuis-2022"],["Rapport EPI-PHARE (PDF, 25/06/2026)","https://ansm.sante.fr/uploads/2026/06/25/20260625-thm-rapport-epiphare.pdf"],["EPI-PHARE","https://www.epi-phare.fr/actualites/thm-utilisation/"]],"coi":"Indépendant","fin":"Étude publique du GIS EPI-PHARE (ANSM-Cnam) sur données du SNIIRAM ; pas de financement privé."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":4,"dt":"2026-03","titre":"Pratiques de prescription du THM en France en 2025 : enquête nationale MENOPRAT","subst":"traitement hormonal de la ménopause (pratiques de prescription)","res":"Enquête nationale en ligne auprès de gynécologues français (Maturitas 2026;208:108923, mars 2026, doi 10.1016/j.maturitas.2026.108923) : un gynécologue sur quatre n'offre pas systématiquement le THM en première intention pour les troubles vasomoteurs modérés à sévères ; écart persistant entre recommandations et pratique réelle ; principaux freins : hésitation des patientes et craintes des médecins sur cancer du sein et risque cardiovasculaire ; les gynécologues restent les premiers prescripteurs (57 % des premières prescriptions chez les femmes de plus de 45 ans).","off":"Le traitement de la ménopause se discute : les bénéfices et risques dépendent de votre âge, de vos antécédents et de l'intensité des symptômes — c'est une décision partagée avec le médecin.","src":[["Maturitas (ScienceDirect)","https://www.sciencedirect.com/science/article/abs/pii/S0378512226001003"],["PubMed 41886876","https://pubmed.ncbi.nlm.nih.gov/41886876/"]],"coi":"À vérifier","fin":"Enquête académique française ; financement non lisible dans les extraits."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":1,"dt":"2025-12","titre":"THM et risque de troubles cognitifs légers ou de démence : revue systématique et méta-analyse (Lancet Healthy Longevity, commanditée par l'OMS)","subst":"traitement hormonal de la ménopause (THM, démence)","res":"SR/MA d'études primaires 2000-2025 (The Lancet Healthy Longevity, décembre 2025, doi 10.1016/j.lanhl.2025.00122, commanditée par l'OMS, UCL) : les données ne montrent pas d'impact du THM sur le risque de troubles cognitifs légers ou de démence ; l'étude clarifie un sujet longtemps débattu et renforce les recommandations cliniques actuelles fondées sur les symptômes.","off":"D'après la synthèse la plus récente, le traitement hormonal de la ménopause ne semble pas augmenter le risque de troubles de la mémoire ou de démence.","src":[["The Lancet Healthy Longevity","https://www.thelancet.com/journals/lanhl/article/PIIS2666-7568(25)00122-9/fulltext"],["PubMed 41448220","https://pubmed.ncbi.nlm.nih.gov/41448220/"],["Medical Xpress (déc. 2025)","https://medicalxpress.com/news/2025-12-menopause-hormone-therapy-impact-dementia.html"]],"coi":"Indépendant","fin":"Synthèse commanditée par l'OMS (University College London) ; étude observationnelle, hypothèses de confusion résiduelles possibles."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":5,"dt":"2025-12","titre":"Recommandations et messages clés de la Société internationale de la ménopause (IMS) sur la santé de la mi-vie et la ménopause","subst":"traitement hormonal de la ménopause (recommandations IMS)","res":"Recommandations de la International Menopause Society (Climacteric 2026;29(6):634-656, publiée en ligne le 23 décembre 2025, doi 10.1080/13697137.2025.2585487) : synthèse systématique de la littérature sur la santé de la mi-vie, avec messages clés pratiques sur le THM (indications, fenêtre thérapeutique, durée, alternatives non hormonales).","off":"Des recommandations internationales récentes font le point sur la ménopause : il existe aussi des alternatives non hormonales selon votre situation.","src":[["Climacteric (Taylor & Francis)","https://www.tandfonline.com/doi/full/10.1080/13697137.2025.2585487"]],"coi":"Indépendant","fin":"Recommandations d'une société savante internationale, à comité de lecture ; liens industriels des auteurs déclarés dans le texte (pratique déclarative standard)."},{"dom":"Gynécologie & Ménopause","type":"Alerte","n":5,"dt":"2024-01","titre":"Endométriose à diagnostic complexe : la HAS propose l'accès au test salivaire Endotest® via le forfait innovation","subst":"Endotest (endométriose, diagnostic)","res":"Communiqué HAS du 8 janvier 2024 : pour les formes complexes d'endométriose, la HAS propose un accès au test salivaire Endotest® dans le cadre du forfait innovation ; environ 2 millions de femmes adultes en France sont susceptibles de se demander si une endométriose est à l'origine de leurs douleurs pelviennes chroniques, maladie responsable d'infertilité et souvent diagnostiquée tardivement.","off":"Des douleurs de règles intenses ou chroniques ne sont pas normales : parlez-en, un diagnostic d'endométriose peut prendre du temps mais il existe maintenant des outils pour l'aider.","src":[["HAS (communiqué du 8 janv. 2024)","https://www.has-sante.fr/jcms/p_3487378/fr/diagnostic-complexe-d-endometriose-la-has-propose-un-acces-au-test-salivaire-endotest-dans-le-cadre-du-forfait-innovation"]],"coi":"Mixte","fin":"Décision d'autorité publique (HAS) sur un test développé par un laboratoire privé : évaluation indépendante du dispositif."},{"dom":"Gynécologie & Ménopause","type":"Officine","n":5,"dt":"2026-10","titre":"Ménopause : « des jalons pour une meilleure prise en charge en France » (annonce ministérielle, Paris Santé Campus)","subst":"ménopause (parcours de soins, France)","res":"Actualité AFP du 15 octobre 2026 : la ministre de la Santé Stéphanie Rist a dévoilé à Paris Santé Campus des « jalons pour une meilleure prise en charge » de la ménopause en France — information plus accessible, parcours plus organisé, responsabilité collective ; la ministre a jugé que la réponse « dépend trop souvent de la capacité de chaque femme de se débrouiller seule », la ménopause restant « un impensé collectif ».","off":"La France prépare un vrai parcours pour la ménopause : information accessible et médecins formés — les conseils à l'officine ont toute leur place.","src":[["AFP (15 oct. 2026)","news-afp-20261015-06814256"]],"coi":"Indépendant","fin":"Actualité institutionnelle française ; pas de financement privé en jeu."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":5,"dt":"2026-10","titre":"Prise en charge du diabète de type 2 : rapport de consensus ADA/EASD 2026","subst":"diabète de type 2 (consensus ADA/EASD 2026)","res":"Rapport de consensus ADA/EASD publié dans Diabetologia (octobre 2026, doi 10.1007/s00125-026-06855-7, présenté à l'EASD 2026 à Milan) : iSGLT2 et/ou agoniste GLP-1 envisageables dès le diagnostic, metformine n'est plus l'étape obligatoire, le poids devient aussi essentiel que la glycémie, finérénone en troisième couche dans l'insuffisance rénale albuminurique — mise à jour du consensus publié depuis 2006 et actualisé pour la dernière fois en 2022.","off":"Le traitement du diabète de type 2 commence à changer : les nouveaux médicaments protègent aussi le cœur et les reins, et la perte de poids fait partie des objectifs.","src":[["Diabetologia (Springer)","https://link.springer.com/article/10.1007/s00125-026-06855-7"],["GP Cardio (2 oct. 2026)","https://gpcardio.org/en/2026-10-02_ada-easd-2026-consensus-on-type-2-diabetes/"],["ADA (communiqué)","https://diabetes.org/newsroom/press-releases/leading-diabetes-organizations-publish-joint-consensus-report-management"]],"coi":"Mixte","fin":"Consensus des sociétés savantes ADA/EASD ; conflits d'intérêts des panélistes déclarés (industrie des antidiabétiques, pratique déclarative standard)."},{"dom":"Diabète & Endocrinologie","type":"Officine","n":5,"dt":"2026-10","titre":"Entretien « diabète » en officine : la HAS valide le guide d'accompagnement pharmaceutique sous réserve (déploiement 2027)","subst":"entretien pharmaceutique diabète type 2","res":"Avis HAS du 8 octobre 2026 (rapporté par Pharmactu et Concours pluripro) : favorable sous réserve au guide d'accompagnement pharmaceutique des patients diabétiques de type 2 et à la fiche de suivi, prévus par un avenant à la convention pharmaceutique — trois entretiens, sept thématiques (dont santé mentale et autosoins), avec de nombreuses réserves sur le contenu et le périmètre ; déploiement opérationnel en officine courant 2027 après finalisation et fixation de la rémunération.","off":"Un accompagnement régulier par votre pharmacien pour le diabète se prépare pour 2027 : en attendant, tout doute sur vos traitements ou votre glycémie se discute au comptoir.","src":[["Pharmactu","https://pharmactu.fr/articles/entretien-diabete-type-2-officine-avis-has-avenant-2027"],["HAS (saisine)","https://www.has-sante.fr/jcms/p_4579272/fr/reponse-a-la-saisine-de-l-assurance-maladie-guide-d-accompagnement-pharmaceutique-des-patients-diabetiques-de-type-2-et-fiches-de-suivi-patient"],["Concours pluripro","https://www.concourspluripro.fr/exercice-pluriprofessionnel/metiers/diabete-de-type-2-la-has-favorable-un-accompagnement-du-pharmacien"]],"coi":"Indépendant","fin":"Décision d'autorité publique française (HAS, Assurance maladie) ; pas de financement privé."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-04","titre":"HMB et masse musculaire après 50 ans : méta-analyse","subst":"HMB","res":"Méta-analyse (Frontiers in Nutrition, 3 avril 2025) sur la supplémentation orale en HMB chez les plus de 50 ans : gain de force significatif (WMD +1,56 kg, IC95 % 0,03-3,09, p=0,05) et de masse maigre (+0,28 kg, p=0,01) sur 13 études, effets modestes.","off":"Le HMB peut apporter un petit gain musculaire après 50 ans, surtout associé à un entraînement en résistance ; il ne remplace ni les protéines ni l'exercice.","src":[["Frontiers in Nutrition","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1522287/full"],["PMC","https://pmc.ncbi.nlm.nih.gov/articles/PMC12003145/"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; effets significatifs mais de faible amplitude et hétérogènes."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2024-05","titre":"Quercétine et syndrome métabolique : méta dose-réponse de 20 ECR","subst":"quercétine","res":"Méta-analyse dose-réponse (Clinical Nutrition, mai 2024) de 20 ECR (1 164 participants) : la quercétine réduit la glycémie à jeun et la pression artérielle systolique ; pas d'effet poolé sur triglycérides ni HDL ; effet glycémique lié à la durée d'intervention.","off":"La quercétine montre des effets modestes sur la glycémie et la tension dans le syndrome métabolique ; ce n'est pas un traitement, mais un appoint possible à discuter.","src":[["Clinical Nutrition (ScienceDirect)","https://www.sciencedirect.com/science/article/pii/S1756464624001774"],["ResearchGate","https://www.researchgate.net/publication/380255520_The_effect_of_quercetin_supplementation_on_the_components_of_metabolic_syndrome_in_adults_A_systematic_review_and_dose-response_meta-analysis_of_randomized_controlled_trials"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; revue systématique d'ECR, effets modestes."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-08","titre":"Fer oral : un jour sur deux vs quotidien dans l'anémie ferriprive","subst":"fer","res":"Revue systématique et méta-analyse (BMC Pharmacology and Toxicology, 21 août 2025 ; 26(1):152) comparant fer oral quotidien vs un jour sur deux dans l'anémie ferriprive en population générale : l'administration espacée est une alternative discutée, l'efficacité et la tolérance étant comparées par ECR.","off":"Prendre son fer un jour sur deux peut être une option aussi efficace et parfois mieux tolérée : à valider avec votre médecin ou pharmacien, sans changer seul votre traitement.","src":[["BMC Pharmacology and Toxicology (Springer)","https://link.springer.com/article/10.1186/s40360-025-00984-2"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; conclusion d'équivalence d'efficacité à manier avec nuance (efficacité et tolérance selon les sous-groupes)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-05","titre":"Dose et durée optimales du fer chez l'enfant carencé","subst":"fer","res":"Revue systématique et méta-analyse (PLOS One, 6 mai 2026) sur la dose et la durée optimales de supplémentation en fer dans l'anémie ferriprive de l'enfant et de l'adolescent (≤ 19 ans), pour améliorer l'hémoglobine.","off":"Chez l'enfant carencé, la dose et la durée de fer se calculent : pas de cure au hasard, votre pharmacien peut expliquer la posologie prescrite.","src":[["PLOS One","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0319068"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; résultats chiffrés non listés dans les extraits → design décrit sans inventer les doses optimales."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-11","titre":"Fer et santé mentale : méta-analyse chez les non-anémiques","subst":"fer","res":"Méta-analyse (Neuroscience & Biobehavioral Reviews, nov. 2025 ; 178:106372) : la supplémentation en fer chez enfants, adolescents et adultes menstrués NON anémiques mais carencés pourrait améliorer symptômes psychiatriques, intelligence et mémoire à court terme ; bénéfice moindre sans carence martiale avérée.","off":"Une fatigue ou une humeur basse avec des règles abondantes peut évoquer une carence en fer sans anémie : u ents","type":"Complément alimentaire","n":1,"dt":"2025-09","titre":"L-citrulline et pastèque : baisse de la tension après 50 ans","subst":"L-citrulline","res":"Méta-analyse de 15 ECR (Clinical Nutrition ESPEN, 2025 ; 69:653-664, epub sept. 2025) : la L-citrulline et le jus de pastèque abaissent globalement la pression artérielle chez l'adulte d'âge mûr et le senior ; l'association L-citrulline + L-arginine est supérieure à la L-citrulline ou à la pastèque seule (analyse en sous-groupes).","off":"La L-citrulline (on en trouve aussi dans la pastèque) peut abaisser un peu la tension ; c'est un appoint, jamais un substitut aux traitements prescrits.","src":[["Clinical Nutrition ESPEN (ScienceDirect)","https://www.sciencedirect.com/science/article/abs/pii/S2405457725028815"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40789388/"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; qualité jugée élevée (échelle JADAD) mais baisse tensionnelle modeste."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-11","titre":"Folates + B12/B6 et diabète de type 2 : méta-analyse","subst":"vitamines B","res":"Revue systématique et méta-analyse d'ECR (Frontiers in Nutrition, 28 novembre 2025) : l'acide folique combiné aux vitamines B12 et B6 influence le métabolisme de l'homocystéine chez le diabétique de type 2 ; lien discuté avec le risque de complications, sans critère clinique dur démontré.","off":"Les vitamines B font baisser l'homocystéine, un marqueur sanguin, mais leur bénéfice réel sur les complications du diabète n'est pas prouvé.","src":[["Frontiers in Nutrition","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1701310/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; effets biologiques sans événements cliniques démontrés."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-12","titre":"Vitamines B combinées et coronaropathie : homocystéine
