":1,"dt":"2025-04","titre":"Tribulus terrestris : fonction érectile et testostérone — SR des essais cliniques (Nutrients 2025;17(7):1275, publié 06/04/2025)","subst":"tribulus;testostérone;dysfonction érectile;non-efficacité","res":"SR des essais cliniques sur le Tribulus terrestris (page MDPI ouverte, PubMed vu, relais IJIR vu). Résultats lus : niveau de preuve FAIBLE pour un effet sur la fonction érectile ; AUCUNE preuve robuste d'augmentation de la testostérone. NON-EFFICACITÉ (au moins sur la testostérone).","src":[["MDPI — Nutrients 2025;17(7):1275 (Publié : 06/04/2025)","https://www.mdpi.com/2072-6643/17/7/1275"],["PubMed — 40219032","https://pubmed.ncbi.nlm.nih.gov/40219032/"],["International Journal of Impotence Research — relais","https://www.nature.com/articles/s41443-025-01086-7"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Réponse honnête au client « tribulus pour la testo » : non prouvé ; orienter vers le médecin en cas de vrai symptôme (déficit androgénique à explorer)."},{"dom":"Cardiologie","type":"Complément alimentaire","n":1,"dt":"2025-01","titre":"Compléments dans l'insuffisance veineuse chronique : pycnogénol et hydroxyéthylrutoside vs diosmine/hespéridine (Pharmaceutics 2025;17(1):59, publié 03/01/2025)","subst":"pycnogénol;jambes lourdes;IVC;rutosides","res":"Network meta-analysis des compléments dans l'insuffisance veineuse chronique vs standard diosmine/hespéridine (page MDPI ouverte, résultats lus). Résultats lus : l'hydroxyéthylrutoside (MD 38) et le pycnogénol (MD 25,30) réduisent la douleur et améliorent le flux veineux de repos vs comparateurs ; résultats moins cohérents sur l'œdème et la qualité de vie ; hétérogénéité très élevée (I²=100 %) et petits échantillons.","src":[["MDPI — Pharmaceutics 2025;17(1):59 (Publié : 03/01/2025)","https://www.mdpi.com/1999-4923/17/1/59"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les jambes lourdes, les produits standard (diosmine/hespéridine) ne sont pas les seuls à avoir des données — pycnogénol/rutosides ont un signal sur la douleur, à pondérer (qualité de preuve limitée)."},{"dom":"Cardiologie","type":"Complément alimentaire","n":5,"dt":"2026-03","titre":"Vitamine E et facteurs de risque cardiovasculaire : les ECR ne soutiennent pas le bénéfice (BMJ Supportive & Palliative Care, en ligne 02/03/2026)","subst":"vitamine E;cardio;non-efficacité","res":"Revue thématique sur la vitamine E et les facteurs de risque cardiovasculaire (BMJ Support Palliat Care, spcare-2025-005637, early online 02/03/2026 — URL vue, résumé vu, page bloquée ce soir). Résultats lus : alors que les études observationnelles suggéraient un bénéfice cardiovasculaire, les ECR « ne soutiennent pas » ce bénéfice de la vitamine E sur les facteurs de risque cardiaque. NON-EFFICACITÉ.","src":[["BMJ Supportive & Palliative Care — early online 02/03/2026","https://spcare.bmj.com/content/early/2026/03/02/spcare-2025-005637"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas d'argument pour la vitamine E « cardio » ; à réserver aux carences spécifiques (malabsorption, cholestase, prématurés)."},{"dom":"Gastro-entérologie & Hépatologie","type":"Complément alimentaire","n":1,"dt":"2025-06","titre":"Silymarine dans la stéatopathie métabolique (MASLD) : revue Cochrane — bénéfices/risques incertains (CD015524.pub2, publiée 24/06/2025)","subst":"silymarine;chardon-marie;MASLD;foie gras","res":"Revue Cochrane sur la silymarine dans la maladie du foie associée aux dysfonctions métaboliques (page cochrane.org française ouverte : « Publié 24 juin 2025 », Wang ; PubMed 40552569 vu). Résultats lus : bénéfices/risques incertains ; la silymarine semble bien tolérée ; elle améliore peut-être les enzymes hépatiques, mais avec un niveau de preuve TRÈS incertain ; pas d'argument pour un usage hors essais cliniques.","src":[["Cochrane — CD015524, Publié 24/06/2025","https://www.cochrane.org/fr/evidence/CD015524_silymarin-effective-intervention-adults-metabolic-dysfunction-associated-steatotic-liver-disease"],["PubMed — 40552569","https://pubmed.ncbi.nlm.nih.gov/40552569/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Honnêteté sur le chardon-marie et le « foie gras » — pas de miracle ; priorité aux mesures de mode de vie (perte de poids, alcool, alimentation)."},{"dom":"Pédiatrie officinale","type":"Médicament","n":1,"dt":"2025-05","titre":"Phytothérapie des infections respiratoires de l'enfant : Pelargonium sidoides (EPs 7630) documenté, échinacée insuffisante (Front Pediatr, 01/05/2025)","subst":"Pelargonium;échinacée;infections respiratoires;pédiatrie","res":"Revue systématique des phytothérapies dans les infections respiratoires hautes et basses de l'enfant (page Frontiers ouverte). Résultats lus : EPs 7630 (Pelargonium sidoides) = preuves suffisantes pour réduire sévérité et durée des AURTI/ALRTI chez l'enfant ; échinacée et autres phytothérapies = données insuffisantes/hétérogènes.","src":[["Frontiers in Pediatrics — 01/05/2025","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2025.1423250/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour la toux/rhume de l'enfant, le sirop de Pelargonium (Umckaloabo®) est mieux documenté que l'échinacée ; rappel âge minimal et dosage pédiatrique."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":3,"dt":"2025-09","titre":"Concentré de baies de ginseng et fatigue chronique : RCT (J Med Food, publié en ligne 29/09/2025 — relais HerbalGram issue 774)","subst":"ginseng;fatigue;endurance","res":"RCT en double aveugle vs placebo sur le concentré de baies de ginseng (GBC) chez des adultes avec fatigue chronique (relais HerbalGram/ABC, issue 774, page vue). Résultats lus : amélioration significative de l'endurance à l'exercice ; baisse des taux de lactate et d'ammonie. NB : essai corrigeant l'entrée écartée « ginseng rouge coréen anti-fatigue » (mois non vérifiable, ScienceDirect bloqué) ; publication primaire non directement consultable ce soir — source HerbalGram datée vue.","src":[["HerbalGram (ABC) — issue 774, relais J Med Food (published online 29/09/2025)","https://www.herbalgram.org/resources/herbclip/issues/2025/issue-774/ginseng-berry-fatigue-physical-activity-chronic-fatigue"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Option fatigue/énergie plausible mais essai unique industriel probable ; à ranger dans les pistes, pas les certitudes."},{"dom":"Gynécologie","type":"Complément alimentaire","n":1,"dt":"2026-02","titre":"Inositol dans le SOPK : umbrella review de méta-analyses d'ECR (Front Endocrinol, publié 11/02/2026)","subst":"inositol;SOPK;ovulation;insulino-résistance","res":"Umbrella review intégrant les méta-analyses d'ECR sur l'inositol dans le syndrome des ovaires polykystiques (recherche PubMed/Scopus/Embase/WoS jusqu'à août 2025 ; page Frontiers ouverte). Résultats lus : 13 méta-analyses incluses ; AMSTAR-2 : 23,1 % haute qualité, 53,8 % faible, 23,1 % très faible ; évaluation GRADE de 85 items : aucune preuve de haute qualité, 18,9 % modérée, 40 % faible, 41,1 % très faible ; en pooling vs placebo/acide folique, l'inositol améliore significativement testostérone totale et libre, SHBG, HOMA-IR et taux d'ovulation/grossesse ; efficacité différentielle des sous-types d'inositol (myo vs D-chiro) discutée pour personnaliser. NB : la base contient déjà le myo-inositol dans Hashimoto (+sélénium, TSH) — ICI usage SOPK, distinct.","src":[["Frontiers in Endocrinology — umbrella review (publié 11/02/2026)","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2026.1741509/full"],["PubMed — 41757236 (citation vue via recherche)","https://pubmed.ncbi.nlm.nih.gov/41757236/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'inositol est l'un des compléments les plus demandés en SOPK et les données vont dans le bon sens (cycle, insulinorésistance) — mais niveau de preuve globalement modéré/fable ; l'accompagner des mesures diététiques et ne jamais retarder la prise en charge médicale (metformine, induction)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-11","titre":"Cannelle et maladies métaboliques : umbrella review de méta-analyses d'ECR (Front Nutr, publié 03/11/2025)","subst":"cannelle;glycémie;lipides;DT2","res":"Umbrella review des méta-analyses d'ECR sur la cannelle dans les maladies métaboliques (recherche jusqu'à mars 2025 ; page Frontiers ouverte). Résultats lus : 21 méta-analyses / 139 comparaisons incluses ; la supplémentation en cannelle est significativement associée à une amélioration de la glycémie à jeun et du profil lipidique, avec des effets plus marqués chez les diabétiques et les patients avec syndrome métabolique ; analyses en sous-groupes : doses > 1,5 g/jour plus efficaces ; les auteurs recommandent des ECR de plus longue durée pour confirmer.","src":[["Frontiers in Nutrition — umbrella review (publié 03/11/2025)","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1683477/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La cannelle a un signal glycémique/lipidique réel mais modeste — en soutien chez le diabétique/prediabétique, jamais en substitution du traitement ; attention à la cannelle de Chine (casée) riche en coumarine en cas d'usage prolongé (préférer Ceylan)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2024-11","titre":"Canneberge et prévention des infections urinaires : effet dose-dépendant des proanthocyanidines (méta-analyse Front Nutr, publié 28/11/2024)","subst":"canneberge;PAC;cystite;infection urinaire","res":"Méta-analyse de 10 ECR sur la prévention des infections urinaires par les produits de canneberge selon la dose de proanthocyanidines (PAC ; page Frontiers ouverte). Résultats lus : à ≥ 36 mg de PAC/jour, risque d'IU réduit de 18 % (RR = 0,82 ; IC 95 % 0,69-0,98 ; p = 0,03) ; en dessous de 36 mg/jour, pas de réduction significative (p = 0,39). NB : DISTINCTE de l'essai AJCN « poudre de fruit entier » déjà en base (2025-01) — ICI la méta-analyse dose-seuil PAC.","src":[["Frontiers in Nutrition — méta-analyse PAC (publié 28/11/2024)","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2024.1422121/full"],["PubMed — 39668896","https://pubmed.ncbi.nlm.nih.gov/39668896/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument concret au comptoir — vérifier la teneur en PAC du produit proposé (souvent bien en dessous de 36 mg/j) ; cible pertinente : femmes à cystites récidivantes, en complément des mesures hygiéno-diététiques."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-06","titre":"Spiruline seule ou avec exercice chez l'adulte en surpoids/obèse : SR/MA (Front Nutr, publié 27/06/2025)","subst":"spiruline;lipides;tension;surpoids","res":"SR/MA des ECR sur la spiruline seule ou combinée à l'exercice chez l'adulte en surpoids/obésité (23 études, 1 035 participants ; page Frontiers ouverte). Résultats lus : effets rapportés en Hedge's g ; la spiruline améliore le profil lipidique, la pression artérielle et le poids corporel ; l'association à l'exercice renforce certains bénéfices lipidiques ; MAIS impact global limité sur la composition corporelle et le contrôle glycémique ; biais évalués (RoB 2) et GRADE appliqués ; conclusion : la spiruline peut servir de thérapie adjuvante chez les personnes en surpoids avec troubles métaboliques. NB : DISTINCTE de l'entrée « spiruline/chlorella au sport » déjà en base (2026-04) — ICI l'angle cardiométabolique/poids.","src":[["Frontiers in Nutrition — SR/MA (publié 27/06/2025)","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1624982/full"],["PubMed — 40655486 (citation vue)","https://pubmed.ncbi.nlm.nih.gov/40655486"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message honnête pour le client « spiruline pour maigrir » : un léger effet sur lipides/PA, quasi rien sur la balance — l'exercice reste le levier."},{"dom":"Urologie & santé masculine","type":"Complément alimentaire","n":1,"dt":"2025-07","titre":"Lycopène et santé reproductive masculine : SR/MA (Int J Mol Sci 2025;26(15):7224, publié 25/07/2025)","subst":"lycopène;spermogramme;fertilité;infertilité masculine","res":"SR/MA des études cliniques sur la supplémentation en lycopène et la fertilité masculine (recherche jusqu'à février 2025 ; page MDPI ouverte). Résultats lus : 4 études cliniques, 151 participants seulement ; amélioration significative de la concentration spermatique (SMD 0,33 ; IC 0,02-0,65 ; p = 0,037) et de la motilité non progressive (SMD 0,45 ; IC 0,04-0,87 ; p = 0,032) ; PAS d'effet significatif sur motilité totale, motilité progressive, morphologie, volume ou dommage à l'ADN ; biais de publication et hétérogénéité méthodologique notés ; bénéfices jugés modestes, autres critères non concluants, essais plus larges nécessaires.","src":[["MDPI — Int J Mol Sci 2025;26(15):7224 (Publié : 25/07/2025)","https://www.mdpi.com/1422-0067/26/15/7224"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le lycopène (tomate/courge) est plébiscité en fertilité masculine — signal réel mais petit et fondé sur peu d'études ; à placer parmi les antioxydants du spermogramme, pas comme solution."},{"dom":"Urologie & santé masculine","type":"Complément alimentaire","n":1,"dt":"2025-03","titre":"N-acétylcystéine et paramètres du spermogramme : SR/MA d'ECR (Arch Ital Urol Androl 2025;97(1):13750, mars 2025)","subst":"NAC;N-acétylcystéine;fertilité;spermogramme","res":"SR/MA des ECR sur la NAC dans l'infertilité masculine ou l'altération du spermogramme (recherche jusqu'au 21/02/2024 ; page PagePress ouverte). Résultats lus : 5 études incluses ; vs contrôle, la NAC améliore significativement le volume (MD 0,69 ; IC 0,26-1,12 ; p = 0,002), la concentration (MD 4,43 ; IC 1,50-7,36 ; p = 0,003), la motilité totale (MD 9,69 ; IC 6,61-12,77 ; p < 0,00001) et la morphologie normale (MD 1,36 ; IC 0,70-2,03 ; p < 0,0001) ; aucun effet indésirable rapporté dans les études incluses.","src":[["Archivio Italiano di Urologia e Andrologia — 2025;97(1):13750 (mars 2025)","https://www.pagepressjournals.org/aiua/article/view/13750"],["PubMed — 40126496 (citation vue via recherche)","https://pubmed.ncbi.nlm.nih.gov/40126496/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La NAC, déjà connue en mucolytique, a un profil favorable sur le spermogramme à dose orale — option antioxydante à évoquer avec le médecin en infertilité masculine idiopathique (souvent en association au zinc/oméga-3 des « fertility » du comptoir)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-03","titre":"Graines de lin et pression artérielle chez les patients avec facteurs de risque CV : SR/MA d'ECR (J Cardiovasc Thorac Res 2025, first published online 18/03/2025)","subst":"graines de lin;tension;HTA;lignanes","res":"SR/MA d'ECR en groupes parallèles sur les graines de lin et la tension artérielle chez les patients avec facteurs de risque cardiovasculaire (page JCVTR ouverte). Résultats lus : 18 ECT inclus ; en pooling, la supplémentation en graines de lin réduit la PAS (WMD −4,75 mmHg ; IC 95 % −7,05 à −2,44 ; p ≤ 0,001) et la PAD (WMD −3,09 mmHg ; IC −4,37 à −1,81 ; p ≤ 0,001) ; hétérogénéité très élevée (I² = 93,6 % PAS / 91,2 % PAD) — les auteurs demandent d'interpréter avec prudence et appellent d'autres ECR de qualité.","src":[["Journal of Cardiovascular and Thoracic Research — FullHtml jcvtr-33280 (First published online 18/03/2025)","https://jcvtr.tbzmed.ac.ir/FullHtml/jcvtr-33280"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les graines de lin moulues (2 c. à soupe/j) gardent une place hygiéno-diététique (fibres, ALA, lignanes) avec un signal tension réel — à intégrer au conseil HTA de première intention, sans remplacer le traitement."},{"dom":"Diabète & Endocrinologie","type":"Complément alimentaire","n":1,"dt":"2025-04","titre":"Nigelle (Nigella sativa) et indices cardiométaboliques du DT2 : SR/MA d'ECR (Complement Ther Med 2025;90:103174, avril 2025)","subst":"nigelle;cumin noir;DT2;HbA1c;LDL","res":"SR/MA d'ECR sur la nigelle (cumin noir) chez les patients diabétiques de type 2 (recherche jusqu'à janvier 2025 ; citation et date vues sur ResearchGate : Complementary Therapies in Medicine 90 (2025) 103174, avril 2025 ; conclusion lue via l'enregistrement PubMed 40210172 — ScienceDirect bloqué ce soir). Résultats lus : la supplémentation en nigelle améliore significativement la glycémie à jeun (FBG), l'HbA1c, le cholestérol total et le LDL chez le patient DT2 ; PAS d'effet significatif sur l'insuline, les triglycérides, les enzymes hépatiques ni la fonction rénale.","src":[["ResearchGate — citation complète Complement Ther Med 90 (2025) 103174, avril 2025 (page vue)","https://www.researchgate.net/publication/390614364_Effects_of_Black_Seed_Nigella_sativa_L_on_Cardiometabolic_Indices_in_Type_2_Diabetic_Patients_A_Systematic_Review_and_Meta-Analysis_of_RCTs"],["PubMed — 40210172 (conclusion lue via extrait de la notice)","https://pubmed.ncbi.nlm.nih.gov/40210172/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La nigelle (huile ou graines) a un signal glycémique/lipidique documenté dans le DT2 — en accompagnement du traitement, avec rappel de l'insulino-résistance d'abord ; prudence en cas de traitements hypoglycémiants (risque de potentialisation) et chez la femme enceinte (usage traditionnel abortif à forte dose)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-05","titre":"NMA de 20 compléments dans l'arthrose : pelure de fruit de la passion et MSM en tête, glucosamine absente du podium (J Integr Med 2025;23(4):357-369)","subst":"arthrose;NMA;MSM;collagène;fruit de la passion","res":"Network meta-analysis des compléments alimentaires dans l'arthrose (recherche PubMed/Embase/Cochrane/WoS jusqu'au 20/01/2025 ; citation et date vues sur ResearchGate : Journal of Integrative Medicine 23(4):357-369, en ligne mai 2025, DOI 10.1016/j.joim.2025.04.008 — ScienceDirect bloqué ce soir, extraits lus via la page ScienceDirect et ResearchGate). Résultats lus : 20 compléments évalués dans 69 études éligibles ; 7 ont des effets grands et cliniquement pertinents (effet > 0,80) : collagène hydrolysé, extrait de pelure de fruit de la passion, extrait de Curcuma longa, extrait de Boswellia serrata, curcumine, pycnogénol et L-carnitine ; sur le score WOMAC douleur, la pelure de fruit de la passion obtient le meilleur SUCRA (91 % ; MD −9,2 ; IC −16,0 à −2,3), suivie du MSM (89 %), du collagène de type II non dénaturé (87 %) et du collagène (84 %). NB : DISTINCTE de la NMA gonarthrose Front Nutr 07/03/2025 de la vague 1 du soir (NEM/Aflapin/E-OA-07) — ICI 20 compléments/69 études, avec MSM et fruit de la passion en tête.","src":[["ResearchGate — citation J Integr Med 2025;23(4):357-369 (page vue)","https://www.researchgate.net/publication/391434460_Effects_of_dietary_supplements_on_patients_with_osteoarthritis_A_systematic_review_and_network_meta-analysis"],["ScienceDirect — extrait de l'article (bloqué en accès direct ce soir, extraits lus)","https://www.sciencedirect.com/science/article/pii/S2095496425000536"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Hiérarchie utile au rayon arthrose — MSM, collagène hydrolysé, curcumine et pycnogénol sortent mieux classés que les classiques du comptoir ; rappelons que ces produits soulagent sans modifier l'évolution structurale."},{"dom":"Diabète & Endocrinologie","type":"Complément alimentaire","n":1,"dt":"2025-09","titre":"Carnosine ou bêta-alanine dans le prédiabète et le DT2 : SR/MA d'ECR (BMC Endocrine Disorders 2025 — Li et al., relais scienmag daté 25/09/2025)","subst":"carnosine;bêta-alanine;prédiabète;DT2","res":"SR/MA des ECR sur la carnosine ou son précurseur la bêta-alanine dans le prédiabète et le diabète de type 2 (Li et al., BMC Endocrine Disorders 2025 ; accès Springer bloqué ce soir — daté via le relais scienmag du 25/09/2025, page vue, et relais EMJ Reviews, page vue ; PubMed rate-limité). Points lus (relais) : la supplémentation améliore le contrôle glycémique chez les personnes DT2 et prédiabétiques, avec un potentiel sur la fonction des cellules bêta. NB : DISTINCTE de l'entrée « bêta-alanine et efforts intenses » déjà en base (2026-09) — ICI l'usage métabolique.","src":[["Scienmag — relais daté 25/09/2025 (page vue)","https://scienmag.com/carnosine-and-beta-alanine-diabetes-supplementation-review/"],["EMJ Reviews — relais BMC Endocr Disord (page vue)","https://www.emjreviews.com/diabetes/news/carnosine-and-%CE%B2-alanine-show-promise-in-type-2-diabetes/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Usage émergent du sport vers le métabolique — pas de recommandation officine à ce stade, un message de prudence et de suivi du traitement antidiabétique suffit."},{"dom":"Ophtalmologie","type":"Complément alimentaire","n":1,"dt":"2026-05","titre":"Lutéine (± zéaxanthine/épilutéine) et DMLA : MPOD et acuité améliorées au stade précoce — SR/MA (Journal of Ophthalmology 2026, relais MDSpire daté 05/05/2026)","subst":"lutéine;zéaxanthine;DMLA;macula","res":"SR/MA des ECR évaluant la lutéine orale seule ou combinée (zéaxanthine, épilutéine) dans la DMLA (Journal of Ophthalmology, Wiley — page bloquée ce soir ; corps et chiffres lus via le relais MDSpire/Conexiant daté 05/05/2026, page ouverte). Résultats lus : 9 ECR contre placebo, 860 patients ; doses 2-20 mg/j, durée 2-24 mois ; améliorations significatives de la densité optique du pigment maculaire (MPOD) et de la meilleure acuité visuelle corrigée (BCVA) vs placebo ; en sous-groupes, significatif chez les DMLA À UN STADE PRÉCOCE, PAS aux stades tardifs ; la lutéine en monothérapie améliore MPOD et BCVA, les formules combinées améliorent la MPOD mais pas significativement la BCVA (différence à ne pas surinterpréter — effectifs plus faibles) ; sensibilité au contraste améliorée ; les auteurs précisent que les changements de BCVA traduisent surtout une préservation de la fonction ; méta-régressions : durée et dose cumulée associées à de plus grands changements. NB : DISTINCTE de l'entrée AREDS2 (atrophie géographique, 2025-01) déjà en base — ICI le stade précoce et la fonction.","src":[["MDSpire/Conexiant — relais daté 05/05/2026 (page ouverte, corps lu)","https://conexiant.com/ophthalmology/articles/lutein-supplementation-may-improve-outcomes-in-early-amd/"],["Journal of Ophthalmology — Wang 2026 (Wiley, page bloquée ce soir, citée par le relais)","https://onlinelibrary.wiley.com/doi/10.1155/joph/2155378"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument fort pour les compléments « macula » chez le patient DMLA débutante à prédominance lutéine ; à prendre au cours d'un repas (lipides) ; pas d'intérêt attendu aux stades évolués."}];
const NIV = {1:"N1 · Méta-analyse", 2:"N2 · Phase 3", 3:"N3 · Phase 2 / petit essai", 4:"N4 · Vie réelle", 5:"N5 · Revue / alerte"};
const NC = {1:"#047857",2:"#2563eb",3:"#d97706",4:"#7c3aed",5:"#64748b"};
const TCOL = {"Médicament":"#0d5b8c","Vaccin":"#0f766e","Complément alimentaire":"#c2410c","Alerte":"#b91c1c","Officine":"#334155","Économie":"#9d174d","Alimentation":"#4d7c0f"};
const CCOI = {"Industrie":"#b45309","Mixte":"#7c3aed","Indépendant":"#047857","À vérifier":"#64748b"};
const CCOIBG = {"Industrie":"#fef3c7","Mixte":"#ede9fe","Indépendant":"#d1fae5","À vérifier":"#f1f5f9"};
const FACETS = [
  {id:"year", label:"📅 Année"},
  {id:"dom", label:"🩺 Discipline"},
  {id:"type", label:"🏷️ Type de revue"},
  {id:"n", label:"💪 Force d'étude"},
  {id:"coi", label:"⚖️ Conflits d'intérêts"}
];
var S = { q:"", tri:"annee", sel:{year:new Set(), dom:new Set(), type:new Set(), n:new Set(), coi:new Set()} };
function fval(r, f){ return f==="n" ? String(r.n) : f==="year" ? r.dt.slice(0,4) : r[f]; }
function matches(r, skip){
  if(S.q){ var hay=(r.titre+" "+r.dom+" "+r.type+" "+(r.subst||"")+" "+r.res).toLowerCase(); if(hay.indexOf(S.q)<0) return false; }
  for(var f in S.sel){
    if(f===skip || !S.sel[f].size) continue;
    if(!S.sel[f].has(fval(r,f))) return false;
  }
  return true;
}
function valOrder(f){
  if(f==="year"){ var ys=[...new Set(REVUES.map(r=>r.dt.slice(0,4)))].sort(); return ys.reverse(); }
  if(f==="n") return ["1","2","3","4","5"];
  if(f==="type") return Object.keys(TCOL);
  if(f==="coi") return Object.keys(CCOI);
  var d={}; REVUES.forEach(function(r){ d[r.dom]=(d[r.dom]||0)+1; });
  return Object.keys(d).sort(function(a,b){ return d[b]-d[a] || a.localeCompare(b,"fr"); });
}
function vlabel(f,v){
  if(f==="n") return NIV[Number(v)];
  if(f==="year") return v;
  return v;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function buildFacets(){
  var host = document.getElementById("facets");
  host.innerHTML = "";
  FACETS.forEach(function(F){
    var box = document.createElement("div"); box.className="facet";
    var bt = document.createElement("button");
    bt.innerHTML = "<span>"+F.label+"</span><span class='arr'>▼</span>";
    bt.onclick = function(){ box.classList.toggle("closed"); };
    box.appendChild(bt);
    var body = document.createElement("div"); body.className="fbody";
    box.appendChild(body); host.appendChild(box);
    F._body = body;
  });
}
function refreshFacetCounts(){
  FACETS.forEach(function(F){
    var body = F._body; if(!body) return;
    body.innerHTML = "";
    valOrder(F.id).forEach(function(v){
      var c = REVUES.filter(function(r){ return matches(r, F.id) && fval(r,F.id)===v; }).length;
      var lab = document.createElement("label");
      lab.className = "fopt" + (S.sel[F.id].has(v) ? " on" : "");
      var cb = document.createElement("input"); cb.type="checkbox"; cb.checked = S.sel[F.id].has(v); cb.disabled = (c===0 && !S.sel[F.id].has(v));
      cb.onchange = function(){
        if(this.checked) S.sel[F.id].add(v); else S.sel[F.id].delete(v);
        apply();
      };
      var lb = document.createElement("span"); lb.className="lb"; lb.textContent = vlabel(F.id, v);
      var ct = document.createElement("span"); ct.className="ct"; ct.textContent = c;
      lab.appendChild(cb); lab.appendChild(lb); lab.appendChild(ct);
      if(c>0 || S.sel[F.id].has(v)) body.appendChild(lab);
    });
    if(!body.children.length) body.innerHTML = "<div style='font-size:12px;color:var(--mut);padding:4px 2px'>Aucune option dans ce filtre</div>";
  });
}
function cardHTML(r){
  var srcs = (r.src||[]).map(function(s){ return "<a href='"+s[1]+"' target='_blank' rel='noopener'>"+esc(s[0])+"</a>"; }).join(" · ");
  var off = r.off ? "<details><summary>💬 À dire au patient</summary><p>"+esc(r.off)+"</p></details>" : "";
  return "<article class='card'><div class='tags'>"
    +"<span class='nb' style='background:"+NC[r.n]+"'>N"+r.n+"</span>"
    +"<span class='tb' style='background:"+TCOL[r.type]+"'>"+esc(r.type)+"</span>"
    +"<span class='tb' style='background:"+CCOIBG[r.coi]+";color:"+CCOI[r.coi]+"'>"+esc(r.coi)+"</span>"
    +"<span class='yr'>"+r.dt.slice(0,4)+"</span>"
    +"<span class='dom'>"+esc(r.dom)+"</span></div>"
    +"<h3>"+esc(r.titre)+"</h3>"
    +"<p class='res'>"+esc(r.res)+"</p>"
    + off
    +"<div class='srcline'><span>🔗 "+srcs+"</span></div>"
    +"</article>";
}
function sortList(list){
  list.sort(function(a,b){
    if(S.tri==="recent") return b.dt.localeCompare(a.dt);
    if(S.tri==="annee") return b.dt.slice(0,4).localeCompare(a.dt.slice(0,4)) || a.n-b.n;
    return a.n-b.n || b.dt.localeCompare(a.dt);
  });
  return list;
}
function refreshActive(){
  var bar = document.getElementById("activebar");
  var chips = [];
  for(var f in S.sel){ S.sel[f].forEach(function(v){ chips.push({f:f, v:v}); }); }
  if(!chips.length){ bar.style.display="none"; return; }
  bar.style.display="flex";
  bar.innerHTML = "";
  chips.forEach(function(c){
    var ch = document.createElement("span"); ch.className="chip";
    var t = document.createElement("span"); t.textContent = vlabel(c.f, c.v);
    var x = document.createElement("button"); x.textContent="×"; x.title="Retirer ce filtre";
    x.onclick = function(){ S.sel[c.f].delete(c.v); apply(); };
    ch.appendChild(t); ch.appendChild(x); bar.appendChild(ch);
  });
  var cl = document.createElement("button"); cl.className="clear"; cl.textContent="Tout effacer ("+chips.length+")";
  cl.onclick = function(){ for(var f in S.sel) S.sel[f].clear(); apply(); };
  bar.appendChild(cl);
}
function apply(){
  var list = sortList(REVUES.filter(function(r){ return matches(r); }));
  document.getElementById("count").innerHTML = "<b>"+list.length+"</b> / "+REVUES.length+" revues";
  var res = document.getElementById("results");
  res.innerHTML = list.length ? list.map(cardHTML).join("")
    : "<div class='empty'><b>Aucune revue ne correspond</b><br><br>Desserrez un filtre, ou effacez tout : <button class='clear' style='border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer' onclick='for(var f in S.sel)S.sel[f].clear();apply()'>Tout effacer</button></div>";
  refreshFacetCounts();
  refreshActive();
}
document.getElementById("q").addEventListener("input", function(){ S.q=this.value.trim().toLowerCase(); apply(); });
document.getElementById("tri").addEventListener("change", function(){ S.tri=this.value; apply(); });
buildFacets();
apply();
</script>
