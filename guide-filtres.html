<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaVeille — Trouver une revue</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc;--acc:#0d5b8c;
--n1:#047857;--n2:#2563eb;--n3:#d97706;--n4:#7c3aed;--n5:#64748b;
--med:#0d5b8c;--comp:#c2410c;--vac:#0f766e;--ale:#b91c1c;--off:#334155;--eco:#9d174d;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 4px rgba(15,23,42,.06)}
header h1{font-size:17px;white-space:nowrap}
header h1 span{color:var(--acc)}
.searchbox{flex:1;min-width:220px;display:flex}
.searchbox input{flex:1;border:1.5px solid var(--line);border-right:none;border-radius:8px 0 0 8px;padding:9px 12px;font-size:15px}
.searchbox input:focus{outline:none;border-color:var(--acc)}
.searchbox button{border:1.5px solid var(--acc);background:var(--acc);color:#fff;border-radius:0 8px 8px 0;padding:9px 16px;font-size:15px;cursor:pointer}
#count{font-size:13px;color:var(--mut);white-space:nowrap}
#count b{color:var(--ink);font-size:15px}
select#tri{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;cursor:pointer}
.layout{display:grid;grid-template-columns:270px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:18px 16px}
aside{min-width:0}
.facet{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.facet>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;font-size:14px;font-weight:600;padding:11px 14px;cursor:pointer;color:var(--ink)}
.facet>button .arr{transition:transform .15s;color:var(--mut);font-size:11px}
.facet.closed .arr{transform:rotate(-90deg)}
.fbody{padding:2px 14px 12px;border-top:1px solid var(--line)}
.facet.closed .fbody{display:none}
.fopt{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;border-radius:6px;font-size:13.5px}
.fopt:hover{background:var(--bg)}
.fopt input{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}
.fopt .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fopt .ct{color:var(--mut);font-size:12px;background:var(--bg);border-radius:10px;padding:1px 8px;min-width:26px;text-align:center}
.fopt.on .lb{font-weight:600}
.nbadge{display:inline-block;width:22px;text-align:center;color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:1px 0}
.activebar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.activebar .chip{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;border-radius:16px;padding:4px 10px;font-size:12.5px}
.activebar .chip button{background:none;border:none;color:#fff;cursor:pointer;font-size:14px;line-height:1;padding:0}
.activebar .clear{background:none;border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--mut)}
.activebar .clear:hover{border-color:#b91c1c;color:#b91c1c}
main{min-width:0}
.results{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 12px rgba(15,23,42,.10)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.nb{color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px}
.tb{color:#fff;font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px}
.yr{color:var(--acc);font-size:11.5px;font-weight:700;border:1px solid var(--acc);border-radius:5px;padding:1px 6px}
.dom{color:var(--mut);font-size:11.5px}
.card h3{font-size:15.5px;margin-bottom:6px;line-height:1.35}
.card .res{font-size:13.5px;color:#334155;margin-bottom:8px}
.card details{margin-bottom:8px}
.card details summary{cursor:pointer;font-size:13px;font-weight:600;color:#0f766e}
.card details p{font-size:13px;color:#334155;background:#f0fdfa;border-left:3px solid #0f766e;padding:7px 10px;margin-top:5px;border-radius:0 6px 6px 0}
.srcline{font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:7px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.srcline a{color:var(--acc);text-decoration:none;font-weight:600}
.srcline a:hover{text-decoration:underline}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:44px 20px;text-align:center;color:var(--mut)}
.empty b{color:var(--ink);font-size:16px}
footer{max-width:1280px;margin:0 auto;padding:10px 16px 28px;color:var(--mut);font-size:12px}
@media(max-width:860px){.layout{grid-template-columns:1fr}aside{order:0}
aside .facetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
aside .facetgrid{display:block}
@media(max-width:860px){aside .facetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}}
@media(max-width:560px){aside .facetgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>📘 Pharma<span>Veille</span></h1>
  <div class="searchbox">
    <input id="q" type="search" placeholder="Rechercher un mot-clé, une substance, une pathologie…" aria-label="Recherche">
    <button onclick="document.getElementById('q').value='';S.q='';apply()">✕</button>
  </div>
  <select id="tri" aria-label="Tri">
    <option value="annee">Tri : année → pertinence</option>
    <option value="force">Tri : pertinence (force d'étude)</option>
    <option value="recent">Tri : plus récent</option>
  </select>
  <div id="count"></div>
</header>
<div class="layout">
<aside>
  <div class="facetgrid" id="facets"></div>
</aside>
<main>
  <div class="activebar" id="activebar" style="display:none"></div>
  <div class="results" id="results"></div>
</main>
</div>
<footer>PharmaVeille — moteur de recherche par facettes · niveaux de preuve N1 (méta-analyse) à N5 (revue/alerte) · sources vérifiées cliquables · mise à jour du 11/11/2026 · s'ouvre hors ligne dans tout navigateur.</footer>
<script>
const REVUES = [{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2025-09","titre":"Orforglipron (GLP-1 oral) : perte de poids jusqu’à −11,2 % à 72 semaines (ATTAIN-1)","subst":"Orforglipron — agoniste oral du récepteur GLP-1 (petite molécule non peptidique)","res":"Premier agoniste GLP-1 oral non peptidique : dans cet essai de phase 3 vs placebo (NEJM, sept. 2025), la perte de poids moyenne à 72 semaines atteint −11,2 % à la dose de 36 mg (−7,5 % à 6 mg, −8,4 % à 12 mg) contre −2,1 % sous placebo, avec amélioration des facteurs de risque cardiometaboliques. Avantage clé attendu : pas de contrainte de jeûne/délai alimentaire, contrairement au sémaglutide oral. Dossiers d’enregistrement mondiaux déposés.","off":"Un GLP-1 en pilule, sans injection ni prise à jeun obligatoire, est en passe d’arriver — les AMM sont attendues ; attention aux contrefaçons vendues en ligne en attendant.","src":[["NEJM 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40960239/"],["Communiqué Eli Lilly","https://lilly.gcs-web.com/news-releases/news-release-details/lillys-oral-glp-1-orforglipron-demonstrated-meaningful-weight"]],"coi":"Industrie","fin":"Essai sponsorisé et analysé par Eli Lilly, fabricant de l’orforglipron ; résultats d’abord diffusés par communiqué de presse du laboratoire."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2025-11","titre":"Orforglipron chez le patient obèse avec diabète de type 2 (ATTAIN-2, phase 3)","subst":"Orforglipron — population obésité + DT2","res":"Essai de phase 3 (1 698 participants randomisés, sept. 2023 – août 2025, The Lancet) : l’orforglipron 12 et 36 mg entraîne une perte de poids et une réduction de l’HbA1c chez les adultes obèses vivant avec un DT2, avec comme comparateur actif le sémaglutide oral (7 et 14 mg). Effets indésirables surtout digestifs, légers à modérés, concentrés pendant la titration.","off":"Le GLP-1 oral en cours d’évaluation fonctionne aussi chez le diabétique de type 2 : piste d’avenir pour simplifier la prise en charge, rien à délivrer aujourd’hui.","src":[["The Lancet 2025","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(25)02165-8/abstract"],["Medscape","https://www.medscape.com/viewarticle/phase-3-completed-obesity-pill-orforglipron-advances-2025a1000und"]],"coi":"Industrie","fin":"Essai sponsorisé par Eli Lilly ; le comparateur actif (sémaglutide oral) est commercialisé par un concurrent direct du sponsor."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2025-07","titre":"Tirzépatide vs sémaglutide en tête-à-tête : supériorité du tirzépatide (SURMOUNT-5)","subst":"Tirzépatide vs sémaglutide","res":"Première comparaison directe des deux incretines (phase 3b, 72 semaines, NEJM 2025) chez l’adulte en obésité sans diabète : le tirzépatide entraîne une perte de poids et de tour de taille significativement plus importante que le sémaglutide. Effets indésirables surtout digestifs, légers à modérés, pendant l’escalade posologique.","off":"Toutes les « skinny pens » ne se valent pas : les études tête-à-tête montrent des différences d’efficacité — le choix se fait avec le médecin selon profil, tolérance et remboursement.","src":[["NEJM (revue ACC)","https://www.acc.org/Latest-in-Cardiology/Journal-Scans/2025/07/10/09/09/SURMOUNT-5"],["Applied Clinical Trials","https://www.appliedclinicaltrialsonline.com/view/tirzepatide-weight-loss-semaglutide-surmount-trial"]],"coi":"Industrie","fin":"Head-to-head sponsorisé par Eli Lilly, fabricant du tirzépatide — c’est le laboratoire qui commercialise le « gagnant » qui a financé la comparaison."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2026-05","titre":"Arrêter le tirzépatide = reprendre le poids (SURMOUNT-MAINTAIN)","subst":"Tirzépatide — maintien de la perte de poids","res":"Essai randomisé (The Lancet, 2026) : après une phase initiale de perte de poids, la poursuite du tirzépatide (dose maximale tolérée ou 5 mg) maintient la perte de poids de façon statistiquement et cliniquement supérieure au passage sous placebo. Confirmation que l’obésité se comporte comme une maladie chronique nécessitant un traitement d’entretien.","off":"Ces traitements ne sont pas une « cure » : à l’arrêt, la reprise du poids est la règle — l’hygiène de vie reste le socle, et la poursuite du traitement se discute avec le médecin.","src":[["The Lancet 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42119587/"],["ECTO 2026","https://www.pharmaceutical-technology.com/analyst-comment/eco-2026-surmount-maintain-tirzepatide-weight-loss/"]],"coi":"Industrie","fin":"Essai sponsorisé par Eli Lilly."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2026-06","titre":"Finérénone : la MRC non diabétique bénéficie enfin d’un traitement (FIND-CKD)","subst":"Finérénone — antiminéralocortéroïde non stéroïdien","res":"Essai de phase 3 (JAMA, juin 2026) : chez l’adulte avec maladie rénale chronique non diabétique, la finérénone ralentit significativement le déclin du DFG et réduit durablement l’albuminurie vs placebo — ouverture vers une extension d’indication au-delà du diabète. Bénéfices qualifiés de modestes et effets cardiovasculaires encore incertains, mais une porte s’ouvre pour la majorité des patients MRC qui avaient peu d’options.","off":"La finérénone pourrait bientôt protéger aussi les reins des non-diabétiques — hyperkaliémie et fonction rénale à surveiller, comme toujours avec cette classe.","src":[["JAMA 2026","https://doi.org/10.1001/jama.2026.9923"],["EurekAlert","https://www.eurekalert.org/news-releases/1130695"],["NephJC","http://www.nephjc.com/news/2026/7/6/find-ckd"]],"coi":"Industrie","fin":"Essai sponsorisé par Bayer, titulaire de l’AMM finérénone (Kerendia) ; critère principal = pente du DFG, critère de substitution."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2025-06","titre":"Finérénone + empagliflozin d’emblée : supériorité sur l’albuminurie (CONFIDENCE)","subst":"Finérénone + empagliflozin — combinaison précoce","res":"Essai randomisé (NEJM, 2025) : l’initiation simultanée de finérénone et d’empagliflozin dans la MRC diabétique réduit davantage l’albuminurie que chaque monothérapie prise seule, sans excès d’insuffisance rénale aiguë — argument fort pour combiner tôt antialdostérone et iSGLT2 chez les patients albuminuriques.","off":"La stratégie qui émerge : combiner iSGLT2 + finérénone précocement, sous surveillance conjointe de la fonction rénale et de la kaliémie.","src":[["NephJC (résumé)","http://www.nephjc.com/news/2026/7/20/finerenone-shorts"],["Bayer","https://www.bayer.com/en/us/news-stories/kerendia-for-type-1-diabetes-and-chronic-kidney-disease"]],"coi":"Industrie","fin":"Essai sponsorisé par Bayer et Boehringer Ingelheim, fabricants de la finérénone et de l’empagliflozine."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":2,"dt":"2026-03","titre":"Première insuline basale hebdomadaire : l’insuline icodec approuvée par la FDA","subst":"Insuline icodec 700 U/mL (Awiqli) — DT2 de l’adulte","res":"Autorisation FDA (mars 2026) de la première insuline basale à administration unique par semaine, sur la base du programme de phase 3 ONWARDS. Pas d’extension au diabète de type 1 : le comité d’experts a voté contre (7–4) en raison d’hypoglycémies cliniquement significatives plus fréquentes vs insuline dégludec dans ONWARDS 6.","off":"Une injection par semaine au lieu d’une par jour existe désormais pour le DT2 : alternative à évoquer avec le médecin si les injections quotidiennes sont un obstacle à l’observance.","src":[["Pharmacy Times","https://www.pharmacytimes.com/view/fda-approves-insulin-icodec-abae-first-once-weekly-basal-insulin-for-adults-with-type-2-diabetes"],["AJMC","https://www.ajmc.com/view/fda-approves-novel-weekly-basal-insulin-for-t2d"]],"coi":"Industrie","fin":"Programme ONWARDS sponsorisé par Novo Nordisk, fabricant de l’Awiqli ; l’absence d’approbation dans le DT1 a été arbitrée par un comité indépendant (vote FDA 7–4)."},{"dom":"Neurologie","type":"Médicament","n":2,"dt":"2026-06","titre":"Alzheimer : lecanemab et donanemab approuvés en Europe — un changement d’ère, avec recul","subst":"Lecanemab (Leqembi) · donanemab (Kisunla) — anticorps anti-amyloïdes","res":"L’EMA a accordé les AMM européennes des deux anticorps anti-amyloïdes dans la maladie d’Alzheimer débutale symptomatique : ralentissement du déclin cognitif et fonctionnel d’environ 27–35 % sur 18 mois. L’évaluation européenne insiste sur l’équilibre bénéfice/risque : bénéfice modeste au quotidien, risque d’ARIA (œdème et micro-hémorragies cérébrales) imposant IRM de surveillance et sélection par biomarqueurs — auxquels s’ajoutent désormais des tests sanguins de dépistage de l’amyloïde.","off":"Ces traitements ne « guérissent » pas : ils ralentissent d’environ un tiers la progression sur 18 mois, avec une surveillance cérébrale obligatoire — un espoir à présenter comme tel, sans le survendre.","src":[["Lancet Regional Health Europe 2026","https://www.thelancet.com/journals/lanpe/article/PIIS2666-7762(26)00056-6/fulltext"],["Guide neurologique 2026","https://neurotrials.ai/journal/dementia/the-new-era-of-alzheimer-disease-therapy-a-2026-neurologists-guide/"]],"coi":"Industrie","fin":"Essais sponsorisés par Eisai/Biogen (lécanemab) et Eli Lilly (donanemab) ; l’évaluation indépendante de l’EMA a souligné le rapport bénéfice/risque étroit (ARIA)."},{"dom":"Douleur & Migraine","type":"Médicament","n":2,"dt":"2026-09","titre":"Atogepant vs topiramate : le gepant gagne en efficacité ET en tolérance (TEMPLE)","subst":"Atogepant (Qulipta) — antagoniste oral du récepteur CGRP","res":"Essai de phase 3b en tête-à-tête (Lancet Neurology, sept. 2026) : l’atogepant est supérieur au topiramate, référent oral de la prévention depuis 20 ans, sur les jours de migraine par mois, le handicap lié aux céphalées, le fonctionnement quotidien et les fonctions cognitives, avec une meilleure tolérabilité. À noter : l’atogepant a obtenu une indication aiguë supplémentaire dans l’UE en juin 2026 (préventif seul aux USA), et l’AAN/AHS ont actualisé leur guideline de prévention.","off":"Nouvelle génération antimigraineuse : une option orale mieux tolérée que les anciens préventifs, à évoquer en cas d’échec ou d’intolérance du traitement actuel.","src":[["BioSpace (AbbVie)","https://www.biospace.com/press-releases/abbvie-temple-study-demonstrates-superior-tolerability-and-efficacy-of-atogepant-qulipta-in-head-to-head-migraine-prevention-trial"],["Revue gepants","https://www.e-hpr.org/journal/view.php?doi=10.62087%2Fhpr.2026.0034"]],"coi":"Industrie","fin":"Essai sponsorisé par AbbVie, fabricant de l’atogépant (Qulipta) ; communiqué du laboratoire avant publication."},{"dom":"Psychiatrie","type":"Médicament","n":2,"dt":"2026-02","titre":"Psilocybine (COMP360) : 2e essai de phase 3 positif dans la dépression résistante","subst":"Psilocybine — thérapie assistée par psychédélique","res":"Deux essais de phase 3 hautement significatifs (2025–2026) dans la dépression résistante : à la semaine 6, différence moyenne de −3,8 points sur la MADRS vs comparateur à faible dose (p<0,001), avec 39 % des patients atteignant une réduction cliniquement pertinente ; effet plus net après 2 séances. Dépôt de dossier FDA en cours — l’amplitude de l’effet reste débattue et le cadre d’administration sera strictement médical.","off":"Un traitement « psychédélique-assisté » pourrait entrer en psychiatrie : aucune automédication possible, administration encadrée indispensable — l’espoir est réel mais le cadre sera médical.","src":[["Compass Pathways","https://ir.compasspathways.com/News--Events-/news/news-details/2026/Compass-Pathways-Successfully-Achieves-Primary-Endpoint-in-Second-Phase-3-Trial-Evaluating-COMP360-Psilocybin-for-Treatment-Resistant-Depression/default.aspx"],["Drug Discovery & Development","https://www.drugdiscoverytrends.com/first-phase-3-psilocybin-data-clears-the-bar-for-treatment-resistant-depression-but-how-high-was-the-bar/"],["Psychiatric Times","https://www.psychiatrictimes.com/view/comp360-psilocybin-for-treatment-resistant-depression-achieves-primary-endpoint-in-phase-3-trial"]],"coi":"Industrie","fin":"Développement par Compass Pathways (société cotée, marque déposée sur COMP360) ; critiques méthodologiques récurrentes sur le comparateur 1 mg et l’ampleur de l’effet."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2026-05","titre":"Tézépélumab (anti-TSLP) : ~70 % de réduction des exacerbations d’asthme sévère, tous phénotypes","subst":"Tézépélumab (Tezspire) — anticorps anti-TSLP","res":"Données présentées à l’ATS 2026 : réduction d’environ 70 % des exacerbations dans l’asthme sévère non contrôlé, y compris chez les fumeurs et les patients avec BPCO comorbide, confortant l’intérêt d’un blocage en amont de l’inflammation (NAVIGATOR : phase 3, n=1 061). Des données réelles multicentriques (ERJ Open Research, 2025) confirment l’efficacité en vie réelle.","off":"L’asthme sévère dispose de biotechniques efficaces quel que soit le phénotype : orienter vers le pneumologue si ≥2 exacerbations/an malgré un bon usage des corticoïdes inhalés (vérifier la technique à l’inhalation !).","src":[["HCPLive (ATS 2026)","https://www.hcplive.com/view/ats-2026-asthma-tezepelumab-dupilumab-biologics-expert-interviews"],["ClinicalMetric","https://clinicalmetric.com/insights/asthma-clinical-trials-2026"]],"coi":"Industrie","fin":"Essais sponsorisés par AstraZeneca/Amgen, fabricants du Tezspire."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2026-08","titre":"BPCO : le dupilumab approuvé, les éosinophiles deviennent le biomarqueur à suivre","subst":"Dupilumab et biotechniques anti-IL-4/13 dans la BPCO","res":"BOREAS (phase 3, Lancet Respiratory Medicine) : le dupilumab réduit les exacerbations chez les patients BPCO avec inflammation de type 2 (éosinophiles sanguins élevés) — indication obtenue en plus de l’asthme, de la dermatite atopique, de la polypose nasale… L’étude COURSE (CHEST 2026) et les données mepolizumab plaident pour doser les polynucléaires éosinophiles sanguins afin de guider les biotechniques dans la BPCO, à la manière de l’asthme.","off":"La BPCO « à éosinophiles élevés » devient une cible des biotechniques : le dosage des PNE change la prise en charge — un domaine où le pharmacien peut expliquer l’intérêt de l’examen biologique.","src":[["Lancet Respir Med","https://www.thelancet.com/journals/lanres/article/PIIS2213-2600(25)00044-X/fulltext"],["CHEST Physician (COURSE)","https://www.chestphysician.org/course-trial-shows-importance-of-biomarker-testing-in-copd/"],["Historique AMM Dupixent","https://www.drugs.com/history/dupixent.html"]],"coi":"Industrie","fin":"Essais BOREAS/AEROS sponsorisés par Sanofi/Regeneron, fabricants du Dupixent."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2026-05","titre":"Céfépime-zidebactam (Zaynich) : nouvelle arme IV contre les IVU à Gram-négatifs résistants","subst":"Céfépime-zidebactam — association bêta-lactamine / inhibiteur non classique","res":"Autorisation FDA (29 mai 2026) pour le traitement des infections urinaires compliquées, y compris pyélonéphrites aiguës, à bacilles Gram-négatifs sensibles chez l’adulte — une réponse au défi croissant des entérobactéries multirésistantes. Réservé à l’usage hospitalier.","off":"De nouveaux antibiotiques contre les bactéries résistantes arrivent, mais par voie IV et à l’hôpital : en ville, les règles d’or restent le bon usage des antibiotiques oraux et la lutte contre l’automédication.","src":[["Medical Daily","https://www.medicaldaily.com/zaynich-cefepime-zidebactam-fda-approval-2026-drug-resistant-uti-superbug-475623"]],"coi":"Industrie","fin":"Développement par Wockhardt ; autorisation fondée sur les essais du fabricant."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-12","titre":"Zoliflodacine : premier antibiotique conçu spécifiquement pour la gonorrhée en des décennies","subst":"Zoliflodacine (NUZOLVENCE) — antigonococcique oral","res":"Autorisation FDA (déc. 2025) à l’issue d’un essai clinique global : premier nouveau traitement développé exclusivement pour la gonorrhée, alors que Neisseria gonorrhoeae développe des résistances aux traitements de référence. Fruit d’un partenariat public-privé (GARDP).","off":"La résistance de la gonorrhée a désormais un contre-mesure dédié — toujours rappeler le dépistage des autres IST et l’absence de protection anticonceptive du préservatif seul.","src":[["SICRES / GARDP","https://sicres.org/2025/12/16/a-successful-global-trial-paves-the-way-for-the-us-fda-approval-of-the-first-in-class-gonorrhoea-antibiotic/"]],"coi":"Mixte","fin":"Développement en partenariat public-privé par le GARDP (organisation à but non lucratif) avec des essais globaux menés hors de l’industrie commerciale."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":3,"dt":"2026-03","titre":"Zosurabalpin (Roche) : la phase 3 contre Acinetobacter baumannii résistant démarre","subst":"Zosurabalpin — mécanisme antibactérien inédit (transport du LPS)","res":"Antibiotique à mécanisme complètement nouveau : la phase 3 contre les infections à Acinetobacter baumannii résistant aux carbapénèmes (CRAB, menace classée « urgente » par le CDC) a été lancée en 2026. Résultats attendus dans quelques années.","off":"Le pipeline anti-« superbactéries » redevient actif ; en attendant : pas d’antibiotique sans ordonnance, pas de reliquats de boîtes, et rappeler que la vaccination reste une arme anti-résistance.","src":[["Contagion Live","https://www.contagionlive.com/view/phase-3-clinical-trial-reporting-prospective-regulatory-filings-to-watch-for-in-2026"],["BST Quarterly","https://www.bstquarterly.com/article/new-antibiotic-enters-phase-iii-trials-to-fight-superburg/"]],"coi":"Industrie","fin":"Développement par Roche."},{"dom":"Rhumatologie","type":"Médicament","n":2,"dt":"2026-03","titre":"Néphrite lupique : l’obinutuzumab obtient 46 % de réponse rénale complète (REGENCY)","subst":"Obinutuzumab — anti-CD20, néphrite lupique","res":"Essai de phase 3 : chez l’adulte avec néphrite lupique prouvée par biopsie, l’ajout d’obinutuzumab au traitement standard obtient 46,4 % de réponse rénale complète à 76 semaines contre 33,1 % sous traitement standard seul (p=0,02). Approbation FDA obtenue — la déplétion lymphocytaire B confirme sa place dans le lupus rénal.","off":"Le lupus rénal dispose d’une nouvelle biothérapie de fond : l’observance du traitement immunosuppresseur et la surveillance rénale restent essentielles.","src":[["Frontiers in Lupus 2026","https://www.frontiersin.org/journals/lupus/articles/10.3389/flupu.2026.1829480/full"]],"coi":"Industrie","fin":"Essai sponsorisé par Roche/Genentech."},{"dom":"Rhumatologie","type":"Médicament","n":2,"dt":"2026-10","titre":"Lupus : le dapirolizumab pegol (anti-interféron) franchit son critère principal (PHOENYCS GO)","subst":"Dapirolizumab pegol — bloqueur de l’interféron de type I","res":"Présenté à l’ACR 2026 : à trois visites finales consécutives, 11,5 % des patients sous dapirolizumab pegol (en add-on au traitement standard) restent en rémission contre 4,7 % sous placebo, sur un critère composite d’activité faible de la maladie — deuxième candidat prometteur du lupus après l’obinutuzumab.","off":"La recherche lupus s’accélère : deux candidats solides en 2026 — mais aucun changement de protocole sans avis du rhumatologue.","src":[["ACR 2026 (résultats)","https://www.stocktitan.net/news/BIIB/acr-2026-dapirolizumab-pegol-associated-with-greater-treatment-fyqwvwb8vqhc.html"]],"coi":"Industrie","fin":"Développement Biogen/UCB ; résultats diffusés par communiqué lors de l’ACR 2026 avant publication revue par les pairs."},{"dom":"Rhumatologie","type":"Médicament","n":2,"dt":"2024-10","titre":"Sémaglutide et arthrose du genou : moins de douleur, potentiellement moins d’AINS (STEP 9)","subst":"Sémaglutide 2,4 mg — obésité + gonarthrose","res":"Essai randomisé (407 patients, NEJM) : le sémaglutide 2,4 mg/semaine chez les patients obèses avec gonarthrose modérée et douleur quotidienne réduit significativement la douleur et le poids, avec amélioration de la fonction physique — suggérant une voie pour diminuer la consommation d’AINS à risque cardiovasculaire et digestif.","off":"Perdre du poids fait réellement moins mal aux genoux : les GLP-1 pourraient remplacer une partie des antalgiques chroniques — argument de motivation supplémentaire.","src":[["Applied Clinical Trials","https://www.appliedclinicaltrialsonline.com/view/semaglutide-knee-osteoarthritis-pain-obesity-suggesting-potential"],["Endocrinology Advisor","https://www.endocrinologyadvisor.com/news/semaglutide-reduces-knee-osteoarthritis-pain-in-adults-with-obesity/"]],"coi":"Industrie","fin":"Essai STEP 9 sponsorisé par Novo Nordisk, fabricant du sémaglutide."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":4,"dt":"2026-06","titre":"Traitement hormonal de la ménopause : la FDA lève les mises en garde « black box »","subst":"THM / THS — œstrogènes ± progestatif","res":"Novembre 2025 : après réexamen des données scientifiques, la FDA a engagé la suppression des mises en garde encadrées (cardiovasculaire, cancer du sein, démence) des produits de THM — les données actuelles n’objectivent pas d’excès de risque dans les indications appropriées. Une cohorte nationale danoise (BMJ, 2026, femmes nées 1950–1977, suivi jusqu’en 2023) ne retrouve pas d’excès de mortalité toutes causes lié au THM. La décision reste individuelle : fenêtre d’initiation, dose minimale efficace, voie d’administration.","off":"Le message d’aujourd’hui : le THM n’est plus l’épouvantail des années 2000 — en cas de troubles invalidants, consulter pour en reparler sans peur est justifié.","src":[["American Heart Association","https://newsroom.heart.org/news/long-term-study-finds-modern-hormone-replacement-therapy-not-linked-to-heart-disease-risk"],["BMJ 2026 (cohorte danoise)","https://www.bmj.com/content/392/bmj-2025-085998"]],"coi":"Mixte","fin":"Décision réglementaire indépendante (FDA, après panel d’experts de juillet 2025) ; la cohorte danoise s’appuie sur des registres nationaux publics, sans financement industriel."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-08","titre":"Vériciguat : le bénéfice s’étend à l’insuffisance cardiaque chronique (VICTOR)","subst":"Vériciguat (Verquvo) — stimulateur de la guanylate cyclase soluble","res":"Présenté à l’ESC 2025 et publié simultanément dans The Lancet : le vériciguat apporte un bénéfice chez les patients en insuffisance cardiaque chronique à FEVG réduite — étendant la preuve d’efficacité au-delà de la phase post-décompensation (VICTORIA).","off":"L’arsenal de l’IC s’élargit (iSGLT2, antialdostérones, vériciguat) : à chaque renouvellement, vérifier que le protocole des « quatre piliers » est bien en place.","src":[["Merck (résultats)","https://www.merck.com/news/merck-provides-new-results-for-verquvo-vericiguat-in-patients-with-chronic-heart-failure-and-reduced-ejection-fraction/"]],"coi":"Industrie","fin":"Essai sponsorisé par Merck/Bayer, co-développeurs du Verquvo."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2026-05","titre":"Amylose cardiaque ATTR : l’acoramidis confirme, l’eplontersen en phase 3","subst":"Acoramidis (ATTRibute-CM) · eplontersen (CARDIO-TTRansform)","res":"Au congrès Heart Failure 2026, données positives de phase 3 pour l’acoramidis dans l’amylose cardiotranshyrétine (ATTR-CM) ; en parallèle, la phase 3 CARDIO-TTRansform évalue l’eplontersen (oligonucléotide antisens). Une maladie jadis sans traitement devient une véritable cible thérapeutique.","off":"Devant une « cardiomyopathie inexpliquée » chez un senior, l’amylose ATTR se cherche désormais : des traitements existent et le diagnostic est trop souvent porté tard.","src":[["Cardiovascular Business","https://cardiovascularbusiness.com/topics/clinical/cardiac-amyloidosis/cardiac-amyloidosis-spotlight-heart-failure-2026"],["AstraZeneca","https://www.astrazeneca.com/media-centre/press-releases/2026/update-cardio-ttransform-phase-iii-trial.html"]],"coi":"Industrie","fin":"Essais sponsorisés par BridgeBio Pharma (acoramidis) et AstraZeneca/Ionis (eplontersen)."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2025-04","titre":"Pembrolizumab périopératoire dans les cancers ORL : résultats « practice-changing » (KEYNOTE-689)","subst":"Pembrolizumab (Keytruda) — stratégie périopératoire","res":"Essai de phase 3 présenté à l’AACR 2025 : l’administration du pembrolizumab avant et après la chirurgie dans les carcinomes épidermoïdes localement avancés de la tête et du cou améliore les résultats — une stratégie périopératoire qui s’ajoute aux standards de prise en charge.","off":"L’immunothérapie s’étend aux stratégies autour de la chirurgie : accompagnement vaccinal et gestion des effets indésirables immuns du patient traité comptent désormais au comptoir.","src":[["AACR (bilan 2025)","https://www.aacr.org/blog/2025/12/18/cancer-in-2025-funding-new-treatments-and-breakthrough-ideas/"]],"coi":"Industrie","fin":"Essai sponsorisé par Merck, fabricant du Keytruda."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2026-06","titre":"Ivonescimab : premier médicament chinois en présentation plénière à l’ASCO (HARMONi-6)","subst":"Ivonescimab — anticorps bi-spécifique PD-1 × VEGF","res":"HARMONi-6, essai présenté en plénière à l’ASCO 2026 dans le cancer bronchique non à petites cellules épidermoïde : l’ivonescimab, anticorps bi-spécifique anti-PD-1/VEGF développé en Chine, se positionne face aux standards d’immunothérapie — signe de l’émergence de la Chine comme force d’innovation en oncologie mondiale.","off":"Le paysage de l’immunothérapie s’internationalise : de nouvelles molécules bi-fonctionnelles arrivent dans les pipelines.","src":[["PSI-CRO (ASCO 2026)","https://psi-cro.com/asco-2026-personalized-therapy-immunotherapy/"],["OncoDaily","https://oncodaily.com/oncolibrary/immunotherapy-oncology"]],"coi":"Industrie","fin":"Développé par Akeso (Chine), sponsor de l’essai HARMONi-6."},{"dom":"Infectiologie & Vaccins","type":"Vaccin","n":1,"dt":"2026-05","titre":"Vaccins RSV des seniors : 58–83 % d’efficacité réelle contre l’hospitalisation","subst":"Vaccins RSVpreF (Abrysvo) et RSVpreF3 (Arexvy)","res":"Méta-analyse de données post-AMM (Clinical Infectious Diseases, mai 2026) : les vaccins RSV préviennent 58 à 83 % des hospitalisations et passages aux urgences liés au virus respiratoire syncytial chez les personnes âgées, selon les saisons et critères de jugement — les données de vie réelle confirment les essais.","off":"Un vaccin anti-VRS pour seniors existe et son efficacité est confirmée en vie réelle : à proposer à l’automne selon les recommandations en vigueur (âge, comorbidités).","src":[["Clin Infect Dis 2026","https://academic.oup.com/cid/article/82/5/e1104/8489594"],["CIDRAP","https://www.cidrap.umn.edu/respiratory-syncytial-virus-rsv/rsv-vaccines-estimated-be-58-83-protective-older-adults"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41705791/"]],"coi":"Indépendant","fin":"Méta-analyse de données post-AMM issues de registres et dossiers médicaux électroniques ; pas de financement industriel identifié."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-05","titre":"Vitamine D et calcium : la grande méta-analyse qui met fin au dogme « anti-fracture »","subst":"Vitamine D · calcium — prévention des fractures et chutes","res":"Revue systématique et méta-analyse (BMJ, 2026, ~154 000 participants) : la supplémentation en calcium, en vitamine D ou leur association n’apporte pas de protection cliniquement pertinente contre les fractures ni les chutes chez l’adulte — dans la lignée des positions de l’USPSTF, défavorables à la supplémentation systématique en population générale.","off":"La vitamine D « pour les os » en prévention générale ne sert à rien : réserver la supplémentation aux carences documentées (dosage 25-OH-D3), à l’ostéoporose traitée et aux populations spécifiques.","src":[["BMJ 2026","https://www.bmj.com/content/393/bmj-2025-088050"],["Medical Daily (analyse)","https://www.medicaldaily.com/calcium-vitamin-d-supplements-fractures-bmj-meta-analysis-153000-people-2026-475677"]],"coi":"Indépendant","fin":"Méta-analyse menée dans un cadre institutionnel (agence fédérale américaine, contexte USPSTF) ; sans financement industriel."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-02","titre":"Créatine et cerveau du sujet âgé : des données sérieuses s’accumulent","subst":"Créatine monohydrate — cognition et performance physique du senior","res":"Revue systématique (Nutrition Reviews, fév. 2026) sur créatine et cognition du vieillissement : les essais les mieux conduits montrent des bénéfices surtout en mémoire et attention, en condition de stress cognitif ou de privation de sommeil. Les revues 2025-2026 sur la sphère musculaire du senior restent hétérogènes (effets renforcés par l’entraînement en résistance). L’EFSA n’a pas validé d’allégation cognition (2024) ; sécurité bonne aux doses usuelles (3–5 g/j).","off":"La créatine n’est ni dopante ni réservée aux sportifs : chez le senior, c’est probablement le complément « muscle + cerveau » le mieux documenté — effets attendus modestes, à présenter sans excès.","src":[["Nutrition Reviews 2026","https://academic.oup.com/nutritionreviews/article/84/2/333/8253584"],["Frontiers in Nutrition","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2025.1687719/full"],["Commentaire EFSA","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2026.1716285/full"]],"coi":"À vérifier","fin":"Revue académique ; financement non précisé dans les sources consultées ."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-10","titre":"Oméga-3 et cœur : effet global modeste, l’EPA pur à forte dose garde la faveur","subst":"Oméga-3 (EPA / DHA) — prévention cardiovasculaire","res":"Méta-analyses 2025-2026 : la supplémentation en oméga-3 réduit de façon limitée et débattue les événements cardiovasculaires en population générale ; les signaux favorables se concentrent sur les formulations hautement purifiées en EPA à forte dose, en complément des statines en prévention secondaire. Une méta-analyse suggère un avantage du EPA seul sur la mortalité cardiovasculaire face aux mélanges EPA/DHA.","off":"Pas de « gélule anti-infarctus » pour tous : l’oméga-3 n’a de justification que dans des cadres précis (hypertriglycéridémie, prévention secondaire sur avis médical).","src":[["Méta-analyse 2025","https://onlinelibrary.wiley.com/doi/10.1002/ctd2.70094"],["EPA vs EPA/DHA (mortalité CV)","https://www.sciencedirect.com/science/article/pii/S2772963X25005745"],["Lipides en cardiopathie ischémique","https://www.sciencedirect.com/science/article/abs/pii/S0939475326002279"]],"coi":"Mixte","fin":"Méta-analyses académiques englobant des essais primaires sponsorisés par l’industrie (ex. REDUCE-IT financé par Amarin, fabricant de l’EPA pur)."},{"dom":"Psychiatrie","type":"Complément alimentaire","n":1,"dt":"2026-01","titre":"Oméga-3 à dominante EPA : adjuvant réel (mais modeste) de la dépression","subst":"EPA ≥ 60 % — 1 à 2 g/jour","res":"Les méta-analyses d’essais randomisés (2025-2026) confirment un effet antidépresseur additif des oméga-3 : taille d’effet autour de −0,4 à −0,56 (SMD), spécifique aux formules contenant ≥ 60 % d’EPA à 1–2 g/jour, particulièrement utile en cas d’inflammation, de faibles taux d’oméga-3 ou de dépression résistante. Pas de preuve solide pour la DHA seule. La « psychiatrie nutritionnelle » devient une discipline reconnue.","off":"En complément du traitement antidépresseur — jamais en remplacement : 1 à 2 g d’EPA par jour a un niveau de preuve honorable.","src":[["Frontiers in Nutrition 2026","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2026.1748196/full"],["Revue narrative (MDPI)","https://www.mdpi.com/2813-7086/3/1/2"]],"coi":"À vérifier","fin":"Méta-analyses académiques dont certaines incluent des essais financés par des producteurs d’oméga-3 — à vérifier article par article."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-12","titre":"Coenzyme Q10 et douleurs musculaires sous statines : la question reste ouverte","subst":"CoQ10 (ubiquinone) — myalgies sous statines","res":"Méta-analyse (Journal of Nutritional Science) aux résultats mitigés sur les myopathies sous statines ; une étude observationnelle de 2025 rapporte une amélioration des symptômes musculaires avec 50 mg matin et soir chez des utilisateurs au long cours ; une synthèse récente suggère un bénéfice possible. Bilan : option d’appoint plausible, pas de preuve solide — penser d’abord aux causes classiques (interactions, hypothyroïdie, effort physique inhabituel).","off":"Le CoQ10 peut être tenté si myalgies sous statine, mais mieux vaut d’abord réévaluer avec le médecin (posologie, interactions, cause) : l’effet est inconstant.","src":[["Méta-analyse (Cambridge)","https://www.cambridge.org/core/journals/journal-of-nutritional-science/article/effects-of-coenzyme-q10-supplementation-on-myopathy-in-statintreated-patients-a-systematic-review-and-metaanalysis/21158F64C8D162585D71D5616B075E05"],["PubMed 2025 (observationnel)","https://pubmed.ncbi.nlm.nih.gov/41122613/"],["Examine (synthèse)","https://examine.com/research-feed/study/0mXOq1/"]],"coi":"Mixte","fin":"Méta-analyse hétérogène : plusieurs essais primaires impliquent des fabricants de compléments ; l’étude observationnelle citée est académique."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-02","titre":"Curcumine et arthrose : la douleur s’améliore — tout est dans la formulation","subst":"Curcumine (turmeric) — gonarthrose","res":"Umbrella review des revues systématiques et méta-analyses (Frontiers in Medicine, 2026) : la curcumine améliore douleur et fonction dans la gonarthrose par rapport aux comparateurs, avec une tolérance favorable. Limites : grande hétérogénéité, formulations à biodisponibilité très variable (pipérine, phytosomes…) et essais souvent de faible puissance ; les revues critiques appellent à la prudence avant de généraliser.","off":"Une alternative ou un adjuvant naturel de l’AINS est plausible : choisir une formulation à biodisponibilité optimisée, présenter l’effet comme modéré.","src":[["Umbrella review 2026","https://www.frontiersin.org/journals/medicine/articles/10.3389/fmed.2026.1801273/full"],["BMC 2025 (biomarqueurs)","https://link.springer.com/article/10.1186/s12906-025-04951-6"],["Revue critique","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2025.1664319/full"]],"coi":"Mixte","fin":"Essais primaires souvent sponsorisés par des fabricants d’extraits de curcumine ; les revues critiques indépendantes appellent à la prudence."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-09","titre":"Collagène : peau et articulations — des effets réels mais modestes","subst":"Peptides de collagène hydrolysé — peau et articulations","res":"Méta-analyse (IJDVL) : les compléments à base de collagène améliorent significativement l’hydratation et l’élasticité cutanées ; un umbrella review (2025-2026) retrouve aussi des signaux favorables sur les douleurs articulaires. Limites : essais souvent sponsorisés par l’industrie, durées courtes, doses et formes variables (5–10 g/j de peptides).","off":"Effets réels mais modestes sur la peau et le confort articulaire : ne pas promettre un « lifting buvable » — l’hydratation et la photoprotection font plus pour la peau.","src":[["IJDVL (peau)","https://ijdvl.com/effects-of-collagen-based-supplements-on-skins-hydration-and-elasticity-a-systematic-review-and-meta-analysis/"],["Umbrella review (ASJ Open Forum)","https://academic.oup.com/asjopenforum/article/doi/10.1093/asjof/ojag018/8446510"]],"coi":"Industrie","fin":"La plupart des essais primaires sont sponsorisés par des fabricants de collagène — point explicitement relevé par l’umbrella review."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-01","titre":"Ashwagandha : effet dose-dépendant confirmé sur le stress et l’anxiété","subst":"Ashwagandha (Withania somnifera) — adaptogène","res":"Méta-analyse dose-réponse d’essais randomisés (2026) : l’extrait d’ashwagandha réduit significativement les symptômes de stress, d’anxiété et de dépression chez l’adulte, avec un effet lié à la dose et à la standardisation de l’extrait ; les revues notent l’hétérogénéité des formulations et la nécessité de reproduire les résultats à plus grande échelle.","off":"Un des rares adaptogènes avec un niveau de preuve correct sur le stress : privilégier un extrait standardisé, en cure de 6 à 12 semaines — pas d’automédication chronique sans avis.","src":[["Dose-réponse (Complement Ther Med)","https://www.sciencedirect.com/science/article/pii/S0965229926000087"],["HerbalGram (analyse)","https://www.herbalgram.org/resources/herbclip/issues/2026/issue-782/ashwagandha-stress-anxiety-depression"]],"coi":"Mixte","fin":"Beaucoup d’essais portent sur des extraits brevetés détenus par des industriels, parfois co-écrits avec eux ; effet attendu lié à la marque d’extrait."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-02","titre":"Magnésium : anxiolytique léger, antidépresseur modéré, hypnotique limité","subst":"Magnésium — stress, anxiété, sommeil","res":"Revue systématique 2026 (Food Production, Processing & Nutrition) : le magnésium réduit modérément les symptômes dépressifs et légèrement l’anxiété — surtout chez les personnes carencées, en stress chronique ou en réponse partielle aux antidépresseurs. Sur le sommeil : gains modestes chez l’adulte qui dort mal ; pas de preuve d’efficacité dans l’insomnie chronique. À noter, le marché français des compléments « anti-stress » pèse 282 M€ alors que les essais montrent des effets modestes ou fragiles.","off":"Utile si carence ou stress, mais ne pas vendre le magnésium comme somnifère : alternative douce à essayer ponctuellement ; l’insomnie chronique relève du médecin.","src":[["Springer 2026","https://link.springer.com/article/10.1186/s43014-026-00424-6"],["Bioengineer (revue)","https://bioengineer.org/magnesium-shows-moderate-antidepressant-and-mild-anxiolytic-effects-in-systematic-review/"],["Analyse marché FR","https://medilax.fr/news/complements-alimentaires-stress-magnesium-ashwagandha-melatonine-anses/"]],"coi":"À vérifier","fin":"Revue académique ; financement non précisé dans les sources consultées."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-03","titre":"Probiotiques et diarrhée des antibiotiques : 170 essais randomisés, l’effet est là","subst":"Probiotiques — prévention de la diarrhée associée aux antibiotiques","res":"Umbrella review de 21 revues systématiques couvrant 170 essais randomisés uniques (Frontiers in Nutrition, 2026) : les probiotiques réduisent efficacement la diarrhée associée aux antibiotiques (AAD), chez l’adulte comme chez l’enfant et la personne âgée — une des indications les mieux documentées du rayon.","off":"Pendant une cure d’antibiotique, proposer d’emblée des probiotiques à souches documentées : indication au niveau de preuve le plus élevé de tout le rayon.","src":[["Frontiers 2026 (umbrella)","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2026.1994645/abstract"],["Revue (Pharmaceuticals)","https://doi.org/10.3390/pharma5010003"]],"coi":"Mixte","fin":"Essais primaires souvent financés par des fabricants de probiotiques ; l’umbrella review elle-même est académique."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-02","titre":"Probiotiques et syndrome de l’intestin irritable : amélioration confirmée (IBS-SSS)","subst":"Probiotiques — syndrome de l’intestin irritable","res":"Méta-analyse actualisée avec analyse séquentielle des essais (Journal of Gastroenterology and Hepatology, 2026) : les probiotiques améliorent significativement le score de sévérité IBS-SSS dans le SII ; les revues par souche (2025) confirment une efficacité souche-dépendante — pas de souche miracle universelle, mais un essai thérapeutique rationnel.","off":"Un essai de 4 à 12 semaines avec un produit multi-souches documenté se justifie dans le SII — cadrer l’attente : amélioration des symptômes, pas de guérison.","src":[["JGH 2026","https://onlinelibrary.wiley.com/doi/10.1111/jgh.70322"],["Revues par souche (JCM)","https://doi.org/10.3390/jcm15031152"]],"coi":"Mixte","fin":"Essais primaires souvent financés par l’industrie des probiotiques ; la méta-analyse elle-même est académique."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-10","titre":"Mélatonine : le sommeil des seniors, et un signal cardiaque à surveiller","subst":"Mélatonine — sommeil du sujet âgé","res":"Méta-analyse d’essais randomisés (Age and Ageing, oct. 2025) chez les personnes âgées avec troubles cognitifs : la mélatonine améliore modestement le temps de sommeil total et l’efficacité du sommeil, sans bénéfice cognitif global. À noter : un rapport de septembre 2025 suggère, sur des données observationnelles (donc non causales), une incidence d’insuffisance cardiaque plus élevée chez les insomniaques traités 12 mois (4,6 % vs 2,7 %) — signal à suivre, pas une contre-indication.","off":"La mélatonine aide surtout à rééduquer le rythme (décalage, endormissement) ; chez le senior le bénéfice est modeste : dose la plus basse efficace, cures courtes.","src":[["Age and Ageing 2025","https://academic.oup.com/ageing/article-abstract/54/11/afaf333/8324285"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41240058/"],["Medscape (analyse)","https://www.medscape.com/viewarticle/fad-or-fixture-melatonin-sleep-and-cognition-2026a10009uj"]],"coi":"Indépendant","fin":"Méta-analyse de revue académique (Age and Ageing) ; le signal cardiaque provient de données de registres indépendantes."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-01","titre":"Vitamine C et rhume : la revue Cochrane tranche (29 essais, 11 306 patients)","subst":"Vitamine C — rhume banal","res":"Revue Cochrane (29 ECT, n=11 306) : la prise régulière de vitamine C raccourcit la durée des rhumes d’environ 8 % chez l’adulte et 14 % chez l’enfant, sans effet préventif en population générale ; un intérêt subsiste en période de stress physique intense (effort d’endurance, froid).","off":"La vitamine C ne prévient pas le rhume : si le patient y tient, expliquer un gain limité à ~1 jour sur la durée — l’hydratation, le lavage de nez et le repos font le reste.","src":[["Cochrane (analyse)","https://supplementscience.ai/research/vitamin-c-cold-duration-meta-analysis"],["Revue immune (2025-2026)","https://myvillagegreen.com/blogs/post/vitamin-c-vitamin-d-and-zinc-for-immune-support-what-the-research-says"]],"coi":"Indépendant","fin":"Revue Cochrane — procédure éditoriale stricte de gestion des conflits d’intérêts des auteurs."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-09","titre":"Zinc et rhume : efficace si pris très tôt et sous la bonne forme","subst":"Zinc (gluconate, acétate) — rhume banal","res":"Revue 2026 (s’appuyant sur les données Cochrane) : le zinc réduit la durée du rhume lorsqu’il est initié dans les 24 premières heures après l’apparition des symptômes, avec une efficacité variable selon les sels (gluconate, acétate) et les doses ; pas d’effet préventif en population générale.","off":"Pastilles de zinc à démarrer dès les tout premiers symptômes chez l’adulte sinon sain — goût métallique et tolérance digestive en limitent l’usage.","src":[["Biology Insights 2026","https://biologyinsights.com/is-zinc-good-for-colds-what-the-evidence-shows/"],["NutritionPro (Cochrane)","https://nutritionpro.fr/en/blogs/infos/zinc-immunity-and-cold-real-benefits-dosage-and-forms"]],"coi":"Indépendant","fin":"Données issues de la revue Cochrane (gestion stricte des COI) ; les articles cités ici sont des analyses secondaires de qualité variable."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-05","titre":"Bérbérine : un « métformine naturel » ? Glycémie et lipides améliorés, preuves fragiles","subst":"Bérbérine — syndrome métabolique et diabète de type 2","res":"Méta-analyse d’essais randomisés vs placebo (Frontiers in Pharmacology, 2025) : la bérbérine améliore la glycémie à jeun, le profil lipidique et la pression artérielle dans le syndrome métabolique et le DT2. Mais essais de petite taille, hétérogènes, souvent monocentriques, aucune donnée de morbidité-mortalité, biodisponibilité faible — ce n’est pas un substitut aux antidiabétiques validés.","off":"Effet métabolique plausible, mais pas de « métformine naturelle » : ne jamais remplacer un traitement prescrit ; l’annoncer comme adjuvant discutable, à valider avec le médecin.","src":[["Frontiers Pharmacology 2025","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2025.1572197/full"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40740996/"]],"coi":"À vérifier","fin":"Essais primaires souvent menés par des équipes liées à des producteurs de bérbérine ; qualité méthodologique variable, essais de petite taille."},{"dom":"Nutrition & Compléments","type":"Médicament","n":5,"dt":"2026-06","titre":"Métformine « anti-âge » : toujours pas de preuve — le mode de vie, oui","subst":"Métformine — hypothèse anti-âge (essai TAME)","res":"En 2026, l’essai TAME (Targeting Aging with Metformin) n’a toujours pas recruté ni produit de résultats d’efficacité. Dans le même temps, le suivi de 21 ans du Diabetes Prevention Program (JAMA, juin 2026) montre que l’intensification du mode de vie réduit le risque de multimorbidité chez l’adulte prédiabétique — contrairement à la métformine, qui n’a pas montré ce bénéfice.","off":"Recadrer la mode « métformine pour vieillir » : aucune preuve d’effet anti-âge ; l’activité physique et l’alimentation restent la seule intervention documentée.","src":[["Technology.org (TAME)","https://www.technology.org/2026/09/26/tame-trial-metformin-aging-funding/"],["JAMA DPP (analyse)","https://progevita.com/en/blog/metformin-longevity-what-science-says/"],["Aging (revue)","https://doi.org/10.18632/aging.206407"]],"coi":"Indépendant","fin":"Suivi du DPP financé par des fonds publics (NIH) ; l’essai TAME est porté par une fondation à but non lucratif (AFAR), mais n’a pas recruté à ce jour."},{"dom":"Autorisations & Sécurité","type":"Médicament","n":5,"dt":"2026-01","titre":"Panorama 2025 : 104 médicaments recommandés par l’EMA, dont 38 nouvelles substances actives","subst":"Veille des autorisations européennes","res":"L’EMA a recommandé 104 médicaments en 2025, dont 38 nouvelles substances actives jamais autorisées dans l’UE et 16 médicaments de maladies rares (dont le premier traitement du syndrome de Wiskott-Aldrich). Au niveau mondial, 2025 reste une année plus faible en « novel drugs » (46) que 2024 (53) et 2023 (70).","off":"La veille AMM reste dense : 38 nouvelles substances actives à intégrer dans les gammes officinales en 2026 — à croiser avec vos protocoles de délivrance.","src":[["EMA — Human medicines 2025","https://www.ema.europa.eu/en/news/human-medicines-2025"],["Br J Pharmacology (bilan)","https://bpspubs.onlinelibrary.wiley.com/doi/10.1111/bph.70376"]],"coi":"Indépendant","fin":"Rapport réglementaire public de l’Agence européenne des médicaments."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-04","titre":"Alerte : Garcinia cambogia toujours interdit à la vente en France (jusqu’en avril 2027)","subst":"Garcinia cambogia — « coupe-faim »","res":"L’interdiction de vente et d’importation des compléments alimentaires à base de Garcinia cambogia a été renouvelée par arrêté (avril 2026, effet jusqu’au 18 avril 2027), sur la base des conclusions de l’Anses du 12 février 2025 mettant en évidence un risque aigu lié à la consommation — 38 cas d’effets indésirables signalés en France entre 2009 et mars 2024, dont des effets graves.","off":"Refuser les demandes de coupe-faim à base de Garcinia (y compris achetés en ligne ou importés) et orienter vers la prise en charge hygiéno-diététique ou un avis médical.","src":[["Vidal","https://www.vidal.fr/actualites/37775-garcinia-cambogia-interdiction-de-vente-en-france-prolongee-jusqu-en-avril-2027.html"],["Ordre des pharmaciens (CNOP)","https://www.ordre.pharmacien.fr/les-communications/focus-sur/les-actualites/renouvellement-de-la-suspension-des-complements-alimentaires-a-base-de-garcinia-cambogia"]],"coi":"Indépendant","fin":"Évaluation de l’Anses (agence sanitaire publique) et arrêté ministériel français."},{"dom":"Soins primaires & Officine","type":"Officine","n":1,"dt":"2026-01","titre":"Déprescription pharmaceutique chez le sujet âgé : la méta-analyse de référence (BMC Geriatrics)","subst":"Bilan de médication et déprescription — polymédication du sujet âgé","res":"Revue systématique et méta-analyse (BMC Geriatrics) des interventions de déprescription conduites par des pharmaciens chez les patients âgés en polymédication : réduction des médicaments potentiellement inappropriés et des événements indésirables liés aux médicaments ; les auteurs appellent des essais plus larges, standardisés, avec suivi long terme et évaluations cliniques, économiques et rapportées par les patients. Un socle de preuves pour ancrer le rôle officinal dans la polypharmacie.","off":"Chez un patient âgé sous beaucoup de médicaments, proposez un bilan de médication : réduire ou arrêter certains traitements, sous surveillance et avec le médecin, c'est prouvé et plus sûr.","src":[["BMC Geriatrics 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/41514446/"],["Texte intégral (Springer)","https://link.springer.com/article/10.1186/s12877-025-06964-9"]],"coi":"Indépendant","fin":"Revue systématique académique en accès libre (BMC) ; pas de sponsor industriel identifié dans les sources consultées."},{"dom":"Soins primaires & Officine","type":"Officine","n":2,"dt":"2026-02","titre":"Pharmacien consultant à distance pour déprescrire opioïdes et benzodiazépines : essai randomisé en grappes (JAMA Network Open)","subst":"Service de pharmacien consultant centralisé — opioïdes et benzodiazépines au long cours chez le sujet âgé","res":"Essai randomisé en grappes (JAMA Network Open 2026 ;9(2):e2560581, équipe UNC) : des cliniques de soins primaires randomisées vers un service de pharmacien consultant centralisé — revue du dossier médical et du registre des ordonnances (PDMP), puis recommandations de réduction individualisées envoyées aux prescribers — vs soins usuels, chez les patients âgés sous opioïdes et/ou benzodiazépines au long cours (critères : exposition médicamenteuse et chutes). Modèle scalable : le pharmacien déporté renforce les cabinets sans alourdir l'équipe en place.","off":"Patients âgés sous opioïdes + benzodiazépines : signalez-les au médecin — des recommandations de réduction personnalisées, même établies à distance, aident à sécuriser la prescription.","src":[["JAMA Network Open 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/41746649/"],["Université UNC (Eshelman)","https://pharmacy.unc.edu/2026/03/04/new-unc-chapel-hill-study-explores-a-scalable-approach-to-safer-medication-use-in-older-adults/"]],"coi":"Indépendant","fin":"Essai académique (University of North Carolina) ; pas de financement industriel identifié dans les sources consultées."},{"dom":"Soins primaires & Officine","type":"Officine","n":3,"dt":"2026-04","titre":"Arrêter les benzodiazépines : réduction guidée par pharmacien + TCC « pleine conscience » (pilote JGIM)","subst":"Déprescription des benzodiazépines — programme virtuel de 10 semaines associant pharmacien et psychologue","res":"Essai pilote (Journal of General Internal Medicine 2026) chez les 65 ans et plus sous benzodiazépines au long cours : programme virtuel intégré aux soins primaires combinant un plan de réduction guidé par le pharmacien et 3 séances brèves de thérapie cognitivo-comportementale informée par la pleine conscience (psychologue). Faisabilité démontrée ; les entretiens qualitatifs montrent une auto-efficacité accrue et l'utilité perçue des deux composantes (pharmacien + psychologue).","off":"Arrêter un somnifère de la famille des benzodiazépines, ça se prépare : réduction progressive sur ~10 semaines avec un accompagnement, pas un arrêt brutal.","src":[["JGIM 2026 (Springer)","https://link.springer.com/article/10.1007/s11606-026-10356-z"],["Texte libre (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC13020675/"]],"coi":"Indépendant","fin":"Recherche académique (laboratoire Prescribing Wisely, Boston) ; essai pilote, résultats préliminaires avant essai randomisé de plus grande ampleur."},{"dom":"Soins primaires & Officine","type":"Officine","n":5,"dt":"2026-03","titre":"Dépistage cardiovasculaire au moment de la vaccination : l'officine, cadre idéal (revue de portée BMJ Open)","subst":"Dépistage cardiovasculaire intégré à la vaccination en officine (tension, fibrillation auriculaire, risque CV)","res":"Revue de portée (BMJ Open 2026 ;16:e108381) : l'officine est un cadre optimal pour intégrer des interventions de dépistage cardiovasculaire au service de vaccination (déjà fréquenté par les patients) ; les facilitateurs identifiés incluent la qualité de la formation des équipes, la complémentarité avec la généraliste et une gouvernance claire des résultats. Une piste de service concret à déployer côté comptoir.","off":"Profitez du passage pour le vaccin contre la grippe pour proposer un contrôle de tension ou de pouls : simple, opportun, et documenté comme faisable.","src":[["BMJ Open 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/41877336/"],["Texte intégral (BMJ Open)","https://bmjopen.bmj.com/content/16/3/e108381"]],"coi":"Indépendant","fin":"Revue académique en accès libre (BMJ Open) ; pas de financement industriel identifié."},{"dom":"Soins primaires & Officine","type":"Officine","n":5,"dt":"2026-08","titre":"CHAMP : le pharmacien au front du dépistage du cancer du poumon (essai stepped-wedge, Iowa)","subst":"Dépistage du cancer du poumon dirigé par le pharmacien — programme CHAMP dans 10 officines de l'Iowa","res":"Protocole d'essai randomisé en marches d'escalier (stepped-wedge) publié en 2026 : dépistage du cancer du poumon dirigé par le pharmacien dans 10 officines de l'Iowa, après une phase de faisabilité — alors que ~20 % seulement des personnes éligibles de l'Iowa sont dépistées malgré la couverture d'assurance et les recommandations USPSTF. Programme lancé en janvier 2026, soutenu par l'University of Iowa College of Pharmacy (financement Lilly) avec l'association des pharmaciens de l'Iowa et le réseau CPESN.","off":"Le dépistage du cancer du poumon reste trop rare : l'officine est en train de prouver qu'elle peut orienter efficacement vers le scanner faible dose.","src":[["Protocole (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42580402/"],["University of Iowa College of Pharmacy","https://pharmacy.uiowa.edu/news/2025/12/lilly-fuels-innovative-lung-cancer-screenings-iowa-pharmacies"]],"coi":"Industrie","fin":"Programme financé par Lilly via l'University of Iowa College of Pharmacy — le dépistage suit des recommandations standard, mais l'origine du financement doit être signalée."},{"dom":"Soins primaires & Officine","type":"Officine","n":5,"dt":"2026-06","titre":"Tests rapides (TRO) à l'officine et antibiotiques : faisabilité confirmée, rémunération à construire (JAC-AMR)","subst":"Tests au point de soins (PoCT) pour l'antibiothérapie des infections respiratoires en officine","res":"Revue de portée (JAC-Antimicrobial Resistance, juin 2026) sur les tests rapides au point de soins à l'officine dans les infections respiratoires : faisables pour améliorer l'antibiorésistance ; la montée en charge exige une formation des pharmaciens, la collaboration avec les généralistes et des modèles de rémunération adaptés. Des essais randomisés de haute qualité restent nécessaires pour confirmer l'efficacité et la coût-efficacité.","off":"Le test rapide au comptoir (angine, grippe, CRP selon les pays) aide à décider de l'antibiotique — son intérêt dépend surtout de son intégration au parcours de soin avec le médecin.","src":[["JAC-AMR 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42311604/"],["Texte intégral (Oxford)","https://academic.oup.com/jacamr/article/8/3/dlag106/8708765"]],"coi":"Indépendant","fin":"Revue académique (National Centre for Antimicrobial Stewardship) ; pas de financement industriel identifié dans les sources consultées."},{"dom":"Soins primaires & Officine","type":"Officine","n":5,"dt":"2026-06","titre":"Quels critères de résultat pour les soins primaires « conduits par le pharmacien » ? (revue de portée IJCP)","subst":"Évaluation des services de soins primaires pharmaceutiques — critères de résultats centrés patients","res":"Revue de portée (International Journal of Clinical Pharmacy, juin 2026) : le rôle des pharmaciens en soins primaires s'est rapidement étendu, porté par la pression sur la médecine généraliste et des financements publics (pleine étendue de pratique, coûts réduits pour les patients) ; les auteurs cartographient les critères de résultats patients utilisés pour évaluer ces services — un cadre utile pour structurer l'évaluation de vos propres services offici(na)ux.","off":"Un service pharmaceutique se défend d'autant mieux qu'il est mesuré : résultats cliniques, économiques et rapportés par le patient.","src":[["IJCP 2026 (Springer)","https://link.springer.com/article/10.1007/s11096-026-02179-z"],["Sommaire (springermedicine)","https://www.springermedicine.com/patient-health-outcomes-for-evaluation-of-pharmacist-led-primary/52817182"]],"coi":"Indépendant","fin":"Revue académique (équipe universitaire, accès éditeur) ; pas de financement industriel identifié dans les sources consultées."},{"dom":"Soins primaires & Officine","type":"Officine","n":4,"dt":"2026-10","titre":"Angleterre : les pharmaciens prescripteurs entrent dans Pharmacy First (29 octobre 2026)","subst":"Pharmacy First — service national anglais, extension de l'ordonnance par pharmacien prescripteur indépendant","res":"Angleterre : à partir du 29 octobre 2026, les officines approuvées disposant d'un pharmacien prescripteur indépendant peuvent prescrire dans le cadre du service national Pharmacy First (les obligations incluent la traçabilité des consultations dans le système clinique et l'envoi d'un résumé au médecin via NHS.net). Lancé en janvier 2024 pour désengorger les généralistes, le service comptait déjà plus de 3,3 millions de consultations — l'officine s'installe comme un vrai relais de soins primaires, avec ordonnance.","off":"À l'étranger, le pharmacien d'officine traite et prescrit désormais certaines pathologies courantes — une piste de croissance pour la pharmacie française.","src":[["Community Pharmacy England — service","https://cpe.org.uk/national-pharmacy-services/advanced-services/pharmacy-first-service/"],["CPE — prescription dès le 29 oct. 2026","https://cpe.org.uk/our-news/prescribing-within-the-cpcf-commences-today/"]],"coi":"Indépendant","fin":"Politique publique britannique (NHS England / DHSC) relayée par Community Pharmacy England ; pas d'acteur privé en propre."},{"dom":"Économie de la Santé","type":"Économie","n":5,"dt":"2026-07","titre":"GLP-1 et obésité : coût-efficaces mais insoutenables pour les budgets, tranche l'ICER","subst":"Agonistes GLP-1 (sémaglutide, tirzépatide, orforglipron) — évaluation économique et impact budgétaire","res":"Rapport de l'ICER : les agonistes GLP-1 dans l'obésité sont jugés coût-efficaces sur le long terme (via la réduction des complications cardio-métaboliques), mais leur impact budgétaire immédiat est jugé trop lourd pour les payeurs américains au prix actuel. En réponse, le programme fédéral Medicare GLP-1 Bridge (lancé le 1er juillet 2026, jusqu'au 31 décembre 2027) offre aux bénéficiaires éligibles Wegovy, orforglipron (Foundayo) ou Zepbound KwikPen à tarif fixe négocié.","off":"Ces médicaments « minceur » sont efficaces, mais leur prix est le nerf de la guerre : payeurs et fabricants négocient désormais frontalement.","src":[["Drug Topics (rapport ICER)","https://www.drugtopics.com/view/icer-report-finds-glp-1s-are-cost-effective-but-warns-of-budget-strain"]],"coi":"Indépendant","fin":"ICER : institut indépendant d'évaluation en santé financé par des cotisations publiques et privées multiples, pas par les fabricants des médicaments évalués."},{"dom":"Économie de la Santé","type":"Économie","n":4,"dt":"2026-01","titre":"Biosimilaires : 75 milliards d'euros d'économies cumulées en Europe (IQVIA)","subst":"Concurrence des biosimilaires en Europe — économies pour les systèmes de santé","res":"Scorecards 2026 de l'IQVIA Institute : les économies cumulées générées par la concurrence des biosimilaires en Europe atteignent ≈ 75 Md€ à prix catalogue au 1er juillet 2025 (dont ≈ 64 Md€ en Europe de l'Ouest et ≈ 11 Md€ en Europe centrale et orientale) ; l'EMA avait approuvé 126 biosimilaires à juin 2025. Des économies qui peuvent financer l'accès aux innovations (dont GLP-1).","off":"Substituer par un biosimilaire, c'est financer l'innovation ailleurs : à l'échelle européenne, ce sont des dizaines de milliards d'euros libérés.","src":[["Euractiv (scorecards IQVIA)","https://www.euractiv.com/news/biosimilars-reshape-immunology-care-across-eu-a-decade-after-market-entry/"],["Rapport IQVIA 2026","https://www.iqvia.com/insights/the-iqvia-institute/reports-and-publications/reports/biosimilar-sustainability-scorecards-for-europe-2026"]],"coi":"À vérifier","fin":"IQVIA Institute : cabinet de conseil dont les clients incluent l'industrie pharmaceutique — chiffres de marché de référence, mais conflits d'intérêts structurels à garder en tête."},{"dom":"Économie de la Santé","type":"Économie","n":4,"dt":"2026-01","titre":"France : 27,2 milliards d'euros de médicaments remboursés — l'assurance maladie alerte sur l'innovation chère","subst":"Dépense de médicaments en France — chiffres-clés Cnam (janvier 2026)","res":"Chiffres-clés de l'Assurance Maladie (janv. 2026) : remboursements de médicaments à 27,2 Md€ en 2024 (+7,2 % sur un an, +19 % en cinq ans), soit 26 % des dépenses de soins de ville ; en dix ans, les antinéoplasiques passent de la 9e à la 1re place (0,87 → 3,35 Md€) et les immunosuppresseurs doublent (1,37 → 3,04 Md€). La Cnam alerte : une vingtaine de médicaments coûtent plus de 80 000 € par an et par patient, et elle entend « traquer » les traitements sans progrès thérapeutique réel ; 6,2 Md€ de remises accordées aux organismes contiennent déjà la dépense.","off":"L'explosion des thérapies innovantes (oncologie, immunologie) se paie collectivement — la substitution générique/biosimilaire reste votre levier d'économies le plus direct au comptoir.","src":[["Assurance Maladie (presse)","https://www.assurance-maladie.ameli.fr/presse/2026-01-14-dp-medicaments"],["Le Moniteur des pharmacies","https://www.lemoniteurdespharmacies.fr/profession/socio-professionnel/medicament-ces-62-milliards-deuros-de-remises-qui-contiennent-la-depense"]],"coi":"Indépendant","fin":"Données officielles de la Caisse nationale de l'Assurance Maladie (presse du 14 janvier 2026), agence publique."},{"dom":"Économie de la Santé","type":"Économie","n":1,"dt":"2026-02","titre":"Bilan de médication : que valent les économies de la déprescription ? (revue JACCP)","subst":"Coût-utilité des interventions de déprescription pharmaceutique chez le sujet âgé à domicile","res":"Revue systématique (Journal of the American College of Clinical Pharmacy 2026 ; e70166) des analyses coût-utilité des interventions de déprescription conduites par des pharmaciens chez les adultes âgés vivant à domicile : première synthèse dédiée à la valeur économique du bilan de médication — un appui pour défendre le financement des services offici(na)ux (CPAM, réseaux) sur des données, pas seulement sur des convictions.","off":"Réduire les médicaments inutiles n'est pas qu'une question de sécurité : c'est aussi une économie documentée pour le système de santé.","src":[["JACCP 2026 (Wiley)","https://accpjournals.onlinelibrary.wiley.com/doi/10.1002/jac5.70166"]],"coi":"Indépendant","fin":"Revue académique (JACCP / American College of Clinical Pharmacy) ; pas de financement industriel identifié dans les sources consultées."},{"dom":"Économie de la Santé","type":"Économie","n":1,"dt":"2026-02","titre":"CAR-T : des guérisons spectaculaires, un prix qui interroge (revue PharmacoEconomics + Stanford)","subst":"Thérapies CAR-T en onco-hématologie — coût-efficacité et soutenabilité","res":"Revue systématique actualisée (PharmacoEconomics-Open) : les CAR-T offrent des gains de santé substantiels dans les hémopathies, mais la part du rapport coût-efficacité imputable au prix du produit lui-même (vs aux coûts des soins standards) reste difficile à établir ; l'analyse HMPI (Stanford, févr. 2026) documente des coûts croissants dans un marché en pleine expansion — la soutenabilité pour les systèmes de santé est posée, alors que la classe s'étend à sept produits autorisés depuis 2017.","off":"Des traitements personnalisés à plusieurs centaines de milliers d'euros la dose : le défi n'est plus seulement médical, il est économique.","src":[["Revue systématique (Springer)","https://link.springer.com/article/10.1007/s41669-025-00614-x"],["HMPI / Stanford (févr. 2026)","https://hmpi.org/2026/02/18/car-t-therapy-escalating-costs-in-an-expanding-market/"]],"coi":"Indépendant","fin":"Analyses académiques (Stanford ; revue Springer Nature) ; pas de financement industriel identifié dans les sources consultées."},{"dom":"Économie de la Santé","type":"Économie","n":5,"dt":"2025-12","titre":"NICE relève ses seuils de coût-efficacité pour la première fois — sous pression commerciale américaine","subst":"Politique de prix du médicament au Royaume-Uni — seuils NICE (£/QALY) et accord commercial UK–US","res":"Le 1er décembre 2025, le gouvernement britannique a annoncé la première hausse historique des seuils de coût-efficacité utilisés par NICE pour juger les nouveaux médicaments (appliquée à partir d'avril 2026) : le NHS pourra dépenser environ 25 % de plus par QALY gagnée — un assouplissement lié à l'accord commercial Royaume-Uni–États-Unis (hausse des prix britanniques estimée à ~1 Md£ sur 3 ans pour le NHS). Le seuil de coût-efficacité devient un instrument de politique commerciale, pas seulement sanitaire.","off":"Les anglo-saxons assument un « prix du progrès » plus élevé ; en France, c'est la HAS et la négociation CEPS qui tiennent ce rôle — à suivre dans les débats de financement.","src":[["NICE (annonce officielle)","https://www.nice.org.uk/news/articles/changes-to-nice-s-cost-effectiveness-thresholds-confirmed"],["Pharmaceutical Journal","https://pharmaceutical-journal.com/article/news/nice-cost-effectiveness-thresholds-increased-as-uk-strikes-trade-deal-with-united-states"]],"coi":"Indépendant","fin":"Décision du gouvernement britannique communiquée par NICE (organisme public) ; analyse du Pharmaceutical Journal."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2025-06","titre":"CagriSema : −22,7 % de poids en phase 3 (REDEFINE-1, NEJM) — l’amyline entre en scène","subst":"CagriSema (cagrilintide + sémaglutide) — analogue d’amyline + GLP-1 en injection hebdomadaire","res":"Première combinaison fixe amyline + GLP-1 : dans REDEFINE-1 (phase 3, 3 417 adultes obèses/en surpoids, NEJM du 22 juin 2025), −22,7 % de poids moyen sous CagriSema 2,4/2,4 mg, significativement supérieur au sémaglutide seul et au placebo ; REDEFINE-2 confirme la supériorité chez le patient obèse avec DT2. Dossier d’AMM en cours d’examen — pas encore disponible.","off":"Une seule injection hebdomadaire combinant deux hormones satiétogènes arrive dans le tour de pipe-line : plus puissante que le sémaglutide seul, mais à ne pas survendre avant l’AMM.","src":[["HCPLive (REDEFINE-1)","https://www.hcplive.com/view/cagrisema-achieves-22-7-weight-loss-in-phase-3-redefine-1-trial"],["Novo Nordisk (communiqué NEJM)","https://www.prnewswire.com/news-releases/cagrisema-2-4-mg--2-4-mg-demonstrated-22-7-mean-weight-reduction-in-adults-with-overweight-or-obesity-in-redefine-1--published-in-nejm-302487770.html"]],"coi":"Industrie","fin":"Programme REDEFINE sponsorisé par Novo Nordisk, fabricant du CagriSema ; données d’abord annoncées par communiqué, puis publiées dans le NEJM."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2026-10","titre":"Retatrutide : jusqu’à −20,8 % chez l’obèse diabétique (TRIUMPH-2), le triple agoniste confirme","subst":"Retatrutide — triple agoniste GIP + GLP-1 + glucagon (Lilly, hebdomadaire)","res":"Premier agoniste triple hormonal : dans TRIUMPH-2 (phase 3, obésité + DT2), −49,6 lbs (−20,8 %) de poids en 80 semaines à la dose de 12 mg, et plus de la moitié des participants ne répondaient plus aux critères d’IMC d’obésité ; les essais de phase 3 du programme TRIUMPH (dont TRIUMPH-4, jusqu’à −28,7 %) s’enchaînent avec dépôt d’AMM attendu. La 4e génération d’incrétines prend forme.","off":"Les médicaments de la génération suivante (3 hormones en une) perdent davantage de poids que le sémaglutide ou le tirzépatide — mais rien n’est disponible en pharmacie aujourd’hui.","src":[["Lilly (communiqué TRIUMPH-2)","https://www.prnewswire.com/news-releases/lillys-triple-agonist-retatrutide-delivered-substantial-weight-loss-and-a1c-reduction-underscoring-its-potential-promise-for-people-with-obesity-and-type-2-diabetes-302891798.html"],["Medical Xpress (TRIUMPH-2)","https://medicalxpress.com/news/2026-10-triple-action-drug-retatrutide-major.html"]],"coi":"Industrie","fin":"Programme TRIUMPH sponsorisé par Eli Lilly, fabricant du retatrutide ; résultats pré-AMM, issus pour partie de communiqués de presse."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":2,"dt":"2026-06","titre":"DT2 : le retatrutide conclut avec succès son premier essai de phase 3 (TRANSCEND-T2D-1, Lancet)","subst":"Retatrutide dans le diabète de type 2 — triple agoniste GIP/GLP-1/glucagon","res":"Topline positif (Lilly, 19 mars 2026) puis publication dans The Lancet (juin 2026) : réductions significatives de l’HbA1c et du poids dans le premier essai de phase 3 du triple agoniste dans le diabète de type 2. Après l’icodec hebdomadaire, le DT2 voit se profiler une option encore plus puissante que les bi-agonistes — utile aussi chez le patient DT2 obèse.","off":"Pour le diabète de type 2, l’arme du futur combine trois hormones — plus efficace sur la glycémie ET le poids, mais pas avant plusieurs années.","src":[["Eli Lilly (topline TRANSCEND-T2D-1)","https://investor.lilly.com/news-releases/news-release-details/lillys-triple-agonist-retatrutide-demonstrated-significant"],["The Lancet (publication juin 2026) via suivi d’actualité","https://www.retaweightloss.com/article/complete-retatrutide-guide-2026-phase-3-trials-timeline-whats-next"]],"coi":"Industrie","fin":"Essai sponsorisé par Eli Lilly ; résultats d’abord annoncés par communiqué avant publication dans une revue à comité de lecture."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2026-07","titre":"Néphropathie à IgA : l’atacicept (Trutakna) obtient une AMM accélérée de la FDA","subst":"Atacicept (Trutakna) — inhibiteur BAFF/APRIL auto-injectable hebdomadaire, néphropathie à IgA","res":"AMM accélérée FDA (7 juillet 2026) pour réduire la protéinurie de l’adulte dans la néphropathie à IgA primitive à risque de progression (essai ORIGIN 3) : auto-injection sous-cutanée hebdomadaire. C’est la 4e thérapie approuvée en procédure accélérée depuis 2024 dans cette glomérulonéphrite — après le budsésonide à libération ciblée et le sparsentan ; données confirmatoires sur le déclin du DFG attendues (dossier complémentaire visé fin 2026).","off":"La
