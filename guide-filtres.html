crohn-s-disease-in-phase-3-fuz"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les patients Crohn avec fistules périnéales sous guselkumab, rappeler l'hygiène locale, la surveillance des surinfections et la bonne conservation du stylo ; aucune spécialité disponible en France n'a (encore) cette indication — ne jamais conseiller d'automédication sur une fistule active."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2026-06","titre":"Tulisokibart (anti-TL1A) : premier signal de phase 3 positif dans la rectocolite hémorragique (ATLAS-UC)","subst":"tulisokibart · MK-7240 · anti-TL1A · rectocolite hémorragique","res":"Programme ATLAS-UC (deux essais randomisés, en double aveugle, vs placebo) : le tulisokibart, anticorps anti-TL1A (Merck), atteint la rémission clinique à la semaine 12 en phase 3 d'induction — premier signal de phase 3 positif pour la classe anti-TL1A dans la RCH. Résultats topline (chiffres détaillés à venir en congrès), tolérance cohérente avec la phase 2. Source vue : HCPLive daté 22/06/2026. Développement Merck.","src":[["HCPLive (22/06/2026)","https://www.hcplive.com/view/tulisokibart-phase-3-endpoints-ulcerative-colitis-anti-tl1a"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas encore de médicament disponible — à suivre comme voie anti-inflammatoire/anti-fibrose à venir ; pour les patients RCH, l'actualité ne change rien aux traitements en cours (mésalazine, biothérapies) ni à la vigilance sur les rectorragies et la déshydratation."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2026-10","titre":"AFFIRM : l'induction sous-cutanée du risankizumab efficace dans la maladie de Crohn modérée à sévère","subst":"risankizumab · Skyrizi · Crohn · induction sous-cutanée","res":"Nouvelles données de phase 3 (AFFIRM) présentées par AbbVie le 13 octobre 2026 : l'induction sous-cutanée du risankizumab (Skyrizi) montre des taux élevés de rémission clinique et de réponse endoscopique dans la maladie de Crohn modérée à sévère ; ces données soutiennent la demande d'approbation d'un schéma d'induction sous-cutané auprès de la FDA (le risankizumab IV et le schéma d'entretien SC sont déjà approuvés). Source vue : communiqué AbbVie daté 13/10/2026. Sponsor : AbbVie.","src":[["AbbVie (13/10/2026)","https://news.abbvie.com/2026-10-13-AbbVie-Presents-New-Phase-3-AFFIRM-Data-Showing-Clinical-and-Endoscopic-Outcomes-With-Subcutaneous-SKYRIZI-risankizumab-rzaa-in-Patients-With-Moderately-to-Severely-Active-Crohns-Disease"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour un patient déjà sous Skyrizi, la perspective d'une induction à l'officine par stylo auto-injecteur simplifierait le parcours (moins d'hôpital de jour) ; toujours vérérer le respect du rythme d'entretien (toutes les 8 semaines) et signaler fièvre/infections avant l'injection."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2025-08","titre":"TRIUMpH : le tégorprazan (P-CAB) supérieur au lansoprazole dans le maintien de la cicatrisation de l'œsophagite (RGO)","subst":"tégorprazan · RGO · œsophagite érosive · pompe à protons potassium-competitive","res":"Programme TRIUMpH de phase 3 (Sebela/Braintree, communiqué daté du 7 août 2025) : dans la phase de maintien de 24 semaines, le tégorprazan — inhibiteur de la pompe à protons à base de potassium (P-CAB) — montre une cicatrisation de l'œsophagite érosive statistiquement supérieure au lansoprazole 15 mg, sur tous les grades LA (A-D) et chez les patients les plus sévères (grades C/D), avec un profil de sécurité et des gastrines sériques restées dans les limites normales ; dossier FDA (œsophagite érosive + NERD) prévu au T4 2025. Sources vues : PRNewswire daté 07/08/2025, Applied Clinical Trials. Sponsor : Sebela.","src":[["PRNewswire (07/08/2025)","https://www.prnewswire.com/news-releases/sebela-pharmaceuticals-announces-successful-completion-of-phase-3-triumph-program-of-tegoprazan-in-gerd-with-positive-24-week-maintenance-phase-results-302524332.html"],["Applied Clinical Trials","https://www.appliedclinicaltrialsonline.com/view/tegoprazan-superior-maintenance-healing-triumph-study-gastroesophageal-reflux-disease"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le tégorprazan n'est pas encore approuvé ; pour l'heure, IPP et alginates restent la base du conseil RGO — la classe P-CAB à action rapide pourrait arriver comme option nouvelle, en attendant rappeler la prise 30 min avant le repas pour les IPP et les règles hygiéno-diététiques."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":4,"dt":"2025-12","titre":"Bulévirtide : dix ans de données vie réelle dans l'hépatite delta chronique (cohorte allemande, JGLD)","subst":"bulévirtide · hépatite D/delta · Hepcludex · vie réelle","res":"Étude de vie réelle (Journal of Gastrointestinal and Liver Diseases, 2025 Dec;34(4):467-73, date vue dans la page éditeur et PubMed 41453086) : dix ans d'utilisation du bulévirtide (premier traitement direct de l'hépatite delta, entrée précoce allemande puis AMM conditionnelle EMA) — les données vie réelle consolident son rôle dans une maladie jusqu'alors sans option (l'interféron off-label étant peu efficace et mal toléré). Chiffres détaillés non reproduits ici (abstract partiellement lu).","src":[["JGLD (2025 Dec;34(4):467-73)","https://jgld.ro/jgld/index.php/jgld/article/view/6501"],["PubMed 41453086","https://pubmed.ncbi.nlm.nih.gov/41453086/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le bulévirtide (Hepcludex) se délivre en rétrocession hospitalière ; à l'officine, connaître son existence pour orienter les co-infectés VHB/VDH, et rappeler que la vaccination contre l'hépatite B reste le meilleur moyen de prévenir l'hépatite D."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2026-08","titre":"CROSSING : le tézépélumab (anti-TSLP) positif en phase 3 dans l'œsophagite à éosinophiles — nouvel usage au-delà de l'asthme","subst":"tézépélumab · Tezspire · œsophagite à éosinophiles · anti-TSLP","res":"Essai de phase 3 CROSSING (Amgen, communiqué d'août 2026) : le tézépélumab — anticorps anti-TSLP déjà connu pour l'asthme sévère (usage distinct en base) — atteint les co-critères principaux et tous les critères secondaires clés dans l'œsophagite à éosinophiles (OÉE) ; un second communiqué (octobre 2026) rapporte la rémission histologique et l'amélioration des symptômes. Sources vues : communiqués Amgen (URL datée 2026/08 et 2026/10), APFED Research Round-Up automne 2026. Sponsor : Amgen (avec AstraZeneca).","src":[["Amgen (août 2026)","https://www.amgen.com/newsroom/press-releases/2026/08/tezspire-demonstrates-positive-phase-3-results-in-eosinophilic-esophagitis-across-both-co-primary-and-all-key-secondary-endpoints"],["APFED (automne 2026)","https://apfed.org/blog/research-round-up-fall-2026/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les patients OÉE (dysphagie, impactions alimentaires), le conseil reste l'adaptation alimentaire (aliments mixés, éviter les prises trop volumineuses) ; les inhibiteurs de pompe à protons à forte dose restent le premier traitement — le tézépélumab n'est pas (encore) approuvé dans cette indication."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":3,"dt":"2026-01","titre":"TrIuMPH : la première thérapie « microbiome full-spectrum » orale positive en phase 2a dans le syndrome de l'intestin irritable","subst":"EBX-102-02 · EnteroBiotix · microbiote · SII · dysbiose","res":"Essai de phase 2a randomisé TrIuMPH (résultats finaux annoncés le 8 janvier 2026) : EBX-102-02, thérapie orale « full-spectrum » à base de microbiote (EnteroBiotix, Glasgow), améliore de façon cliniquement significative la sévérité globale des symptômes du SII dès la semaine 1, avec un effet entretenu jusqu'à la semaine 7 et supérieur au placebo, chez les SII-constipation et SII-diarrhée. Sources vues : communiqué GlobeNewswire daté 08/01/2026, HCPLive. Sponsor : EnteroBiotix.","src":[["GlobeNewswire (08/01/2026)","https://www.globenewswire.com/news-release/2026/01/08/3215080/0/en/EnteroBiotix-announces-positive-Phase-2-TrIuMPH-results-supporting-EBX-102-02-as-a-potential-first-in-class-oral-full-spectrum-microbiome-therapy-for-irritable-bowel-syndrome.html"],["HCPLive","https://www.hcplive.com/view/ebx-102-02-shows-benefit-for-ibs-c-and-ibs-d-in-phase-2a-triumph-trial"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ce n'est pas un probiotique standard du rayon — piste « médicament de demain » fondée sur la dysbiose ; aujourd'hui, la base du conseil SII reste fibres solubles (psyllium), régularité des repas et, si régime pauvre en FODMAP envisagé, un accompagnement diététique pour éviter les carences."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":3,"dt":"2026-11","titre":"Premier essai chez l'homme d'une thérapie ARNi (Regeneron) dans la stéatose hépatique métabolique (MASLD)","subst":"ARN interférent · Regeneron · MASLD · stéatose hépatique","res":"Premiers résultats chez l'homme (first-in-human) présentés au Liver Meeting 2026 (AASLD, Denver) et publiés dans le NEJM selon la couverture datée du 12/11/2026 : la thérapie ARNi expérimentale de Regeneron réduit la graisse hépatique des adultes atteints de MASLD (phase précoce — design détaillé non lisible dans les extraits vus, résultats chiffrés non reproduits). Source vue : News-Medical daté 12/11/2026. Sponsor : Regeneron.","src":[["News-Medical (12/11/2026)","https://www.news-medical.net/news/20261112/Richmond-Pharmacology-highlights-encouraging-first-in-human-results-for-Regenerons-investigational-RNAi-therapy-in-MASLD.aspx"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Rien d'utilisable en 2026 — pour le foie gras, la base reste la perte de poids (les GLP-1 et l'activité physique sont déjà documentés dans la base) ; à retenir comme signe que le MASLD devient une cible pharmacologique majeure après le resmétírom."},{"dom":"Néphrologie","type":"Médicament","n":3,"dt":"2025-01","titre":"Dapagliflozin + tolvaptan dans la polykystose rénale (ADPKD) : essai croisé randomisé ouvert, volume rénal significativement freiné","subst":"dapagliflozin (SGLT2) · tolvaptan · ADPKD · polykystose","res":"Essai randomisé contrôlé croisé ouvert japonais (Kidney Int Rep 2025 Jan 18;10(4):1063-1075, PubMed 40303212) : chez des patients ADPKD déjà sous tolvaptan, la variation de volume rénal total (TKV) à 6 mois est de −0,44 ± 4,91 % avec dapagliflozin vs +5,04 ± 8,09 % sans (P = 0,01) — effet additif possible du SGLT2i sur la progression ADPKD, population exclue des grands essais SGLT2i. Nouvel usage du dapagliflozin (déjà en base pour DELIVER et DAPA-CKD, usages IC et MRC) : ADPKD sous tolvaptan. Essai croisé de petite taille : à confirmer en phase 3 de grande ampleur.","src":[["PubMed 40303212 (citation : 2025 Jan 18;10(4):1063-1075)","https://pubmed.ncbi.nlm.nih.gov/40303212/"],["Kidney International Reports (fulltext, vu en résultats)","https://www.kireports.org/article/S2468-0249(25)00048-8/fulltext"],["ISN Global Trials Focus — Trial of the month (commentaire, vu)","https://www.theisn.org/blog/2025/06/30/explore-the-latest-isn-global-trials-focus-selections-featuring-a-trial-of-the-month-on-the-effect-of-dapagliflozin-in-patients-with-adpkd-receiving-tolvaptan/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ne pas généraliser au comptoir — le Forxiga n'a PAS d'indication ADPKD ; message utile = l'hydratation abondante reste la mesure non médicamenteuse de référence dans la polykystose, et tout nouveau traitement se discute avec le néphrologue."},{"dom":"Néphrologie","type":"Alimentation","n":3,"dt":"2025-04","titre":"Manger dans une fenêtre de temps (time-restricted eating) dans la polykystose rénale : RCT pilote 12 mois — la perte de poids compte plus que l'horaire","subst":"time-restricted eating · jeûne · ADPKD · polykystose","res":"Essai randomisé contrôlé pilote 12 mois (Clin Kidney J, Volume 18, Issue 4, April 2025, sfaf069 ; PubMed 40207097 « 2025 Mar 3;18(4):sfaf069 », eCollection avril 2025) : alimentation restreinte dans le temps (TRE) vs alimentation saine (HE) dans l'ADPKD. Les deux groupes perdent un poids modeste à 12 mois ; l'objectif d'adhérence ≥ 75 % à la TRE n'est PAS atteint, et la perte de poids/adiposité semble être le vrai moteur plutôt que le rythme horaire des repas. Nouvel usage du jeûne intermittent (déjà en base pour poids/risque cardiométabolique, méta BMJ) : néphrologie/ADPKD — essai pilote, preuve limitée.","src":[["PubMed 40207097 (citation : 2025 Mar 3;18(4):sfaf069, eCollection 2025 Apr)","https://pubmed.ncbi.nlm.nih.gov/40207097/"],["Clinical Kidney Journal — Volume 18, Issue 4, April 2025 (page vue en résultats)","https://academic.oup.com/ckj/article/18/4/sfaf069/8051351"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour le patient polykystique qui veut « jeûner », pas de panique ni de promesse : ce qui compte semble être le poids et l'hydratation régulière — le tolvaptan impose de boire abondamment, incompatible avec des restrictions hydriques drastiques du jeûne."},{"dom":"Néphrologie","type":"Médicament","n":4,"dt":"2025-05","titre":"MARKISIO : aucun biomarqueur rénal ne prédit de façon fiable le besoin de dialyse après un AIG sévère en réanimation","subst":"AKI · blessure rénale aiguë · biomarqueurs · dialyse","res":"Étude prospective MARKISIO (Crit Care 2025 May 20;29(1):204, PubMed 40394608) chez des patients de réanimation avec AKI sévère : en analyse multivariée, AUC des biomarqueurs pour prédire la nécessité d'épuration extrarénale dans les 72 h non significative — les biomarqueurs montent mais ne prédisent pas l'intervention, creux persistant entre signal biologique et décision clinique. Utile pour tempérer la « biomarqueur-manie » : le dialogue clinique (diurèse, contexte, créatinine) reste central. Peu actionnable directement au comptoir mais utile pour le pharmacien hospitalier et pour comprendre pourquoi aucun test précoce d'AKI n'est disponible en ville.","src":[["PubMed 40394608 (citation : 2025 May 20;29(1):204)","https://pubmed.ncbi.nlm.nih.gov/40394608/"],["Critical Care — MARKISIO (article Springer, vu en résultats)","https://link.springer.com/article/10.1186/s13054-025-05439-y"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas de test prédictif d'insuffisance rénale aiguë en pharmacie ; devant un patient sous IEC/ARA2 + diurétique + AINS (« triple whammy ») avec diarrhées ou vomissements, c'est la clinique qui doit alerter — conseiller d'arrêter transitoirement l'AINS et de consulter."},{"dom":"Néphrologie","type":"Médicament","n":1,"dt":"2025-03","titre":"Bicarbonate de sodium dans l'acidose métabolique de l'insuffisance rénale chronique : revue systématique et méta-analyse — balance efficacité/sécurité encore incertaine","subst":"bicarbonate de sodium · acidose métabolique · IRC · néphroprotection","res":"Revue systématique et méta-analyse (World J Methodol 2025;14(1):101078, « Published online: March 25, 2025 » vu sur la page éditeur ; PubMed 40134641) : le bicarbonate de sodium oral peut corriger l'acidose métabolique de l'IRC et ralentir possiblement la progression, mais le profil de sécurité global et l'efficacité restent incertains — conclusions prudentes, pas de dose standard validée. Journal de rang secondaire (Baishideng) : à citer comme signal d'incertitude, pas comme preuve forte.","src":[["World Journal of Methodology — page éditeur (« Published online: March 25, 2025 », vue)","https://www.wjgnet.com/2220-6124/full/v14/i1/101078.htm"],["PubMed 40134641","https://pubmed.ncbi.nlm.nih.gov/40134641/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le bicarbonate de sodium reste hors automédication dans l'IRC — jamais conseillé seul au comptoir (charge sodée, HTA, œdèmes) ; si un patient IRC s'en procure pour « protéger ses reins », l'orienter vers son néphrologue et rappeler que la néphroprotection validée reste IEC/ARA2, SGLT2i et contrôle tensionnel."},{"dom":"Néphrologie","type":"Médicament","n":1,"dt":"2026-08","titre":"Dénervation rénale dans l'HTA du patient insuffisant rénal : méta-analyse — baisse tensionnelle sans altérer la fonction rénale","subst":"dénervation rénale · HTA résistante · IRC","res":"Revue systématique et méta-analyse (PubMed 42601755, citation « 2026 Aug 14;105(33):e50220 ») : la dénervation rénale (RDN) abaisse la pression artérielle des patients IRC y compris stades avancés, sans compromettre la fonction rénale et avec un profil de sécurité acceptable — en appoint dans l'HTA résistante. Conclusion prudente : effets basés sur des critères tensionnels, données à long terme limitées. Concerne le pharmacien hospitalier/équipes HTA ; au comptoir, l'essentiel reste l'observance des 4-5 antihypertenseurs du patient résistant.","src":[["PubMed 42601755 (citation : 2026 Aug 14;105(33):e50220)","https://pubmed.ncbi.nlm.nih.gov/42601755/"],["Eur J Med Res — méta-analyse time-stratified RDN/CKD (Springer, vu en résultats ; mois non vérifié — source secondaire)","https://link.springer.com/article/10.1186/s40001-026-05010-7"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un patient « opéré de la tension » (dénervation) garde ses médicaments et son automesure — l'efficacité est complémentaire, pas une guérison ; vérifier la poursuite du traitement anti-HTA et le suivi biologique rénal (kaliémie, créatinine) inchangés."},{"dom":"Néphrologie","type":"Médicament","n":4,"dt":"2026-05","titre":"Citrate au long cours chez les lithiasiques à haut risque : sûr métaboliquement à long terme (étude suisse)","subst":"citrate de potassium · lithiase · hypocitraturie · prévention récidive","res":"Étude suisse de cohorte Clin Kidney J (Volume 19, Issue 5, May 2026, sfag058 ; PubMed 42147788) chez des formateurs de calculs à haut risque : le traitement citraté au long cours apparaît métaboliquement sûr (pas d'effet métabolique indésirable), réduit sélectivement la sursaturation en acide urique ; la récidive plus fréquente chez les traités reflète vraisemblablement un risque de base différent (patients plus sévères traités). Utile : le citrate de potassium reste la pierre angulaire de la prévention de la lithiase hypocitraturique, avec prudence chez les formateurs de phosphate de calcium et les IRC (revue CKJ 2025 lue en extraits).","src":[["PubMed 42147788","https://pubmed.ncbi.nlm.nih.gov/42147788/"],["Clinical Kidney Journal 19(5), May 2026 — page issue vue (« 19 | 5 | May 2026 »)","https://academic.oup.com/ckj/issue/19/5"],["CKJ — revue « Citrate and calcium kidney stones » 18(9) 2025 (vue en résultats, contexte)","https://academic.oup.com/ckj/article/18/9/sfaf244/8221902"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Hydratation abondante et régulière (> 2 L/j répartis, y compris la nuit) reste le socle ; le citrate est un traitement prescrit et suivi (kaliémie, pH urinaire) — jamais en automédication, surtout si IEC/ARA2/épargneurs de potassium associés ; éviter les charges sodées (charcuteries) qui augmentent le calcium urinaire."},{"dom":"Santé du voyageur","type":"Médicament","n":3,"dt":"2025-03","titre":"Tradipitant (antagoniste NK1) efficace dans le mal des transports : RCT multicentrique — puis 1re autorisation en 40 ans (FDA, 30/12/2025)","subst":"tradipitant · mal des transports · cinétose · NK1 · voyage","res":"Essai randomisé multicentrique double aveugle vs placebo « Motion Syros » (Frontiers in Neurology, PubMed 40103934 « 2025 Mar 4:16:1550670 ») : le tradipitant, antagoniste oral du récepteur neurokinine-1, est efficace sur les nausées et vomissements induits par le mouvement. La FDA a ensuite approuvé le tradipitant (NEREUS) le 30 décembre 2025 pour la prévention des vomissements induits par le mal des transports — première autorisation en ~40 ans depuis le patch de scopolamine (communiqués HCPLive/Drug Topics vus, FDA 30/12/2025 ; Calmiant non anticholinergique mais sédation signalée dans le labeling).","src":[["PubMed 40103934 (citation : 2025 Mar 4:16:1550670)","https://pubmed.ncbi.nlm.nih.gov/40103934/"],["Frontiers in Neurology — Motion Syros (page article, vue)","https://www.frontiersin.org/journals/neurology/articles/10.3389/fneur.2025.1550670/full"],["HCPLive — FDA Approves Tradipitant (NEREUS) (30/12/2025, vu)","https://www.hcplive.com/view/fda-approves-tradipitant-nereus-for-the-prevention-of-vomiting-induced-by-motion"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour le voyageur sujet au mal des transports, les repères actuels restent le côté avant/axe du véhicule, la lecture évitée, la scopolamine ou les antihistaminiques sédatifs ; le tradipitant est une piste américaine à venir — pas encore disponible en France, pas d'autorisation européenne connue à ce jour."},{"dom":"Santé du voyageur","type":"Vaccin","n":4,"dt":"2026-08","titre":"Vaccin contre la dengue (Qdenga/TAK-003) chez le voyageur : mêmes preuves, recommandations divergentes selon les pays — analyse comparative","subst":"Qdenga · TAK-003 · dengue · voyageur · vaccination","res":"Analyse comparative internationale (J Travel Med, Volume 33, Issue 6, August 2026, taag065 ; PubMed 42485451) : face aux mêmes données d'efficacité du vaccin vivant atténué Qdenga (TAK-003), les comités nationaux (Royaume-Uni, Suède, Canada CATMAT, etc.) émettent des recommandations divergentes pour les voyageurs — reflet d'interprétations différentes des lacunes de données (efficacité selon sérologie, populations d'essais ≠ voyageurs) ; la plupart des autorités restreignent l'usage aux personnes avec dengue antérieure documentée en laboratoire (contexte lu). Message clé pour la prévention du voyageur : la vaccination dengue n'est PAS généralisée, la protection antivectorielle (répulsif DEET/ICARIDIN, vêtements longs) reste la base.","src":[["PubMed 42485451","https://pubmed.ncbi.nlm.nih.gov/42485451/"],["Journal of Travel Medicine 33(6), August 2026, taag065 (page article, vue en résultats)","https://academic.oup.com/jtm/article/33/6/taag065/8739998"],["CATMAT Canada — recommandations Qdenga pour les voyageurs (vues)","https://www.canada.ca/en/public-health/services/catmat/recommendations-qdenga-dengue-vaccine-jurisdictions-authorized-travellers.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas de vaccin dengue disponible en officine française ; pour un séjour en zone d'endémie, la consultation voyage (vaccins fièvre jaune, hépatite A, typhoïde…) et surtout les conseils répulsif + moustiquaire priment, y compris pour les voyageurs déjà « vaccinés à l'étranger »."},{"dom":"Seniors & polymédication","type":"Médicament","n":2,"dt":"2026-11","titre":"STREAM (NEJM) : arrêter les statines chez l'adulte de 70 ans et plus sans maladie cardiovasculaire connue","subst":"statines · déprescription · sujet âgé · prévention primaire","res":"Essai randomisé ouvert de non-infériorité avec adjudication à l'aveugle (1 880 adultes ≥ 70 ans, 24 sites Suisse/Pays-Bas/France, nov. 2021–avril 2025) : l'arrêt des statines en prévention primaire (≥ 2 maladies chroniques, sans AVC/IDM connu) est non inférieur à la poursuite sur le critère composite premier événement cardiovasculaire majeur ou décès à 2 ans ; environ 1 événement majeur ou décès supplémentaire sur 2 ans pour 40 patients arrêtants (traduction de risque absolu, ACC). Publié le 7 novembre 2026 au NEJM, présenté à l'AHA 2026. Décision individualisée, jamais un arrêt systématique.","src":[["NEJM — essai STREAM","https://www.nejm.org/doi/abs/10.1056/NEJMoa2606634"],["ACC — AHA 2026 (06/11/2026)","https://www.acc.org/Latest-in-Cardiology/Articles/2026/11/06/14/37/sat-445pm-statins-aha-2026"],["Healio (08/11/2026)","https://www.healio.com/news/cardiology/20261108/new-study-informs-statin-discontinuation-in-older-adults-without-cvd"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ne pas conseiller l'arrêt seul(e) ; si le médecin arrête la statine d'un senior en prévention primaire, expliquer que l'essai STREAM soutient cette décision individualisée et revoir la tolérance musculaire et le bilan lipidique."},{"dom":"Pédiatrie officinale","type":"Médicament","n":1,"dt":"2025-12","titre":"Méta-analyse (Lancet Child & Adolescent Health) : efficacité et sécurité des traitements pharmacologiques de la constipation fonctionnelle de l'enfant","subst":"constipation enfant · macrogol/PEG · pédiatrie","res":"Revue systématique et méta-analyse (de Geus et al., Lancet Child Adolesc Health 2025;9(12):848-856, epub 13/10/2025) comparant les pharmacothérapies de la constipation fonctionnelle de l'enfant ; le PEG/macrogol confirme sa place de premier choix, avec un profil d'efficacité et de tolérance le mieux documenté.","src":[["The Lancet Child & Adolescent Health","https://www.thelancet.com/journals/lanchi/article/PIIS2352-4642(25)00219-6/fulltext"],["PubMed 41101321 (2025 Dec;9(12):848-856)","https://pubmed.ncbi.nlm.nih.gov/41101321/"],["Amsterdam UMC (01.12.2025)","https://pure.amsterdamumc.nl/en/publications/efficacy-and-safety-of-pharmacological-therapies-for-functional-c/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour un enfant constipé, conseiller le macrogol en première intention (réhydratation des sachets, prise régulière plusieurs semaines, pas d'arrêt dès la première selle), adapter la posologie au poids et expliquer les règles hygiéno-diététiques (eau, fibres, activité)."},{"dom":"Seniors & polymédication","type":"Officine","n":2,"dt":"2025-07","titre":"MEDREV (BMC Geriatrics) : le pharmacien clinicien réduit fortement les erreurs médicamenteuses du patient âgé hospitalisé — essai randomisé en grappes français","subst":"pharmacien clinicien · erreurs médicamenteuses · sujet âgé · MEDREV","res":"Essai randomisé en grappes en marches d'escalier (stepped-wedge), multicentrique, CHU français (Leguelinel-Blache et al., BMC Geriatr 2025-07-11;25(1):516) : la prise en charge pharmaceutique collaborative (CPC) fait passer la proportion de patients âgés avec au moins une erreur médicamenteuse de 88,9 % à 29,2 %, et le nombre médian d'erreurs par patient de 3 à 0 (p<0,0001). Premier essai randomisé français évaluant la CPC à grande échelle.","src":[["BMC Geriatrics (2025 Jul 11;25(1):516)","https://bmcgeriatr.biomedcentral.com/articles/10.1186/s12877-025-06122-1"],["PMC12247195","https://pmc.ncbi.nlm.nih.gov/articles/PMC12247195/"],["ClinicalTrials.gov NCT02598115","https://clinicaltrials.gov/study/NCT02598115"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message fort pour valoriser le bilan de médication — la revue systématique de l'ordonnance d'un senior polymédiqué détecte et corrige une majorité d'erreurs évitables."},{"dom":"Seniors & polymédication","type":"Médicament","n":4,"dt":"2025-02","titre":"Charge anticholinergique et symptômes psycho-comportementaux du patient âgé avec trouble cognitif (Frontiers in Medicine)","subst":"charge anticholinergique · ACB · troubles cognitifs · sujet âgé","res":"Étude observationnelle (Front Med, publié 12/02/2025, PMID 40012975) : chez les patients âgés avec troubles cognitifs, le score de charge anticholinergique (ACB) est un prédicteur indépendant de la sévérité des symptômes psycho-comportementaux (NPI), après ajustement sur âge, sexe, polymédication et IADL.","src":[["Frontiers in Medicine (12 February 2025)","https://www.frontiersin.org/journals/medicine/articles/10.3389/fmed.2025.1505007/full"],["PubMed 40012975","https://pubmed.ncbi.nlm.nih.gov/40012975/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Repérer les médicaments anticholinergiques (certains antihistaminiques sédatifs, antidépresseurs imipraminiques, anticholinergiques urinaires, certains antiparkinsoniens) dans l'ordonnance d'un senior confus ou agité et signaler la charge cumulée au prescripteur."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":2,"dt":"2025-07","titre":"Compléments nutritionnels oraux prêts à l'emploi chez les seniors dénutris à domicile (Nutrients, ECR)","subst":"compléments nutritionnels oraux · dénutrition · senior · CNO","res":"Essai randomisé (Nutrients 2025, 17(15), 2474, publié 29/07/2025) chez des personnes âgées dénutries suivies en soins primaires : les compléments nutritionnels oraux (CNO) prêts à l'emploi augmentent les apports totaux en nutriments et couvrent davantage de références nutritionnelles SANS réduire les apports alimentaires spontanés (pas d'effet de déplacement du régime).","src":[["Nutrients 2025, 17(15), 2474 (29 July 2025)","https://www.mdpi.com/2072-6643/17/15/2474"],["NutraIngredients (31/07/2025)","https://www.nutraingredients.com/Article/2025/07/31/oral-nutrition-supplements-correct-nutrient-gaps-in-malnourished-older-adults-study-finds/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Chez un senior qui maigrit, proposer des CNO en complément (et non en remplacement) des repas, fractionnés entre les prises, et surveiller le poids ; à signaler à RECAP_COMP pour la ligne « compléments nutritionnels oraux / dénutrition du senior »."},{"dom":"Pédiatrie officinale","type":"Médicament","n":3,"dt":"2026-06","titre":"Oxyurose de l'enfant : albendazole vs mebendazole vs pyrantel — essai randomisé indien (Indian Pediatrics)","subst":"oxyurose · albendazole · mebendazole · pyrantel · enfant","res":"Essai contrôlé randomisé (Indian Pediatrics 2026;63(6), PMID 41989723) comparant albendazole, mebendazole et pyrantel pour la rémission et la prévention des récidives d'Enterobius vermicularis chez l'enfant : les réinfestations en cycles restent la difficulté principale, justifiant le traitement de l'entourage et la répétition de la dose (J15-J21 selon les recommandations françaises, RecoMédicales). Un éditorial méthodologique (Indian Pediatr 2026;63:454) souligne des limites à l'interprétation.","src":[["Indian Pediatrics (10.1007/s13312-026-00303-w)","https://link.springer.com/article/10.1007/s13312-026-00303-w"],["PubMed 41989723 (2026 Jun;63(6))","https://pubmed.ncbi.nlm.nih.gov/41989723/"],["Recommandations oxyurose (dose unique renouvelée J15/J21)","https://recomedicales.fr/recommandations/oxyurose/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Traiter toute la famille, rappeler la dose unique renouvelée après 2-3 semaines, et les mesures d'hygiène (ongles courts, linge de nuit et draps à 60 °C)."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":4,"dt":"2026-10","titre":"Sulfonylurées + amiodarone : initiation de l'amiodarone associée à un surrisque d'hypoglycémie sévère (Diabetes, Obesity and Metabolism)","subst":"sulfonylurées · amiodarone · hypoglycémie · interaction · sujet âgé","res":"Étude en émulation d'essai cible sur données de remboursement (Bea, Lee et al., Diabetes Obes Metab 2026;28(10):9336-9345, PMID 42517252) : l'initiation de l'amiodarone chez un patient sous sulfonylurée est associée à un risque plus élevé d'hypoglycémie sévère par rapport aux autres antiarythmiques — interaction à connaître chez le diabétique âgé souvent polymédiqué.","src":[["Diabetes, Obesity and Metabolism (doi 10.1111/dom.71082)","https://dom-pubs.onlinelibrary.wiley.com/doi/10.1111/dom.71082"],["PubMed 42517252","https://pubmed.ncbi.nlm.nih.gov/42517252/"],["PMC13538823 (© 2026)","https://pmc.ncbi.nlm.nih.gov/articles/PMC13538823/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"À l'instauration d'amiodarone chez un patient sous glimépiride/gliclazide/glibenclamide, alerter le patient sur les signes d'hypoglycémie (sueurs, tremblements, confusion), recommander l'autosurveillance glycémique renforcée et proposer la revue de médication au prescripteur."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":3,"dt":"2026-03","titre":"CONCRET-MENOPA : créatine orale 8 semaines et cognition des femmes péri/ménopausées (ECR)","subst":"créatine · HCl · périménopause · ménopause · cognition","res":"Nouvel usage de la créatine (base : cognition du senior, performance sportive) : la transition ménopausique. Essai randomisé, contrôlé vs placebo (CONCRET-MENOPA, Université de Novi Sad, n=36 femmes péri/ménopausées 40-60 ans, 8 semaines) publié dans le Journal of the American Nutrition Association (Vol 45, No 3, « 04 Mar 2026 » vu sur la page Taylor & Francis ; PubMed 40854087) : supplémentation à faible dose en créatine chlorhydrate (750 ou 1 500 mg/j, ou association avec créatine ester éthylique) bien tolérée, avec amélioration d'issues cliniques et élévation des concentrations cérébrales de créatine. Financement : Vireo Systems (industriel) + Province de Voïvodine — essai de petite taille, formules non-monohydrate (les données les plus solides restent sur la monohydrate).","src":[["Taylor & Francis — J Am Nutr Assoc (04 Mar 2026)","https://www.tandfonline.com/doi/full/10.1080/27697061.2025.2551184"],["PubMed 40854087","https://pubmed.ncbi.nlm.nih.gov/40854087/"],["NutraIngredients (12/09/2025)","https://www.nutraingredients.com/Article/2025/09/12/research-deepens-into-creatine-and-the-menopause-transition/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour une cliente ménopausée qui se plaint de « brouillard cérébral », dire que la créatine est une piste sérieuse à l'étude (effet sur le cerveau testé par essais randomisés), mais que la monohydrate reste la forme de référence et qu'aucune dose validée n'est établie pour la cognition à la ménopause."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-03","titre":"Oméga-3 et récupération sportive : méta-analyse de 41 ECR (FASEB Journal) — baisse des marqueurs inflammatoires et de dommage musculaire","subst":"oméga-3 · EPA/DHA · récupération · sport · inflammation","res":"Nouvel usage des oméga-3 (base : prévention CV, dépression, seniors/chutes, sécheresse oculaire) : la récupération de l'exercice. Méta-analyse PRISMA 2020 de 41 essais contrôlés randomisés (2011-2025, ~1 800 participants, récréatifs à entraînés) publiée dans The FASEB Journal (« First published: 27 March 2026 » et « 2026; 40:e71709 » vus sur la page Wiley ; PubMed 41891174) : la supplémentation EPA+DHA réduit plusieurs marqueurs de l'inflammation post-exercice (IL-6, TNF-α, CRP) et du dommage musculaire (créatine kinase, DOMS perçues), avec des signaux plus nets dans les essais à ≥ 2 g/j d'EPA+DHA combinés pendant au moins 6 semaines (sous-groupe cité par des sources secondaires). Hétérogénéité des doses/produits : effet d'appoint, pas une révolution.","src":[["Wiley — The FASEB Journal (First published: 27 March 2026)","https://faseb.onlinelibrary.wiley.com/doi/full/10.1096/fj.202504783R"],["PubMed 41891174","https://pubmed.ncbi.nlm.nih.gov/41891174/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour un sportif qui enchaîne les séances dures et demande « quoi prendre pour récupérer », les oméga-3 à ~2 g/j d'EPA+DHA sont l'une des rares options avec preuve méta-analytique — à condition de parler aussi sommeil, glucides et progressivité de l'entraînement."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-12","titre":"Carences martiales des athlètes de haut niveau : revue systématique — impact réel sur l'endurance, supplémentation à ~100 mg/j de fer élémentaire","subst":"fer · athlète féminine · endurance · ferritine · carence sans anémie","res":"Nouvel usage du fer (base : anémie ferriprive un jour sur deux, enfant, santé mentale des non-anémiques) : la femme athlète de haut niveau. Revue systématique (Pengelly et al., Journal of Sport and Health Science 2025;14:101009 ; PMC « Collection date 2025 Dec » vu ; texte intégral vu via le dépôt de l'Université de Canberra) : la carence en fer avec ou sans anémie est fréquente chez les athlètes d'endurance féminines de haut niveau, dégrade la performance d'endurance, et se corrige chez ces sportives par une supplémentation documentée à ~100 mg/jour de fer élémentaire (ou un jour sur deux) — sous suivi biologique.","src":[["Journal of Sport and Health Science 2025;14:101009 (PMC 11863318)","https://pmc.ncbi.nlm.nih.gov/articles/PMC11863318/"],["Université de Canberra — texte intégral (Pengelly et al. 2025)","https://researchsystem.canberra.edu.au/ws/portalfiles/portal/106239859/Pengelly_et_al._2025_-_Iron_deficiency_supplementation_and_sports_performance_in_female_athletes_-_systematic_review.pdf"],["ScienceDirect — page article","https://www.sciencedirect.com/science/article/pii/S2095254624001674"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour une coureuse fatiguée avec ferritine basse, le fer n'est pas un complément « au comptoir » : c'est un traitement à dose forte, prescrit et suivi (ferritine, CRP pour interpréter) ; dépister plutôt les causes (règles abondantes, foot strikes, apports insuffisants) et rappeler que l'automédication ferreuse masque des diagnostics."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":2,"dt":"2026-04","titre":"Vitamine D seule et blessures musculo-squelettiques de surmenage : ECR en jeunes hommes en entraînement intensif hivernal","subst":"vitamine D · blessure de surmenage · stress fracture · militaire","res":"Nouvel usage de la vitamine D (base : fractures/chutes — verdict « pas de preuve », DO-HEALTH seniors) : prévention des blessures de surmenage. Essai randomisé contre placebo (Carswell et al., British Journal of Nutrition ; PubMed 41978289, « 2026 Apr 14:1-11 » ; n=250 hommes ~21 ans débutant un entraînement militaire intensif en hiver) : 12 semaines de supplémentation en vitamine D ; le critère blessures musculo-squelettiques du bas du corps (bassin, sacrum, membres inférieurs) est rapporté — la supplémentation n'a pas démontré d'effet protecteur net dans les extraits lus (pas de réduction d'incidence chiffrée affichée), alors que le statut 25(OH)D s'améliore. Nuance utile contre la « vitamine D miracle » : corriger une carence reste légitime, supplémenter massivement pour « éviter les blessures » ne tient pas.","src":[["PubMed 41978289 (2026 Apr 14:1-11)","https://pubmed.ncbi.nlm.nih.gov/41978289/"],["British Journal of Nutrition (Cambridge Core)","https://www.cambridge.org/core/journals/british-journal-of-nutrition/article/vitamin-d-supplementation-and-musculoskeletal-injury-risk-in-young-men-undergoing-arduous-training-a-randomised-placebocontrolled-trial/40018EAAFC8F9E7FB9208F1BF3CF0D1D"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Au comptoir, ne pas vendre la vitamine D comme prévention des blessures sportives ; si le patient carencé (dosage fait) en veut pour son os, c'est la correction de carence qui compte, pas la surdose."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-05","titre":"Probiotiques et sport : méta-analyse d'essais cliniques — composition corporelle, récupération après dommage musculaire et performance","subst":"probiotiques · sport · récupération · composition corporelle","res":"Nouvel usage des probiotiques (base : diarrhée des antibiotiques, SII, dermatite atopique) : le sportif. Revue systématique et méta-analyse d'essais cliniques (Shirkoohi et al., Physiological Reports 2025;13(8):e70288, vu dans le DOI 10.14814/phy2.70288 et l'article NutraIngredients du 07/05/2025) : la supplémentation probiotique est associée à des bénéfices sur la récupération après dommage musculaire induit par l'exercice et sur des indicateurs de composition corporelle/performance, sans remettre en cause l'absence de panacée (effets modérés, souches et protocoles hétérogènes). Une deuxième méta-analyse (cytokines post-exercice, Sports Medicine - Open, PubMed 40402402) suggère une augmentation de l'IL-10 anti-inflammatoire, conclusions prudentes.","src":[["Physiological Reports (doi 10.14814/phy2.70288)","https://physoc.onlinelibrary.wiley.com/doi/10.14814/phy2.70288"],["NutraIngredients (07/05/2025)","https://www.nutraingredients.com/Article/2025/05/07/meta-analysis-supports-body-composition-and-exercise-performance-benefits-of-probiotics/"],["PubMed 40402402 (méta cytokines)","https://pubmed.ncbi.nlm.nih.gov/40402402/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un sportif régulier demandant des probiotiques « pour la récup » peut être orienté vers des souches étudiées (Lactobacillus surtout) sans en attendre un effet magique — l'intérêt digestif/immun reste l'usage le mieux documenté."},{"dom":"Cardiologie","type":"Alimentation","n":1,"dt":"2025-12","titre":"Boissons énergétiques et santé cardiovasculaire des jeunes : revue critique de 33 études originales (2020-2025)","subst":"boissons énergétiques · caféine · taurine · cardiovasculaire · jeune","res":"Nouvelle entrée (aucune revue boissons énergétiques en base). Revue critique PRISMA 2020 (Beverages 2026, 12(1), 4 ; « Review — 31 December 2025 » vu sur la page MDPI ; 33 études originales en accès libre 2020-2025) : la consommation de boissons énergétiques chez les jeunes est associée à des effets cardiovasculaires indésirables aigus (élévation de la fréquence cardiaque et de la pression artérielle, allongement de l'intervalle QT rapporté dans plusieurs études) et à un profil de risque comportemental ; les auteurs plaident pour une vigilance chez les adolescents/jeunes adultes, souvent combinée à l'alcool ou au sport intense. La présence de taurine modifie la cinétique de la caféine — sans preuve d'innocuité pour autant.","src":[["MDPI Beverages 2026, 12(1), 4 — Review, 31 December 2025","https://www.mdpi.com/2306-5710/12/1/4"],["MDPI Nutrients 2025 — revue effets indésirables et interactions médicamenteuses des boissons énergétiques","https://www.mdpi.com/2072-6643/17/15/2435"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message clair pour les ados et étudiants : une boisson énergétique = ponctuelle, jamais avant un effort sportif intense ou mélangée à l'alcool ; les « energy drinks » ne remplacent ni sommeil ni repas."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-12","titre":"Caféine et performance en contre-la-montre : méta-analyse en réseau — dose et mode d'administration","subst":"caféine · endurance · contre-la-montre · réseau","res":"Nouvel usage de la caféine (base : puissance en musculation) : l'endurance en contre-la-montre. Revue systématique et méta-analyse en réseau (Nutrients 2025, 17(23), 3792 ; « Systematic Review — 3 December 2025 » vu sur la page MDPI) comparant les doses et méthodes d'administration de caféine sur la performance en time-trial : les comparaisons directes et indirectes permettent de hiérarchiser doses et formes (gommes, gels, boissons) ; l'effet ergogénique classique est confirmé pour les doses modérées (~3 mg/kg et plus), sans sur-bénéfice démontré aux doses massives — et au prix d'effets indésirables (tremblements, insomnie, palpitations).","src":[["MDPI Nutrients 2025, 17(23), 3792 — 3 December 2025","https://www.mdpi.com/2072-6643/17/23/3792"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour un cycliste/coureur, ~3 mg/kg de caféine 45-60 min avant l'effort (soit un café fort pour 70 kg) reste la base ; plus n'est pas mieux — et attention aux boissons énergétiques en complément, la dose totale de caféine s'additionne (limite prudente ~400 mg/j pour un adulte)."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":3,"dt":"2025-07","titre":"Collagène 10 g/j pendant 16 semaines : raideur musculo-tendineuse et force explosive augmentées (ECR)","subst":"collagène · tendon d'Achille · raideur · force explosive","res":"Nouvel usage du collagène (base : peau et articulations) : le tendon d'Achille et la performance. Essai randomisé contrôlé de 16 semaines (PubMed 40623147, « Epub 2025 Jul 7 » ; Medicine & Science in Sports & Exercise ; jeunes hommes en bonne santé) : la supplémentation quotidienne en peptides de collagène (≈ 10 g/j) augmente la raideur du muscle ET du tendon d'Achille, l'amélioration de la raideur musculaire contribuant à la force explosive (saut) — premier essai montrant un effet structurel tendineux couplé à un résultat fonctionnel. Essai de taille modeste, population jeune masculine entraînée.","src":[["PubMed 40623147 (Epub 2025 Jul 7)","https://pubmed.ncbi.nlm.nih.gov/40623147/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour un sportif avec tendinopathie d'Achille chronique ou en prévention, 10-15 g de peptides de collagène ~30-60 min avant la séance (avec vitamine C) est un complément plausible à la réhabilitation — jamais un substitut au travail excentrique et à la gestion de la charge."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-12","titre":"Taurine en dose unique pré-exercice : revue méta-analytique — petit effet réel sur l'endurance et la puissance","subst":"taurine · dose unique · performance · endurance","res":"Nouvelle substance (taurine absente de la base ; souvent vendue via les boissons énergétiques). Revue systématique et méta-analyse (Deng et al., Scandinavian Journal of Medicine & Science in Sports, doi 10.1111/sms.70123 ; l'analyse publiée en décembre 2025, article daté du 29/12/2025 sur Examine) : une dose unique de taurine avant l'exercice améliore modestement certains critères d'endurance, d'endurance musculaire et de puissance, pour des doses de l'ordre de 1 à 6 g pris 1-2 h avant l'effort — effet petit mais cohérent, sans danger aux doses testées. Complément de la méta-analyse Heliyon 2025 sur les marqueurs de dommage musculaire (mois non vérifié → écartée, mais signal concordant : réduction des CK post-exercice).","src":[["Wiley — Scand J Med Sci Sports (doi 10.1111/sms.70123)","https://onlinelibrary.wiley.com/doi/10.1111/sms.70123"],["Examine — Study Summary (publié le 29/12/2025)","https://examine.com/research-feed/study/9zwO3d/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La taurine seule en gélules n'est pas un dopage ni un miracle ; effet ergogénique léger possible — inutile de la promouvoir, mais pas d'inquiétude si un sportif en prend dans des doses raisonnables."},{"dom":"Nutrition & Compléments","type":"Alerte","n":5,"dt":"2025-12","titre":"SARMs vendus en ligne : vague de lettres d'avertissement de la FDA (12 décembre 2025) — produits non approuvés à risque hépatique et cardiovasculaire","subst":"SARMs · ostarine · RAD-140 · LGD-4033 · dopage · FDA","res":"Alerte complémentaire au thème « dopage » (base : revue des adultérants de compléments sportifs, 9-15 %). Le 12 décembre 2025, la FDA a émis une série de lettres d'avertissement (Atomix LLC, Pinnacle Peptides, Prime Sports Nutrition, Titan SARMS, entre autres — pages FDA vues, « WARNING LETTER December 12, 2025 ») contre des vendeurs en ligne de modulateurs sélectifs des récepteurs aux androgènes (SARMs : MK-2866/ostarine, RAD-140/testolone, LGD-4033) : substances non approuvées, interdites en permanence par l'AMA (WADA) chez le sportif, et associées à des atteintes hépatiques (hépatotoxicité, cholestase) et à des risques cardiovasculaires (le taux de LDL/HDL se dégrade). Ces produits sont parfois contaminés ou étiquetés comme compléments, sans en être.","src":[["FDA — Atomix LLC, 12/12/2025","https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/atomix-llc-719111-12122025"],["FDA — Pinnacle Peptides, 12/12/2025","https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/pinnacle-professional-research-dba-pinnacle-peptides-719337-12122025"],["USADA — SARMs","https://www.usada.org/spirit-of-sport/selective-androgen-receptor-modulators-sarms-prohibited-class-anabolic-agents/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un client de salle de sport qui s'approvisionne en ligne pour « sécher » ou « prendre du muscle » avec des SARMs doit être découragé fermement — pas des compléments, des médicaments non approuvés aux risques réels ; proposer l'orientation vers un médecin du sport et vérifier que ses « compléments » affichent des labels anti-dopage (certification type Informed Sport) s'il est compétiteur."},{"dom":"Soins primaires & Officine","type":"Officine","n":2,"dt":"2025-09","titre":"Bilan de médication structuré à l'officine dans la polymédication : essai randomisé contrôlé en double aveugle (Frontiers in Medicine, 03/09/2025)","subst":"bilan de médication | polymédication | drug-related problems","res":"Essai randomisé, contrôlé, en double aveugle, en groupes parallèles, en officine communautaire, évaluant les effets d'un bilan de médication structuré (type 2a) sur les problèmes liés aux médicaments chez tous les patients en polymédication (« all-comers »). URL vue, date de publication vérifiée sur la page Frontiers (« Front. Med., 03 September 2025 »).","src":[["Frontiers in Medicine (03/09/2025)","https://www.frontiersin.org/journals/medicine/articles/10.3389/fmed.2025.1656595/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un argument de plus pour structurer les bilans de médication au comptoir chez les patients polymédiqués, sans attendre une pathologie cible."},{"dom":"Soins primaires & Officine","type":"Officine","n":1,"dt":"2026-06","titre":"Télésanté pharmaceutique (telepharmacy) dans les maladies chroniques : revue Cochrane (Sugita et al., 2026)","subst":"télésanté | telepharmacy | observance | maladies chroniques","res":"Revue Cochrane (CD015136, publiée le 12 juin 2026, recherches au 15/12/2025) sur l'efficacité clinique des services de télésanté pharmaceutique vs soins usuels en ambulatoire. Messages clés vus sur la page Cochrane : la télépharmacie peut aider à prendre ses médicaments comme prescrit et peut réduire la pression artérielle systolique et diastolique ; probablement peu ou pas de différence sur l'HbA1c ; incertitude importante sur les autres critères.","src":[["Cochrane (résumé vulgarisé)","https://www.cochrane.org/evidence/CD015136_does-telepharmacy-remote-pharmacy-care-work-better-usual-care-people-long-term-health-conditions-who"],["Cochrane Library (CD015136)","https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD015136.pub2/full"],["PubMed 42283624","https://pubmed.ncbi.nlm.nih.gov/42283624/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le suivi à distance du pharmacien a un début de preuve sur l'observance et la tension — à considérer comme complément de l'entretien présentiel, pas comme un remplacement."},{"dom":"Soins primaires & Officine","type":"Officine","n":1,"dt":"2025-07","titre":"Interventions de pharmaciens sur l'observance dans les maladies chroniques : revue systématique d'essais randomisés (Patient Preference and Adherence, 22/07/2025)","subst":"observance | interventions pharmaciens | maladies chroniques","res":"Revue systématique d'essais randomisés (Patient Prefer Adherence 2025 Jul 22;19:2161–2178, doi 10.2147/PPA.S530503) sur l'efficacité des interventions menées par des pharmaciens sur l'observance médicamenteuse dans les maladies chroniques ; les interventions combinant volets éducatif et comportemental ressortent comme les plus utilisées et efficaces. Date vérifiée dans l'extrait de citation PMC.","src":[["PMC — Patient Prefer Adherence 2025;19:2161–2178","https://pmc.ncbi.nlm.nih.gov/articles/PMC12301242/"],["Dove Medical Press (PPA)","https://www.dovepress.com/effectiveness-of-pharmacist-led-intervention-on-medication-adherence-i-peer-reviewed-fulltext-article-PPA"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'observance se travaille — conseil éducatif + stratégies comportementales (rappels, routine de prise), pas seulement des discours sur l'importance du traitement."},{"dom":"Économie de la Santé","type":"Économie","n":4,"dt":"2026-07","titre":"Biosimilaires de l'adalimumab : plus d'un patient sur sept revient au princeps après le switch (données vie réelle US, JMCP 2026)","subst":"biosimilaires | adalimumab | substitution | vie réelle","res":"Étude de vie réelle Truveta (~68 000 patients, février 2023 – août 2025) publiée dans le Journal of Managed Care & Specialty Pharmacy (2026;32(7):856) : l'adoption des biosimilaires de l'adalimumab a fortement augmenté après les changements de formulaire, mais plus d'un initiateur sur sept est revenu à l'adalimumab de référence, ce qui peut annuler une partie des économies et compliquer la continuité des traitements. Dates vérifiées : citation « 10.18553/jmcp.2026.32.7.856 », PMID 42341073, communiqué Truveta du 29/06/2026.","src":[["JMCP 2026;32(7):856","https://www.jmcp.org/doi/10.18553/jmcp.2026.32.7.856"],["PubMed 42341073","https://pubmed.ncbi.nlm.nih.gov/42341073/"],["Truveta (communiqué 29/06/2026)","https://www.truveta.com/blog/announcement/real-world-switching-patterns-humira-biosimilars/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Au comptoir, un patient « revenu au princeps » n'est pas un échec de la substitution — documenter et rassurer sur l'équivalence pour éviter les allers-retours coûteux."},{"dom":"Économie de la Santé","type":"Économie","n":5,"dt":"2026-05","titre":"Rapport IGAS-IGF sur la chaîne de distribution pharmaceutique : les biosimilaires, levier de ~10 milliards d'euros d'économies (rendu public en mai 2026)","subst":"biosimilaires | distribution | économie | rémunération officinale","res":"Rapport conjoint IGAS-IGF « La chaîne de distribution pharmaceutique » (rapport daté janvier 2026, Hippolyte d'Albis, rendu public début mai 2026) : le marché des biosimilaires devient un levier majeur d'économies pour l'Assurance maladie (environ 10 milliards d'euros évoqués « en ligne de mire ») ; le rapport appelle à « décorréler totalement » la rémunération des pharmacies des prix et volumes de médicaments. En 2025, le marché des biosimilaires en officine représentait ~1 milliard d'euros HT (+17 % sur un an, part de marché 39 % en valeur vs 32 % en 2024, selon Le Moniteur). Dates vérifiées : PDF IGAS (dossier 2026-05, couverture « JANVIER 2026 »), Revue Pharma (mai 2026).","src":[["IGAS — rapport PDF (janv. 2026, publié mai 2026)","https://www.igas.gouv.fr/sites/igas/files/2026-05/Rapport%20IGAS-IGF%20chaine%20de%20distribution%20pharmaceutique%20(2026).pdf"],["Revue Pharma (mai 2026)","https://www.revuepharma.fr/2026/05/le-rapport-igas-igf-appelle-a-decorreler-totalement-la-remuneration-des-pharmacies-aux-prix-et-volumes-des-medicaments/"],["Le Moniteur des Pharmacies","https://www.lemoniteurdespharmacies.fr/profession/socio-professionnel/10-milliards-deuros-deconomies-en-ligne-de-mire-les-biosimilaires-deviennent-le-nouveau-champ-de-bataille-economique-des-officines"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Préparer la bascule économique — biosimilaires par défaut, mais la rémunération de l'officine va se jouer ailleurs que sur le prix du produit."},{"dom":"Soins primaires & Officine","type":"Officine","n":4,"dt":"2026-01","titre":"Téléconsultation en France : la 6e étude annuelle Medaviz (publiée le 27/01/2026) montre une pratique devenue routine","subst":"télésanté | téléconsultation | France","res":"Sixième étude annuelle Medaviz (usages de 13 900 praticiens inscrits/utilisateurs), publiée le 27 janvier 2026 : la téléconsultation est devenue routine mais reste très inégalement investie selon les spécialités, la santé mentale tirant l'activité. L'État affine en parallèle la feuille de route télémédecine 2026-2028 (plafond de 20 % de téléconsultations, dérogations, lieux équipés, déclaration aux ARS). Date vérifiée dans l'article Caducée du 27/01/2026.","src":[["Caducée (27/01/2026)","https://www.caducee.net/actualite-medicale/16782/teleconsultation-2025-la-sante-mentale-tire-l-activite-l-etat-affine-la-feuille-de-route-2026-2028.html"],["SafeSanté — feuille de route télémédecine 2026-2028","https://www.safesante.fr/blog-teleconsultation/feuille-de-route-telemedecine-2026-2028/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La téléconsultation s'installe durablement — attendez-vous à des ordonnances issues de la distance ; le conseil de proximité au comptoir garde toute sa valeur sur ces traitements « prescrits sans examen présentiel »."},{"dom":"Ophtalmologie","type":"Médicament","n":4,"dt":"2025-06","titre":"Rétinopathie diabétique sous sémaglutide : l'étude réseau OHDSI rassure — pas d'excès de rétinopathie proliférante ni de besoin de traitement (BMJ Open Diabetes Research & Care)","subst":"sémaglutide | rétinopathie diabétique | OHDSI | étude réseau vie réelle | GLP-1","res":"Étude réseau observationnelle OHDSI multi-bases (BMJ Open Diab Res Care 2025;13:e005424, volume 13 numéro 6) comparant le sémaglutide aux autres GLP-1RA et aux non-GLP-1RA chez des patients DT2 : pas d'augmentation identifiée du risque de rétinopathie proliférante ni de rétinopathie nécessitant un traitement ; les auteurs rappellent que les patients DT2 doivent continuer un suivi ophtalmologique rapproché (conclusion lue dans l'extrait PubMed 41192935). Distinct du dépistage FA AMALFI (en base) et de l'alerte FDA GLP-1/vision (en base) : ici l'angle est le risque rétinopathie du sémaglutide lui-même, question posée à l'officine depuis les signaux SUSTAIN-6/FOCUS.","src":[["PubMed 41192935 — BMJ Open Diab Res Care 2025;13:e005424","https://pubmed.ncbi.nlm.nih.gov/41192935/"],["BMJ Open Diabetes Research & Care — vol 13, n° 6, e005424","https://drc.bmj.com/content/13/6/e005424"],["Washington University in St. Louis — présentation de l'étude OHDSI (2025)","https://i2db.wustl.edu/semaglutide-and-diabetic-retinopathy-an-ohdsi-network-study/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Réponse rassurante au patient DT2 sous Ozempic qui a entendu parler de « risques pour les yeux » — pas d'excès démontré en vie réelle, mais jamais sauter le rendez-vous annuel d'ophtalmologue prescrit pour le diabète."},{"dom":"Ophtalmologie","type":"Médicament","n":2,"dt":"2026-04","titre":"DMLA atrophique (atrophie géographique) : résultats à 2 ans de GATHER2 — l'avacincaptad pegol (Izervay) maintient le ralentissement de la croissance de l'atrophie (phase 3, Ophthalmology)","subst":"avacincaptad pegol | Izervay | atrophie géographique | DMLA sèche | GATHER2 | C5","res":"Résultats d'efficacité et de sécurité à 2 ans de l'essai de phase 3 GATHER2 de l'avacincaptad pegol (aptamer anti-C5 intravitréen) dans l'atrophie géographique secondaire à la DMLA (Ophthalmology 2026 Apr — extrait PubMed 41407269 « Ophthalmology. 2026 Apr », DOI 10.1016/j.ophtha.2025.12.011 lu sur la page aaojournal) : 725 patients environ par essai GATHER ; au fil de l'année 2, la croissance de l'atrophie reste réduite sous avacincaptad mensuel ou un mois sur deux, avec un profil de sécurité cohérent avec l'année 1 — aucun cas de vasculite rétinienne ni de neuropathie optique ischémique rapporté (chiffres lus dans les extraits Ophthalmology360 et PubMed). Complément de l'entrée AREDS2 (base, antioxydants oraux) : ici le versant pharmacologique injectable de la DMLA sèche.","src":[["PubMed 41407269 — Ophthalmology 2026 Apr (GATHER2 2 ans)","https://pubmed.ncbi.nlm.nih.gov/41407269/"],["Ophthalmology (aaojournal) — DOI 10.1016/j.ophtha.2025.12.011, page article","https://www.aaojournal.org/article/S0161-6420(25)00790-0/fulltext"],["Ophthalmology 360 — synthèse des données GATHER2 à 2 ans","https://ophthalmology360.com/geographic-atrophy/two-year-gather2-data-show-sustained-ga-growth-reduction-with-avacincaptad-pegol/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour le patient sous Izervay — injections intravitréennes en hôpital de jour, pas de collyre ; surveiller les signes d'alerte (baisse brutale de vision, douleur) et rappeler que le traitement ralentit la lésion sans restaurer la vision perdue."},{"dom":"Ophtalmologie","type":"Médicament","n":2,"dt":"2026-01","titre":"NAION (« AVC du nerf optique ») : l'essai phase 2/3 du QPI-1007 (ARNs anti-caspase 2) ne montre pas de bénéfice global — un bénéfice possible dans les formes les plus sévères (Ophthalmology)","subst":"QPI-1007 | NAION | neuropathie optique ischémique | caspase 2 | phase 2/3","res":"Essai randomisé sham-controlled de phase 2/3 (Ophthalmology 2026 Jan;133(1):62-74, DOI 10.1016/j.ophtha.2025.07.039 — citation complète lue sur le portail de recherche Ben-Gurion) : 725 participants avec NAION aiguë unilatérale inclus dans les 14 jours après les symptômes visuels ; l'injection intravitréenne de QPI-1007 (ARN interférent silencçant la caspase 2) a été bien tolérée, sans bénéfice global sur la vision vs sham ; en analyse de sous-groupe (lue dans la couverture Retinal Physician), les patients avec acuité visuelle initiale ≤ 60 lettres du groupe multidose 3 mg avaient moins de perte visuelle (5,9 % vs 25,4 % sur l'acuité, P=.01).","src":[["Ben-Gurion University Research Portal — Ophthalmology. 2026 Jan 1;133(1):62-74","https://cris.bgu.ac.il/en/publications/a-randomized-sham-controlled-phase-23-trial-of-qpi-1007-for-acute-2/"],["Ophthalmology (aaojournal) — page article QPI-1007","https://www.aaojournal.org/article/S0161-6420(25)00484-1/fulltext"],["Retinal Physician — NAION therapy shows no overall benefit (2025)","https://retinalphysician.com/news/2025/naion-therapy-shows-no-overall-benefit/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas (encore) de traitement validé de la NAION — derrière une perte visuelle brutale indolore d'un œil, urgence ophtalmologique immédiate ; point de vigilance GLP-1 déjà couvert par l'alerte FDA en base."},{"dom":"Ophtalmologie","type":"Médicament","n":4,"dt":"2024-11","titre":"Après une NAION, le risque d'AVC reste durablement élevé — cohorte multinationale (JAMA Network Open)","subst":"NAION | AVC | risque cardiovasculaire | cohorte | JAMA Network Open","res":"Étude de cohorte rétrospective multinationale (JAMA Netw Open 2024;7(11):e2444534 — citation complète lue dans les couvertures Medscape/NeurologyAdvisor) : les patients ayant présenté une neuropathie optique ischémique antérieure non artéritique présentent un risque d'AVC significativement et durablement plus élevé, indépendamment des facteurs de risque cardiovasculaire classiques. Message de prévention secondaire directement exploitable au comptoir.","src":[["NeurologyAdvisor — NAION linked to elevated stroke risk (JAMA Netw Open 2024;7(11):e2444534)","https://www.neurologyadvisor.com/news/nonarteritic-anterior-ischemic-optic-neuropathy-is-linked-to-elevated-stroke-risk/"],["Medscape — Elevated Stroke Risk Following NAION (2024)","https://www.medscape.com/viewarticle/elevated-stroke-risk-following-naion-2024a1000l7w"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le patient sortant d'une NAION est un patient à risque vasculaire — vérifier et optimiser la prise du traitement préventif (antihypertenseur, statine, antithrombotique selon prescription), contrôler tension et observance tabagique lors de la délivrance."},{"dom":"Ophtalmologie","type":"Médicament","n":4,"dt":"2026-06","titre":"DMLA néovasculaire résistante : switch vers le faricimab (Vabysmo) en vie réelle — vision maintenue et intervalles d'injection allongés à 2 ans (Clinical Ophthalmology)","subst":"faricimab | Vabysmo | DMLA néovasculaire | anti-VEGF/Ang-2 | vie réelle","res":"Étude de vie réelle à 2 ans (Clinical Ophthalmology 2026;20:596406, publié le 9 juin 2026 — DOI 10.2147/OPTH lu dans l'extrait PubMed 42294415) : chez des yeux en DMLA néovasculaire résistants aux anti-VEGF classiques, le switch vers le faricimab (anticorps bi-spécifique anti-VEGF-A/Ang-2) a maintenu l'acuité visuelle, amélioré les critères anatomiques et permis d'allonger les intervalles d'injection, avec un profil de sécurité favorable sur 2 ans (conclusion lue dans l'extrait PubMed). Complément possible de la dose 20h (latanoprostène bunod glaucome en base) : ici le versant DMLA.","src":[["PubMed 42294415 — Clin Ophthalmol 2026 Jun 9;20:596406","https://pubmed.ncbi.nlm.nih.gov/42294415/"],["Nature Eye — Three-year real-world outcomes of faricimab in pretreated eyes (référence connexe)","https://www.nature.com/articles/s41433-026-04916-0"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour le patient sous Vabysmo — l'allongement des intervalles réduit la charge hospitalière ; toujours Oriplast/ordonnance hospitalière, pas de substitution possible ; rappeler l'arrêt du tabac (facteur de risque majeur de la DMLA)."},{"dom":"ORL & stomatologie","type":"Médicament","n":1,"dt":"2025-02","titre":"Sinusite chronique avec polypes (CRSwNP) réfractaire : méta-analyse de vie réelle des biothérapies — dupilumab, omalizumab, mépolizumab, benralizumab confirmés hors essais (Allergy)","subst":"CRSwNP | polypes nasaux | biothérapies | dupilumab | omalizumab | mépolizumab | benralizumab | vie réelle","res":"Méta-analyse des données de vie réelle (Allergy 2025;80(5):1256-1270, DOI 10.1111/all.16499 — « February 2025 · 80(5):1256-1270 » lu sur la notice ResearchGate, page Wiley vue en résultats) sur l'efficacité et la sécurité des biothérapies (dupilumab, omalizumab, mépolizumab, benralizumab) dans la sinusite chronique avec polypes nasaux sévère non contrôlée : les bénéfices observés en phase 3 se confirment en pratique, avec un bon profil de tolérance (message lu dans les extraits Wiley). Distinct de la candidate dupilumab AFRS (03h, autre indication ORL) et des entrées intranasaux/allergologie (rhinite) : ici la polypose nasale en échec de corticoïdes/chirurgie.","src":[["Allergy (Wiley) — Cai et al., DOI 10.1111/all.16499","https://onlinelibrary.wiley.com/doi/10.1111/all.16499"],["ResearchGate — notice de publication « February 2025 · 80(5):1256-1270 »","https://www.researchgate.net/publication/389250212_Efficacy_and_Safety_of_Biologics_for_Chronic_Rhinosinusitis_With_Nasal_Polyps_A_Meta-Analysis_of_Real-World_Evidence"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Patients sous Dupixent/consultation ORL pour polypes — rassurer sur l'efficacité confirmée en vie réelle, vérifier le stock frigo 2-8 °C du stylo, et ne jamais conseiller d'arrêter les lavages de nez au sérum physiologique qui restent le socle du traitement."},{"dom":"ORL & stomatologie","type":"Médicament","n":1,"dt":"2026-06","titre":"Vertige positionnel paroxystique bénin (VPPB) : la bétahistine contre les vertiges résiduels après manoeuvre de repositionnement — revue systématique d'ECR, les preuves restent limitées (Frontiers in Pharmacology)","subst":"bétahistine | VPPB | manoeuvre d'Epley | vertiges résiduels | revue systématique","res":"Revue systématique d'essais randomisés (Frontiers in Pharmacology, section Neuropharmacology, publiée le 2 juin 2026 — « Front. Pharmacol., 02 June 2026 » lu sur la page ouverte, DOI 10.3389/fphar.2026.1855843) évaluant la bétahistine pour les vertiges résiduels persistants après maneuvre de repositionnement cannalaire (Epley/Semont) dans le VPPB : les mécanismes proposés (vasodilatation labyrinthique) fondent une rationnelle biologique, mais les essais randomisés inclus ne la valident pas directement (message d'ensemble lu dans les extraits PubMed 42311406 et de la page Frontiers). Distinct de la candidate SFORL rééducation vestibulaire Ménière (reco-vague5) : ici le VPPB, vertige périphérique le plus fréquent en officine.","src":[["Frontiers in Pharmacology — publication du 2 juin 2026 (page ouverte)","https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1855843/full"],["PubMed 42311406 — Betahistine for residual dizziness after canalith repositioning in BPPV","https://pubmed.ncbi.nlm.nih.gov/42311406/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Après une maneuvre réussie, des sensations instables résiduelles quelques jours sont fréquentes et bénignes ; pas de preuve solide pour ajouter un antivertigineux au long cours — poursuite des exercices de Brandt-Daroff et consultation si persistance au-delà de quelques semaines."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2024-11","titre":"OPTION : fermeture de l'appendice auriculaire gauche vs anticoagulation orale après ablation de FA (NEJM)","subst":"appendice auriculaire gauche · Watchman · ablation FA · anticoagulation","res":"Essai randomisé 1600 patients ayant eu une ablation de FA : la fermeture de l'appendice auriculaire (Watchman, avec anticoagulation 90 jours puis aspirine seule) est non inférieure à l'anticoagulation orale pour la protection thrombo-embolique, avec un risque hémorragique non lié à la procédure inférieur (résultats présentés AHA le 16/11/2024 et publiés NEJM le 16/11/2024, page ACC vue et datée ; sponsor Boston Scientific). Aucune entrée base/candidates sur l'appendice auriculaire (FA en base : ESC/EACTS 2024, AMALFI dépistage, AVANT GUARD PFA, PRESTIGE-AF).","src":[["ACC — OPTION trial (16/11/2024)","https://www.acc.org/latest-in-cardiology/clinical-trials/2024/11/15/15/16/option"],["SOLACI — OPTION (25/11/2024)","https://solaci.org/en/2024/11/25/option-trial-left-atrial-appendage-closure/"],["Healio — OPTION (16/11/2024)","https://www.healio.com/news/cardiology/20241116/left-atrial-appendage-closure-safe-effective-firstline-option-for-af-ablation-patients"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un patient ablaté porteur d'un Watchman peut être sous simple aspirine à long terme — ne pas s'étonner de l'absence d'AOD, vérifier l'observance du schéma post-implantation et l'absence d'automédication par AINS."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-10","titre":"ARREST-AF : prise en charge agressive des facteurs de risque après ablation de FA — récidives réduites de près de moitié (JAMA Cardiology)","subst":"facteurs de risque · ablation FA · poids · alcool · sommeil","res":"Essai randomisé (JAMA Cardiology, publié en ligne le 29/10/2025, doi 10.1001/jamacardio.2025.4007 ; PMID 41160038) : chez les patients FA non permanente symptomatique (IMC ≥ 27) en première ablation, un programme intensif de gestion des facteurs de risque (poids, tension, alcool, sommeil, activité) améliore la liberté de récidive d'arythmie à 12 mois — relais Patient Care Online : « reduced recurrent AF by nearly half ». Complète AVANT GUARD (technique) : ici le LE VIE DU PATIENT est le levier.","src":[["JAMA Cardiology — ARREST-AF (doi)","https://dx.doi.org/10.1001/jamacardio.2025.4007"],["PubMed 41160038","https://pubmed.ncbi.nlm.nih.gov/41160038/"],["Patient Care Online — « Published online October 29, 2025 »","https://www.patientcareonline.com/view/aggressive-risk-factor-management-reduced-recurrent-af-by-nearly-half-after-catheter-ablation"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Après une ablation, la pilule ne suffit pas — perte de poids, arrêt de l'alcool, traitement de l'apnée du sommeil et activité physique font partie du traitement au même titre que les antiarythmiques ; message fort pour l'entretien de sortie."},{"dom":"Cardiologie","type":"Officine","n":2,"dt":"2026-01","titre":"EQUAL : dépistage de la FA par montre connectée (Apple Watch) chez le sujet âgé à haut risque — essai randomisé (JACC)","subst":"montre connectée · dépistage FA · télésurveillance","res":"Essai randomisé (Amsterdam UMC, ~437 patients âgés à haut risque d'AVC) : la télésurveillance par montre connectée (PPG + ECG, notification au médecin) détecte ~4 fois plus de nouveaux diagnostics de FA, souvent asymptomatique et paroxystique, que le suivi habituel (EQUAL ; JACC publié en ligne le 21/01/2026, print 2026 Apr;87(14):1714-1728 ; relais ACC du 28/01/2026 et EurekAlert vus). Distinct du dépistage par patch ECG AMALFI déjà en base (autre dispositif, autre essai, résultat plus modeste).","src":[["ACC journal scan — EQUAL (28/01/2026)","https://www.acc.org/latest-in-cardiology/journal-scans/2026/01/28/02/51/equal"],["JACC — EQUAL RCT","https://www.jacc.org/doi/10.1016/j.jacc.2025.11.032"],["EurekAlert — Amsterdam UMC (notification vue)","https://www.eurekalert.org/news-releases/1113132"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"De plus en plus de patients arrivent avec une notification « FA suspectée » de leur montre — ce n'est pas un diagnostic : orienter vers le médecin (ECG confirmatoire), mais ne pas minimiser le signal chez le sujet âgé à risque."},{"dom":"Cardiologie","type":"Médicament","n":4,"dt":"2025-11","titre":"ASPREE suivi prolongé : l'aspirine en prévention primaire chez le sujet sain de 70 ans et plus — toujours pas de bénéfice CV, hémorragies majeures en excès (European Heart Journal)","subst":"aspirine · prévention primaire · sujet âgé · hémorragie","res":"Suivi post-essai étendu d'ASPREE (15 668 adultes ≥ 70 ans, Australie/US ; EHJ 2025;46(42):4410-4422, 7 novembre 2025 — citation et PDF « (2025) 46, 4410–4422 » vus) : l'aspirine à faible dose en prévention primaire du sujet âgé sain ne réduit pas les événements CV à long terme et majore le risque d'hémorragie majeure (relais Medical Xpress/Medscape 09/2025). Aucune entrée base sur l'aspirine en prévention primaire CV (aspirine en base uniquement : prééclampsie).","src":[["EHJ — ASPREE extended follow-up, 46(42):4410","https://academic.oup.com/eurheartj/article/46/42/4410/8232480"],["EHJ — PDF « (2025) 46, 4410–4422 »","https://academic.oup.com/eurheartj/article-pdf/46/42/4410/64027053/ehaf514.pdf"],["Medscape — relais 09/2025","https://www.medscape.com/viewarticle/aspirin-confers-no-long-term-heart-benefits-older-adults-2025a1000m2k"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Rappel utile au comptoir — l'aspirine « pour le cœur » sans maladie cardiovasculaire installée n'est pas recommandée chez le senior ; vérifier l'automédication chronique et signaler toute automédication non justifiée au médecin."},{"dom":"Cardiologie","type":"Médicament","n":1,"dt":"2025-06","titre":"Polypill et prévention CV primaire et secondaire : méta-analyse des combinaisons optimales (Frontiers in Cardiovascular Medicine)","subst":"polypill · combinaison fixe · prévention CV","res":"Revue systématique et méta-analyse (Front. Cardiovasc. Med., publié le 09/06/2025 — page Frontiers vue « 09 June 2025 » ; PubMed 40552187) : les polypills à 3 classes contenant une statine de forte intensité + aspirine + inhibiteur du SRAA donnent la plus grande réduction des MACE ; la présence d'un diurétique/antagoniste calcique n'apporte pas de bénéfice supplémentaire net (conclusions lues dans les extraits). Aucune entrée polypill en base.","src":[["Frontiers Cardiovasc Med — 09/06/2025","https://www.frontiersin.org/journals/cardiovascular-medicine/articles/10.3389/fcvm.2025.1558579/full"],["PubMed 40552187","https://pubmed.ncbi.nlm.nih.gov/40552187"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pertinent pour l'observance du patient polymédiqué coronaire — une combinaison fixe réduit le nombre de prises ; ne jamais « déconditionner » sans vérifier que les dosages correspondent à la prescription."},{"dom":"Cardiologie","type":"Médicament","n":1,"dt":"2026-05","titre":"iSGLT2 et insuffisance cardiaque : méta-analyse complète sur mortalité et hospitalisations (Frontiers in Endocrinology)","subst":"SGLT2 · insuffisance cardiaque · mortalité · hospitalisation","res":"Méta-analyse « comprehensive » (Front. Endocrinol., publié le 13/05/2026 — page Frontiers vue « 13 May 2026 » ; PubMed 42211456) : les iSGLT2 réduisent significativement la mortalité et les hospitalisations pour IC et améliorent les biomarqueurs et paramètres de fonction cardiaque, indépendamment du statut diabétique et du phénotype d'IC (conclusions lues dans les extraits PubMed). La base contient les essais pivots fondateurs (EMPEROR-Reduced/Preserved, DELIVER, rétro) — cette entrée apporte la SYNTHÈSE globale 2026, utile pour le discours « les gliflozines protègent le cœur même sans diabète ».","src":[["Frontiers in Endocrinology — 13/05/2026","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2026.1758519/full"],["PubMed 42211456","https://pubmed.ncbi.nlm.nih.gov/42211456/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Chez l'insuffisant cardiaque, un iSGLT2 n'est pas un « médicament de diabétique » — expliquer le double bénéfice, ne pas conseiller l'arrêt pour une glycémie normale, et rappeler l'hydratation et les signes de déplétion."},{"dom":"Soins primaires & Officine","type":"Officine","n":1,"dt":"2025-03","titre":"Services de soins hypertensifs délivrés par les pharmaciens : revue systématique et méta-analyse d'ECR (Frontiers in Cardiovascular Medicine)","subst":"pharmacien · hypertension · soins ambulatoires","res":"Revue systématique et méta-analyse d'essais randomisés (Front. Cardiovasc. Med., publié le 14/03/2025 — page Frontiers vue « 14 March 2025 » ; section Hypertension) : les interventions pharmaciennes (éducation, suivi d'observance, automesure, adaptation collaborative) améliorent le contrôle tensionnel vs soins usuels (synthèse de la littérature d'ECR, conclusions des extraits). La base ne contient qu'UNE étude nationale d'automesure promue par pharmacien (Hypertension Research) — cette méta-analyse en est le socle de preuves global, grade supérieur (N1).","src":[["Frontiers Cardiovasc Med — 14/03/2025","https://www.frontiersin.org/journals/cardiovascular-medicine/articles/10.3389/fcvm.2025.1477729/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument pour valoriser un service tension à l'officine (automesure, entretien observance, orientation) ; l'HTA non contrôlée est la 1re cause modifiable de mortalité CV."},{"dom":"Cardiologie","type":"Médicament","n":4,"dt":"2025-10","titre":"AOD chez les très âgés et patients à haut risque hémorragique avec FA, souvent privés d'anticoagulation : cohorte nationale coréenne (EP Europace)","subst":"AOD · sujet très âgé · risque hémorragique · FA","res":"Cohorte nationale de population (Corée ; EP Europace 2025;27(10):euaf230, « 2025 Oct 7;27(10):euaf230 » lu dans la citation PubMed 41020486) : chez les patients très âgés/fragiles à haut risque hémorragique souvent exclus de l'anticoagulation, les AOD sont associés à de meilleurs résultats et à un meilleur bénéfice clinique net vs warfarine — dans une population où l'ELDERCARE-AF (edoxaban 15 mg) avait montré la voie (essai 2021, hors fenêtre 2024-2026, non retenu).","src":[["EP Europace — 27(10):euaf230","https://academic.oup.com/europace/article/27/10/euaf230/8267820"],["PubMed 41020486 — « 2025 Oct 7;27(10):euaf230 »","https://pubmed.ncbi.nlm.nih.gov/41020486/"],["PMC12510312","https://pmc.ncbi.nlm.nih.gov/articles/PMC12510312/"]],"coi":
