 néphropathie à IgA, longtemps sans traitement spécifique, entre dans l’ère des biothérapies ciblées — surveiller la protéinurie sous traitement devient un suivi de routine.","src":[["Vera Therapeutics (communiqué FDA)","https://ir.veratx.com/news-releases/news-release-details/vera-therapeutics-receives-fda-accelerated-approval-trutaknatm"],["BioPharma Dive","https://www.biopharmadive.com/news/vera-fda-approve-trutakna-IgAN-kidney-disease-atacicept/824620/"]],"coi":"Industrie","fin":"Essai ORIGIN 3 sponsorisé par Vera Therapeutics, fabricant de l’atacicept ; AMM accélérée = bénéfice provisoire confirmé sur la protéinurie, données de fonction rénale encore attendues."},{"dom":"Neurologie","type":"Médicament","n":2,"dt":"2026-02","titre":"SEP secondaire progressive non repoussante : un traitement retarde enfin le handicap (HERCULES)","subst":"Tolébrutinib — inhibiteur oral de BTK (Sanofi), SEP progressive","res":"Phase 3 HERCULES : l’inhibiteur de BTK oral tolébrutinib réduit de 31 % le risque d’entrée en progression confirmée à 6 mois du handicap dans la SEP secondaire progressive non repoussante (nrSPMS) — première preuve clinique qu’un traitement peut agir sur cette population sans option, en visant l’inflammation intra-SNC (cellules B résidentes). En revanche, l’essai dans la SEP primaire progressive n’a pas atteint son critère principal (ACTRIMS, févr. 2026) : l’effet dépend de la population.","off":"Pour les formes progressives de SEP, longtemps orphelines de traitement, un espoir documenté se précise — la physiopathologie cible l’inflammation dans le cerveau lui-même.","src":[["Cleveland Clinic (HERCULES)","https://consultqd.clevelandclinic.org/disability-progression-slowed-for-first-time-in-nonrelapsing-secondary-progressive-multiple-sclerosis"],["MS News Today (ACTRIMS 2026)","https://multiplesclerosisnewstoday.com/news-posts/2026/02/10/actrims-2026-tolebrutinib-misses-main-goal-ppms-trial/"]],"coi":"Industrie","fin":"Programme tolébrutinib (HERCULES, essai PPMS) sponsorisé par Sanofi ; résultats présentés en conférence, publication à comité de lecture en cours."},{"dom":"Douleur & Migraine","type":"Médicament","n":2,"dt":"2025-01","titre":"Suzetrigine (Journavx) : premier antalgique non opioïde d’une classe nouvelle depuis plus de 20 ans","subst":"Suzetrigine — inhibiteur sélectif du canal sodique Nav1.8 (Vertex), douleur aiguë","res":"Inhibiteur oral sélectif Nav1.8 approuvé par la FDA le 30 janvier 2025 pour la douleur aiguë modérée à sévère : dans deux essais de phase 3 (NEJM), supérieur au placebo sur 48 h après abdominoplastie ou bunionectomie, d’efficacité comparable à hydrocodone/acétaminophène, avec des effets indésirables légers à modérés — sans les risques opioïdes (dépression respiratoire, dépendance). Une classe à suivre pour l’antalgie post-opératoire ; pas d’indication chronique à ce jour.","off":"Une nouvelle option non opioïde contre la douleur aiguë existe désormais : elle ne crée pas de dépendance, mais ne remplace pas encore les traitements des douleurs chroniques.","src":[["Essais de phase 3 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40117446/"],["NeurologyLive (AMM FDA)","https://www.neurologylive.com/view/fda-approves-vertex-pharmaceuticals-suzetrigine-acute-pain-management"]],"coi":"Industrie","fin":"Développement sponsorisé par Vertex Pharmaceuticals, fabricant du suzetrigine ; essais de phase 3 publiés dans le NEJM."},{"dom":"Psychiatrie","type":"Médicament","n":2,"dt":"2024-09","titre":"Schizophrénie : Cobenfy (xanomeline-trospium), premier antipsychotique sans blocage dopaminergique depuis des décennies","subst":"Xanomeline + trospium — agoniste muscarinique central (KarXT, BMS), schizophrénie","res":"Combinaison d’un agoniste muscarinique central (xanomeline) et du trospium (pour limiter les effets cholinergiques périphériques) : approuvée par la FDA en septembre 2024 sur les essais de phase 3 EMERGENT (réduction des symptômes positifs et négatifs de la schizophrénie sans antagonisme D2 — pas de prise de poids ni de symptômes extrapyramidaux attendus). Nuance importante : l’essai ARISE en adjonction à un antipsychotique atypique n’a pas atteint le seuil de significativité (topline BMS) — la place exacte de Cobenfy reste à définir.","off":"Un antipsychotique qui ne passe pas par la dopamine : une rupture mécanistique, mais le recul et la place dans l’arsenal restent à construire.","src":[["BMS (topline ARISE)","https://news.bms.com/news/details/2025/Bristol-Myers-Squibb-Announces-Topline-Results-from-Phase-3-ARISE-Trial-Evaluating-Cobenfy-xanomeline-and-trospium-chloride-as-an-Adjunctive-Treatment-to-Atypical-Antipsychotics-in-Adults-with-Schizophrenia/default.aspx"],["Revue systématique KarXT (PubMed)","https://pubmed.ncbi.nlm.nih.gov/41045433/"]],"coi":"Industrie","fin":"Développement Karuna Therapeutics/Bristol Myers Squibb, fabricant de Cobenfy ; AMM sur procédure accélérée, essai adjuvant négatif à signaler."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2026-04","titre":"BPCO : l’anti-IL-33 tozorakimab réussit trois essais de phase 3 (OBERON, TITANIA, MIRANDA)","subst":"Tozorakimab — anticorps anti-IL-33 (AstraZeneca), BPCO à exacerbations","res":"Trois essais pivots de phase 3 positifs en 2026 : OBERON et TITANIA (annoncés en mars) puis MIRANDA (20 avril ; 1 454 patients, 300 mg toutes les 2 semaines) — réduction statistiquement significative et cliniquement pertinente du taux annualisé d’exacerbations modérées à sévères de BPCO sous traitement inhalé standard, y compris chez les anciens fumeurs, avec un profil de sécurité favorable. Après le dupilumab, la BPCO à exacerbations s’installe comme cible biologique ; dépôts réglementaires en préparation.","off":"Pour la BPCO qui fait des exacerbations à répétition malgré les inhalateurs, une ère d’anticorps injectables s’ouvre — l’inhalation reste la base, l’injectable vient en plus.","src":[["AstraZeneca (MIRANDA, 20 avril 2026)","https://www.astrazeneca.com/media-centre/press-releases/2026/third-tozorakimab-positive-phase-iii-in-copd.html"],["HCPLive (OBERON, TITANIA)","https://www.hcplive.com/view/il-33-inhibitor-tozorakimab-cuts-copd-exacerbations-in-phase-3-trials"]],"coi":"Industrie","fin":"Programme sponsorisé par AstraZeneca, fabricant du tozorakimab ; résultats haut niveau de phase 3, publication complète à venir."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-09","titre":"Prévention du VIH : le lénacapavir semestriel (Yeztugo) approuvé — un tournant pour la PrEP","subst":"Lénacapivir — inhibiteur de capside du VIH, injectable tous les 6 mois (PrEP)","res":"Inhibiteur de capside injectable deux fois par an (Gilead) : dans PURPOSE-2 (phase 3), réduction de 96 % des infections VIH dans les populations cisgenres masculines et gender-diverses vs comparateur oral ; AMM FDA 2025 comme PrEP, et le CDC recommande fortement le lénacapivir chez toute personne ≥35 kg à qui la PrEP serait bénéfique (MMWR 2025). Une protection semestrielle par injection relègue l’observance quotidienne au second plan : un tournant de santé publique dans l’épidémie.","off":"Se protéger du VIH en deux injections par an plutôt qu’un comprimé quotidien : c’est désormais recommandé aux États-Unis pour les personnes exposées.","src":[["CDC MMWR (recommandation)","https://www.cdc.gov/mmwr/volumes/74/wr/mm7435a1.htm"],["Pharmacy Times (AMM FDA)","https://www.pharmacytimes.com/view/fda-approves-twice-yearly-lenacapavir-for-hiv-preexposure-prophylaxis"]],"coi":"Industrie","fin":"Essais PURPOSE sponsorisés par Gilead Sciences, fabricant du lénacapavir ; recommandation CDC indépendante fondée sur les deux ECT."},{"dom":"Rhumatologie","type":"Médicament","n":2,"dt":"2026-11","titre":"Gonarthrose de l’obèse : le retatrutide fait chuter la douleur du genou (TRIUMPH-4, NEJM)","subst":"Retatrutide dans la gonarthrose douloureuse avec obésité — perte de poids comme antalgique","res":"Deux essais de phase 3 (TRIUMPH-4 et TRIUMPH-1-OA, plus de 1 000 participants, pilotés par Northwestern) publiés dans le NEJM le 8 novembre 2026 : chez le patient en surpoids/obèse avec gonarthrose douloureuse, le triple agoniste retatrutide réduit significativement la douleur du genou à 68 semaines, avec jusqu’à −28,7 % de poids (TRIUMPH-4). La perte de poids devient un traitement analgésique démontré en phase 3 — après STEP 9, le paradigme « l’arthrose se soigne aussi par le poids » s’impose.","off":"Perdre du poids fait moins mal au genou : c’est maintenant prouvé par des essais de phase 3, pas seulement par le bon sens.","src":[["NEJM (TRIUMPH arthrose)","https://www.nejm.org/doi/full/10.1056/NEJMoa2610676"],["Patient Care (TRIUMPH-4)","https://www.patientcareonline.com/view/retatrutide-achieves-up-to-28-7-weight-loss-and-marked-knee-pain-reduction-in-phase-3-triumph-4-trial"]],"coi":"Industrie","fin":"Essais TRIUMPH sponsorisés par Eli Lilly, fabricant du retatrutide, coordonnés par Northwestern ; publiés dans le NEJM."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":4,"dt":"2026-02","titre":"Dépression post-partum : zuranolone (Zurzuvae), l’oral de 14 jours confirme en vie réelle — mais reste sous-utilisée","subst":"Zuranolone (Zurzuvae) — neurostéroïde oral modulateur GABA-A, dépression post-partum","res":"Premier traitement oral spécifique de la dépression post-partum (AMM FDA 2023 ; effet rapide dès J3, cure quotidienne de 14 jours) : une étude de phase 4 en vie réelle montre une amélioration cliniquement pertinente dès la fin de la cure, entretenue jusqu’à J45, quelle que soit la sévérité initiale ; recommandé en Écosse (SMC, février 2026). Mais les données de prescription 2024-2025 montrent une adoption très faible : la plupart des femmes éligibles ne se voient pas proposer ce traitement — un échec de diffusion à corriger côté officine.","off":"Une dépression post-partum sévère qui dure peut se traiter par un comprimé pendant 14 jours, avec effet rapide — en parler en consultation allaitement/péri-partum peut changer une trajectoire.","src":[["Contemporary OB/GYN (phase 4 vie réelle)","https://www.contemporaryobgyn.net/view/zuranolone-postpartum-depression-real-world-interim-day-45"],["SMC Écosse (févr. 2026)","https://scottishmedicines.org.uk/media/9786/zuranolone-zurzuvae-final-jan-2026-for-website.pdf"]],"coi":"Industrie","fin":"Développement Sage Therapeutics/Biogen ; les données vie réelle proviennent d’une étude sponsorisée par le fabricant — l’adoption faible est documentée par des sources indépendantes (Psychiatric Times)."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2026-09","titre":"Lp(a) : le pelacarsen abaisse de 78 %… sans réduire les événements (Lp(a)HORIZON, résultat négatif)","subst":"Pelacarsen — ARN antisens anti-Lp(a) (Novartis), patients CV établie avec Lp(a) élevée","res":"Résultat majeur et contre-intuitif : dans Lp(a)HORIZON (phase 3, ~4,7 ans de suivi ; topline Novartis du 4 septembre 2026, sessions AHA 2026, NEJM), le pelacarsen a réduit la Lp(a) d’environ 78 % mais n’a pas atteint son critère principal de réduction des événements cardiovasculaires majeurs (MACE) chez les patients avec maladie CV établie et Lp(a) élevée ; effets indésirables légers. L’hypothèse « abaisser la Lp(a) suffit à éviter les événements » est au banc d’essai — les autres approches (zérasiran, olézarsen) restent à prouver sur critères cliniques.","off":"Avoir une Lp(a) élevée reste un marqueur de risque à connaître, mais aucun médicament abaisseur n’a encore démontré éviter des accidents cardiovasculaires — le dépistage oui, le traitement spécifique pas encore.","src":[["Novartis (topline, 4 sept. 2026)","https://www.novartis.com/news/media-releases/novartis-announces-lpahorizon-phase-iii-topline-results-pelacarsen-patients-elevated-lpa-and-established-cardiovascular-disease-cvd"],["NEJM (Lp(a)HORIZON)","https://www.nejm.org/doi/full/10.1056/NEJMoa2610159"]],"coi":"Industrie","fin":"Essai sponsorisé par Novartis/Ionis ; résultat négatif rendu public de façon transparente par le sponsor — un essai « instructif » à connaître avant de survendre la baisse de Lp(a)."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2026-06","titre":"Cancer du pancréas métastatique : le daraxonrasib double quasiment la survie (RASolute 302, ASCO 2026)","subst":"Daraxonrasib — inhibiteur multisélectif de RAS(ON) (Revolution Medicines), 2e ligne PDAC","res":"Session plénière ASCO 2026 : dans RASolute 302 (phase 3), l’inhibiteur multisélectif de RAS(ON) daraxonrasib versus chimiothérapie en 2e ligne du cancer pancréatique métastatique prétraité montre une survie médiane quasi doublée (amélioration de ~60 %), décrite comme « transformatrice » — première preuve qu’un inhibiteur direct de RAS apporte un bénéfice de survie dans un des cancers les plus réfractaires qui soient.","off":"Le cancer du pancréas, longtemps hors d’atteinte des thérapies ciblées, voit enfin arriver un inhibiteur de RAS actif — une lueur pour une maladie qui manquait d’options.","src":[["ASCO Post (RASolute 302)","https://ascopost.com/issues/june-10-2026/daraxonrasib-nearly-doubles-survival-in-previously-treated-metastatic-pancreatic-cancer/"],["Revolution Medicines (ASCO plénière)","https://ir.revmed.com/news-releases/news-release-details/revolution-medicines-announces-asco-plenary-presentation"]],"coi":"Industrie","fin":"Essai sponsorisé par Revolution Medicines, développeur du daraxonrasib ; résultats présentés en session plénière ASCO, publication complète à venir."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2026-08","titre":"Vaccin ARNm personnalisé + pembrolizumab : la rechute du mélanome chute de 42 % (INTerpath-001)","subst":"Intismeran autogene (V940, ex-mRNA-4157) + pembrolizumab — thérapie néoantigénique individualisée, mélanome réséqué","res":"Première combinaison vaccin ARNm personnalisé/immunothérapie à franchir la phase 3 : INTerpath-001 (1 137 patients, mélanome complètement réséqué stade IIB-IV ; annonces Merck/Moderna d’août 2026) atteint ses critères de survie sans récidive (RFS) et sans métastase à distance (DMFS), avec un risque de rechute réduit de 42 % vs pembrolizumab seul en adjuvant — vers un nouveau standard adjuvant du mélanome, et un jalon pour la médecine ARNm personnalisée en oncologie.","off":"Après l’ablation d’un mélanome à risque, un vaccin fabriqué sur mesure à partir de la tumeur diminue fortement le risque de rechute : l’ère des vaccins anticancer personnalisés commence.","src":[["Merck/Moderna (topline INTerpath-001)","https://www.merck.com/news/merck-and-moderna-announce-phase-3-interpath-001-trial-of-intismeran-autogene-plus-keytruda-met-endpoints-of-recurrence-free-survival-rfs-and-distant-metastasis-free-survival-dmfs-in-patient/"],["AJMC (−42 % de rechutes)","https://www.ajmc.com/view/merck-moderna-cancer-vaccine-cuts-melanoma-recurrence-risk-by-42-"]],"coi":"Industrie","fin":"Essai sponsorisé conjointement par Merck et Moderna, codéveloppeurs d’intismeran ; données détaillées à présenter en congrès, publication à venir."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-09","titre":"Veille réglementaire européenne : le CHMP recommande 12 médicaments en septembre, 12 nouveaux + 6 biosimilaires sur janvier-février","subst":"CHMP (EMA) — flux d’autorisations 2026, procédure centralisée européenne","res":"Réunions du CHMP 2026 : 12 médicaments recommandés à la réunion de septembre ; sur janvier-février, 12 nouveaux médicaments et 6 biosimilaires recommandés pour une autorisation européenne (revue du Lancet Regional Health – Europe). Un flux d’autorisations à surveiller pour anticiper les innovations arrivant à l’officine — chaque réunion mensuelle du CHMP peut déplacer une ligne de votre plan de bataille.","off":"Les futures AMM européennes se décident au CHMP : suivre ses conclusions mensuelles, c’est voir 6 à 12 mois à l’avance ce qui arrivera en rayon ou en rétrocession.","src":[["EMA (CHMP septembre 2026)","https://www.ema.europa.eu/en/news/meeting-highlights-committee-medicinal-products-human-use-chmp-14-17-september-2026"],["Lancet Regional Health – Europe (janv.-févr. 2026)","https://www.thelancet.com/journals/lanepe/article/PIIS2666-7762(26)00069-4/fulltext"]],"coi":"Indépendant","fin":"Agence européenne des médicaments (agence publique de l’UE) et revue académique à comité de lecture — aucune participation industrielle."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2026-06","titre":"Créatine vs protéine vs oméga-3 : qui gagne pour le muscle ? (méta-analyse en réseau, 35 essais)","subst":"Créatine, protéines, oméga-3 — force, endurance et récupération chez l’adulte entraîné","res":"Méta-analyse en réseau (Nutrients, 2026 ; 35 essais randomisés, 1 211 participants entraînés) comparant les trois compléments vedettes : la créatine domine pour la force musculaire, les protéines pour l’endurance, les oméga-3 pour la récupération — aucun ne gagne sur tous les tableaux, le choix dépend de l’objectif. Un argument au comptoir pour remplacer la vente croisée générique par un conseil ciblé.","off":"Créatine pour la force, protéine pour l’endurance, oméga-3 pour récupérer : dites-moi votre objectif, je vous dis votre complément.","src":[["Nutrients 2026 (NMA)","https://www.mdpi.com/2072-6643/18/6/909"]],"coi":"Indépendant","fin":"Revue académique en accès libre (MDPI, Nutrients) ; pas de financement industriel identifié dans la source consultée."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2024-03","titre":"MASH : le resmetirom (Rezdiffra), premier médicament de l’histoire du « foie gras » avec fibrose","subst":"Resmetirom — agoniste THR-β hépatique (Madrigal), MASH avec fibrose F2-F3","res":"AMM accélérée FDA (14 mars 2024) : premier traitement approuvé de la stéatohépatite métabolique (MASH) avec fibrose modérée à avancée, fondée sur l’essai de phase 3 MAESTRO-NASH (NEJM, févr. 2024) — amélioration de la stéatose, des enzymes hépatiques, des biomarqueurs de fibrose et de l’imagerie vs placebo. Après une décennie d’échecs, le dépistage du MASH chez l’obèse et le diabétique change d’enjeu : il existe désormais un traitement des stades fibrotiques.","off":"Il existe enfin un médicament du « foie gras » avec fibrose — mais l’hygiène alimentaire reste la base, et le traitement n’est réservé qu’aux stades documentés par biopsie/imagerie.","src":[["Medscape (AMM FDA)","https://www.medscape.com/viewarticle/fda-approves-first-drug-mash-2024a10004vn"],["Drugs.com (historique AMM)","https://www.drugs.com/history/rezdiffra.html"]],"coi":"Industrie","fin":"Essai MAESTRO-NASH sponsorisé par Madrigal Pharmaceuticals, fabricant du resmetirom ; AMM accélérée, données confirmatoires en cours."},{"dom":"Cardiologie","type":"Médicament","n":3,"dt":"2024-02","titre":"HTA : le zilebesiran, ARN interférent contre l’angiotensinogène — vers 2 injections par an (KARDIA-1)","subst":"Zilebesiran — ARNi sous-cutané ciblant la synthèse hépatique de l’angiotensinogène (Alnylam)","res":"Essai randomisé de phase 2 KARDIA-1 (JAMA, 16 févr. 2024) : chez l’hypertendu léger à modéré, le zilebesiran (300 ou 600 mg sous-cutané) abaisse la pression artérielle sur 24 h de façon maintenue jusqu’à 6 mois, avec des schémas trimestriels ou semestriels. Le concept : transformer un traitement quotidien en deux injections annuelles — un angle mort de l’observance. Résultats de phase 2 à confirmer (KARDIA-2 en association a suivi).","off":"Une piqûre semestrielle au lieu d’un comprimé quotidien pour la tension : encore expérimental, mais la piste est sérieuse pour les hypertendus non observants.","src":[["JAMA (KARDIA-1)","https://jamanetwork.com/journals/jama/fullarticle/2815379"],["Alnylam (publication)","https://capella.alnylam.com/2024/02/16/zilebe-k1-nejm"]],"coi":"Industrie","fin":"Essai KARDIA-1 sponsorisé par Alnylam Pharmaceuticals, développeur du zilebesiran ; phase 2, confirmation en phase 3 nécessaire."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2024-10","titre":"Cancer gastrique : le zolbetuximab (Vyloy) cible CLDN18.2 en 1re ligne (FDA, oct. 2024)","subst":"Zolbetuximab — anticorps anti-claudine 18.2 (Astellas), adénocarcinome gastrique/GEJ avancé","res":"AMM FDA (18 oct. 2024) : premier traitement ciblant la claudine 18.2, approuvé avec chimiothérapie (fluoropyrimidine + platine) en 1re ligne de l’adénocarcinome gastrique ou gastrique-œsophagien avancé CLDN18.2-positif — fondée sur les essais de phase 3 SPOTLIGHT et GLOW : amélioration de la survie sans progression ET de la survie globale vs chimiothérapie seule. CLDN18.2 rejoint HER2 dans le bilan biomarqueur de ces cancers ; tests compagnons à anticiper à l’hôpital.","off":"Les cancers de l’estomac entrent dans l’ère des biomarqueurs : un anticorps ciblé CLDN18.2 est désormais approuvé en première ligne.","src":[["Oncology Nursing News (AMM)","https://www.ons.org/publications-research/voice/news-views/10-2024/fda-approves-zolbetuximab-clzb-chemotherapy-gastric"],["OncLive (SPOTLIGHT/GLOW)","https://www.onclive.com/view/fda-approves-zolbetuximab-plus-chemo-for-cldn18-2-gastric-or-gej-adenocarcinoma"]],"coi":"Industrie","fin":"Essais SPOTLIGHT et GLOW sponsorisés par Astellas Pharma, fabricant du zolbetuximab."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2024-08","titre":"Gliome de grade 2 IDH-muté : le vorasidenib, première thérapie ciblée en neuro-oncologie (INDIGO)","subst":"Vorasidenib (Voranigo) — inhibiteur oral IDH1/2 pénétrant le SNC (Servier)","res":"AMM FDA (6 août 2024) : première thérapie ciblée des gliomes diffus de grade 2 avec mutation IDH1/2 — fondée sur l’essai de phase 3 INDIGO (Dana-Farber) : le vorasidenib a plus que doublé le délai avant la prochaine intervention antitumorale vs placebo et retardé la progression. Pour des patients jusque-là entre surveillance et radiothérapie destructrice, un comprimé oral différé les traitements lourds — décrit comme l’avancée la plus importante depuis des décennies dans cette maladie.","off":"Pour certains gliomes de bas grade, un comprimé ciblé permet de différer radiothérapie et chimiothérapie : un vrai changement de vie pour ces patients jeunes.","src":[["Dana-Farber (AMM)","https://www.dana-farber.org/newsroom/news-releases/2024/fda-approves-new-therapy-for-glioma-patients-for-first-time-in-decades"],["Drugs.com (historique AMM)","https://www.drugs.com/history/voranigo.html"]],"coi":"Industrie","fin":"Essai INDIGO sponsorisé par Servier Pharmaceuticals, fabricant du vorasidenib."},{"dom":"Oncologie","type":"Médicament","n":3,"dt":"2024-02","titre":"Mélanome métastatique : le lifileucel (Amtagvi), première thérapie cellulaire TIL en tumeur solide","subst":"Lifileucel — immunothérapie par lymphocytes T infiltrant la tumeur (Iovance), mélanome post-PD-1","res":"AMM accélérée FDA (16 févr. 2024) : première thérapie TIL (lymphocytes T infiltrant la tumeur, extraits de la tumeur du patient) approuvée, pour le mélanome unresectable/métastatique après échec d’un anti-PD-1 (± anti-CTLA-4, ± BRAF/MEK) — fondée sur un essai de phase 2 monobras (taux de réponse et durée de réponse jugés convaincants). Un traitement lourd (lymphodéplétion + IL-2, durée d’hospitalisation) mais une option de recours inédite ; première thérapie cellulaire solide, aux côtés des CAR-T hématologiques.","off":"Après échec des immunothérapies du mélanome, il existe maintenant une thérapie cellulaire fabriquée à partir de la tumeur du patient lui-même.","src":[["FDA (AMM accélérée)","https://www.fda.gov/drugs/resources-information-approved-drugs/fda-grants-accelerated-approval-lifileucel-unresectable-or-metastatic-melanoma"],["Clinical Cancer Research (résumé AMM)","https://aacrjournals.org/clincancerres/article/31/19/4004/765498/FDA-Approval-Summary-Lifileucel-for-Unresectable"]],"coi":"Industrie","fin":"Développement Iovance Biotherapeutics ; AMM accélérée sur essai monobras de phase 2, confirmation en cours."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2024-06","titre":"BPCO : l’ensifentrine (Ohtuvayre), premier inhalé bronchodilatateur ET anti-inflammatoire non stéroïdien (FDA, juin 2024)","subst":"Ensifentrine — inhibiteur double PDE3/PDE4 inhalé (Verona Pharma), BPCO d’entretien","res":"AMM FDA (26 juin 2024) : premier inhalé associant bronchodilation et effet anti-inflammatoire non stéroïdien (double inhibiteur PDE3/PDE4) pour l’entretien de la BPCO adulte — fondée sur deux essais randomisés de phase 3 contre placebo, en ajout du traitement standard (réduction des exacerbations et amélioration de la fonction pulmonaire). Premier nouveau mécanisme inhalé dans la BPCO depuis des années ; prix de lancement ~2 950 $/mois (AJMC), un point de vigilance d’autonomie.","off":"Une nouvelle famille d’inhalés arrive dans la BPCO : elle s’ajoute aux bronchodilatateurs classiques et cible aussi l’inflammation, avec espoir de moins d’exacerbations.","src":[["Verona Pharma (AMM)","https://www.veronapharma.com/news/verona-pharma-announces-us-fda-approval-of-ohtuvayre-ensifentrine/"],["FDA (Drug Trials Snapshot)","https://www.fda.gov/drugs/drug-trials-snapshots/drug-trials-snapshots-ohtuvayre"]],"coi":"Industrie","fin":"Essais de phase 3 sponsorisés par Verona Pharma, fabricant de l’ensifentrine."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2024-06","titre":"Apnée du sommeil de l’obèse : le tirzépatide réduit l’IAH (SURMOUNT-OSA, NEJM 2024)","subst":"Tirzépatide — bi-agoniste GIP/GLP-1 (Lilly), apnée obstructive modérée à sévère avec obésité","res":"Deux essais de phase 3 SURMOUNT-OSA 1 et 2 (NEJM, 21 juin 2024) : chez l’adulte obèse avec apnée obstructive modérée à sévère (sous PPC ou non), le tirzépatide hebdomadaire réduit significativement l’indice d’apnées-hypopnées (IAH) et améliore les variables liées au sommeil et les paramètres cardio-métaboliques vs placebo. La perte de poids devient un traitement de l’apnée elle-même — un changement de paradigme pour cette pathologie.","off":"Chez l’obèse apnéique, perdre du poids avec le tirzépatide réduit l’apnée elle-même — le masque reste de mise tant que le médecin ne le retire pas.","src":[["Neurology Today (SURMOUNT-OSA)","https://neurologytoday.aan.com/doi/10.1212/breakingnews.1473"],["ADA (communiqué)","https://diabetes.org/newsroom/press-releases/use-tirzepatide-shown-improve-sleep-apnea-and-cardiovascular-outcomes"]],"coi":"Industrie","fin":"Essais SURMOUNT-OSA sponsorisés par Eli Lilly, fabricant du tirzépatide ; publication simultanée dans le NEJM."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2024-09","titre":"Néphropathie à IgA : le sparsentan (Filspari) en approbation complète — freiner le déclin rénal (PROTECT)","subst":"Sparsentan — antagoniste oral double endothéline/angiotensine (Travere), IgAN à risque de progression","res":"Approbation complète FDA (5 sept. 2024) : le sparsentan devient le premier traitement non immunosuppresseur à ralentir significativement le déclin de la fonction rénale dans la néphropathie à IgA — extension à 2 ans de l’essai de phase 3 PROTECT : bénéfice durable sur la protéinurie et le déclin du DFG, supérieur à l’irbésartan. Un socle oral à positionner avec l’atacicept et les voies du complément dans la stratégie IgAN, dont le pipeline s’étoffe d’année en année.","off":"La néphropathie à IgA dispose désormais de traitements oraux qui protègent le rein à long terme, sans immunosuppression classique.","src":[["Travere (AMM complète)","https://ir.travere.com/news-releases/news-release-details/travere-therapeutics-announces-full-fda-approval-filsparir/"],["HCPLive (analyse AMM)","https://www.hcplive.com/view/fda-approves-travere-therapuetcs-sparsentan-for-proteinuria-reduction-in-adult-primary-igan"]],"coi":"Industrie","fin":"Essai PROTECT sponsorisé par Travere Therapeutics, fabricant du sparsentan."},{"dom":"Autorisations & Sécurité","type":"Médicament","n":5,"dt":"2025-01","titre":"Panorama 2024 : 50 nouveaux médicaments approuvés par la FDA, record de biosimilaires","subst":"Veille réglementaire FDA/CDER 2024 — 50 nouveautés dont 32 entités chimiques et 18 biologiques","res":"Bilan annuel du CDER (publié janv. 2025) : 50 nouveaux médicaments approuvés en 2024 (32 nouvelles entités chimiques, 18 produits biologiques), cinq de moins qu’en 2023 — dont plusieurs déjà repris dans cette base : resmetirom (MASH), lifileucel (TIL), zolbetuximab (CLDN18.2), vorasidenib (gliome IDH), ensifentrine (BPCO). Année record également pour les biosimilaires américains. Complément du panorama EMA : le pipeline mondial reste dense — d’où l’intérêt d’une veille structurée par discipline et par année.","off":"Un an = ~50 substances actives nouvelles côté FDA : impossible de suivre à l’instinct — la veille se structure par discipline et par année.","src":[["RAPS (bilan CDER 2024)","https://www.raps.org/news-and-articles/news-articles/2025/1/cder-approved-50-novel-drugs-in-2024,-record-numbe"],["C&EN (50 NME)","https://cen.acs.org/pharmaceuticals/50-new-drugs-received-FDA/103/i2"]],"coi":"Indépendant","fin":"Bilan officiel du CDER (agence fédérale américaine) relayé par la presse professionnelle réglementaire — aucune participation industrielle."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-01","titre":"ICFEp de l'obèse : le tirzépatide réduit de 38 % le décès CV ou l'aggravation de l'insuffisance cardiaque (SUMMIT, NEJM)","subst":"tirzépatide","res":"Essai international de phase 3, randomisé en double aveugle vs placebo (731 patients, insuffisance cardiaque à FE ≥45 %, IMC ≥30) : le tirzépatide réduit de 38 % le critère composite décès cardiovasculaire ou aggravation de l'insuffisance cardiaque et améliore le statut de santé. Première démonstration d'un bénéfice dur dans l'ICFEp de l'obèse.","off":"Ce traitement hebdomadaire, déjà connu contre le diabète et l'obésité, protège aussi le cœur quand l'insuffisance cardiaque est liée au surpoids.","src":[["NEJM — SUMMIT","https://www.nejm.org/doi/10.1056/NEJMoa2410027"],["ACC — SUMMIT (AHA 2024)","https://www.acc.org/latest-in-cardiology/articles/2024/11/13/21/17/sat-959am-summit-aha-2024"]],"coi":"Industrie","fin":"Essai sponsorisé par Novo Nordisk ; des auteurs sont employés du laboratoire."},{"dom":"Cardiologie","type":"Alerte","n":2,"dt":"2024-04","titre":"Revascularisation complète guidée par FFR après infarctus : pas de supériorité à 4,8 ans (FULL REVASC, NEJM)","subst":"revascularisation complète FFR","res":"Essai randomisé (IDM avec ST+ ou NSTEMI à très haut risque et maladie tritronculaire) : la stratégie de revascularisation complète guidée par FFR n'est pas supérieure à la seule angioplastie de la lésion coupable sur le composite décès/IDM/revascularisation non planifiée à 4,8 ans de suivi médian. Un résultat négatif qui tempère l'enthousiasme pour le « tout revasculariser ».","off":"Après un infarctus, traiter toutes les artines n'est pas systématiquement mieux que traiter seulement la coupable : la décision se fait au cas par cas.","src":[["NEJM — FULL REVASC","https://www.nejm.org/doi/full/10.1056/NEJMoa2314149"],["ACC — FULL REVASC","https://www.acc.org/latest-in-cardiology/clinical-trials/2024/04/05/14/15/full-revasc"]],"coi":"À vérifier","fin":"Essai académique scandinave d'initiative investigateur ; financement détaillé non vérifié."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2025-08","titre":"Bêtabloquants après infarctus non compliqué avec FE préservée : aucun bénéfice démontré (REBOOT)","subst":"bêtabloquants","res":"Essai international randomisé coordonné par le CNIC : chez les patients victimes d'un infarctus non compliqué laissant la fonction contractile intacte (FE préservée), les bêtabloquants n'apportent aucun bénéfice clinique — un résultat qui remet en cause 40 ans de prescription systématique et relance la déprescription raisonnée.","off":"Après un infarctus simple sans atteinte du muscle cardiaque, le bêtabloquant n'est plus automatique ; votre médecin peut le réévaluer — ne l'arrêtez jamais seul.","src":[["CNIC — communiqué REBOOT (NEJM/Lancet)","https://www.cnic.es/en/noticias/nejm-lancet-cnic-led-reboot-clinical-trial-challenges-40-year-old-standard-care-heart"]],"coi":"À vérifier","fin":"Essai coordonné par le CNIC (public espagnol) et l'Institut Mario Negri ; financement détaillé non vérifié."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":2,"dt":"2025-05","titre":"Sémaglutide oral : −14 % d'événements cardiovasculaires majeurs dans le DT2 à haut risque (SOUL, NEJM)","subst":"sémaglutide oral","res":"Essai randomisé vs placebo (9 650 patients, DT2 avec maladie cardiovasculaire athéroscléreuse et/ou maladie rénale chronique, suivi médian 49,5 mois) : le sémaglutide oral réduit de 14 % le MACE à 3 points — premier GLP-1 oral à démontrer un bénéfice cardiovasculaire.","off":"Ce comprimé de la famille GLP-1, pris à jeun le matin, réduit aussi le risque cardiaque chez le diabétique à haut risque.","src":[["NEJM — SOUL","https://www.nejm.org/doi/10.1056/NEJMoa2501006"],["ACC — SOUL","https://www.acc.org/Latest-in-Cardiology/Clinical-Trials/2025/03/27/15/04/soul"]],"coi":"Industrie","fin":"Essai sponsorisé par Novo Nordisk."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2025-04","titre":"MASH : le sémaglutide améliore la stéatohépatite et la fibrose en phase 3 (ESSENCE, NEJM)","subst":"sémaglutide","res":"Essai de phase 3 randomisé vs placebo (72 semaines) : sous sémaglutide, résolution de la MASH et régression de la fibrose significativement plus fréquentes que sous placebo. Dossier déposé à la FDA avec revue prioritaire pour cette indication.","off":"Pour le « foie gras » avec inflammation, ce médicament de la famille GLP-1 a prouvé en phase 3 qu'il améliore l'inflammation et la fibrose du foie.","src":[["NEJM — ESSENCE","https://www.nejm.org/doi/10.1056/NEJMoa2413258"],["PubMed 40305708","https://pubmed.ncbi.nlm.nih.gov/40305708/"]],"coi":"Industrie","fin":"Essai sponsorisé par Novo Nordisk."},{"dom":"Neurologie","type":"Alerte","n":2,"dt":"2024-05","titre":"AVC ischémique étendu : la thrombectomie améliore le pronostic fonctionnel, au prix d'hémorragies (LASTE, NEJM)","subst":"thrombectomie","res":"Essai randomisé français multicentrique (infarctus de taille illimitée à l'IRM) : la thrombectomie plus soins médicaux donne de meilleurs résultats fonctionnels et une mortalité plus basse que les soins médicaux seuls, mais avec une incidence plus élevée d'hémorragies intracérébrales symptomatiques — le bénéfice dépend d'une sélection rigoureuse des patients.","off":"En cas d'AVC majeur, le retrait mécanique du caillot peut préserver des fonctions, mais les équipes sélectionnent les patients image par image car le risque d'hémorragie augmente.","src":[["NEJM — LASTE","https://www.nejm.org/doi/full/10.1056/NEJMoa2314063"],["PubMed 38718358","https://pubmed.ncbi.nlm.nih.gov/38718358/"]],"coi":"À vérifier","fin":"Essai académique français multicentrique ; financement détaillé non vérifié."},{"dom":"Neurologie","type":"Médicament","n":2,"dt":"2025-01","titre":"Myasthénie grave généralisée : le nipocalimab, premier FcRn au contrôle durable quel que soit l'anticorps (Vivacity-MG3)","subst":"nipocalimab","res":"Phase 3 randomisée vs placebo : critère principal (MG-ADL à 24 semaines) atteint avec une réduction soutenue des autoanticorps, chez les patients AChR+, MuSK+ ou LRP4+ — premier bloqueur FcRn à démontrer un contrôle durable de la maladie ajouté au traitement standard.","off":"Dans la myasthénie, cette perfusion mensuelle réduit les autoanticorps responsables de la fatigue musculaire, en plus des traitements habituels.","src":[["Lancet Neurology — Vivacity-MG3","https://www.thelancet.com/journals/laneur/article/PIIS1474-4422(24)00498-8/abstract"],["PubMed 39862879","https://pubmed.ncbi.nlm.nih.gov/39862879/"]],"coi":"Industrie","fin":"Essai sponsorisé par Johnson & Johnson/Janssen."},{"dom":"Rhumatologie","type":"Médicament","n":2,"dt":"2026-05","titre":"Dermatomyosite : le brepocitinib 30 mg/j améliore muscle et peau à un an (VALOR, NEJM)","subst":"brepocitinib","res":"Phase 3 randomisée en 1:1:1 vs placebo (52 semaines) : score total d'amélioration TIS de 46,5 sous brepocitinib 30 mg vs 31,2 sous placebo (différence +15,3, p<0,001) ; la dose 15 mg n'est pas supérieure au placebo. Premier inhibiteur TYK2/JAK1 oral à conclure dans cette maladie.","off":"Dans cette maladie rare de peau et de muscles, ce comprimé immunomodulateur a prouvé en phase 3 qu'il améliore force et lésions cutanées à un an.","src":[["NEJM — VALOR","https://www.nejm.org/doi/full/10.1056/NEJMoa2503531"]],"coi":"Industrie","fin":"Essai sponsorisé par Pfizer."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2024-09","titre":"Tumeurs neuroendocrines avancées : le cabozantinib double le temps avant progression (CABINET, NEJM)","subst":"cabozantinib","res":"Phase 3 randomisée vs placebo (essai académique) : survie sans progression médiane de 8,4 vs 3,9 mois dans les tumeurs neuroendocrines extra-pancréatiques (n=203), bénéfice confirmé dans la cohorte pancréatique, quel que soit le site primitif.","off":"Pour ces tumeurs rares, ce comprimé anti-angiogénique déjà connu dans le cancer du rein ralentit la progression après échec des traitements usuels.","src":[["NEJM — CABINET","https://www.nejm.org/doi/full/10.1056/NEJMoa2403991"],["ASCO Post — CABINET","https://ascopost.com/news/september-2024/phase-iii-cabinet-trial-cabozantinib-in-advanced-neuroendocrine-tumors/"]],"coi":"Mixte","fin":"Essai académique (Alliance, financé par le NCI), médicament fourni par Exelixis."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2025-11","titre":"Néphropathie à IgA : le sibeprenlimab réduit la protéinurie de 55 % (VISIONARY, analyse intermédiaire)","subst":"sibeprenlimab","res":"Analyse intermédiaire de phase 3 vs placebo : réduction de 55,0 % de la protéinurie ajustée vs placebo et stabilisation de la fonction rénale. Résultats finaux attendus en 2026.","off":"Dans cette maladie du rein liée à des dépôts d'anticorps, une injection mensuelle sous-cutanée a fortement réduit la protéinurie dans l'analyse intermédiaire.","src":[["NEJM — VISIONARY","https://www.nejm.org/doi/abs/10.1056/NEJMoa2512133"],["ASN — Kidney Week 2025","https://www.eurekalert.org/news-releases/1104071"]],"coi":"Industrie","fin":"Essai sponsorisé par l'industrie (Visterra/Otsuka)."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2025-11","titre":"Glomérulonéphrite C3 et MPGN à immunocomplexes : résultats positifs du pegcetacoplan en phase 3 (VALIANT)","subst":"pegcetacoplan","res":"Phase 3 randomisée vs placebo : à 26 semaines, résultats positifs cohérents chez les patients atteints de glomérulonéphrite C3 et de MPGN à complexes immuns primitifs, adolescents et adultes (publiés dans le NEJM, présentés à l'ASN Kidney Week 2025).","off":"Dans cette maladie rénale rare du complément, ce traitement inhibiteur du complément a montré un bénéfice à 6 mois en phase 3.","src":[["Sobi — communiqué VALIANT (NEJM)","https://www.sobi.com/en/press-releases/new-england-journal-medicine-publishes-positive-phase-3-valiant-results-pegcetacoplan-c3g-and-primary-ic-mpgn-2410968"]],"coi":"Industrie","fin":"Essai sponsorisé par Swedish Orphan Biovitrum (Sobi)."},{"dom":"Psychiatrie","type":"Alerte","n":2,"dt":"2025-01","titre":"Schizophrénie : échec du programme iclepertin — la cognition reste un besoin non couvert (CONNEX)","subst":"iclepertin","res":"Le programme de phase 3 CONNEX (iclepertin, inhibiteur du transporteur de la glycine ciblant la cognition dans la schizophrénie) n'a pas atteint ses critères principaux en janvier 2025 ; le développement est arrêté. La cognition des patients schizophrènes reste un besoin thérapeutique majeur sans traitement validé.","off":"Pour les troubles de la mémoire ou de l'attention dans la schizophrénie, aucun médicament n'est validé : la remédiation cognitive et l'accompagnement non médicamenteux restent la référence.","src":[["Boehringer Ingelheim — mise à jour CONNEX","https://www.boehringer-ingelheim.com/human-health/mental-health/schizophrenia/update-phase-iii-connex-clinical-program-schizophrenia"]],"coi":"Industrie","fin":"Programme développé par Boehringer Ingelheim."},{"dom":"Douleur & Migraine","type":"Médicament","n":2,"dt":"2024-02","titre":"Migraine épisodique après échec de 2-3 préventifs oraux : l'atogepant reste efficace (ELEVATE, Lancet Neurology)","subst":"atogepant","res":"Phase 3b randomisée vs placebo (73 sites, 13 pays) chez des adultes en échec de 2 à 3 préventifs oraux classiques : l'atogepant 60 mg/j est efficace et bien toléré pour la prévention de la migraine épisodique — les gepants restent une option après échec des traitements conventionnels.","off":"Même après plusieurs échecs de préventifs classiques, il existe une alternative orale spécifique de la migraine, sans prise de poids ni sédation.","src":[["Lancet Neurology — ELEVATE","https://www.thelancet.com/journals/laneur/article/PIIS1474-4422(24)00025-5/abstract"],["PubMed 38364831","https://pubmed.ncbi.nlm.nih.gov/38364831/"]],"coi":"Industrie","fin":"Essai sponsorisé par AbbVie."},{"dom":"Douleur & Migraine","type":"Médicament","n":3,"dt":"2024-09","titre":"Migraine : un anticorps anti-PACAP prometteur en phase 2 — une 2e voie biologique après le CGRP (NEJM)","subst":"Lu AG09222 (anti-PACAP)","res":"Essai randomisé de phase 2 (Lu AG09222, anticorps monoclonal anti-PACAP, cible distincte du CGRP) : réduction significative du nombre de jours de migraine vs placebo. Une seconde voie biologique ouvre la prévention de la migraine aux non-répondeurs des anti-CGRP.","off":"La recherche avance sur une nouvelle cible de la migraine : pour les patients qui ne répondent pas aux traitements actuels, des pistes sérieuses arrivent en phase 3.","src":[["NEJM — anti-PACAP phase 2","https://www.nejm.org/doi/full/10.1056/NEJMoa2314577"],["PubMed 39231342","https://pubmed.ncbi.nlm.nih.gov/39231342/"]],"coi":"À vérifier","fin":"Sponsor industriel probable (développement Lundbeck) ; financement détaillé non vérifié."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":2,"dt":"2025-09","titre":"Bouffées de chaleur de la ménopause : l'elinzanetant, option non hormonale durable (OASIS-3, JAMA Internal Medicine)","subst":"elinzanetant","res":"Phase 3 randomisée vs placebo (83 sites, 52 semaines) : réduction significative de la fréquence des bouffées vasomotrices modérées à sévères à 12 semaines vs placebo (plus de 73 % d'amélioration rapportée), effet maintenu à 52 semaines. Dual antagoniste NK-1/NK-3 non hormonal, alternative aux estrogènes.","off":"Contre les bouffées de chaleur, un comprimé non hormonal de nouvelle classe a démontré son efficacité à 1 an — utile quand les hormones sont contre-indiquées.","src":[["PubMed 40920404 — OASIS-3","https://pubmed.ncbi.nlm.nih.gov/40920404/"],["JAMA Internal Medicine — texte intégral","https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2838538"]],"coi":"Industrie","fin":"Essai sponsorisé par Bayer."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2024-12","titre":"Myélome indolent à haut risque : le daratumumab retarde l'évolution vers le myélome actif (AQUILA, NEJM)","subst":"daratumumab","res":"Phase 3 (390 patients, myélome indolent à haut risque) : survie sans progression à 5 ans de 63,1 % sous daratumumab sous-cutané vs 40,8 % sous surveillance active ; survie globale à 5 ans de 93,0 % vs 86,9 %. Première autorisation pour le myélome indolent (FDA, 2026) — un changement de paradigme : traiter avant la maladie symptomatique.","off":"Dans cette forme pré-symptomatique de myélome, un traitement précoce retarde l'évolution ; la surveillance reste une option à discuter.","src":[["NEJM — AQUILA","https://www.nejm.org/doi/full/10.1056/NEJMoa2409029"],["PubMed 39652675","https://pubmed.ncbi.nlm.nih.gov/39652675/"]],"coi":"Industrie","fin":"Essai sponsorisé par Johnson & Johnson."},{"dom":"Oncologie","type":"Médicament","n":2,"dt":"2025-10","titre":"Myélome en rechute : le belantamab mafodotine triple le temps avant progression (DREAMM-7, Lancet Oncology)","subst":"belantamab mafodotine","res":"Analyse de suivi de la phase 3 DREAMM-7 : survie sans progression médiane de 36,6 mois (BVd) vs 13,4 mois (DVd), HR 0,41 ; bénéfice significatif de survie globale avec une réduction du risque de décès de 42 %. L'anticorps conjugué anti-BCMA revient en force en 2e ligne.","off":"Dans le myélome en rechute, une nouvelle association à base d'anticorps conjugué triple le temps avant progression — toxicité oculaire à surveiller.","src":[["PubMed 40680754 — DREAMM-7 suivi","https://pubmed.ncbi.nlm.nih.gov/40680754/"],["GSK — communiqué DREAMM-7","https://www.gsk.com/en-gb/media/press-releases/blenrep-shows-significant-overall-survival-benefit-reducing-the-risk-of-death-by-42-in-multiple-myeloma-at-or-after-first-relapse/"]],"coi":"Industrie","fin":"Essai sponsorisé par GSK."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2026-01","titre":"Panorama 2025 : 46 nouveaux médicaments approuvés par la FDA, dont 20 first-in-class","subst":"autorisations FDA 2025","res":"En 2025, la FDA (CDER) a approuvé 46 nouveaux médicaments : 20 first-in-class (43 %), 23 médicaments orphelins, 11 autorisations accélérées ; 31 petites molécules, 12 biologiques et 3 oligonucléotides. Un repli par rapport à 2024 (53) et 2023 (70).","off":"Les nouveautés thérapeutiques continuent d'arriver : demandez à votre pharmacien si un de vos traitements a une meilleure alternative récente.","src":[["FDA — Novel Drug Approvals 2025","https://www.fda.gov/drugs/novel-drug-approvals-fda/novel-drug-approvals-2025"]],"coi":"Indépendant","fin":"Rapport officiel d'une agence publique (FDA) ; pas de financement industriel."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2024-12","titre":"Asthme sévère éosinophilique : le depemokimab, biothérapie administrée tous les 6 mois (SWIFT-1/2, NEJM)","subst":"depemokimab","res":"Essais randomisés de phase 3 (essais répliqués SWIFT) : le depemokimab, anti-IL-5 à très longue durée d'action, administré deux fois par an, réduit significativement les exacerbations vs placebo dans l'asthme sévère éosinophilique — vers une charge d'injections allégée face aux biothérapies mensuelles.","off":"Pour l'asthme sévère allergique aux injections fréquentes, une biothérapie semestrielle démontre son efficacité en phase 3.","src":[["NEJM — depemokimab SWIFT","https://www.nejm.org/doi/abs/10.1056/NEJMoa2406673"]],"coi":"Industrie","fin":"Essais sponsorisés par GSK."},{"dom":"Cardiologie","type":"Alerte","n":2,"dt":"2025-03","titre":"Carence martiale de l'insuffisant cardiaque : le fer IV déçoit (FAIR-HF2, JAMA)","subst":"ferricarboxymaltose","res":"Essai randomisé allemand DZHK05 : la ferricarboxymaltose IV n'a pas réduit significativement le temps jusqu'à la première hospitalisation pour insuffisance cardiaque ou le décès cardiovasculaire vs placebo. Un résultat négatif qui nuance la supplémentation martiale systématique recommandée depuis AFFIRM-AHF.","off":"La perfusion de fer n'est pas systématique chez l'insuffisant cardiaque carencé : elle se discute au cas par cas, selon les symptômes et la tolérance.","src":[["PubMed 40159390 — FAIR-HF2","https://pubmed.ncbi.nlm.nih.gov/40159390/"],["ACC — FAIR-HF2","https://www.acc.org/latest-in-cardiology/journal-scans/2025/03/24/16/30/sun-8am-fair-hf2-acc-2025"]],"coi":"À vérifier","fin":"Essai académique allemand (DZHK) ; financement détaillé non vérifié."},{"dom":"Nutrition & Compléments","type":"Alerte","n":1,"dt":"2024-05","titre":"Zinc et rhume : la Cochrane 2024 tempère l'optimisme (prévention non prouvée, ~2 jours gagnés au mieux)","subst":"zinc","res":"Revue Cochrane 2024 : aucune preuve claire d'efficacité du zinc en prévention du rhume ; en traitement, réduction possible de la durée des symptômes d'environ 2 jours, mais avec peu de confiance dans les données et une augmentation des effets indésirables non graves. Insuffisant pour recommander — ce résultat nuance les méta-analyses antérieures plus favorables.","off":"Le zinc peut raccourcir un rhume d'un jour ou deux au mieux, sans preuve en prévention ; mauvais goût et nausées sont fréquents.","src":[["Cochrane (français) — Zinc et rhume","https://www.cochrane.org/fr/evidence/CD014914_zinc-prevention-and-treatment-common-cold"],["PubMed 38719213","https://pubmed.ncbi.nlm.nih.gov/38719213/"]],"coi":"Indépendant","fin":"Revue Cochrane indépendante, sans financement industriel."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2024-10","titre":"Insuffisance cardiaque : la coenzyme Q10 réduirait mortalité et hospitalisations (méta-analyse de 33 essais)","subst":"coenzyme Q10","res":"Méta-analyse de 33 essais randomisés (~2 350 patients, BMC Cardiovascular Disorders 2024) : la supplémentation en CoQ10 est associée à une réduction de la mortalité (RR 0,64) et des hospitalisations pour insuffisance cardiaque. Les essais individuels restent de faible effectif — un signal plausible, à confirmer par un grand essai.","off":"La CoQ10, antioxydant naturel de l'organisme, montre un signal bénéfique chez l'insuffisant cardiaque dans les méta-analyses — jamais en remplacement des traitements prescrits.","src":[["BMC Cardiovasc Disord — méta CoQ10","https://link.springer.com/article/10.1186/s12872-024-04232-z"],["PubMed 39462324","https://pubmed.ncbi.nlm.nih.gov/39462324/"]],"coi":"À vérifier","fin":"Méta-analyse académique ; sources de financement des essais inclus hétérogènes."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-10","titre":"Oméga-3 : l'EPA seul serait plus protecteur que les mélanges EPA+DHA pour la mortalité cardiovasculaire (méta-analyse)","subst":"oméga-3 (EPA/DHA)","res":"Méta-analyse d'essais randomisés (JACC Advances 2025) : l'EPA pur abaisse la mortalité d'origine cardiovasculaire, tandis que le bénéfice des associations EPA+DHA est atténué. Un argument pour relire les étiquettes des compléments vendus au comptoir : tous les oméga-3 ne se valent pas.","off":"Pour le cœur, les produits riches en EPA semblent plus protecteurs que les mélanges EPA+DHA — vérifiez l'étiquette avec votre pharmacien.","src":[["JACC Advances — EPA vs EPA/DHA","https://www.jacc.org/doi/10.1016/j.jacadv.2025.102149"],["PMC — texte intégral","https://pmc.ncbi.nlm.nih.gov/articles/PMC12791848/"]],"coi":"À vérifier","fin":"Méta-analyse académique ; financement détaillé non vérifié."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-03","titre":"Diarrhée sous antibiotique : les probiotiques réduisent le risque, surtout multiespèces (méta-analyses, avec réserves)","subst":"probiotiques","res":"Méta-analyse 2025 : les probiotiques, en particulier les associations multiespèces (Lactobacillus, Bifidobacterium), réduisent l'incidence de la diarrhée associée aux antibiotiques chez l'adulte — les revues parapluie convergent vers un risque relatif de 0,47 à 0,58. Réserve : qualité méthodologique limitée et grande hétérogénéité des souches et doses.","off":"Sous antibiotique, un probiotique multiespèces peut réduire le risque de diarrhée ; l'effet dépend des souches — demandez conseil plutôt que de prendre le premier fermente trouvé.","src":[["PubMed 40191517 — probiotiques et AAD","https://pubmed.ncbi.nlm.nih.gov/40191517/"],["Frontiers in Nutrition — revue parapluie","https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2026.1994645/abstract"]],"coi":"À vérifier","fin":"Méta-analyses académiques ; financements des essais primaires hétérogènes."},{"dom":"Douleur & Migraine","type":"Médicament","n":5,"dt":"2024-06","titre":"Lombalgie commune : paracétamol décevant, opioïdes pas mieux que le placebo (revue BMJ + OPAL)","subst":"Antalgiques — lombalgie commune (paracétamol, AINS, opioïdes)","res":"Revue pratique du BMJ (juin 2024) sur l'antalgie de la lombalgie non spécifique : le paracétamol n'a jamais montré de supériorité convaincante vs placebo ; les AINS apportent un bénéfice réel mais modeste ; les opioïdes n'ont pas leur place — l'essai randomisé OPAL (Lancet 2023, oxycodone-naloxone LP vs placebo) n'a montré aucune supériorité sur la douleur à 6 semaines dans la lombalgie et la cervicalgie aiguës. Le socle reste non médicamenteux : rester actif, chaleur, reprise progressive, éducation.","off":"Pour un mal de dos récent : bouger et la chaleur font plus pour vous qu'un cachet ; le paracétamol seul est décevant, un AINS en courte cure peut aider un peu — et pas d'opioïdes.","src":[["BMJ 2024 (revue pratique)","https://www.bmj.com/content/385/bmj-2024-080064"],["BMJ (PubMed)","https://pubmed.ncbi.nlm.nih.gov/38936847/"],["Essai OPAL, Lancet 2023 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/37392748/"]],"coi":"Indépendant","fin":"Revue BMJ en accès libre sans sponsor commercial ; essai OPAL financé par le NHMRC australien (public)."},{"dom":"Douleur & Migraine","type":"Médicament","n":1,"dt":"2025-03","titre":"Colique néphrétique : les AINS au centre du traitement, la formulation compte (Cochrane 2025)","subst":"AINS — colique néphrétique aiguë","res":"La Cochrane (mars 2025) réévalue les AINS dans la colique néphrétique de l'adulte : ils soulagent mieux que le placebo, en agissant à la fois sur l'inflammation et sur la pression dans les voies urinaires. Entre molécules, le kétorolac IV pourrait être moins efficace que l'ibuprofène IV, et la voie IV probablement plus efficace que l'IM. Les opioïdes restent un recours, pas un traitement de première ligne — un argument de plus contre l'overtreatment opioïde aux urgences et à l'officine (contre-indications rénales respectées).","off":"En cas de douleur de calcul au rein : un anti-inflammatoire est le traitement de référence, pas la morphine d'emblée. Si vomissements, fièvre ou douleur qui dure : consultez.","src":[["Cochrane 2025","https://cochranelibrary.com/cdsr/doi/10.1002/14651858.CD006027.pub3/full"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40084512/"]],"coi":"Indépendant","fin":"Revue Cochrane indépendante, sans financement commercial."},{"dom":"Rhumatologie","type":"Médicament","n":1,"dt":"2025-01","titre":"Entorses et arthrose : les AINS en gel ont des preuves solides — avec ~38 % d'effets indésirables en moins que par voie orale","subst":"AINS topiques (diclofénac émulgel, kétoprofène gel)","res":"Les données Cochrane reprises par les recommandations 2025 (Journal of Evidence-Based Medicine) : dans les entorses et élongations, l'émulgel de diclofénac et le gel de kétoprofène soulagent une nette majorité de patients (NNT bas) ; dans la gonarthrose et l'arthrose de la main, le diclofénac topique garde une efficacité réelle à 6-12 semaines (NNT 5-7). Une méta-analyse 2024 confirme environ 38 % d'effets indésirables en moins vs AINS oraux, grâce à la faible absorption systémique. Au comptoir : la galénique compte — choisir la bonne formulation et masser sur la zone douloureuse.","off":"Un anti-inflammatoire en gel marche vraiment sur les entorses et l'arthrose du genou : appliquez-le sur la zone douloureuse plutôt que d'avaler un comprimé — moins d'effets sur l'estomac, le cœur et les reins.","src":[["Cochrane (vue d'ensemble)","https://www.cochrane.org/evidence/CD008609_do-painkillers-rubbed-skin-really-work"],["Recommandations JEBM 2025","https://onlinelibrary.wiley.com/doi/full/10.1111/jebm.12661"],["Méta-analyse EI topique vs oral 2024","https://www.ijcmph.com/index.php/ijcmph/article/view/13308"]],"coi":"Indépendant","fin":"Recommandations JEBM fondées sur les revues Cochrane ; aucune implication industrielle identifiée dans les extraits consultés."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":1,"dt":"2025-01","titre":"Antibiothérapie courte : 5 jours suffisent souvent en cas d'amélioration (revue parapluie Lancet Infectious Diseases)","subst":"Durée des antibiothérapies — pneumonie, BPCO, sinusite, cystite","res":"La revue parapluie du Lancet Infectious Diseases (janv. 2025) passe au crible toutes les données des infections respiratoires haut et bas : pour les pneumonies communautaires non graves et les exacerbations de BPCO avec amélioration clinique, 5 jours d'antibiotique valent les traitements plus longs ; pour l'angine à streptocoque, la question des durées plus courtes reste ouverte (données limitées vs le schéma historique de 10 jours). Une revue systématique JAC-AMR (2025) sur 315 études : 85 % concluent à l'équivalence des durées courtes, avec les preuves les plus robustes pour sinusite, pneumonie, cystite/pyélonéphrite et cellulite. Message officinal : la durée prescrite est la bonne durée — ni arrêt précoce, ni « je finis la boîte ».","off":"Prenez l'antibiotique exactement le nombre de jours écrit sur l'ordonnance : souvent 5 jours suffisent quand on va mieux. Ne prolongez jamais « pour être sûr » — c'est inutile et ça fabrique des résistances.","src":[["Lancet Infect Dis 2025 (revue parapluie)","https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(24)00456-0/abstract"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/39243792/"],["JAC-AMR 2025","https://academic.oup.com/jacamr/article/7/1/dlae215/7986017"]],"coi":"À vérifier","fin":"Travaux académiques (Amsterdam UMC) ; financement non précisé dans les extraits consultés."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-07","titre":"Cystites à répétition : la méthénamine (antiseptique urinaire non antibiotique) validée chez la femme âgée (ImpresU)","subst":"Méthénamine hippurate — prophylaxie des cystites récidivantes","res":"Essai ImpresU (Clinical Microbiology and Infection, juil. 2025) : triple insu vs placebo, méthénamine hippurate 1 g × 2/j pendant 6 mois chez des femmes âgées avec cystites récidivantes → moins d'épisodes traités par antibiotique pendant la prise ; l'effet disparaît à l'arrêt (6 mois de suivi). Confirme l'essai ALTAR (BMJ) de non-infériorité vs antibioprophylaxie continue chez des femmes d'environ 50 ans, référencé par la mise à jour NICE de décembre 2024. Une vraie option de stewardship pour sortir des antibiotiques au long cours — à condition d'une prise continue.","off":"Contre les cystites qui reviennent, il existe un « désinfectant des urines » qui n'est pas un antibiotique : à prendre tous les jours sans interruption, et son effet s'arrête quand on l'arrête.","src":[["ImpresU, CMI 2025","https://www.clinicalmicrobiologyandinfection.org/article/S1198-743X(25)00344-1/fulltext"],["ALTAR (BMJ) & NICE déc. 2024 (synthèse)","https://cobfoundation.org/health-information/methenamine-hippurate-for-recurrent-uti/"],["Protocole BMJ Open","https://bmjopen.bmj.com/content/12/11/e065217"]],"coi":"Indépendant","fin":"Essai académique multinational (Norvège, Suède, Pologne, Pays-Bas), consortium public ; pas de financement industriel identifié."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":2,"dt":"2024-04","titre":"D-mannose : le grand essai anglais est négatif — pas mieux que le placebo contre les cystites récidivantes","subst":"D-mannose","res":"Le plus grand essai randomisé du D-mannose (JAMA Internal Medicine, avr. 2024 ; 598 femmes en soins primaires au Royaume-Uni, 99 cabinets) : après 6 mois de prise quotidienne, aucune réduction de la proportion de femmes consultant pour une nouvelle cystite vs placebo. Conclusion des auteurs : ne pas le recommander. Ce négatif tempère les petits essais antérieurs — un exemple type de complément populaire démenti par un essai de grande taille.","off":"Le D-mannose (sucre vendu contre les cystites) ne fait pas mieux qu'un placebo dans le plus grand essai — inutile de le payer en prévention.","src":[["JAMA Intern Med 2024","https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2817488"],["NIHR (analyse indépendante)","https://evidence.nihr.ac.uk/alert/d-mannose-does-not-prevent-urinary-tract-infections-utis/"]],"coi":"Indépendant","fin":"Essai conduit en soins primaires au Royaume-Uni, publié dans une revue à comité de lecture ; aucun conflit industriel signalé."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":2,"dt":"2025-01","titre":"Canneberge : −52 % de cystites confirmées en culture avec la poudre de fruit entier (essai AJCN 2025)","subst":"Canneberge — poudre de fruit entier riche en proanthocyanidines","res":"Essai randomisé multicentrique, double aveugle vs placebo, 6 mois (American Journal of Clinical Nutrition, janv. 2025) : la poudre de fruit entier de canneberge en gélules réduit de 52 % le risque d'infection urinaire confirmée en culture chez des femmes avec antécédents de récidives (risque relatif ajusté ~0,48). Résultat à confronter au négatif du D-mannose : tout se joue sur la formulation — poudre de fruit entier dosée en proanthocyanidines, pas le jus sucré ni les extraits au hasard.","off":"Contre les cystites à répétition, la canneberge en gélules de poudre de fruit entier a fait chuter les infections de moitié dans un grand essai — à prendre tous les jours. Le jus du commerce, non.","src":[["AJCN 2025","https://ajcn.nutrition.org/article/S0002-9165(25)00022-X/fulltext"],["ScienceDirect (même article)","https://www.sciencedirect.com/science/article/pii/S000291652500022X"]],"coi":"À vérifier","fin":"Essai multicentrique publié dans AJCN ; financement et rôle éventuel de l'interprofession canneberge non précisés dans les extraits consultés."},{"dom":"Soins primaires & Officine","type":"Officine","n":2,"dt":"2025-06","titre":"Sevrage tabagique : la cytisinicline confirme en phase 3 (ORCA-3, JAMA Internal Medicine)","subst":"Cytisinicline — agoniste nicotinique partiel oral (dérivé de la cytisine)","res":"ORCA-3 (JAMA Intern Med, juin 2025 ; 185(6):648-655) : 792 fumeurs (≥ 10 cigarettes/j), cytisinicline 3 mg × 3/j pendant 6 ou 12 semaines vs placebo avec soutien comportemental → abstinence continue vérifiée par CO expiré (< 10 ppm) dans les 4 dernières semaines significativement supérieure au placebo, réduction du craving, bonne tolérance. Réplication indépendante d'ORCA-2 ; dépôt de dossier FDA annoncé mi-2025. La cytisinicline, issue de la cytisine (plante), s'annonce comme une option orale du sevrage — un pan de la consultation tabac officinale.","off":"Un médicament dérivé d'une plante (cytisine) augmente nettement les chances d'arrêter de fumer en 6 à 12 semaines, avec un soutien — une piste si patchs et varénicline ne conviennent pas.","src":[["JAMA Intern Med 2025","https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2832701"],["Communiqué Achieve Life Sciences","https://ir.achievelifesciences.com/news-events/press-releases/detail/224/achieve-life-sciences-announces-cytisinicline-phase-3-orca-3-trial-publication-on-smoking-cessation-in-jama-internal-medicine"]],"coi":"Industrie","fin":"Essai sponsorisé par Achieve Life Sciences (laboratoire développeur) ; design en double aveugle avec vérification biochimique de l'abstinence."},{"dom":"Psychiatrie","type":"Médicament","n":2,"dt":"2025-12","titre":"Insomnie : la thérapie numérique (TCC-I en ligne) valide ses résultats et son autorisation FDA","subst":"TCC-I numérique (SleepioRx) — insomnie de l'adulte et du senior","res":"Essai randomisé décentralisé américain (JMIR Mental Health, déc. 2025) : la TCC-I numérique SleepioRx améliore significativement l'insomnie vs éducation-santé, avec des gains maintenus à 6 mois — résultats à l'appui de la première autorisation FDA d'un dispositif médical numérique contre l'insomnie. Chez le sujet âgé, l'essai SHUTi OASIS (npj Digital Medicine, 2025) confirme l'efficacité d'une TCC-I en ligne adaptée aux seniors, population sous hypnotiques. Positionnement officinal : proposer la TCC-I (digitale ou en présentiel) avant tout hypnotique ; zolpidem et apparentés en cure courte, jamais par habitude.","off":"Pour dormir sans somnifère : des programmes en ligne fondés sur la thérapie cognitivo-comportementale (réapprendre à dormir, temps au lit limité) marchent, et l'effet dure — à essayer avant tout comprimé.","src":[["JMIR Ment Health 2025","https://mental.jmir.org/2025/1/e84323"],["SHUTi OASIS, npj Digital Medicine 2025","https://www.nature.com/articles/s41746-025-01847-0"],["Méta-analyse TCC-I automatisée, npj 2025","https://www.nature.com/articles/s41746-025-01514-4"]],"coi":"Industrie","fin":"Essai SleepioRx conduit avec le fabricant Big Health (à l'appui de l'autorisation FDA) ; essais seniors et méta-analyse académiques indépendants."},{"dom":"Soins primaires & Officine","type":"Officine","n":2,"dt":"2026-04","titre":"IPP au long cours : la déprescription fonctionne — et à l'arrêt, plusieurs stratégies se valent","subst":"Inhibiteurs de la pompe à protons — déprescription","res":"Essai randomisé en grappes (JAMA Internal Medicine, 2026) : l'intervention combinée — brochure d'éducation envoyée directement au patient + algorithme de déprescription transmis au médecin généraliste — réduit significativement les prescriptions d'IPP potentiellement inappropriées en soins primaires vs soins usuels. En parallèle, un essai multicentrique rapporté dans le Journal of Gastroenterology (2026) : après arrêt, trois stratégies (IPP à la demande, substitution par alginate, IPP intermittent) donnent des résultats comparables ; jusqu'à 82 % des usages au long cours manqueraient d'indication valable (commentaire Medscape). Place du pharmacien : repérer les IPP depuis des mois sans indication claire, ouvrir la discussion, éviter l'arrêt brutal (hypersecrétion acide rebond).","off":"Beaucoup d'IPP pris depuis des années ne servent plus à rien. L'arrêt peut se faire en douceur — à la demande, ou remplacé par un pansement anti-reflux le soir — avec votre médecin et votre pharmacien.","src":[["JAMA Intern Med 2026 (essai en grappes)","https://jamanetwork.com/journals/jamainternalmedicine/article-abstract/2847655"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41973459/"],["Stratégies à l'arrêt, J Gastroenterol 2026","https://link.springer.com/article/10.1007/s00535-026-02475-5"],["Synthèse Medscape 2026","https://www.medscape.com/viewarticle/deprescribing-long-term-ppis-many-strategies-can-work-2026a10015o5"]],"coi":"À vérifier","fin":"Essai pragmatique en soins primaires ; financements non détaillés dans les extraits consultés. L'éditorial associé souligne l'enjeu des « médicaments hérités »."},{"dom":"Soins primaires & Officine","type":"Officine","n":4,"dt":"2025-10","titre":"Hypertension : un programme national d'automesure à domicile promu par les pharmaciens améliore le contrôle (Hypertension Research)","subst":"Automesure tensionnelle — pharmacien communautaire","res":"Évaluation d'un programme national taïwanais (Hypertension Research, epub oct. 2025 ; 2026;49(2):315-327) : la promotion de l'automesure à domicile par les pharmaciens communautaires, avec suivi hybride et télésurveillance, améliore le contrôle tensionnel et l'autogestion des patients hypertendus. Une méta-analyse 2025 d'essais randomisés (Frontiers in Cardiovascular Medicine) confirme l'effet propre des interventions pharmaceutiques sur la pression artérielle vs soins usuels. Pour l'officine française : l'automesure validée (appareil à bras, protocole 3 mesures matin et soir × 3 jours) reste le socle du suivi — et le comptoir un point de contact régulier idéal.","off":"Mesurez votre tension à la maison : assis, au calme, 5 minutes de repos, matin et soir pendant 3 jours — et montrez les chiffres à votre médecin ou votre pharmacien.","src":[["Hypertens Res 2025 (epub)","https://www.nature.com/articles/s41440-025-02422-6"],["Méta-analyse Frontiers 2025","https://www.frontiersin.org/journals/cardiovascular-medicine/articles/10.3389/fcvm.2025.1477729/full"]],"coi":"À vérifier","fin":"Programme conduit à l'échelle nationale avec les autorités de santé taïwanaises ; financements non détaillés dans les extraits consultés."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":4,"dt":"2026-08","titre":"Métformine et vitamine B12 : le dépistage systématique questionné par des critères diagnostiques modernes","subst":"Vitamine B12 — carence sous métformine","res":"Étude transversale danoise (Endocrine Practice, en ligne août 2026 ; 2 consultations, mars 2024–oct. 2025) : en appliquant des critères contemporains de carence (B12 ≤ 250 pmol/L + acide méthylmalonique élevé, plus spécifiques que les anciens seuils), elle compare la prévalence chez les utilisateurs de métformine et les non-utilisateurs — alors que les recommandations de dépistage systématique reposent sur des définitions jugées anciennes et peu spécifiques. Le lien métformine–B12 reste établi, dose- et durée-dépendant (mini-revue 2024). Au comptoir : penser B12 devant des paresthésies ou une neuropathie inexpliquée chez un diabétique sous métformine de longue durée — senior, végétarien ou opéré de l'estomac à risque accru.","off":"Sous métformine depuis des années : si fourmillements ou engourdissements persistent, parlez-en — une carence en vitamine B12 est possible et simple à doser.","src":[["Endocr Pract 2026","https://www.endocrinepractice.org/article/S1530-891X(26)01093-1/fulltext"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/42567282/"],["Mini-revue touchREVIEWS 2024","https://touchendocrinology.com/diabetes/journal-articles/metformin-use-and-vitamin-b12-deficiency-in-people-with-type-2-diabetes-what-are-the-risk-factors-a-mini-systematic-review/"]],"coi":"Indépendant","fin":"Étude académique danoise (Steno Diabetes Center, universités) ; mini-revue sans financement industriel identifié."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-07","titre":"Gastro-entérite de l'enfant : l'ondansétron à doses répétées à la maison réduit l'évolution (NEJM 2025)","subst":"Ondansétron — vomissements de la gastro-entérite pédiatrique","res":"Essai randomisé de supériorité (NEJM, 17 juil. 2025 ; 393(3):255-266) : 1 030 enfants (6 mois–18 ans) sortant des urgences pour gastro-entérite avec vomissements ; l'ondansétron oral délivré à la sortie, en schéma multidose à domicile, vs placebo, réduit le risque de gastro-entérite modérée à sévère dans les 7 jours suivants. Financement public canadien (IRSC). Le socle reste la réhydratation orale par petites quantités fréquentes ; l'ondansétron (sur ordonnance) se justifie quand les vomissements empêchent de boire.","off":"Si votre enfant vomit tout et ne peut plus boire : soluté de réhydratation par petites cuillerées régulières ; un médicament anti-vomitif (sur ordonnance) existe pour éviter la déshydratation et une nouvelle course aux urgences.","src":[["NEJM 2025 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40673584/"],["Analyse GastroenterologyAdvisor","https://www.gastroenterologyadvisor.com/news/oral-ondansetron-beneficial-for-pediatric-gastroenteritis-linked-vomiting/"]],"coi":"Indépendant","fin":"Essai financé par les Instituts canadiens de recherche en santé (public), publié dans le NEJM."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-07","titre":"Grippe sévère : combiner baloxavir + inhibiteur de neuraminidase réduit la mortalité (analyse post hoc Flagstone)","subst":"Baloxavir marboxil — grippe sévère du patient à haut risque","res":"Analyse post hoc de l'essai Flagstone (Open Forum Infectious Diseases, juil. 2025) chez des patients hospitalisés pour grippe sévère avec facteurs de risque : la combinaison baloxavir + inhibiteur de neuraminidase vs inhibiteur seul montre une réduction de mortalité supérieure, sans excès d'effets indésirables. À lire avec la méta-analyse en réseau du Lancet (2024, appui OMS) sur les antiviraux de la grippe sévère : oseltamivir et péramivir raccourciraient l'hospitalisation, mais les données de mortalité restent de faible certitude. Pour l'officine : chez le patient fragile, une grippe qui s'aggrave = consultation sans délai ; les antiviraux se jouent dans les 48 h.","off":"Si vous êtes fragile (âge, maladies chroniques) et que la grippe s'installe durement : ne tardez pas à consulter. Les antiviraux marchent pris tôt — et à l'hôpital, on peut en combiner deux.","src":[["OFID 2025 (Flagstone post hoc)","https://academic.oup.com/ofid/article/12/8/ofaf439/8213628"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40852135/"],["NMA Lancet 2024 (antiviraux grippe sévère)","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(24)01307-2/fulltext"]],"coi":"Industrie","fin":"Essai Flagstone sponsorisé par Shionogi (laboratoire du baloxavir) ; la méta-analyse du Lancet a été conduite avec l'appui de l'OMS."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":2,"dt":"2025-02","titre":"Seniors : 1 g/j d'oméga-3 réduit les chutes (−10 %) et les infections (−13 %) ; le trio avec vitamine D et exercice ralentit le vieillissement biologique (DO-HEALTH)","subst":"Oméga-3 d'origine algale (+ vitamine D + exercice) — sujet âgé","res":"L'essai factoriel DO-HEALTH (2 157 seniors de 5 pays européens) livre ses analyses 2024-2025 : l'oméga-3 d'origine algale (1 g/j) réduit seul les infections (−13 %) et les chutes (−10 %) ; le trio oméga-3 + vitamine D 2 000 UI/j + exercice à domicile réduit la pré-frailté (−39 %) et les cancers invasifs (−61 %). L'analyse des horloges épigénétiques (Nature Aging, févr. 2025, 777 participants) suggère de surcroît un ralentissement du vieillissement biologique sous oméga-3. Une supplémentation simple et bon marché avec des critères de résultat gériatriques concrets — à distinguer des données cardiovasculaires globalement modestes.","off":"Après 70 ans, 1 gramme par jour d'oméga-3 (même végétal, tiré des algues) réduit les chutes et les infections ; associé à la vitamine D et un peu d'exercice à la maison, l'effet d'ensemble est encore plus net.","src":[["Nature Aging 2025","https://www.nature.com/articles/s43587-024-00793-y"],["Analyse indépendante (Science Media Centre)","https://www.sciencemediacentre.org/expert-reaction-to-study-looking-at-omega-3-and-biological-ageing-in-humans/"]],"coi":"Indépendant","fin":"Essai académique suisse (université et hôpital de Zurich) ; mesures épigénétiques soutenues par le Fonds national suisse (public)."},{"dom":"Soins primaires & Officine","type":"Médicament","n":1,"dt":"2026-06","titre":"Reflux : les alginates revalorisés — l'option la plus efficace du reflux laryngé, non inférieure à l'IPP doublé dans l'œsophagite légère","subst":"Alginates — pansements anti-reflux (RGO, reflux laryngo-pharyngé)","res":"Méta-analyse en réseau (European Archives of Oto-Rhino-Laryngology, 2026) : dans le reflux laryngo-pharyngé, l'alginate montre la plus grande efficacité parmi les options pharmacologiques comparées (IPP, inhibiteurs de pompe potassiques, alginates). Un essai de phase 3 (Digestive Diseases, août 2026 ; 692 patients) : les capsules sucralfate/alginate sont non inférieures à l'oméprazole 20 mg × 2/j dans les symptômes réfractaires aux IPP (NERD et œsophagite Los Angeles A/B). Le conseil officinal reprend du galon : alginate à la demande en post-prandial et nocturne, lévation de la tête de lit, dîner précoce — et relais crédible lors des tentatives d'arrêt d'IPP.","off":"Le « pansement gastrique » (alginate) forme un gel qui barre la route aux remontées acides, surtout le soir après le dîner. Dans le reflux de gorge, il serait même le plus efficace — et il peut remplacer un comprimé d'IPP dans certaines situations.","src":[["NMA Eur Arch Otorhinolaryngol 2026","https://link.springer.com/article/10.1007/s00405-026-10354-1"],["Essai phase 3, Dig Dis 2026 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/42636164/"]],"coi":"À vérifier","fin":"Essai multicentrique ; financements non précisés dans les extraits consultés (le sucralfate/alginate y est évalué comme spécialité)."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":1,"dt":"2024-02","titre":"Aliments ultra-transformés : l'exposition la plus élevée est liée à 32 issues néfastes (revue parapluie BMJ)","subst":"Aliments ultra-transformés (classification NOVA) — santé publique","res":"La revue parapluie du BMJ (févr. 2024 ; 384:e077310) compile 45 méta-analyses épidémiologiques : une plus forte exposition aux aliments ultra-transformés est associée à 32 issues néfastes, avec les liens les plus solides pour la mortalité cardiovasculaire, le diabète de type 2 et les troubles mentaux communs ; d'autres associations touchent obésité, cancers et maladies respiratoires. Les preuves restent observationnelles (certitude souvent faible) : le message est de réduire — pas d'interdire — les plats tout prêts, sodas et snacking industriel au profit du fait-maison. Un argument de santé publique réutilisable au comptoir nutrition.","off":"Plus vous mangez d'aliments ultra-transformés (plats tout prêts, biscuits, sodas industriels), plus les études les relient à maladies cardiaques, diabète et prise de poids — cuisinez simple et frais autant que possible.","src":[["BMJ 2024 (revue parapluie)","https://www.bmj.com/content/384/bmj-2023-077310"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/38418082/"],["Synthèse BMJ Group","https://bmjgroup.com/consistent-evidence-links-ultra-processed-food-to-over-30-damaging-health-outcomes/"]],"coi":"À vérifier","fin":"Revue parapluie académique (Deakin, Australie) ; financement non détaillé dans les extraits consultés. Liens observés : pas de preuve de causalité."},{"dom":"Nutrition & Compléments","type":"Alimentation","n":1,"dt":"2024-11","titre":"Régime méditerranéen du senior : moins de mortalité cardiaque, confirmé par méta-analyse et revue parapluie","subst":"Régime méditerranéen (huile d'olive, légumes, poisson, céréales complètes)","res":"Méta-analyse d'études observationnelles et interventionnelles (Nutrients, nov. 2024) chez les adultes âgés : le régime méditerranéen est associé à une réduction de la mortalité toutes causes et cardiovasculaire et des événements CV non fatals. Une revue parapluie 2025 (Nutrition & Dietetics) sur les ECR en prévention primaire et secondaire conclut dans le même sens. L'alimentation la mieux documentée pour vieillir en bonne santé — et la plus facile à conseiller au comptoir sans complément aucun.","off":"Le régime méditerranéen (huile d'olive, légumes, légumineuses, poisson, céréales complètes, fruits à coque) réduit la mortalité cardiaque chez les seniors : c'est l'alimentation la mieux prouvée pour bien vieillir.","src":[["Nutrients 2024 (méta-analyse)","https://pubmed.ncbi.nlm.nih.gov/39599734/"],["Article (accès libre)","https://www.mdpi.com/2072-6643/16/22/3947"],["Revue parapluie 2025 (Wiley)","https://onlinelibrary.wiley.com/doi/10.1111/1747-0080.12891"]],"coi":"Indépendant","fin":"Synthèses académiques en accès libre, sans financement industriel identifié."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":1,"dt":"2025-11","titre":"Vitamine K2 et os après la ménopause : les marqueurs du remodelage s'améliorent, les fractures restent à prouver","subst":"Vitamine K2 (ménaquinone-7) — ostéoporose postménopausique","res":"Méta-analyse (Frontiers in Endocrinology, nov. 2025) de 9 essais randomisés, 2 570 patientes ostéoporotiques postménopausées (Chine, Japon) : la supplémentation en K2 améliore les marqueurs biologiques du remodelage osseux dans un sens favorable à la formation. À temperer : les marqueurs ne sont pas des fractures, les essais sont surtout asiatiques, et le bénéfice clinique du K2 seul n'est pas démontré. Position officinale : le K2 n'est pas un traitement de l'ostéoporose ; calcium + vitamine D + traitements prescrits restent la base, le K2 est au mieux un adjuvant.","off":"La vitamine K2 améliore peut-être les marqueurs de l'os après la ménopause, mais ce n'est ni un traitement de l'ostéoporose ni un remplacement du calcium, de la vitamine D ou des médicaments prescrits.","src":[["Frontiers in Endocrinology 2025","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2025.1703116/full"],["Analyse Nutraingredients 2025","https://www.nutraingredients.com/Article/2025/11/13/meta-analysis-supports-vitamin-k2s-bone-health-benefits/"]],"coi":"À vérifier","fin":"Méta-analyse académique sino-japonaise ; financement non précisé dans les
