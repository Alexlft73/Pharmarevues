ulaire, dépression, seniors).","off":"Les oméga-3 peuvent soulager certains yeux secs, mais l'effet n'est pas garanti pour tout le monde : ils ne remplacent pas les larmes artificielles et l'hygiène des paupières.","src":[["BMC Ophthalmology (Springer)","https://link.springer.com/article/10.1186/s12886-026-04992-6"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/42304315/"],["Ophthalmology Advisor","https://www.ophthalmologyadvisor.com/news/omega-3-supplements-dry-eye-benefits-inconsistent-study-sa"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; résultats hétérogènes par formulation et étiologie, à ne pas survendre."},{"dom":"Ophtalmologie","type":"Médicament","n":1,"dt":"2025-05","titre":"Rebamipide topique vs larmes artificielles dans la sécheresse oculaire : méta-analyse","subst":"rebamipide","res":"Revue systématique et méta-analyse (BMC Ophthalmology, 27 mai 2025 ; 25:317 ; PubMed 40426110) comparant le rebamipide ophtalmique (sécrétagogue de mucine, non disponible en France) aux larmes artificielles dans la maladie de l'œil sec : l'efficacité comparative est encore jugée peu concluante au moment de la revue ; chiffres détaillés non lus dans les extraits → design décrit sans invention.","off":"Des pistes nouvelles se dessinent pour l'œil sec (médicaments qui aident l'œil à faire son propre mucus) ; rien de disponible à l'officine en France pour l'instant.","src":[["BMC Ophthalmology (Springer)","https://link.springer.com/article/10.1186/s12886-025-04146-0"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40426110/"],["PMC","https://pmc.ncbi.nlm.nih.gov/articles/PMC12107901"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; molécule hors marché français, intérêt surtout de veille."},{"dom":"Santé du voyageur","type":"Médicament","n":1,"dt":"2025-08","titre":"Bismuth subsalicylate pour prévenir la diarrhée du voyageur : réévaluation 2018-2023","subst":"bismuth subsalicylate","res":"Étude d'efficacité du bismuth subsalicylate pour la prévention de la diarrhée du voyageur sur les données 2018-2023 (Journal of Travel Medicine, vol. 32, issue 6, août 2025 ; taaf047), par des auteurs du réseau CDC : la revue réévalue l'efficacité prophylactique du bismuth (référence historique du CDC contre la turista) ; chiffres poolés non lisibles dans les extraits → question et design décrits sans inventer le résultat.","off":"Pour voyager, la première ligne reste l'hygiène des mains et la prudence alimentaire ; le bismuth (là où il est disponible) peut réduire le risque de tourista : demandez conseil avant le départ, il n'est pas pour tout le monde (allergie salicylés, enfant).","src":[["Journal of Travel Medicine (Oxford)","https://academic.oup.com/jtm/article/32/6/taaf047/8152723"],["CDC Yellow Book","https://www.cdc.gov/yellow-book/hcp/preparing-international-travelers/travelers-diarrhea.html"]],"coi":"À vérifier","fin":"Auteurs affiliés au CDC (institutionnel) ; financement non lisible dans les extraits ; produit non commercialisé en France."},{"dom":"Santé du voyageur","type":"Médicament","n":1,"dt":"2025-05","titre":"Mal aigu des montagnes : l'acétazolamide à dose modérée suffit, avec une fenêtre prophylactique plus longue (NMA bayésienne)","subst":"acétazolamide","res":"Revue systématique et méta-analyse en réseau bayésienne (Travel Medicine and Infectious Disease, mai 2025) des interventions pharmacologiques de prévention du mal aigu des montagnes : l'acétazolamide à dose modérée (125-250 mg × 2/jour) prévient efficacement le MAM avec une fenêtre prophylactique plus longue que les schémas à forte dose (375 mg × 2/jour) ; aucune intervention pharmacologique ne prévient le MAM sévère et pas de preuve de haute qualité contre l'hypertension pulmonaire d'altitude. Financement public chinois (lisible dans les déclarations).","off":"Pour un trek en altitude, un médicament préventif (acétazolamide) existe à dose modérée : il se prépare avec votre médecin avant le départ, et ne dispense pas d'une montée progressive.","src":[["Travel Medicine and Infectious Disease (ScienceDirect)","https://www.sciencedirect.com/science/article/pii/S1477893925000742"]],"coi":"Indépendant","fin":"Financement public (projets Tibet / West China Hospital) lisible dans les extraits ; preuve de qualité variable selon les comparateurs."},{"dom":"Allergologie","type":"Médicament","n":5,"dt":"2024-12","titre":"Syndrome pollen-aliment (allergie orale) : allergènes, diagnostic et pièges thérapeutiques (revue)","subst":"pollen-food allergy syndrome (syndrome oral)","res":"Revue (Applied Sciences, MDPI, 15(1):66, publiée le 25 décembre 2024) sur le syndrome pollen-aliment : réaction croisée entre pollens (bouleau, ambroisie, graminées) et aliments végétaux, manifestations généralement limitées à des symptômes oraux mais pouvant être plus sévères ; enjeux de diagnostic et de prise en charge, utiles pour le conseil au comptoir (aliments crus vs cuits, fruits de la famille des rosacées).","off":"Si la pomme crue picore la bouche mais pas la compote, c'est peut-être une allergie croisée avec le pollen des arbres : dites-le à votre médecin, et sachez que cuire ou peler change souvent tout.","src":[["Applied Sciences (MDPI)","https://www.mdpi.com/2076-3417/15/1/66"],["ScienceDirect (revue PFAS)","https://www.sciencedirect.com/science/article/pii/S1323893024000893"]],"coi":"À vérifier","fin":"Revue narrative (pas de méta-analyse) ; financement non lisible dans les extraits."},{"dom":"Pédiatrie officinale","type":"Médicament","n":5,"dt":"2026-05","titre":"Oxyures chez l'enfant : revue pratique avec algorithme famille-école","subst":"oxyures (Enterobius vermicularis)","res":"Revue narrative orientée pratique (Frontiers in Public Health, 25 mai 2026 ; 14:1780558 ; PubMed 42267275) sur l'oxyurose, l'une des helminthiases les plus fréquentes de l'enfance : rappel du test de Scott (ruban adhésif périanal), des traitements (benzimidazolés, pyrantel selon les marchés), de la fréquence des réinfestations intra-familiales et proposition d'un algorithme associant école et foyer — terrain officinal classique (prurit anal nocturne de l'enfant).","off":"Les vers intestinaux des enfants (oxyures) sont bénins mais très contagieux en famille : on traite, on lave le linge et les mains, et on refait un traitement si ça revient — votre pharmacien peut expliquer le rituel.","src":[["Frontiers in Public Health","https://www.frontiersin.org/journals/public-health/articles/10.3389/fpubh.2026.1780558/full"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/42267275/"]],"coi":"À vérifier","fin":"Revue narrative (pas de méta-analyse) ; financement non lisible dans les extraits ; cohorte saoudienne, messages transposables avec prudence."},{"dom":"Seniors & polymédication","type":"Complément alimentaire","n":1,"dt":"2025-11","titre":"Protéines en supplémentation chez le senior : panorama des méta-analyses","subst":"protéines (supplémentation du senior)","res":"Overview de méta-analyses (Age and Ageing, 28 novembre 2025 ; 54(12):afaf351 ; PubMed 41385355) sur les effets de la supplémentation protéique chez les personnes âgées (masse et force musculaires, fonction physique) : les auteurs discutent le niveau réel de bénéfice et la représentativité des populations incluses dans les essais ; chiffres poolés non lisibles dans les extraits → design et question décrits sans inventer.","off":"Les protéines en poudre peuvent aider le muscle du senior, surtout associées à un peu d'exercice ; elles ne font rien seules et ne remplacent pas une alimentation variée.","src":[["Age and Ageing (Oxford)","https://academic.oup.com/ageing/article/54/12/afaf351/8378198"],["PMC","https://pmc.ncbi.nlm.nih.gov/articles/PMC12700089/"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41385355/"]],"coi":"À vérifier","fin":"Overview de méta-analyses (niveau élevé de preuve synthétique) ; financement non lisible dans les extraits."},{"dom":"Seniors & polymédication","type":"Officine","n":1,"dt":"2025-03","titre":"Programmes médicamenteux aux urgences pour la sécurité du senior : revue systématique et méta-analyse (JAMA Network Open)","subst":"polymédication (sécurité médicamenteuse)","res":"Revue systématique et méta-analyse (JAMA Network Open, mars 2025 ; 8(3):e250814 ; PMC11897843) évaluant si les programmes médicamenteux fondés aux urgences (réconciliation, réduction des médicaments potentiellement inappropriés, dépistage iatrogénique) chez les 65 ans et plus s'associent à moins d'événements indésirables liés aux médicaments : la question et le design sont décrits dans l'article ; les résultats poolés ne sont pas lisibles dans les extraits → pas de chiffre inventé. Intéressant pour le pharmacien ville-hôpital : le passage aux urgences comme point d'entrée du bilan de médication.","off":"Après un passage aux urgences, la liste de médicaments des seniors mérite souvent une relecture : un point officinal utile au retour à domicile.","src":[["JAMA Network Open","https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2831215"],["PMC","https://pmc.ncbi.nlm.nih.gov/articles/PMC11897843"]],"coi":"À vérifier","fin":"Article en accès libre CC-BY ; financement non lisible dans les extraits."},{"dom":"Urologie & santé masculine","type":"Complément alimentaire","n":1,"dt":"2025-08","titre":"CoQ10 dans l'infertilité masculine idiopathique : revue systématique et méta-analyse d'essais randomisés","subst":"coenzyme Q10 (infertilité masculine)","res":"Revue systématique et méta-analyse (World Journal of Men's Health, 27 août 2025 ; doi 10.5534/wjmh.250159 ; PubMed 40878114 ; accepté le 28 mai 2025) sur le CoQ10 oral dans l'infertilité masculine idiopathique : amélioration rapportée des paramètres du spermogramme ; les auteurs appellent à des études plus larges sur les taux de grossesse et notent qu'une étude sur quatre seulement rapportait des données de sécurité. Nouvel usage d'une substance déjà en base (myalgies sous statines, insuffisance cardiaque).","off":"Le coenzyme Q10 est parfois proposé aux hommes qui essaient d'avoir un enfant : il peut améliorer certains paramètres du spermogramme, mais sans garantie de grossesse — à discuter avec le médecin avant tout achat.","src":[["World Journal of Men's Health","https://wjmh.org/DOIx.php?id=10.5534%2Fwjmh.250159"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40878114/"],["PMC","https://pmc.ncbi.nlm.nih.gov/articles/PMC13646325"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; preuves sur les paramètres du sperme plus solides que sur la grossesse."},{"dom":"ORL & stomatologie","type":"Complément alimentaire","n":1,"dt":"2025-12","titre":"Halitose : les probiotiques améliorent-ils l'haleine ? (revue systématique et méta-analyse)","subst":"probiotiques (halitose)","res":"Revue systématique et méta-analyse d'ECR (Journal of Breath Research, publié le 23 décembre 2025 ; 20:016004 ; PubMed 41289613 ; recherche jusqu'en décembre 2024) sur les probiotiques dans la gestion de l'halitose : des différences notées sur des paramètres d'haleine, mais pas de différence substantielle entre groupes sur la qualité de vie bucco-dentaire (SMD 0,21, IC95 % [-0,06 ; 0,49], p=0,12) ni sur le statut oral subjectif (SMD -0,04) selon les extraits lus. 3e usage des probiotiques en base (après diarrhée antibiotique et SII).","off":"Pour une mauvaise haleine, les probiotiques buccaux peuvent aider un peu, mais l'hygiène (brossage, langue, fil dentaire) et un avis dentaire restent la base.","src":[["Journal of Breath Research (IOP)","https://iopscience.iop.org/article/10.1088/1752-7163/ae23f0"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/41289613/"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; effet le plus net sur les composés soufrés volatils, sans traduction claire en qualité de vie."},{"dom":"Diabète & Endocrinologie","type":"Complément alimentaire","n":1,"dt":"2026-04","titre":"Hashimoto : le myo-inositol ajouté au sélénium réduit la TSH, pas les autres marqueurs (méta-analyse avec TSA)","subst":"myo-inositol + sélénium","res":"Revue systématique et méta-analyse actualisée avec analyse séquentielle du trial (TSA) (Journal of Clinical Medicine, MDPI, publié le 22 avril 2026 ; 15(9):3179 ; PubMed 42122912 ; recherche jusqu'au 7 mars 2026) : l'ajout de myo-inositol au sélénium dans la thyroïdite de Hashimoto avec hypothyroïdie subclinique réduit la TSH et la thyroglobuline vs sélénium seul, sans différence significative sur T3 (SMD 0,15), T4 ni anti-TPO. Le sélénium seul (Hashimoto) est déjà en base : l'angle neuf est la combinaison et la hiérarchie des marqueurs.","off":"Dans certaines thyroïdites auto-immunes avec TSH un peu haute, un complément (myo-inositol + sélénium) peut faire baisser la TSH — ce n'est pas un traitement de l'hypothyroïdie, à discuter avec votre médecin.","src":[["Journal of Clinical Medicine (MDPI)","https://www.mdpi.com/2077-0383/15/9/3179"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/42122912/"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; essais petits et de qualité variable, effet biologique sans critère clinique dur."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":4,"dt":"2025-11","titre":"Lévothyroxine : comment les patients la prennent vraiment (enquête CONTROL Surveillance II)","subst":"lévothyroxine","res":"Étude de surveillance (Annals of Thyroid, publiée en ligne le 28 novembre 2025 ; Cummings-John et al.) sur les modalités réelles de prise de la lévothyroxine : respect du jeun pré-prandial (≤30 min avant le petit-déjeuner), co-administration avec aliments, boissons ou médicaments interférents (café, IPP, calcium, fer) ; les résultats détaillés ne sont pas lisibles dans les extraits → design et enjeux décrits sans invention. Terrain du conseil officinal quotidien pour un des médicaments les plus délivrés en France.","off":"La pilule de la thyroïde se prend à jeun, environ une demi-heure avant le petit-déjeuner, à distance du café, du calcium et du fer — sinon elle s'absorbe moins bien.","src":[["Annals of Thyroid (AME)","https://aot.amegroups.org/article/view/8689/html"],["PDF Annals of Thyroid","https://cdn.amegroups.cn/journals/jrh/files/journals/29/articles/8689/public/8689-PB13-2325-R2.pdf?filename=aot-10-4.pdf&t=1767858557"]],"coi":"À vérifier","fin":"Sponsor non lisible dans les extraits (étude de surveillance sur une cohorte de patients traités) ; messages de bon usage conformes aux RCP."},{"dom":"Neurologie","type":"Officine","n":1,"dt":"2025-04","titre":"Le pharmacien au service de l'épilepsie : revue systématique des interventions communautaires et hospitalières","subst":"épilepsie (interventions pharmacien)","res":"Revue systématique (Journal of Pharmaceutical Policy and Practice, publiée en ligne le 10 avril 2025 ; doi 10.1080/20523211.2025.2487046 ; PubMed 40224172) : 5 études éligibles (457 participants, USA ×3, Pays-Bas, autres) sur les interventions de pharmaciens en épilepsie (observance, éducation, qualité de vie) ; les auteurs soulignent la contribution possible des pharmaciens à l'observance et à la qualité de vie — population longtemps absente de la base PharmaVeille.","off":"Les pharmaciens peuvent aider les personnes épileptiques à ne jamais interrompre leur traitement : un doublement de boîte, un carnet, un rappel — parlons-en.","src":[["Journal of Pharmaceutical Policy and Practice (Taylor & Francis)","https://www.tandfonline.com/doi/pdf/10.1080/20523211.2025.2487046"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40224172/"]],"coi":"À vérifier","fin":"Revue systématique (5 études) ; financement non lisible dans les extraits ; preuves encore parcellaires."},{"dom":"Neurologie","type":"Officine","n":4,"dt":"2025-01","titre":"Programme de pharmacien communautaire pour les personnes vivant avec l'épilepsie (JAPhA)","subst":"épilepsie (service officinal)","res":"Évaluation d'un programme de 6 mois en officine (Community Pharmacist Epilepsy Services Program ; Journal of the American Pharmacists Association, 2025 jan-fév ; 65(1):102275, epub 28 octobre 2024 ; PubMed 39490530) associant 4 composantes : consultation patient-pharmacien, plan de soins, points de contact réguliers et coordination des soins ; les résultats détaillés (observance, qualité de vie) ne sont pas lisibles dans les extraits → design décrit sans inventer.","off":"Votre pharmacien peut vous suivre régulièrement entre deux consultations pour l'épilepsie : n'hésitez pas à lui demander un entretien dédié.","src":[["Journal of the American Pharmacists Association (ScienceDirect)","https://www.sciencedirect.com/science/article/pii/S1544319124003066"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/39490530/"],["JAPhA","https://www.japha.org/article/S1544-3191(24)00306-6/fulltext"]],"coi":"À vérifier","fin":"Financement non lisible dans les extraits ; programme pilote monocentrique (contexte américain), transposition française à formuler prudemment."},{"dom":"Soins primaires & Officine","type":"Officine","n":5,"dt":"2025-07","titre":"Hémorroïdes : revue narrative et bonnes pratiques pour le pharmacien","subst":"hémorroïdes (conseil officinal)","res":"Revue narrative et guide de bonnes pratiques dédié aux pharmaciens (Pharmacy, MDPI, 13(4):105, publiée le 30 juillet 2025 ; reçue le 4 juin 2025) : place du pharmacien dans l'éducation, la gestion des symptômes (topiques, bains de siège, régularisation du transit) et les critères de referral (saignement, doute, échec) dans la maladie hémorroïdaire — demande très fréquente au comptoir.","off":"Pour les hémorroïdes, soulager passe par des soins locaux, des bains de siège et un transit plus souple ; en cas de saignement ou de douleur forte, consultez sans attendre.","src":[["Pharmacy (MDPI)","https://www.mdpi.com/2226-4787/13/4/105"]],"coi":"À vérifier","fin":"Revue narrative (pas de méta-analyse) ; financement non lisible dans les extraits ; messages alignés sur les recommandations ASCRS relayées par l'AFP."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2020-10","titre":"EMPEROR-Reduced : l'empagliflozin entre dans l'insuffisance cardiaque à FE réduite (essai pivot, NEJM)","subst":"empagliflozin (SGLT2)","res":"Essai pivot de phase 3 (3 730 patients, HFrEF ; NEJM 2020;383:1413-1424, 8 oct. 2020, DOI 10.1056/NEJMoa2022190) : sur 16 mois médiane, le critère principal (décès CV ou hospitalisation pour IC) est survenu chez 19,4 % sous empagliflozin vs 24,7 % sous placebo (HR 0,75 ; IC95 % 0,65-0,86), avec un bénéfice rénal et une tolérance correcte. Fondatrice : socle SGLT2i de l'ICFEF, confirmée depuis (4 piliers ; ESC IC 2026 déjà en base RECO ; DELIVER/EMPEROR-Preserved puis SUMMIT tirzépatide 2025 pour l'ICFEp).","src":[["NEJM — Cardiovascular and Renal Outcomes with Empagliflozin in Heart Failure (EMPEROR-Reduced)","https://www.nejm.org/doi/full/10.1056/NEJMoa2022190"],["PubMed 32865377","https://pubmed.ncbi.nlm.nih.gov/32865377/"],["TCTMD — EMPEROR-Reduced (chiffres primaires)","https://www.tctmd.com/news/emperor-reduced-empagliflozin-cuts-hospitalizations-cv-mortality-hfref"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Jardiance 10 mg est un traitement de fond de l'IC à ne jamais arrêter sans avis — surveillance hydro-électrolytique et fonction rénale à l'initiation, hydratation suffisante ; expliquer que ce « antidiabétique » protège le cœur même sans diabète."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2021-10","titre":"EMPEROR-Preserved : premier traitement qui marche dans l'IC à FE préservée (essai pivot, NEJM)","subst":"empagliflozin (SGLT2)","res":"Essai pivot de phase 3 (5 988 patients, ICFEp ; NEJM 2021;385:1451-1461, 14 oct. 2021, DOI 10.1056/NEJMoa2107038) : sur 26,2 mois médiane, décès CV ou hospitalisation IC chez 13,8 % sous empagliflozin vs 17,1 % sous placebo (HR 0,79 ; IC95 % 0,69-0,90 ; p<0,001) — premier médicament apportant un bénéfice clinique dur dans l'ICFEp historiquement orpheline. Fondatrice : confirmée et étendue par DELIVER (2022) puis SUMMIT tirzépatide (2025, déjà en base) ; socle SGLT2i de l'ICFEp dans les ESC IC 2026 (RECO en base).","src":[["NEJM — Empagliflozin in Heart Failure with a Preserved Ejection Fraction (EMPEROR-Preserved)","https://www.nejm.org/doi/full/10.1056/NEJMoa2107038"],["PubMed 34449189","https://pubmed.ncbi.nlm.nih.gov/34449189/"],["UTMB Research Experts — citation NEJM 2021 Oct 14;385(16):1451-1461","https://researchexperts.utmb.edu/en/publications/empagliflozin-in-heart-failure-with-a-preserved-ejection-fraction/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Jardiance s'ajoute aux traitements de l'IC « à cœur raide » du senior ; pas d'effet sur la FE attendu mais moins d'hospitalisations ; surveiller volémie, poids et créatinine à l'instauration."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2022-08","titre":"DELIVER : le dapagliflozin valide l'insuffisance cardiaque à FE préservée ou légèrement réduite (essai pivot, NEJM)","subst":"dapagliflozin (SGLT2)","res":"Essai pivot de phase 3 (6 263 patients, FE > 40 % ; NEJM 2022;387:1937-1948, publié en ligne le 27 août 2022, DOI 10.1056/NEJMoa2206286) : sur 2,3 ans médiane, aggravation de l'IC (hospitalisation/visite urgente) ou décès CV chez 16,4 % sous dapagliflozin vs 19,5 % sous placebo (HR 0,82 ; IC95 % 0,73-0,92 ; p<0,001). Fondatrice : avec EMPEROR-Preserved, elle fonde l'utilisation SGLT2i à TOUTES les FE — pérenne en 2026 (ESC IC 2026 en base ; finérénone FINEARTS-HF et tirzépatide SUMMIT, tous deux en base, s'y ajoutent en 2025-2026).","src":[["NEJM — Dapagliflozin in Heart Failure with Mildly Reduced or Preserved Ejection Fraction (DELIVER)","https://www.nejm.org/doi/full/10.1056/NEJMoa2206286"],["PubMed 36027570","https://pubmed.ncbi.nlm.nih.gov/36027570/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Forxiga 10 mg est un traitement de fond de l'IC quelle que soit la FE ; ne pas confondre avec l'indication diabète ; conseils hydratation/rein idem empagliflozin."},{"dom":"Néphrologie","type":"Médicament","n":2,"dt":"2020-10","titre":"DAPA-CKD : le dapagliflozin protège le rein, diabétique ou non (essai pivot, NEJM)","subst":"dapagliflozin (SGLT2)","res":"Essai pivot de phase 3 (4 304 patients, MRC avec excrétion urinaire d'albumine ; NEJM 2020;383:1436-1446, 8 oct. 2020, DOI 10.1056/NEJMoa2024816) : le critère principal (baisse DFG ≥ 50 %, maladie rénale terminale ou décès rénal/CV) est survenu chez 9,2 % (197 patients) sous dapagliflozin vs 14,5 % (312) sous placebo — soit environ un tiers de risque relatif en moins, essai arrêté prématurément pour efficacité (avis DSMB). Fondatrice : a fondé l'extension SGLT2i à la MRC non diabétique — intégrée au KDIGO 2024 (RECO en base) ; confirmée par EMPA-KIDNEY et FIND-CKD finérénone (2026, en base).","src":[["NEJM — Dapagliflozin in Patients with Chronic Kidney Disease (DAPA-CKD)","https://www.nejm.org/doi/full/10.1056/NEJMoa2024816"],["Ovid — citation NEJM 383(15):1436-1446, October 8, 2020","https://www.ovid.com/journals/nejm/abstract/10.1056/nejmoa2024816~dapagliflozin-in-patients-with-chronic-kidney-disease"],["NephJC — DAPA-CKD review (arrêt précoce, chiffres primaires)","http://www.nephjc.com/news/dapa-ckd"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Forxiga est aussi un néphroprotecteur : chez l'insuffisant rénal chronique, l'eGFR peut baisser légèrement à l'initiation (« hémodynamique », attendue) — jamais arrêter seul ; surveillance kaliémie avec diurétiques/IEC."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2020-10","titre":"EAST-AFNET 4 : le contrôle du rythme tôt après une FA améliore le pronostic (essai pivot, NEJM)","subst":"fibrillation auriculaire (contrôle du rythme)","res":"Essai pivot randomisé ouvert (2 789 patients, FA diagnostiquée depuis < 12 mois + comorbidités CV ; NEJM 2020;383:1305-1316, 1ᵉʳ oct. 2020, DOI 10.1056/NEJMoa2019422) : le critère principal composite CV (décès CV, AVC, hospitalisation IC/infarctus) à ~5 ans : 3,9 vs 5,0 événements pour 100 patients-années sous prise en charge précoce du rythme (ablation/antiarythmiques) vs soins usuels (HR 0,79 ; IC96 % 0,66-0,94) — soit 21 % de risque relatif en moins. Fondatrice : a déplacé la FA récente du « pill in the pocket » vers le rythme précoce — message repris par les ESC/EACTS FA 2024 (RECO en base) et l'essor de l'ablation (PFA AVANT GUARD en base).","src":[["NEJM — Early Rhythm-Control Therapy in Patients with Atrial Fibrillation (EAST-AFNET 4)","https://www.nejm.org/doi/full/10.1056/NEJMoa2019422"],["PubMed 32865375","https://pubmed.ncbi.nlm.nih.gov/32865375/"],["Maastricht CRIS — publication NEJM 2020/10/1, vol 383","https://cris.maastrichtuniversity.nl/en/publications/early-rhythm-control-therapy-in-patients-with-atrial-fibrillation/"],["ACC — EAST-AFNET 4 : Redefining the Role of Rhythm Control in AF","https://www.acc.org/latest-in-cardiology/articles/2020/12/04/13/50/east-afnet-4"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Une FA nouvellement diagnostiquée chez un patient à risque se traite activement, pas seulement par anticoagulation ; l'ordonnance typique associe anticoagulant + éventuel antiarythmique — vérifier observance de l'anticoagulation et signaler palpitations/essoufflement au médecin."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2020-04","titre":"ISCHEMIA : la coronaropathie stable sère médicalement — l'invasif d'emblée ne sauve pas (essai pivot, NEJM)","subst":"coronaropathie stable (stratégie invasive vs médicale)","res":"Essai pivot randomisé (5 179 patients, coronaropathie stable avec ischémie modérée-sévère ; NEJM 2020;382:1395-1407, 9 avr. 2020, DOI 10.1056/NEJMoa1915922) : pas de différence significative sur le critère principal (décès ou infarctus) entre stratégie invasive d'emblée (angioplastie/pontage + traitement médical optimal) et stratégie conservatrice (traitement médical, angiographie seulement si aggravation) ; le traitement médical optimal — dont l'observance des antiagrégants, statines, bêtabloquants/IEC — est le socle de la coronaropathie stable. Fondatrice : encore la référence 2026 sur la place du traitement médical dans l'angor stable ; nuances ultérieures en base (FULL REVASC : revascularisation complète FFR post-IDM ; REBOOT : bêtabloquants post-IDM sans FE abaissée).","src":[["NEJM — Initial Invasive or Conservative Strategy for Stable Coronary Disease (ISCHEMIA)","https://www.nejm.org/doi/full/10.1056/NEJMoa1915922"],["PubMed 32227755","https://pubmed.ncbi.nlm.nih.gov/32227755/"],["PMC — Causes of CV death in the ISCHEMIA trial (pas de différence)","https://pmc.ncbi.nlm.nih.gov/articles/PMC9310436/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Après un stent, la priorité du pharmacien est l'OBSERVANCE (bi/thérapie antiagrégante, statine à dose cible) — l'angor stable bien traité médicalement ne réclame pas « un nouveau stent » ; rassurer le patient sur son traitement médical."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2021-09","titre":"STEP (Chine) : chez le senior hypertendu, viser la PAS < 130 protège (essai pivot, NEJM)","subst":"HTA du sujet âgé (cible tensionnelle)","res":"Essai pivot randomisé ouvert (8 511 patients chinois de 60-80 ans, HTA ; NEJM 2021;385:1268-1279, 30 sept. 2021, DOI 10.1056/NEJMoa2111437) : la cible systolique intensive 110-< 130 mmHg vs standard 130-< 150 mmHg donne moins d'événements CV (critère composite CV), avec en particulier AVC HR 0,67 (IC95 % 0,47-0,97), SCA HR 0,67 et insuffisance cardiaque aiguë HR 0,27 (Medscape, résultats présentés) — le bénéfice est net chez le senior, sans excès d'hypotension sévère rapporté comme signal d'alerte majeur. Fondatrice : a nourri la cible unique « < 130/80 » des guidelines AHA/ACC 2025 (RECO en base ; dossier ⚖️ vs ESC 140/90) et l'automesure promue par les pharmaciens (déjà en base).","src":[["NEJM — Trial of Intensive Blood-Pressure Control in Older Patients with Hypertension (STEP)","https://www.nejm.org/doi/full/10.1056/NEJMoa2111437"],["PubMed 34491661","https://pubmed.ncbi.nlm.nih.gov/34491661/"],["Medscape — STEP : composants du critère principal (AVC HR 0.67, etc.)","https://www.medscape.com/viewarticle/957566"],["Ovid — sommaire NEJM Volume 385 n°14, 30 sept. 2021","https://www.ovid.com/journals/nejm/toc/2021/09300"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Chez le 60-80 ans, une automesure autour de 130/80 est une vraie cible, pas de l'acharnement ; on n'arrête pas un traitement parce que « 130 ça va » — vérifier orthostatisme (lever lentement), sodium et interactions, et encourager l'automesure."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2022-07","titre":"RACING : statine d'intensité moyenne + ézétimibe, une alternative validée à la forte dose (essai pivot, Lancet)","subst":"ézétimibe + statine (intensité moyenne)","res":"Essai pivot randomisé ouvert de non-infériorité (3 780 patients coronariens/MCV athéromateuse ; Lancet 2022;400(10349):380-390, 30 juil. 2022, DOI 10.1016/S0140-6736(22)00916-3) : à 3 ans, critère composite (décès CV, IDM, AVC, revascularisation, hospitalisation CV) chez 9,1 % sous rosuvastatine moyenne + ézétimibe vs 9,9 % sous rosuvastatine forte (non-infériorité ; HR 0,92), avec plus de patients à LDL < 70 mg/dL (72 % vs 58 % à 3 ans) et moins d'intolérances. Fondatrice : base de la stratégie « double bloche » quand la forte dose n'est pas tolérée — reprise dans les recommandations ESC/EAS dyslipidémies 2025 (RECO en base).","src":[["The Lancet — RACING : moderate-intensity statin with ezetimibe (abstract)","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(22)00916-3/abstract"],["ScienceDirect — RACING (LDL < 70 : 72 % vs 58 % ; discontinuations)","https://www.sciencedirect.com/science/article/abs/pii/S0140673622009163"],["PACE-CME — RACING (9,1 % vs 9,9 %, HR 0.92)","https://pace-cme.org/news/moderate-intensity-statin-plus-ezetimibe-versus-high-intensity-statin-monotherapy-in-ascvd/2456260/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un patient qui « ne supporte pas » la statine forte peut avoir l'association statine réduite + ézétimibe (zétimibe souvent en association fixe) — l'objectif reste le LDL < 0,7 g/L (voire < 0,55) ; vérifier la prise du soir et les interactions."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2020-04","titre":"ORION-10/11 : l'inclisiran, deux injections par an pour diviser le LDL par deux (phase 3, NEJM)","subst":"inclisiran (ARNi anti-PCSK9)","res":"Deux essais de phase 3 poolés dans un même article (ORION-10 n=781 ASCVD ; ORION-11 n=817 ASCVD ou équivalents de risque ; NEJM 2020;382:1507-1519, 16 avr. 2020, DOI 10.1056/NEJMoa1912387) : l'inclisiran SC (jour 1, 3, puis tous les 6 mois) réduit le LDL-C d'environ 50 % et la PCSK9 de −69,8 % à 510 jours (ORION-10 vs placebo +13,5 %), avec davantage d'événements locaux à l'injection mais bonne tolérance générale. Fondatrice : base du « statin + 2 piqûres/an » (Leqvio, AMM UE déc. 2020) pour le patientASCVD à LDL non contrôlé ; l'ESC/EAS 2025 (RECO en base) le place en 3ᵉ ligne après statine/ézétimibe, avant ou avec les anti-PCSK9 anticorps.","src":[["NEJM — Two Phase 3 Trials of Inclisiran in Patients with Elevated LDL Cholesterol (ORION-10/11)","https://www.nejm.org/doi/full/10.1056/NEJMoa1912387"],["PubMed 32187462","https://pubmed.ncbi.nlm.nih.gov/32187462/"],["Mayo Clinic Pure — citation NEJM Vol. 382, No. 16, 16.04.2020, p. 1507-1519","https://mayoclinic.elsevierpure.com/en/publications/two-phase-3-trials-of-inclisiran-in-patients-with-elevated-ldl-ch/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Leqvio se prend EN PLUS de la statine (pas à la place) — l'oubli de la statine est le 1ᵉʳ motif d'échec ; vérifier la tenue du rendez-vous d'injection (médecin/infirmière) et que le patient garde sa statine et son ézétimibe."},{"dom":"Cardiologie","type":"Médicament","n":2,"dt":"2023-04","titre":"CLEAR Outcomes : le bempédoïque acide réduit les événements CV chez l'intolérant aux statines (essai pivot, NEJM)","subst":"bempédoïque acide (ACL inhibiteur)","res":"Essai pivot randomisé (13 970 patients intolérants aux statines, CV établie ou à haut risque ; NEJM 2023;388:1353-1364, 13 avr. 2023, DOI 10.1056/NEJMoa2215024, présenté à l'ACC le 4 mars 2023) : sur 6 mois le LDL baisse de 29,2 mg/dL de plus que le placebo ; à ~3 ans le critère principal MACE (décès CV, IDM non fatal, AVC non fatal, revascularisation) survient chez 11,7 % vs 13,3 % (HR 0,87), soit −13 % de risque relatif, sans bénéfice démontré sur le décès CV seul ; plus de goutte (hyperuricémie) et d'atteinte hépatique enzymatique sous traitement. Fondatrice : place « alternative lipidique » de l'intolérant aux statines confirmée en 2025 (revue ESC Cardiopractice « Bempedoic acid : mechanism, evidence, safety, and guideline role in 2025 », page vue) et au RCP français.","src":[["NEJM — Bempedoic Acid and Cardiovascular Outcomes in Statin-Intolerant Patients (CLEAR Outcomes)","https://www.nejm.org/doi/full/10.1056/NEJMoa2215024"],["PubMed 36876740","https://pubmed.ncbi.nlm.nih.gov/36876740/"],["HCPLive — CLEAR Outcomes (MACE −13 %, décès CV non démontré)","https://www.hcplive.com/view/bempedoic-acid-reduces-risk-of-mace-by-13-but-proves-no-benefit-on-cardiovascular-death"],["ESC Cardio — Bempedoic acid: mechanism, evidence, safety, and guideline role in 2025","https://www.escardio.org/communities/councils/cardiology-practice/education/cardiopractice/bempedoic-acid-mechanism-evidence-safety-and-guideline-role-in-2025/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'acide bempédoïque (Nustendi avec ézétimibe) est un plan B validé pour l'intolérance vraie aux statines — vérifier l'acide urique (risque goutte) et les transaminases ; il ne remplace jamais l'hygiène de vie, et l'intolérance musculaire aux statines doit être réévaluée par le médecin avant de l'admettre."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2021-03","titre":"STEP 1 : le sémaglutide 2,4 mg, l'essai qui a changé la pharmacologie de l'obésité (essai pivot, NEJM)","subst":"sémaglutide 2,4 mg (obésité)","res":"Essai pivot de phase 3 (1 961 adultes, IMC ≥ 30 ou ≥ 27 + comorbidité, SANS diabète ; NEJM 2021;384:989-1002, 18 mars 2021, DOI 10.1056/NEJMoa2032183) : sémaglutide 2,4 mg hebdo + hygiène de vie pendant 68 semaines : 86,4 % des participants perdent ≥ 5 % de poids vs 31,5 % sous placebo, 69,1 % perdent ≥ 10 % (vs 12,0 %) et 50,5 % perdent ≥ 15 % (vs 4,9 %) ; principaux effets : nausées/vomissements transitoires, arrêts pour GI plus fréquents. Fondatrice : essai fondateur de Wegovy (AMM obésité) — confirmé en 2023 par SELECT (bénéfice CV, analyse 2025 déjà en base) et par le remboursement Wegovy/Mounjaro en France depuis le 15 juin 2026 (déjà en base) ; base du message officinal obésité-maladie-chronique.","src":[["NEJM — Once-Weekly Semaglutide in Adults with Overweight or Obesity (STEP 1)","https://www.nejm.org/doi/full/10.1056/NEJMoa2032183"],["PubMed 33567185","https://pubmed.ncbi.nlm.nih.gov/33567185/"],["ACC — STEP 1 Clinical Trial summary","https://www.acc.org/latest-in-cardiology/clinical-trials/2021/02/18/19/23/step-1"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le sémaglutide 2,4 mg (Wegovy) se dose par paliers hebdomadaires (0,25 → 2,4 mg) — prévenir les nausées du palier (manger lentement, petites portions), ne JAMAIS sauter un palier ni doubler, conserver au frigo avant 1ʳᵉ utilisation, et l'arrêt se traduit par une reprise du poids (démontré plus tard par SURMOUNT-MAINTAIN/SURMOUNT-5, base)."},{"dom":"Obésité & Métabolisme","type":"Médicament","n":2,"dt":"2022-07","titre":"SURMOUNT-1 : le tirzépatide, jusqu'à −20,9 % de poids — la nouvelle référence de l'obésité (essai pivot, NEJM)","subst":"tirzépatide (obésité)","res":"Essai pivot de phase 3 (2 539 adultes obèses ou en surpoids avec comorbidité, sans diabète ; NEJM 2022;387:205-216, 21 juil. 2022, DOI 10.1056/NEJMoa2206038) : à 72 semaines, le tirzépatide 5/10/15 mg hebdo donne des baisses de poids substantielles et durables vs placebo, atteignant à la plus forte dose 20,9 % de perte de poids moyenne vs 3,1 % sous placebo (relais de presse citant l'essai) ; essai randomisé, en aveugle, soutenu par Eli Lilly. Fondatrice : base de Zepbound/Mounjaro — confirmée en 2024-2026 (SURMOUNT-5 : supériorité vs sémaglutide, en base ; SURMOUNT-OSA, SUMMIT-ICFEp et remboursement obésité 15/06/2026, tous en base).","src":[["NEJM — Tirzepatide Once Weekly for the Treatment of Obesity (SURMOUNT-1)","https://www.nejm.org/doi/full/10.1056/NEJMoa2206038"],["PubMed 35658024","https://pubmed.ncbi.nlm.nih.gov/35658024/"],["Ovid — citation NEJM 387(3):205-216, July 21, 2022","https://www.ovid.com/journals/nejm/abstract/10.1056/nejmoa2206038~tirzepatide-once-weekly-for-the-treatment-of-obesity"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Comme tous les GLP-1/GIP, le tirzépatide se dose par paliers de 4 semaines — rappeler la rotation des sites d'injection, la conservation, la complémentation protéines/activité physique pour préserver le muscle, et prévenir nausées/constipation ; la reprise du poids à l'arrêt est documentée (SURMOUNT-MAINTAIN, base) — c'est un traitement au long cours d'une maladie chronique, pas une cure."},{"dom":"Pneumologie","type":"Médicament","n":2,"dt":"2020-07","titre":"ETHOS : la triple thérapie inhalée en inhalateur unique devient la référence des exacerbations de BPCO (essai pivot, NEJM)","subst":"budésonide-glycopyrronium-formotérol (triple thérapie BPCO)","res":"Essai pivot de phase 3 randomisé en double aveugle (BPCO modérée à très sévère, 52 semaines ; NEJM 2020;383:35-48, Vol. 383 n°1 du 2 juillet 2020, DOI 10.1056/NEJMoa1916046) : la triple thérapie budesonide (160 ou 320 µg) + glycopyrronium + formotérol en inhalateur unique (Breztri Aerosphere) administrée deux fois par jour entraîne un taux d'exacerbations modérées à sévères de BPCO plus bas que les deux thérapies doubles (glycopyrrolate-formotérol ou budésonide-formotérol), différence statistiquement significative (résultats lus : NEJM, Healio 25/06/2020, communiqué AstraZeneca) ; l'essai a aussi évalué deux doses de corticoïde inhalé. Fondatrice : socle de la place de la triple thérapie dans le GOLD (rapport GOLD 2026 déjà en base RECO) ; la BPCO à exacerbations reste en 2026 une indication majeure de l'ICS/LAMA/LABA, nuancée depuis par l'arrivée des anti-inflammatoires non stéroïdiens (ensifentrine, tozorakimab — tous deux en base).","src":[["NEJM — Triple Inhaled Therapy at Two Glucocorticoid Doses in Moderate-to-Very-Severe COPD (ETHOS)","https://www.nejm.org/doi/full/10.1056/NEJMoa1916046"],["Healio — Triple inhaled therapy reduces moderate, severe COPD exacerbations: ETHOS (25/06/2020)","https://www.healio.com/news/pulmonology/20200625/triple-inhaled-therapy-reduces-moderate-or-copd-exacerbations-ethos"],["AstraZeneca — Breztri Aerosphere significantly reduced rate of moderate or severe COPD exacerbations in Phase III ETHOS trial","https://www.astrazeneca.com/media-centre/press-releases/2020/breztri-aerosphere-significantly-reduced-rate-of-moderate-or-severe-copd-exacerbations-in-phase-iii-ethos-trial.html"],["OHSU CPD — citation N Engl J Med 2020;383:35-48","https://www.ohsu.edu/sites/default/files/2024-02/PCR%202024%20-%20Llamas%20-%20COPD%20Pharmacist.pdf"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Vérifier la technique d'inhalation de ces dispositifs pressurisés (rinçage de bouche après ICS pour éviter candidose), l'observance quotidienne même sans symptôme, et ne jamais laisser un patient « déboussoler » sa triple thérapie pour un bronchodilatateur seul sans avis médical."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":1,"dt":"2022-02","titre":"GRAM : la première cartographie mondiale de l'antibiorésistance — 1,27 million de morts directs par an (Lancet)","subst":"antibiorésistance (burden mondial, GRAM)","res":"Analyse systématique sans équivalent (204 pays et territoires, infections bactériennes de 2019 ; Lancet 2022;399(10325):629-655, publiée en ligne le 19 janvier 2022, DOI 10.1016/S0140-6736(21)02724-0, PMID 35065702) : environ 4,95 millions de décès en 2019 étaient ASSOCIÉS à une infection bactérienne résistante, dont 1,27 million de décès directement ATTRIBUTABLES à l'antibiorésistance — plus que le VIH/sida ou le paludisme cette année-là (chiffres lus : Monash « 4·95 million (3·62–6·57) » et « 1·27 million (0·911–1·71) », SHEA, communiqués Oxford/EurekAlert du 20/01/2022) ; en pays à revenu élevé, la moitié des décès attribuables sont dus à S. aureus (26 %) ou E. coli (23 %) (Oxford). Fondatrice : LA référence chiffrée de l'antibiorésistance citée partout depuis, message intégralement confirmé en 2024-2026 (l'OMS et la surveillance pédiatrique mondiale JAMA Pediatrics 20/07/2026, déjà en base, ne font que renforcer le constat).","src":[["The Lancet — Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(21)02724-0/fulltext"],["PMC — citation Lancet. 2022 Jan 19;399(10325):629-655","https://pmc.ncbi.nlm.nih.gov/articles/PMC8841637/"],["Monash University — Findings: 4·95 M deaths associated, 1·27 M attributable","https://research.monash.edu/en/publications/global-burden-of-bacterial-antimicrobial-resistance-in-2019-a-sys/"],["Oxford University — An estimated 1.2 million people died in 2019 from antibiotic-resistant bacterial infections (20/01/2022)","https://www.ox.ac.uk/news/2022-01-20-estimated-12-million-people-died-2019-antibiotic-resistant-bacterial-infections"],["UKHSA Research Portal — Vol. 399, No. 10325, pp. 629-655","https://researchportal.ukhsa.gov.uk/en/publications/global-burden-of-bacterial-antimicrobial-resistance-in-2019-a-sys/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument massue pour le discours d'antibiothérapie raisonnée — « l'antibiorésistance tue plus d'un million de personnes par an, directement » ; ne pas délivrer d'antibiotique pour une infection virale, respecter les durées courtes, vérifier l'absence de reliquat d'ancienne boîte d'antibiotique auto-consommé à la maison."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":5,"dt":"2022-12","titre":"Livre OMS AWaRe (Access, Watch, Reserve) : la référence mondiale pour prescrire — et conseiller — les antibiotiques (OMS)","subst":"AWaRe — bon usage des antibiotiques (OMS)","res":"Publication officielle de l'OMS (news OMS du 9 décembre 2022 : « has today published the WHO AWaRe (Access, Watch, Reserve) antibiotic book ») : guide concis et fondé sur les preuves pour plus de 30 infections courantes de l'adulte et de l'enfant, en soins primaires comme à l'hôpital — choix de l'antibiotique, dose, voie et DURÉE de traitement, aligné sur la Liste modèle des médicaments essentiels de l'OMS ; la classification AWaRe (créée en 2017, révisée 2021) répartit les antibiotiques en trois groupes : Access (1re intention, à utiliser au maximum), Watch (surveillance renforcée, à préserver), Reserve (dernier recours). Fondatrice : toujours LA référence opérationnelle du bon usage en 2026 — citée par toutes les politiques de stewardship ; la logique Access/Watch/Reserve est reprise jusqu'aux documents pédiatriques 2026 déjà en base (résistance qui monte le plus vite sur Watch/Reserve).","src":[["OMS — The WHO AWaRe (Access, Watch, Reserve) antibiotic book","https://www.who.int/publications/i/item/9789240062382"],["OMS (news, 09/12/2022) — Moving WHO guidance on antibiotics into the heart of clinical practice","https://www.who.int/news/item/09-12-2022-moving-who-guidance-on-antibiotics-into-the-heart-of-clinical-practice"],["OMS — 2021 AWaRe classification","https://www.who.int/publications/i/item/2021-aware-classification"],["PMC — The WHO AWaRe antibiotic book and prevention of antimicrobial resistance","https://pmc.ncbi.nlm.nih.gov/articles/PMC10042089/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le pharmacien peut nommer la logique AWaRe au comptoir — amoxicilline/doxycycline/nitrofurantoïne = « Access », azithromycine/fluoroquinolones/céphalosporines de 3e génération = « Watch, à ne pas galvauder » ; et rappeler les durées courtes validées (5 jours suffisent souvent, cf. revue parapluie déjà en base) plutôt que le réflexe « finir la boîte »."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2021-03","titre":"PTC : 3 jours de bêta-lactamine suffisent dans la PAC hospitalisée stable — l'essai pivot des durées courtes (Lancet)","subst":"pneumonie aiguë communautaire (durée d'antibiothérapie courte)","res":"Essai randomisé de non-infériorité en double aveugle contre placebo (Dinh A et al., groupe PTC ; patients hospitalisés en service non critique pour une PAC, cliniquement STABLES après 3 jours de bêta-lactamine IV ; Lancet 2021 Mar 27;397(10280):1195-1203, PMID 33773631, DOI 10.1016/S0140-6736(21)00313-5) : interrompre la bêta-lactamine après 3 jours a été NON-INFÉRIEUR à 8 jours de traitement sur le critère principal (lu : The Lancet « discontinuing β-lactam treatment after 3 days was non-inferior to 8 days of treatment » ; commentaire PubMed 34339227 : « In moderately severe CAP stable after 3 d of β-lactam, stopping therapy was noninferior to 5 additional d »). Fondatrice : c'est l'essai pivot derrière le message « durées courtes » des recommandations françaises et de la revue parapluie Lancet ID déjà en base (« 5 jours suffisent souvent en cas d'amélioration », pneumonie citée) — cette revue 2024-2026 confirme le message sans le démentir ; les fiches HAS durées (OMA, en base) suivent la même logique.","src":[["The Lancet — Discontinuing β-lactam treatment after 3 days for patients with CAP (PTC)","https://www.thelancet.com/article/S0140-6736(21)00313-5/fulltext"],["PubMed 33773631 — PTC (Lancet 2021 Mar 27;397(10280):1195-1203)","https://pubmed.ncbi.nlm.nih.gov/33773631/"],["PubMed 34339227 — commentaire : stopping at 3 days non-inferior to 5 additional days","https://pubmed.ncbi.nlm.nih.gov/34339227/"],["SHEA — How low can we go? 3 versus 8 days for CAP","https://shea-online.org/how-low-can-we-go-3-versus-8-days-for-community-acquired-pneumonia/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"À la sortie d'hôpital d'une PAC stabilisée, la courte durée prescrite N'EST PAS une erreur ni un traitement « écourté » ; ne pas conseiller de « finir la boîte » ni de relais non prescrit, expliquer que l'amélioration clinique après 3 jours signe l'efficacité, et signaler toute reprise de fièvre."},{"dom":"Pneumologie","type":"Médicament","n":1,"dt":"2021-01","titre":"ICS-formotérol à la demande : la méta-analyse qui fonde la stratégie GINA « anti-inflammatory reliever » (ERJ Open Research)","subst":"budésonide-formotérol (reliever, asthme léger)","res":"Revue systématique et méta-analyse (Hatter L, Beasley R et al., MRINZ ; ERJ Open Research 2021;7(1):00701-2020, collection date janvier 2021, DOI 10.1183/23120541.00701-2020, PMID 33532465, PMC7836558) : comparé au schéma « corticoïde inhalé d'entretien + bêta-2 agoniste de courte durée (SABA) à la demande », l'ICS-formotérol PRIS À LA DEMANDE réduit le risque d'exacerbation sévère — le SABA seul à la demande disparaît de la stratégie ; nuance lue (PubMed) : le contrôle symptomatique est très légèrement moins bon sous ICS-formotérol à la demande (ACQ-5 différence moyenne 0,12), sans atteindre le seuil d'importance clinique (0,50). Fondatrice : c'est la base factuelle de la refonte GINA 2019+ (« as-needed ICS-formoterol » aux paliers 1-2) toujours en vigueur — les GINA 2025/2026 et SP2A enfant 6-12 ans sont déjà en base RECO et ne font que décliner cette stratégie.","src":[["PMC — ICS-formoterol reliever vs ICS + SABA reliever (ERJ Open Res 2021;7(1):00701-2020)","https://pmc.ncbi.nlm.nih.gov/articles/PMC7836558/"],["PubMed 33532465 — conclusion + nuance ACQ-5 (différence 0,12)","https://pubmed.ncbi.nlm.nih.gov/33532465/"],["ERS — ERJ Open Research 7(1):00701-2020","https://publications.ersnet.org/content/erjor/7/1/00701-2020"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un asthmatique léger sous budésonide/formotérol à la demande SANS traitement de fond séparé suit un schéma VOLONTAIRE — ne pas le « corriger » en vendant un SABA de secours ; vérifier que le patient n'utilise PAS en parallèle une ancienne ventoline (à signaler au médecin), et rappeler que chaque bouffée de secours contient un anti-inflammatoire."},{"dom":"Neurologie","type":"Médicament","n":5,"dt":"2020-07","titre":"Lancet Commission 2020 : 40 % des démences sont liées à 12 facteurs de risque modifiables — la fondation du conseil de prévention au comptoir (Lancet)","subst":"prévention de la démence (facteurs de risque modifiables)","res":"Rapport de la Lancet Commission (Livingston G et al. ; « Dementia prevention, intervention, and care: 2020 report of the Lancet Commission » ; Lancet 2020 Jul 30;396(10248):413-446, publié en ligne le 30 juillet 2020, DOI 10.1016/S0140-6736(20)30367-6, PMID 32738937, PMC7392084) : le modèle de vie entière identifie 12 facteurs de risque MODIFIABLES représentant environ 40 % des démences mondiales (lu : Alzheimer Europe « 12 modifiable risk factors accounting for 40% of dementias ») — dont 3 nouveaux ajoutés en 2020 : alcool excessif, traumatismes crâniens et pollution de l'air (Neurology Today), à côté de l'audition, l'HTA, le diabète, l'obésité, le tabac, la dépression, l'isolement social, la sédentarité et le faible niveau d'éducation. Fondatrice : TOUJOURS la référence de la prévention en 2026 (l'incidence baisse dans les pays qui améliorent ces facteurs ; l'échec des anti-amyloïdes 2026 — EVOKE sémaglutide, déjà en base — renforce a contrario le poids de la prévention).","src":[["The Lancet — Dementia prevention, intervention, and care: 2020 report of the Lancet Commission","https://www.thelancet.com/article/S0140-6736(20)30367-6/fulltext"],["PMC — citation Lancet. 2020 Jul 30;396(10248):413-446","https://pmc.ncbi.nlm.nih.gov/articles/PMC7392084/"],["Alzheimer Europe — 12 modifiable risk factors accounting for 40% of dementias","https://www.alzheimer-europe.org/news/lancet-commission-dementia-prevention-intervention-and-care-identifies-12-modifiable-risk"],["Neurology Today — Three new modifiable risk factors (alcool, traumatismes crâniens, pollution)","https://neurologytoday.aan.com/doi/10.1097/01.NT.0000717956.89468.8a"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Discours de prévention concret — « ce que vous faites pour votre cœur et vos artères protège aussi votre cerveau » : traiter l'audition, bouger, ne pas fumer, limiter l'alcool, contrôler tension/glycémie, entretenir le lien social ; dépister l'isolement et proposer la vaccination grippale/pneumococcique chez le senior."},{"dom":"Douleur & Migraine","type":"Médicament","n":5,"dt":"2022-06","titre":"Guideline EHF 2022 : les anticorps anti-CGRP recommandés en prévention de la migraine, efficaces et sûrs au long cours (J Headache Pain)","subst":"anticorps anti-CGRP (érenumab, frémanezumab, galcanezumab, eptinezumab)","res":"Recommandation de la Fédération européenne du mal de tête (Sacco S, Amin FM et al. ; « European Headache Federation guideline… – 2022 update » ; The Journal of Headache and Pain 2022 Jun 11;23(1):67, DOI 10.1186/s10194-022-01431-x, PMID 35690723) : après revue des ECR et des données de vie réelle, la qualité des preuves est modérée à élevée pour RECOMMANDER les quatre anticorps anti-CGRP (eptinezumab, érenumab, frémanezumab, galcanezumab) dans la prévention de la migraine épisodique et chronique, jugés efficaces et sûs aussi à long terme (lu : conclusions PubMed/Medthority) ; le guideline précise la prudence avec l'érenumab (constipation, phénomène de Raynaud — PDF Springer lu). Fondatrice : socle de la place des anti-CGRP en Europe — le position paper SFEMC 2025 (déjà en base RECO) prolonge ce cadre en France avec les gepants oraux ; les entrées base atogepant/ubrogepant/frémanezumab traitent les molécules, pas la recommandation fondatrice.","src":[["The Journal of Headache and Pain — EHF guideline on mAbs targeting the CGRP pathway, 2022 update","https://thejournalofheadacheandpain.biomedcentral.com/articles/10.1186/s10194-022-01431-x"],["PubMed 35690723 — 2022 Jun 11;23(1):67","https://pubmed.ncbi.nlm.nih.gov/35690723/"],["Springer (PDF) — Sacco et al., J Headache Pain (2022) 23:67 (prudence érenumab)","https://link.springer.com/content/pdf/10.1186/s10194-022-01431-x.pdf"],["Medthority — CGRP migraine prevention, EHF 2022 guideline","https://www.medthority.com/guidelines/headache/european-headache-federation-guideline-on-the-use-of-monoclonal-antibodies-targeting-the-calcitonin-gene-related-peptide-pathway-for-migraine-prevention--2022-update/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un patient sous anti-CGRP injectable (1 injection mensuelle ou trimestrielle) doit tenir SON rythme — pas de « pause » d'un mois ; attendre ~3 mois avant de juger l'efficacité ; signaux à recueillir au comptoir : constipation sous érenumab, réactions au point d'injection ; et ces traitements n'exonèrent pas de la réévaluation des triptans et de la observance."},{"dom":"Neurologie","type":"Médicament","n":2,"dt":"2021-05","titre":"SANAD-II : la lamotrigine reste le premier choix de l'épilepsie focale — levétiracétam et zonisamide non inférieurs seulement en apparence (essai pivot, Lancet)","subst":"lamotrigine · lévétiracétam · zonisamide (épilepsie focale, 1re ligne)","res":"Essai randomisé ouvert de non-infériorité multicentrique de phase 4 (Marson A et al., SANAD II ; Lancet 2021 May 15;397(10287):1802-1812, DOI 10.1016/S0140-6736(21)00247-6, PMID 33838757) : comparaison du lévétiracétam et de la zonisamide vs lamotrigine en PREMIÈRE ligne de l'épilepsie focale nouvellement diagnostiquée (adultes et enfants) ; verdict lu (Lancet) : les résultats « ne supportent PAS l'usage du lévétiracétam ou de la zonisamide comme traitements de première ligne », la lamotrigine doit rester un traitement de première intention — la non-infériorité n'a pas été établie comme attendu sur le délai de 12 mois de remission. Fondatrice : toujours la référence pour arbitrer les antiépileptiques de première ligne en 2026, aucune donnée ultérieure ne l'a démentie ; complément utile à la fenfluramine Dravet (en base) qui traite les épilepsies sévères, pas la 1re ligne focale.","src":[["The Lancet — SANAD II: levetiracetam, zonisamide, or lamotrigine for newly diagnosed focal epilepsy","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(21)00247-6/fulltext"],["PubMed 33838757 — SANAD II","https://pubmed.ncbi.nlm.nih.gov/33838757/"],["PMC — SANAD II (et correction Lancet. 2021 May 15;397(10287):1808)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8047799/"],["Bangor University — SANAD II (notice institutionnelle)","https://research.bangor.ac.uk/en/publications/the-sanad-ii-study-of-the-effectiveness-and-cost-effectiveness-of/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Une ordonnance de 1re intention par lamotrigine est un choix fondé sur les preuves — attention aux interactions (valproate double la demi-vie, contraceptifs oraux la raccourcissent, réévaluer la dose si l'un des deux est ajouté/retiré) ; et pour le lévétiracétam quand il est prescrit : tolérance comportementale à surveiller (irritabilité) ; jamais d'arrêt brutal d'un antiépileptique."},{"dom":"Psychiatrie","type":"Médicament","n":1,"dt":"2021-04","titre":"Arrêter un antidépresseur au long cours : la Cochrane 2021 tempère — sevrage et rechute se confondent, évidence fragile (Cochrane)","subst":"antidépresseurs (arrêt/déprescription au long cours)","res":"Revue systématique Cochrane (Van Leeuwen E, Horowitz MA et al. ; « Approaches for discontinuation versus continuation of long-term antidepressant use for depressive and anxiety disorders in adults » ; Cochrane Database of Systematic Reviews 2021 Apr 15;4:CD013495, PMID 33886130) : patients sous antidépresseur depuis ≥ 6 mois ; peu d'études de qualité sur les modalités d'arrêt, et pas de conclusion ferme possible sur les effets et la sécurité des approches étudiées (lu : PubMed « We cannot make any firm conclusions… ») ; limite MAJEURE identifiée : les symptômes de sevrage (syndrome grippal, insomnie, nausées, vertiges, sensations électriques, hyperarousal) se confondent avec les symptômes de rechute de la dépression et biaisent presque tous les critères (lu : Cochrane.org et BMJ 2021;373:n1065 « Evidence on safe discontinuation is lacking »). Fondatrice : fonde la prudence officinale sur l'arrêt des antidépresseurs — jamais d'arrêt brutal, toujours un plan avec le prescripteur ; le message n'est pas démenti en 2026 (les travaux ultérieurs sur la déprescription, déjà en base, confirment l'approche progressive).","src":[["Cochrane Library — Approaches for discontinuation vs continuation of long-term antidepressant use (CD013495.pub2, 2021)","https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD013495.pub2/full"],["PubMed 33886130 — citation Cochrane Database Syst Rev. 2021 Apr 15;4(4):CD013495","https://pubmed.ncbi.nlm.nih.gov/33886130/"],["Cochrane.org — Stopping long-term antidepressants in people with depression or anxiety","https://www.cochrane.org/evidence/CD013495_stopping-long-term-antidepressants-people-depression-or-anxiety"],["BMJ — Torjesen : Antidepressants: evidence on safe discontinuation is lacking (BMJ 2021;373:n1065)","https://www.bmj.com/content/373/bmj.n1065"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un patient qui veut arrêter son ISRS doit être orienté vers son médecin pour un SEVRAGE PROGRESSIF planifié (paliers de plusieurs semaines) ; prévenir des symptômes transitoires de sevrage (« pas une rechute, mais à ne pas confondre »), éviter la délivrance de boîtes « au fil de l'eau » qui masquent les paliers, et vérifier l'absence d'automédication à l'arrêt."},{"dom":"ORL & stomatologie","type":"Médicament","n":2,"dt":"2025-11","titre":"Dupilumab (Dupixent) dans la rhinosinusite fongique allergique (AFRS) : essai de phase 3 positif","subst":"dupilumab · rhinosinusite fongique allergique · AFRS","res":"Essai de phase 3 présenté à l'ACAAI 2025 : le dupilumab réduit significativement vs placebo les signes et symptômes nasaux de la rhinosinusite fongique allergique chez les patients de 6 ans et plus — opacité sinusienne, congestion nasale (66,7 % d'amélioration sous dupilumab vs 25,3 % sous placebo à la semaine 24, p<0,0001 ; 80,6 % vs 11,6 % à S52) et taille des polypes (60,8 % vs 15,2 % à S24, p<0,0001). Le sBLA est accepté en revue prioritaire par la FDA avec date cible de décision au 28/02/2026 — ce serait la première indication spécifique AFRS (9e indication FDA). Nouvel usage du dupilumab, déjà en base pour BPCO et dermatite atopique.","src":[["Regeneron — communiqué phase 3 AFRS (7 novembre 2025, vu)","https://investor.regeneron.com/news-releases/news-release-details/dupixentr-dupilumab-pivotal-trial-met-all-primary-and-secondary/"],["HCPLive — résultats chiffrés ACAAI 2025","https://www.hcplive.com/view/dupilumab-shows-promise-for-allergic-fungal-rhinosinusitis-in-phase-3-trial-with-amber-luong-md-phd"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Patient polypeux sévère sous dupilumab — rappeler l'injection sous-cutanée tous les 14 jours, l'eff 2026 »). Messages lus : entre 2021 et 2025, les données de vigilance (pharmacovigilance, addictovigilance, centres antipoison) montrent une poursuite de l'augmentation des surdoses et effets indésirables graves liés à la méthadone ; l'ANSM demande de prescrire/délivrer systématiquement un kit de naloxone prêt à l'emploi en même temps que la méthadone, de remettre les documents d'information sur la réduction des risques et d'appeler le 15 en cas de suspicion de surdosage.","src":[["ANSM — actualité « Méthadone : l'ANSM rappelle le bon usage… » (21/05/2026)","https://ansm.sante.fr/actualites/methadone-lansm-rappelle-le-bon-usage-de-ces-medicaments-pour-reduire-le-risque-de-surdose-et-dinteractions-medicamenteuses"],["Cespharm — relais du 22/05/2026 (page vue, datée)","https://www.cespharm.fr/prevention-sante/actualites/2026/methadone-l-ansm-rappelle-le-bon-usage-de-ces-medicaments"],["CNOP — relais de l'actualité ANSM","https://www.ordre.pharmacien.fr/les-communications/focus-sur/les-actualites/methadone-l-ansm-rappelle-le-bon-usage-de-ces-medicaments-pour-reduire-le-risque-de-surdoses-et-dinteractions-medicamenteuses"],["Vidal — « Méthadone et risques associés : l'ANSM rappelle le bon usage »","https://www.vidal.fr/actualites/37822-methadone-et-risques-associes-l-ansm-rappelle-le-bon-usage-et-l-interet-de-la-naloxone.html"],["Le Moniteur des pharmacies — « Publié le 21 mai 2026 »","https://www.lemoniteurdespharmacies.fr/therapeutique/vigilances/methadone-un-medicament-efficace-mais-pas-anodin"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"À chaque délivrance de méthadone (sirop ou gélule), vérifier que le patient dispose d'un kit de naloxone (Prenoxad, Ventizolve — délivrables sans ordonnance) et que l'entourage sait l'utiliser ; rappeler les interactions (ne jamais associer aux benzodiazépines sans avis médical, pas d'automédication sédatrice) et l'interdiction de partager le traitement."},{"dom":"Autorisations & Sécurité","type":"Alerte","n":5,"dt":"2025-05","titre":"Tianeptine (« gas station heroin ») : la FDA met en garde contre tout produit à base de tianeptine — avertissement du 08/05/2025","subst":"tianeptine · compléments · addiction aux opioïdes","res":"Avertissement de la FDA daté [5/8/2025] (page fda.gov ouverte : « Content current as of: 05/08/2025 ») : la tianeptine n'est approuvée pour AUCUNE utilisation médicale aux États-Unis, n'est pas reconnue sûre comme ingrédient alimentaire et ne répond pas à la définition d'un ingrédient diététique — elle est pourtant vendue comme complément/« nootropique » ; la FDA rappelle des effets indésirables graves, dont des décès, des doses rencontrées allant de 50 mg à 10 000 mg par jour (lu dans la page FDA). Contexte lu (lettres FDA et presse) : produits type « Neptune's Fix » vendus en supérettes, surnommés « gas station heroin », interdits ponctuellement dans plusieurs États américains. Signalement officinal d'automedication internationale.","src":[["FDA — Drug Safety and Availability : « FDA warns consumers not to purchase or use any tianeptine product due to serious risks » [5/8/2025] (page ouverte)","https://www.fda.gov/drugs/drug-safety-and-availability/fda-warns-consumers-not-purchase-or-use-any-tianeptine-product-due-serious-risks"],["FDA — page consommateurs Tianeptine (chronologie des alertes)","https://www.fda.gov/consumers/health-fraud-scams/tianeptine"],["FDA — New “Gas Station Heroin” Tianeptine Product Trend (lettre aux professionnels)","https://www.fda.gov/consumers/health-fraud-scams/new-gas-station-heroin-tianeptine-product-trend"],["VCU Health — What you need to know about 'gas station heroin'","https://www.vcuhealth.org/news/what-you-need-to-know-about-gas-station-heroin/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Alerte utile face aux achats de compléments « anti-stress/énergie » sur internet ou en voyage aux USA — la tianeptine n'est pas un complément anodin ; en France elle n'est pas autorisée en complément alimentaire (médicament sur ordonnance) ; orienter vers le médecin tout patient qui en rapporte, et penser aux signaux d'usage problématique (craving, sevrage)."},{"dom":"Douleur & Migraine","type":"Médicament","n":2,"dt":"2025-09","titre":"Extrait plein spectre de Cannabis sativa (VER-01/DKJ127) dans la lombalgie chronique : essai de phase 3 (Nature Medicine)","subst":"cannabis médical · extrait plein spectre VER-01 · lombalgie chronique","res":"Essai multicentrique randomisé contre placebo de phase 3 (Karst et al., Hannover Medical School ; Nature Medicine, publié le 29/09/2025 — date lue : Science Media Centre « published in Nature Medicine at 16:00 UK time on Monday 29th September » ; Rheumatology Advisor « published online Sept. 29 » ; 820 adultes, 394 VER-01 vs 426 placebo) : l'extrait plein spectre de cannabis réduit la douleur lombaire chronique vs placebo (baisse moyenne de 0,6 point sur l'échelle numérique en plus du placebo, 7,3 points en plus dans le sous-groupe avec composante neuropathique — chiffres lus sur Rheumatology Advisor), avec amélioration du sommeil et de la fonction, bonne tolérance (surtout GI, cf. essai comparatif Pain and Therapy 2025) et pas de signal d'abus ou de dépendance rapporté (News-Medical lu). Première entrée cannabis médical de la base.","src":[["Nature Medicine — phase 3 VER-01","https://www.nature.com/articles/s41591-025-03977-0"],["Science Media Centre — publié le 29/09/2025","https://www.sciencemediacentre.org/expert-reaction-to-phase-3-trial-of-cannabis-extract-ver-01-for-chronic-low-back-pain/"],["The Pharmaceutical Journal — 820 adultes, publié 29/09/2025","https://pharmaceutical-journal.com/article/news/cannabis-could-be-effective-for-chronic-lower-back-pain-phase-iii-trial-results-suggest"],["Rheumatology Advisor — −0,6 NRS ; −7,3 si composante neuropathique","https://www.rheumatologyadvisor.com/news/cannabis-extract-ver-01-safe-effective-for-chronic-low-back-pain/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le cannabis thérapeutique reste non disponible en pharmacie française (programme expérimental ANSM suspendu) — message utile : les patients qui s'auto-médicamente via cannabidiol/cannabis récréatif ne reproduisent pas un extrait standardisé à dose contrôlée ; ne jamais conseiller en automédication, orienter vers le médecin si douleur chronique rebelle."},{"dom":"Douleur & Migraine","type":"Médicament","n":1,"dt":"2026-05","titre":"L'efficacité analgésique des opioïdes diminue avec la durée de traitement : revue systématique et méta-analyse (British Journal of General Practice)","subst":"opioïdes · lombalgie chronique · arthrose · hyperalgésie","res":"Revue systématique et méta-analyse d'essais randomisés (Froentjes et al., University of Alberta ; Br J Gen Pract, doi 10.3399/BJGP.2025.0705, epub lu sur PubMed « 2026 May 7:BJGP.2025.0705 », PMID 42097637 ; PMC « Collection date 2026 Aug 1 » ; relais Medical Xpress du 14/10/2026) : dans la lombalgie chronique et l'arthrose, les opioïdes apportent un soulagement significatif sur de courtes durées (≤ 4 semaines), mais leur efficacité s'amenuise avec la durée — et au-delà de 12 semaines de douleur chronique, la balance bénéfice/risque se dégrade (« may cause more harm than good » lu sur Medical Xpress).","src":[["PubMed 42097637 — epub 2026 May 7:BJGP.2025.0705","https://pubmed.ncbi.nlm.nih.gov/42097637/"],["British Journal of General Practice — article","https://bjgp.org/content/76/769/e634"],["PMC13531503 — Collection date 2026 Aug 1","https://pmc.ncbi.nlm.nih.gov/articles/PMC13531503/"],["Medical Xpress — Opioids only useful for short-term pain relief (14/10/2026)","https://medicalxpress.com/news/2026-10-opioids-short-term-pain-relief.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Argument concret pour la déprescription d'opioïdes au long cours — si un patient prend du tramadol/codeine depuis des mois pour son dos ou ses genoux, le traitement a probablement épuisé son bénéfice : ne jamais arrêter brutalement (diminuer progressivement avec le médecin), anticiper laxatif + hydratation pendant le traitement, et signaler toute escalade de dose."},{"dom":"Douleur & Migraine","type":"Officine","n":3,"dt":"2026-08","titre":"Ceinture lombaire non rigide dans la lombalgie commune non spécifique : essai randomisé (JAMA Network Open)","subst":"ceinture lombaire · lombalgie non spécifique","res":"Essai randomisé français (Grange, Calmels, Rannou et al. ; JAMA Network Open, doi 10.1001/jamanetworkopen.2026.29793 — communiqué média JAMA daté du 19/08/2026 « 081926 » vu ; PMID 42616499) : ajouter une ceinture lombaire souple et extensible aux soins usuels améliore la douleur et le handicap fonctionnel chez les patients avec lombalgie non spécifique évoluant depuis 1 à 6 mois (conclusion lue : « resulted in improved pain and functional disability… may be considered as a nonpharmacological [option] »). COI lue sur PubMed : les Drs Grange, Calmels et Rannou déclarent des honoraires de Thuasne (fabricant) pour comité scientifique → coi « Industrie ».","src":[["JAMA Network Open — Lumbar Belt for Nonspecific Low Back Pain","https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2853030"],["JAMA Media — communiqué daté 19/08/2026","https://media.jamanetwork.com/media-releases/10.1001/jamanetworkopen.2026.29793"],["PubMed 42616499 (COI Thuasne lus)","https://pubmed.ncbi.nlm.nih.gov/42616499/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La demande de ceinture lombaire au comptoir est fréquente — cet essai apporte un argument d'efficacité sur 1-6 mois d'évolution ; conseil de bon usage : ceinture non rigide en appoint, port limité (pas de dépendance au port permanent), à associer au maintien de l'activité, et pas de substitut à la consultation si radiculalgie/deficit/signes d'alerte."},{"dom":"Rhumatologie","type":"Médicament","n":3,"dt":"2026-01","titre":"RESET-RA : stimulation du nerf vague implantable dans la polyarthrite rhumatoïde réfractaire — essai pivot randomisé sham-contrôlé (Nature Medicine)","subst":"stimulation du nerf vague · polyarthrite rhumatoïde · SetPoint","res":"Essai pivot randomisé, en double aveugle, contre procédure factice (RESET-RA ; 242 patients PR avec réponse insuffisante/intolérance aux biothérapies/csDMARDs ; Nature Medicine, publication annoncée par SetPoint Medical le 05/01/2026 — communiqué daté vu « January 5, 2026 » ; article s41591-025-04114-7 ; relais Healio du 04/02/2026 : ACR20 > 52 % à 12 mois) : le système implantable de stimulation du nerf vague (SetPoint) montre une efficacité durable et un profil de sécurité soutenable dans la PR difficile à traiter ; dispositif autorisé par la FDA le 30/07/2025 (e-sante.fr lu : « La FDA a autorisé le SetPoint System le 30 juillet 2025 »), première thérapie non médicamenteuse validée dans cette indication.","src":[["Nature Medicine — RESET-RA pivotal RCT","https://www.nature.com/articles/s41591-025-04114-7"],["SetPoint Medical — publication annoncée le 05/01/2026","https://setpointmedical.com/landmark-reset-ra-arthritis-study-published-in-nature-medicine/"],["Healio — ACR20 >52 % à 12 mois (04/02/2026)","https://www.healio.com/news/rheumatology/20260204/vagus-nerve-stimulator-shows-ongoing-efficacy-in-rheumatoid-arthritis"],["E-sante.fr — FDA SetPoint 30/07/2025","https://www.e-sante.fr/polyarthrite-rhumatoide-un-implant-pour-reduire-linflammation/actualite/615202"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Information patient pour les PR réfractaires — le dispositif s'adresse à des patients hospitalo-spécialisés ; pas d'impact sur la dispensation courante, mais message utile : la PR bénéficie maintenant de voies non médicamenteuses, à côté des biothérapies ; l'arrêt du fond ne se discute jamais au comptoir même si un implant est posé."},{"dom":"Rhumatologie","type":"Médicament","n":3,"dt":"2026-08","titre":"COMPARE : thérapie CAR-T anti-CD19 (mivocabtagène autoleucel) dans la polyarthrite rhumatoïde séropositive réfractaire — essai de phase 1 (Nature Medicine)","subst":"CAR-T anti-CD19 · polyarthrite rhumatoïde réfractaire","res":"Premier essai clinique de thérapie CAR-T anti-CD19 dans la PR réfractaire (partie phase 1 du phase 1/2 COMPARE, Charité Berlin avec Leiden, Erlangen et DRFZ ; miv-cel = CAR-T autologue entièrement humain ; Nature Medicine, publié le 27/08/2026 — date lue sur le site Charité : « Nature Medicine. Published 27 August 2026 » ; 6 patients arrêtant tout immunosuppresseur, avec dans les relais 3 patients en rémission complète sans traitement lu sur Medisite) : les foyers inflammatoires (PET-IRM) ne sont plus détectables plusieurs mois après l'injection, avec baisse des douleurs et amélioration de la mobilité (Fraunhofer ITMP, vu). Étude préliminaire de petite taille — pas de promesse.","src":[["Nature Medicine — CD19 CAR T phase 1 PR","https://www.nature.com/articles/s41591-026-04603-3"],["Charité — Published 27 August 2026","https://rheumatologie.charite.de/en/metas/news/artikel/detail/zelltherapie_bei_schwerer_rheumatoider_arthritis_erfolgreich_1/"],["Fraunhofer ITMP — PET-IRM, Study published in Nature Medicine","https://www.itmp.fraunhofer.de/en/press/study-published-in-nature-medicine.html"],["Medisite — COMPARE, 3 patients sur 6 en rémission","https://www.medisite.fr/polyarthrite-une-nouvelle-therapie-guerit-completement-3-patients-sur-6.5717963.58.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Vulgarisation d'une avancée de recherche (cellules T « rééduquées » contre le B) — pour les patients PR en impasse thérapeutique, ces thérapies se testent en centre expert ; aucun impact officinal avant plusieurs années, mais connaître l'existence du programme évitera de confondre avec un traitement disponible."},{"dom":"Rhumatologie","type":"Médicament","n":3,"dt":"2025-11","titre":"Firsekibart (anti-IL-1β) en prophylaxie des crises de goutte à l'instauration du traitement hypouricémiant : essai de phase 2 vs colchicine (ACR Open Rheumatology)","subst":"firsekibart · goutte · prophylaxie des flares · anti-IL-1β","res":"Essai randomisé de phase 2, ouvert, multicentrique, contrôlé actif (Yu et al., Huashan Hospital/Fudan, Shanghai ; ACR Open Rheumatol 2025 Nov;7(11):e70111, doi 10.1002/acr2.70111 — citation PubMed lue « 2025 Nov;7(11):e70111 », PMID 41200857) : aux deux doses testées, le firsekibart (anticorps monoclonal IgG4 anti-IL-1β) réduit la proportion de patients avec ≥ 1 crise de goutte pendant l'initiation du traitement hypouricémiant vs colchicine (jusqu'à −90 % de flares sur 12 semaines, lu sur Rheumatology Live), avec profil de tolérance favorable (pas d'EI ayant conduit à l'arrêt, pas d'EI grave lié, lu sur PubMed). Distinct des entrées goutte déjà en base (colchicine vs AINS pour la prophylaxie ; treat-to-target CV EULAR 2025) : ici un candidat « prochaine génération » anti-IL-1β non encore disponible.","src":[["ACR Open Rheumatology — firsekibart phase 2","https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/acr2.70111"],["PubMed 41200857 — 2025 Nov;7(11):e70111","https://pubmed.ncbi.nlm.nih.gov/41200857/"],["Rheumatology Live — firsekibart beats colchicine (nov. 2025)","https://www.rheum-live.com/view/firsekibart-beats-colchicine-gout-flare-prophylaxis-initiating-ult"],["Medscape — New antibody therapy shows promise (2025)","https://www.medscape.com/viewarticle/new-antibody-therapy-shows-promise-preventing-gout-flares-2025a1000x6q"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas de changement de pratique immédiat — la prophylaxie de référence des crises à l'instauration reste colchicine (ou AINS si non contre-indiqués) ; le message reste l'observance du traitement de fond malgré les crises du démarrage."},{"dom":"Rhumatologie","type":"Médicament","n":1,"dt":"2025-05","titre":"Efficacité et sécurité comparées des différents AINS dans l'arthrose : revue systématique et méta-analyse en réseau d'ECR (PLOS One)","subst":"AINS · arthrose · méta-analyse en réseau · choix de molécule","res":"Revue systématique et méta-analyse en réseau fondée sur les ECR (PLOS One 2025 May;20(5) — citation lue sur The Journal of Pharmaceutical Health Sciences : « PLoS One. 2025 May; 20(5) » ; article 10.1371/journal.pone.0320379) comparant les AINS entre eux dans le traitement symptomatique de l'arthrose : les différents AINS (oraux et topiques) ont des profils efficacité/tolérance distincts, sans supériorité écrasante d'une molécule — le choix se fait par patient et profil de tolérance. Angle","src":[["PLOS One — NMA AINS arthrose","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0320379"],["The Journal of Pharmaceutical Health Sciences — citation « PLoS One. 2025 May; 20(5) »","https://www.thejas.com.pk/index.php/pjhs/article/view/3265"],["Frontiers in Medicine — narrative review knee OA (contexte NMA)","https://www.frontiersin.org/journals/medicine/articles/10.3389/fmed.2025.1523027/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Rappel de bon usage — dose minimale efficace, durée la plus courte, réévaluation systématique ; préférence topique (gel/émulgel) pour genou/main, vigilance gastrique/HTA/rénale pour la voie orale, et pas d'association de deux AINS."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2026-05","titre":"Bépirovirsen : guérison fonctionnelle de l'hépatite B chez ~1 patient sur 5 (phase 3, NEJM)","subst":"bepirovirsën · hépatite B · antisens ARN","res":"Deux essais randomisés de phase 3 en double aveugle (B-Well, GSK) publiés dans le NEJM le 28 mai 2026 : après arrêt du traitement antiviral conventionnel, environ 20 % des patients traités par bépirovirsen (oligonucléotide antisens ARN) ont atteint une « guérison fonctionnelle » de l'hépatite B chronique (perte durable de l'AgHBs), contre ~1 %/an historiquement sous analogues nucléosidiques. Chiffres cités uniquement depuis les sources vues (CIDRAP daté 28/05/2026, aidsmap juin 2026). Essai sponsorisé par GSK (co-développeur).","src":[["CIDRAP (28/05/2026)","https://www.cidrap.umn.edu/hepatitis/phase-3-trials-novel-drug-show-functional-cure-20-chronic-hepatitis-b-patients"],["aidsmap (juin 2026)","https://www.aidsmap.com/news/jun-2026/bepirovirsen-leads-functional-cure-one-fifth-people-long-term-hepatitis-b"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Rien ne change aujourd'hui — le bépirovirsen n'est pas approuvé ; les patients hépatite B sous analogues nucléosidiques (ténofovir/entécavir) doivent poursuivre leur traitement quotidien sans interruption, l'observance restant la clé de la prévention de la cirrhose et du carcinome hépatocellulaire."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2026-05","titre":"FUZION : le guselkumab (IL-23) réussit la première phase 3 dans la maladie de Crohn fistulisante périnéale","subst":"guselkumab · Crohn fistulisant périnéal · Tremfya · anti-IL-23","res":"Essai de phase 3 randomisé, en double aveugle vs placebo (FUZION), résultats à 24 semaines présentés au DDW 2026 (Chicago, 2-5 mai 2026) : le guselkumab augmente significativement le taux de rémission combinée des fistules périnéales vs placebo — premier essai randomisé positif d'un inhibiteur d'IL-23 approuvé dans cette localisation. Source vue : communiqué J&J (daté, DDW 2-5 mai 2026) et couvertures HCPLive/Gastroenterology & Hepatology. Sponsor : Janssen/J&J.","src":[["J&J press release (DDW 2026)","https://www.jnj.com/media-center/press-releases/johnson-johnson-study-shows-tremfya-guselkumab-is-the-first-and-only-il-23-inhibitor-to-demonstrate-efficacy-in-perianal-fistulizing-crohns-disease"],["HCPLive","https://www.hcplive.com/view/guselkumab-shows-efficacy-in-perianal-fistulizing-
