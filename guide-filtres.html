"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un âge très avancé ou une fragilité ne justifient pas à eux seuls l'absence d'anticoagulation dans la FA — le risque d'AVC l'emporte souvent ; toute décision d'arrêt appartient au médecin, mais le pharmacien peut signaler une FA connue non anticoagulée."},{"dom":"Cardiologie","type":"Médicament","n":5,"dt":"2025-11","titre":"Milvexian (anti-XIa oral, BMS/J&J) : arrêt du programme LIBREXIA-ACS — LIBREXIA-AF et LIBREXIA-STROKE continuent (communiqué BMS 14/11/2025)","subst":"milvexian · anti-XIa · phase 3 · pipeline anticoagulant","res":"Communiqué BMS du 14/11/2025 (page vue, datée « November 14, 2025 ») : une revue indépendante programmée juge LIBREXIA-ACS peu susceptible d'atteindre son critère principal d'efficacité → essai interrompu ; les études LIBREXIA-AF (FA) et LIBREXIA-STROKE (AVC) continuent, données attendues en 2026. Le milvexian, anti-XIa oral, vise une anticoagulation « découpée » sur la voie du contact (moins de saignements attendus). Aucune entrée base sur le milvexian (asundexian anti-XIa en base = OCEANIC-STROKE, essai différent, nagatif en 2025 ; les deux s'inscrivent dans le même horizon anti-XIa).","src":[["BMS — Update on Phase 3 Librexia ACS Trial (14/11/2025)","https://news.bms.com/news/details/2025/Update-on-Phase-3-Librexia-ACS-Trial/default.aspx"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas d'impact immédiat (aucun produit sur le marché) — information veille utile si des patients posent des questions sur « le futur anticoagulant sans saignements » ; l'anti-XIa n'en est qu'au stade des essais."},{"dom":"Psychiatrie","type":"Médicament","n":2,"dt":"2026-06","titre":"Clozapine après un seul antipsychotique échoué dans la psychose de première épisode : essai randomisé séquentiel (JAMA Psychiatry)","subst":"clozapine","res":"Essai randomisé séquentiel en 2 phases : en phase 2, les patients atteints de psychose de première épisode non-répondeurs après 8 semaines d'un premier antipsychotique (olanzapine, rispéridone, amisulpride, aripiprazole ou périphénazine en phase 1) étaient re-randomisés vers olanzapine, amisulpride ou CLOZAPINE ; la clozapine donne une amélioration supérieure vs olanzapine et amisulpride (JAMA Psychiatry 2026;83(6):570-580, Li et al., PMID 41811299). Argument pour discuter une clozapine plus précoce qu'après « 2 échecs ».","src":[["JAMA Psychiatry (article)","https://jamanetwork.com/journals/jamapsychiatry/article-abstract/2845904"],["PubMed 41811299","https://pubmed.ncbi.nlm.nih.gov/41811299/"],["Wuhan University (Vol 83, No 6, 06.2026, p 570-580)","https://scholars.whu.edu.cn/en/publications/clozapine-after-1-failed-antipsychotic-drug-trial-in-first-episod/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La clozapine impose le suivi hématologique obligatoire (PNN) — rappeler les prises de sang, jamais d'arrêt brutal."},{"dom":"Psychiatrie","type":"Médicament","n":4,"dt":"2026-08","titre":"Clozapine et neutropénie : quand survient le risque ? Cohorte nationale taiwanaise (Lancet Regional Health – Western Pacific)","subst":"clozapine (neutropénie)","res":"Une des plus grandes études en vie réelle de la clozapine (données d'assurance nationale taiwanaise 2014-2023, nouveaux utilisateurs et ré-introductions après interruption ≥42 j) : la neutropénie est peu fréquente et CONCENTRÉE juste après l'initiation, avec un risque stratifié par l'état hématologique de base et l'âge ; les résultats soutiennent des stratégies de monitorage « risk-informed » plutôt qu'une peur indifférenciée de la molécule (Lancet Reg Health West Pac 2026 Aug 22;74:101970, PMID 42668593, National Health Research Institutes, Taïwan ; Medscape : « published online on August 22 »).","src":[["The Lancet Regional Health – Western Pacific (fulltext)","https://www.thelancet.com/journals/lanwpc/article/PIIS2666-6065(26)00174-4/fulltext"],["PubMed 42668593 ubstitue jamais à un accompagnement psychothérapeutique."},{"dom":"Psychiatrie","type":"Officine","n":4,"dt":"2026-05","titre":"Co-usage cannabis + tabac et transition vers la psychose chez les jeunes à haut risque clinique : étude multisite (Nature Mental Health)","subst":"cannabis · tabac (co-usage, psychose)","res":"Étude multisite sur cohortes de jeunes à haut risque clinique de psychose (Bello et al., Nature Mental Health, epub 12 mai 2026, doi 10.1038/s44220-026-00648-y, PMID 42291778 ; communiqué Vanderbilt du 12/05/2026) : le co-usage de cannabis et de tabac prédit un risque accru de transition psychotique ; l'usage important de cannabis combiné à un tabagisme léger est associé à un risque ≈ TRIPLÉ de psychose vs non-usagers. Usage distinct de l'entrée cannabis-douleur en attente (VER-01) et de la future dose addicto : ici le lien cannabis-tabac-psychose.","src":[["Nature Mental Health (s44220-026-00648-y)","https://www.nature.com/articles/s44220-026-00648-y"],["PubMed 42291778 (Epub 2026 May 12)","https://pubmed.ncbi.nlm.nih.gov/41001470"],["Vanderbilt Health News (12/05/2026)","https://news.vumc.org/2026/05/12/cannabis-and-tobacco-co-use-increases-psychosis-chances-in-high-risk-cohorts-study/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Arrêter le tabac et le cannabis ensemble chez un jeune patient vulnérable n'est pas « deux conseils » séparés — c'est le même message de prévention."},{"dom":"Psychiatrie","type":"Médicament","n":1,"dt":"2025-04","titre":"Sécurité cardiovasculaire comparée des médicaments du TDAH : méta-analyse en réseau de 102 essais (The Lancet Psychiatry)","subst":"médicaments du TDAH (sécurité CV)","res":"Revue systématique et méta-analyse en réseau (Lancet Psychiatry 2025, Farhat, Cortese et al., 102 essais, 22 702 patients, enfants/adolescents/adultes) : les médicaments du TDAH (stimulants et non-stimulants) ont des effets de PETITE amplitude sur la tension artérielle et la fréquence cardia :"PSA · dépistage · cancer de la prostate · ERSPC","res":"Suivi à très long terme de l'European Randomized Study of Screening for Prostate Cancer (ERSPC) publié dans le NEJM le 29 octobre 2025 (date lue : ecancer « published in the New England Journal of Medicine… on 29 October » ; BMJ news « Published 30 October 2025 ») : la mortalité spécifique par cancer de la prostate est 13 % plus basse dans le groupe dépistage après un suivi médian de 23 ans, le bénéfice croissant avec le temps, relance le débat sur un programme organisé (titres lus BMJ/ecancer/news-medical ; chiffre 13 % lu dans plusieurs sources concordantes). Aucune entrée dépistage PSA en base (seul le poids dans le psoriasis et l'hormonothérapie y figurent).","src":[["BMJ — PSA screening cuts cancer mortality by 13% (Published 30 October 2025)","https://www.bmj.com/content/391/bmj.r2288"],["ecancer — publication NEJM du 29 octobre 2025, suivi 23 ans","https://ecancer.org/en/news/27208-long-term-european-study-confirms-psa-screening-saves-lives-deaths-from-prostate-cancer-13-lower-after-23-years"],["news-medical — ERSPC 23 ans, 13 % de mortalité en moins (30/10/2025)","https://www.news-medical.net/news/20251030/Study-confirms-PSA-screening-improves-survival-and-safety.aspx"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Question fréquente au comptoir des hommes de 55-69 ans — le PSA reste un choix partagé : un dosage peut réduire le risque de mourir d'un cancer de la prostate, mais au prix de surdiagnostics et de biopsies ; le message honnête est d'en discuter avec le médecin (et en France, pas de dépistage organisé à ce jour)."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2025-11","titre":"Rifaximine vs régime pauvre en FODMAP dans le syndrome de l'intestin irritable : essai randomisé comparatif direct (Alimentary Pharmacology & Therapeutics)","subst":"rifaximine · FODMAP · SII · microbiote","res":"Essai randomisé comparant la rifaximine au régime pauvre en FODMAP dans le SII (Malaisie, inclusion juin 2021-novembre 2024 ; PubMed 42025708 ; Alimentary Pharmacology & Therapeutics, doi 10.1111/apt.70420 ; Medscape : « November 06, 2025 » — chaque option n'étant efficace que chez <50 % des patients SII, d'où la comparaison directe). Résultats détaillés non lisibles dans les extraits (ScienceDirect/Wiley bloqués) → design et question décrits sans invention ; une lettre éditoriale d'APT (doi 10.1111/apt.70553) note que « rifaximin et le régime LFD ont montré une efficacité globale comparable », en soutenant une approche pragmatique centrée patient. Aucune entrée rifaximine ni FODMAP en base.","src":[["PubMed 42025708 — essai randomisé rifaximine vs LFD","https://pubmed.ncbi.nlm.nih.gov/42025708/"],["Alimentary Pharmacology & Therapeutics — doi 10.1111/apt.70420","https://onlinelibrary.wiley.com/doi/10.1111/apt.70420"],["APT — lettre éditoriale (efficacité globale comparable)","https://onlinelibrary.wiley.com/doi/10.1111/apt.70553"],["Medscape — Which Works Better for IBS (November 06, 2025)","https://www.medscape.com/viewarticle/which-works-better-ibs-rifaximin-or-low-fodmap-diet-2025a1000um7"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Deux options de 2e ligne du SII après règles hygiéno-diététiques — la rifaximine (AMM SII en France) et le régime FODMAP (avec diététicien) ; la comparaison suggère qu'aucune n'est universellement supérieure, le choix suit le profil du patient (préférence alimentaire vs traitement médicamenteux)."},{"dom":"Urologie & santé masculine","type":"Complément alimentaire","n":2,"dt":"2025-09","titre":"SUMMER : un supplément antioxydant très commercialisé (Impryl) n'améliore PAS la grossesse chez l'homme infertile — et même le contraire (JAMA Network Open)","subst":"antioxydants · infertilité masculine · Impryl · grossesse","res":"Essai randomisé triple-aveugle vs placebo (SUMMER, JAMA Network Open — article 2839329 ; couverture news-medical du 28/09/2025, EMJ Reviews, Progress Educational Trust) : 1 171 hommes de 18-50 ans consultant pour fertilité dans 21 hôpitaux/cliniques néerlandais, randomisés entre supplément antioxydant (Impryl) et placebo : pas d'amélioration du taux de grossesse en cours sous Impryl — le taux était même significativement plus bas (lu : « pregnancy success was significantly lower », news-medical), sans bénéfice sur la qualité du sperme. Message inversé par rapport au discours commercial « antioxydants = fertilité ».","src":[["JAMA Network Open — SUMMER trial (article 2839329)","https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2839329"],["news-medical — 28/09/2025, grossesse significativement plus basse sous Impryl","https://www.news-medical.net/news/20250928/Clinical-trial-disproves-claims-that-antioxidant-supplement-boosts-male-fertility.aspx"],["EMJ Reviews — 21 centres, 1 171 hommes","https://www.emjreviews.com/reproductive-health/news/antioxidant-supplements-do-not-boost-male-fertility/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Face à un homme (ou un couple) qui demande « un complément pour la fertilité », la réponse honnête est qu'aucun complément antioxydant n'a démonché améliorer les chances de grossesse — ce grand essai est négatif ; les leviers validés restent l'arrêt du tabac/alcool, le poids et la prise en charge médicale du couple."},{"dom":"Urologie & santé masculine","type":"Médicament","n":3,"dt":"2026-03","titre":"Dénosumab dans l'oligospermie sévère : pas de bénéfice sur la concentration spermatique (essai randomisé, Journal of Clinical Endocrinology & Metabolism)","subst":"dénosumab · oligospermie · RANKL · infertilité masculine","res":"Essai randomisé en double aveugle vs placebo (Yahyavi et al., JCEM, Volume 111, Issue 3 — citation « 111/3/e877 » lue sur la page Oxford ; PubMed 40858297 ; dose unique 60 mg sous-cutanée) : chez les hommes en oligospermie sévère sélectionnés par AMH et taille testiculaire, le dénosumab (anti-RANKL, utilisé dans l'ostéoporose) n'a pas augmenté la concentration spermatique ni modifié les hormones reproductives vs placebo (résultat négatif lu dans la couverture Medscape : « did not increase sperm concentrations ») ; il suivait une piste issue d'un modèle murin et d'un précédent petit essai (Fertility and Sterility, juillet 2025, hommes sélectionnés par AMH). Premier essai du genre en base.","src":[["JCEM — article 111/3 (Volume 111, Issue 3, mars 2026)","https://academic.oup.com/jcem/article-abstract/111/3/e877/8242005"],["PubMed 40858297","https://pubmed.ncbi.nlm.nih.gov/40858297/"],["Medscape — pas d'augmentation de la concentration spermatique","https://www.medscape.com/viewarticle/osteoporosis-drug-shows-no-benefit-male-infertility-2025a1000mvb"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Aucun traitement médicamenteux validé de l'oligospermie sévère ne passe par l'officine — pas de « médicament de la fertilité » à proposer ; orienter vers le centre d'AMP, et si le patient prend déjà des compléments « fertilité », rappeler que la grande étude SUMMER (en base) est négative."},{"dom":"Nutrition & Compléments","type":"Complément alimentaire","n":3,"dt":"2026-07","titre":"Vitamine D3 4000 UI/j pendant 8 semaines : pas d'amélioration supplémentaire de la vitesse ni de la puissance chez des footballeuses professionnelles (RCT, Nutrients)","subst":"vitamine D · sport · performance · footballeuses","res":"Essai randomisé en double aveugle (Nutrients 2026, 18(15):2460 — page MDPI vue : « 28 July 2026 » ; académiciennes de sport professionnelles en Pologne) : 4000 UI/j de vitamine D3 pendant 8 semaines n'ont pas amélioré davantage la vitesse ni la puissance par rapport au placebo, chez des athlètes dont le statut de base était suffisant (extraits lus : « not associated with further improvements in speed or power performance »). Nouvel usage sportif de la vitamine D (en base : fractures/chutes du senior, blessures militaires — pas la performance féminine).","src":[["MDPI Nutrients 2026, 18(15), 2460 — Published 28 July 2026 (page ouverte)","https://www.mdpi.com/2072-6643/18/15/2460"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La vitamine D « pour la perf » ne se justifie pas si le statut est déjà correct — corriger une carence oui (dosage sanguin), surdoser « pour gagner » non ; l'essai est honnête : aucun bénéfice mesurable sur vitesse/puissance chez des joueuses suffisantes."},{"dom":"Dermatologie & peau","type":"Médicament","n":2,"dt":"2026-06","titre":"Zasocitinib (TYK2 de nouvelle génération) vs deucravacitinib en face-à-face : supériorité sur tous les critères dans le psoriasis en plaques (phase 3 LATITUDE Atlas, Takeda)","subst":"zasocitinib · deucravacitinib · TYK2 · psoriasis · oral","res":"Résultats topline de l'essai de phase 3 randomisé, multicentrique, en double aveugle LATITUDE Atlas (TAK-279-PsO-3004) comparant le zasocitinib oral une fois par jour au deucravacitinib chez l'adulte psoriasis en plaques modéré à sévère (communiqué Takeda du 11 juin 2026 — date lue sur la page) : supériorité statistique du zasocitinib sur tous les critères principaux et secondaires clés ; plus de 35 % des patients sous zasocitinib ont atteint la clairance cutanée complète (PASI 100) à la semaine 16, soit plus de 2,5 fois le taux du deucravacitinib ; profil de sécurité cohérent avec les études précédentes, pas de nouveau signal. Pas d'entrée TYK2/psoriasis oral en base.","src":[["Takeda — communiqué du 11 juin 2026 (page ouverte)","https://www.takeda.com/newsroom/newsreleases/2026/zasocitinib-outperforms-deucravacitinib-study/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le psoriasis modéré-sévère passe à l'ère des inhibiteurs TYK2 oraux (deucravacitinib déjà approuvé, zasocitinib investigational) — au comptoir : observance de la prise orale quotidienne, pas d'arrêt brutal, vaccination à jour avant immunosuppression et signalement de toute infection."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":3,"dt":"2025-11","titre":"Hépatite B chronique : l'élébsiran (siRNA) + PEG-IFNα améliore la perte d'AgHBs vs interféron seul — un pas vers la « cure fonctionnelle » (phase 2 ENSURE, Nature Medicine)","subst":"élébsiran · siRNA · hépatite B · AgHBs · cure fonctionnelle","res":"Essai de phase 2 partiellement randomisé, ouvert (ENSURE, Nature Medicine, publication annoncée le 07/11/2025 — PR Newswire/Manila Times daté ; PubMed 41203919 ; doi 10.1038/s41591-025-04049-z) : l'association élébsiran (petit ARN interférent) + PEG-IFNα améliore les taux de perte de l'antigène HBs (AgHBs) comparé au PEG-IFNα seul dans l'hépatite B chronique, et une réponse antérieure au vaccin thérapeutique BRII-179 était associée à de meilleurs résultats (extraits lus sur Nature Medicine/PubMed). Complément : la combinaison tobevibart + élébsiran (essai MARCH, phase 2) a atteint une perte d'AgHBs indétectable à 24 semaines post-traitement chez 17-21 % des participants à AgHBs de base <1 000 UI/mL (Contagion Live, 12/05/2025 — chiffres lus). Aucune entrée hépatite B en base.","src":[["Nature Medicine — Elebsiran and PEG-IFNα, phase 2 (ENSURE)","https://www.nature.com/articles/s41591-025-04049-z"],["PubMed 41203919","https://pubmed.ncbi.nlm.nih.gov/41203919/"],["PR Newswire/Manila Times — publication annoncée le 07/11/2025","https://www.manilatimes.net/2025/11/07/tmt-newswire/pr-newswire/brii-biosciences-announces-publication-of-phase-2-ensure-study-results-in-nature-medicine/2218960"],["Contagion Live — MARCH tobevibart+élébsiran, 17-21 % (12/05/2025)","https://www.contagionlive.com/view/vir-biotechnology-announces-results-of-its-potential-hepatitis-b-cure-combination-therapy"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les patients porteurs chroniques du VHB (ténofovir/entécavir au long cours), le traitement suppressif oral reste la règle — la « cure fonctionnelle » (perte d'AgHBs) progresse en essais mais n'est pas encore un standard ; poursuivre l'observance du nucléos(t)ide sans interruption et rappeler la surveillance hépatique."},{"dom":"Douleur & Migraine","type":"Médicament","n":3,"dt":"2026-07","titre":"Phloroglucinol vs diclofénac dans la colique néphrétique par calcul urétéral : essai randomisé monocentrique chinois (Frontiers in Pain Research)","subst":"phloroglucinol · diclofénac · colique néphrétique · calcul urétéral","res":"Essai prospectif randomisé monocentrique (Front. Pain Res., publié le 16 juillet 2026 — date lue sur la page ouverte ; Gong, Shao et al., Shandong) comparant l'efficacité antalgique du phloroglucinol (antispasmodique NON atropinique, très utilisé en France, y compris en automédication) et du diclofénac sodique dans la colique néphrétique sur calcul urétéral. Résultats détaillés non lisibles dans l'extraits de la page → design et question décrits sans invention. Complément de l'entrée AINS/colique (Cochrane 2025, en base) : ici l'angle est l'antispasmodique français de référence vs AINS.","src":[["Frontiers in Pain Research — publié le 16/07/2026 (page ouverte)","https://www.frontiersin.org/journals/pain-research/articles/10.3389/fpain.2026.1877482/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'AINS reste l'antalgique de référence documenté de la colique néphrétique ; le phloroglucinol est très demandé — cet essai teste précisément la comparaison, en attendant la lecture complète, ne pas remplacer un AINS par un antispasmodique sans avis médical si douleur intense (orientation urgente si fièvre/vomissements)."},{"dom":"Dermatologie & peau","type":"Médicament","n":2,"dt":"2025-03","titre":"Alopécie areata sévère de l'adolescent (12-17 ans) : le baricitinib donne une repousse quasi complète du cuir chevelu à un an (BRAVE-AA-PEDS, phase 3)","subst":"baricitinib · alopécie areata · adolescent · JAK","res":"Essai de phase 3 chez l'adolescent (BRAVE-AA-PEDS, Lilly/Incyte — communiqué PR Newswire daté du 8 mars 2025 : « near-complete scalp hair regrowth at one year » ; Healio, 09/03/2025, congrès AAD Orlando : à 36 semaines, le baricitinib oral quotidien a entraîné une repousse plus importante du cuir chevelu, des sourcils et des cils vs placebo chez les 12-<18 ans en alopécie areata sévère).","src":[["PR Newswire — Lilly, 8 mars 2025, repousse quasi complète à 1 an","https://www.prnewswire.com/news-releases/lillys-baricitinib-delivered-near-complete-scalp-hair-regrowth-at-one-year-for-adolescents-with-severe-alopecia-areata-in-phase-3-brave-aa-peds-trial-302593426.html"],["Healio — 09/03/2025 (AAD), 36 semaines vs placebo","https://www.healio.com/news/dermatology/20250309/baricitinib-effective-in-adolescents-with-severe-alopecia-areata-phase-3-data-show"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour un ado sous baricitinib (Olumiant, AMM alopécie areata sévère de l'adulte — la population adolescente suit les recommandations du prescripteur) : observance quotidienne orale, surveillance infectieuse, et accompagnement psychologique de cette pathologie très vécue à cet âge ; jamais d'arrêt brutal sans avis."},{"dom":"Ophtalmologie","type":"Complément alimentaire","n":3,"dt":"2026-06","titre":"Oméga-3 ré-estérifiés (rTG) vs huile de pépins de raisin dans la sécheresse oculaire avec dysfonction des glandes de Meibomius : pas de supériorité (RCT, JAMA Ophthalmology)","subst":"oméga-3 · sécheresse oculaire · glandes de Meibomius · rTG","res":"Essai randomisé multicentrique en double aveugle, 132 patients, 12 semaines (JAMA Ophthalmology — couverture Eyewire+ datée du 26/06/2026, chiffres lus) : la supplémentation en oméga-3 sous forme ré-estérifiée (rTG) n'a pas été supérieure à l'huile de pépins de raisin pour améliorer les symptômes de sécheresse oculaire associée à la dysfonction des glandes de Meibomius (MGD) ; les deux groupes ont amélioré leur score OSDI de façon cliniquement pertinente, tolérance excellente. Nuance d'usage par rapport à l'entrée méta « oméga-3 sécheresse oculaire » en base : ici la forme rTG, l'étiologie MGD et un comparateur actif.","src":[["Eyewire+ — 26/06/2026, 132 patients, JAMA Ophthalmology (chiffres lus)","https://eyewire.news/news/study-examines-re-esterified-omega-3-supplements-for-dry-eye-associated-with-meibomian-gland-dysfunction"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les oméga-3 restent une option douce de la sécheresse oculaire mais l'essai tempère l'enthousiasme selon l'étiologie (MGD) et la formulation — le conseil de base reste les larmes artificielles sans conservateur, la mécanique palpébrale (warm mask), et l'hygiène des paupières avant le rayon compléments."},{"dom":"ORL & stomatologie","type":"Officine","n":2,"dt":"2025-11","titre":"Acouphènes chroniques : traitement combiné (TCC + appareillage + thérapie sonore) vs traitements seuls — grand essai randomisé international (Nature Communications)","subst":"acouphènes · TCC · thérapie sonore · combinaison","res":"Essai randomisé contrôlé international multicentrique, bras parallèles, de supériorité (Schoisswohl, Basso et al., Université de Ratisbonne ; Nature Communications (2025) 16:10510 — « November 2025 » lu sur ResearchGate ; doi 10.1038/s41467-025-66165-1) comparant le traitement combiné (thérapie cognitivo-comportementale, appareils auditifs/conseil, thérapie sonore par application) aux traitements pris isolément dans l'acouphène chronique — le résumé affirme que l'essai montre un résultat sur le bénéfice de la combinaison (début de conclusion lu : « the authors show, in a multicentre randomised trial, that combination… », fin non lisible dans les extraits → direction exacte du résultat non inventée). Première entrée acouphènes en base.","src":[["Nature Communications — s41467-025-66165-1","https://www.nature.com/articles/s41467-025-66165-1"],["ResearchGate — PDF, Nature Communications November 2025, 16(1):10510","https://www.researchgate.net/publication/397857498_Single_versus_combination_treatment_in_tinnitus_an_international_multicentre_parallel-arm_superiority_randomised_controlled_trial"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Derrière une demande « j'ai un acouphène chronique », aucune goutte ni complément n'a de preuve — les approches documentées sont non médicamenteuses (TCC, thérapie sonore, audition) ; orientation ORL/audioprothésiste et hygiène du sommeil, sans promettre de « pilule anti-acouphène »."},{"dom":"Diabète & Endocrinologie","type":"Médicament","n":5,"dt":"2026-09","titre":"Onswik (insuline efsitora alfa) : la FDA approuve la seconde insuline basale hebdomadaire — 24 septembre 2026 (Lilly)","subst":"efsitora alfa · Onswik · insuline hebdomadaire · DT2","res":"Autorisation FDA (Lilly, communiqué ; Medscape daté du 24/09/2026 : « FDA Approves Efsitora Once-Weekly Basal Insulin Injection ») : Onswik (insuline efsitora alfa) en injection sous-cutanée une fois par semaine pour le DT2 de l'adulte — base sur les essais de phase 3 QWINT (dont QWINT-4 vs glargine U100, citation lue dans le communiqué Lilly). Deuxième insuline hebdomadaire après l'icodec (Awiqli, en base) : le champ des insulines basales longues se consolide.","src":[["Eli Lilly — FDA approves Onswik (insulin efsitora alfa-gobe)","https://investor.lilly.com/news-releases/news-release-details/us-food-and-drug-administration-fda-approves-lillys-onswiktm"],["Medscape — 24/09/2026, FDA Approves Efsitora","https://www.medscape.com/viewarticle/fda-approves-efsitora-once-weekly-basal-insulin-injection-2026a1000zq4"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Si le prescripteur passe un patient à l'efsitora hebdomadaire — jour fixe de la semaine à noter sur la boîte et l'agenda du patient, jamais de double dose en cas d'oubli (contacter le médecin), surveillance des hypoglycémies à l'instauration, et rappel que l'insuline rapide reste quotidienne si trithérapie basale-bolus ; pas encore disponible en France (évaluation européenne à suivre)."},{"dom":"Seniors & polymédication","type":"Complément alimentaire","n":3,"dt":"2026-01","titre":"Supplémentation riche en leucine et haute en protéines chez le senior sarcopénique : essai randomisé (European Journal of Nutrition)","subst":"leucine · protéines · sarcopénie · senior","res":"Essai randomisé contrôlé (European Journal of Nutrition, s00394-025-03845-0 — dates lues sur ResearchGate : « Received: 6 November 2024 / Accepted: 25 September 2025 / Published online: 2 January 2026 » ; seniors sarcopéniques ou à risque, Malaisie/Klang) évaluant l'effet d'une supplémentation riche en leucine et haute en protéines sur la composition corporelle, la fonction musculaire et l'expression génique. Résultats détaillés non lus dans les extraits (Springer bloqué) → design décrit sans invention. Complète l'axe « protéines du senior » de la base (méta-analyse, revues — ici un ECR récent ciblé leucine).","src":[["European Journal of Nutrition — s00394-025-03845-0","https://link.springer.com/article/10.1007/s00394-025-03845-0"],["ResearchGate — PDF, Published online 2 January 2026","https://www.researchgate.net/publication/399405910_Efficacy_of_leucine-rich_high_protein_supplementation_on_body_composition_and_muscle_function_among_older_adults_with_sarcopenia_a_randomized_controlled_trial"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La réponse sarcopénique est l'entraînement de résistance + protéines suffisantes à chaque repas (~20-25 g riches en leucine) ; les compléments hyperprotéinés enrichis en leucine sont une aide pratique si l'alimentation est insuffisante — pas un substitut à l'activité physique, qui reste le moteur de l'effet."},{"dom":"Gastro-entérologie & Hépatologie","type":"Médicament","n":2,"dt":"2025-07","titre":"Rectocolite hémorragique : l'obefazimod (miR-124 enhancer oral, biotech française Abivax) réussit les DEUX essais de phase 3 d'induction ABTECT (8 semaines)","subst":"obefazimod · ABTECT · rectocolite · miR-124 · Abivax","res":"Résultats topline des deux essais de phase 3 ABTECT-1 et ABTECT-2 (communiqué Abivax du 22 juillet 2025 — date lue sur GlobeNewswire/HCPLive) : l'obefazimod, activateur oral du miR-124 (first-in-class, développé par la biotech française Abivax), a atteint le critère principal FDA de rémission clinique à la semaine 8 aux doses de 50 mg une fois par jour dans les deux essais de phase 3 d'induction dans la rectocolite hémorragique modérée à sévère (lu : « met its FDA primary endpoint of clinical remission at week 8 in the 50 mg once-daily dose regimens ») ; essai de maintien attendu ensuite. Distinct du tulisokibart ATLAS-UC (déjà en base).","src":[["Abivax — communiqué GlobeNewswire du 22/07/2025","https://www.globenewswire.com/news-release/2025/07/22/3119843/0/en/Abivax-Announces-Positive-Phase-3-Results-from-Both-ABTECT-8-Week-Induction-Trials-Investigating-Obefazimod-its-First-in-Class-Oral-miR-124-Enhancer-in-Moderate-to-Severely-Active-.html"],["HCPLive — rémission clinique S8, 50 mg qd (22/07/2025)","https://www.hcplive.com/view/obefazimod-meets-primary-endpoint-phase-3-abect-program-ulcerative-colitis"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Option ORALE de la RCH en préparation — un pas pour les patients intolérants aux biothérapies injectables ; l'AMM européenne reste à venir (dossier à suivre) ; en attendant, le conseil sur les 5-ASA oraux et topiques, la observance et la surveillance sanguine reste le quotidien de l'officine."},{"dom":"Cardiologie","type":"Officine","n":4,"dt":"2025-09","titre":"Dépistage ciblé de la fibrillation auriculaire : la combinaison modèle de risque + patch ECG chez les 65 ans et plus (CONSIDERING-AF, essai randomisé suédois, EP Europace)","subst":"fibrillation auriculaire · dépistage · patch ECG · modèle de risque","res":"Essai randomisé suédois (CONSIDERING-AF, EP Europace 2025 Sep 1;27(9):euaf190 — citation PubMed 40842182 lue : « 2025 Sep 1;27(9):euaf190 » ; 2 960 randomisés, analyse en intention d'inviter) : dépistage systématique de la FA par phénotypage détaillé avec un modèle de prédiction de risque combiné à un patch ECG chez les 65 ans et plus ; critère principal = incidence de FA à 6 mois (méthodes lues) — complément du patch ECG par courrier d'AMALFI (déjà en base), ici l'angle du ciblage par score de risque avant patch.","src":[["EP Europace — 27(9):euaf190 (2025)","https://academic.oup.com/europace/article/27/9/euaf190/8239532"],["PubMed 40842182 — 2025 Sep 1;27(9):euaf190","https://pubmed.ncbi.nlm.nih.gov/40842182/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le dépistage opportuniste de la FA à l'officine (prise de pouls, tensiomètre à détection FA) reste pertinent chez le senior — les essais récents affinent QUI cibler (65 ans et plus, à risque) ; tout pouls irrégulier détecté au comptoir = orientation médicale avec tracé ECG, sans alarmer (la FA asymptomatique détectée se discute avec le médecin)."},{"dom":"Gastro-entérologie & Hépatologie","type":"Complément alimentaire","n":3,"dt":"2025-06","titre":"MICI en rémission avec symptômes type intestin irritable : un probiotique à 4 souches améliore les symptômes (essai train-IBD, World Journal of Gastrointestinal Pharmacology and Therapeutics)","subst":"probiotiques · MICI · syndrome intestin irritable · rémission","res":"Essai randomisé (train-IBD, World J Gastrointest Pharmacol Ther 2025 Jun 5;16(2):101268 — citation PubMed 40575360 lue : « 2025 Jun 5;16(2):101268 » ; Fennessy et al., Tallaght, Irlande) : chez les patients atteints de MICI (Crohn, RCH) SANS inflammation active (calprotectine négative) mais avec des symptômes fonctionnels type syndrome de l'intestin irritable, un probiotique à 4 souches a un effet positif sur ces symptômes (titre et extrait lus : « exerts a positive effect on irritable bowel syndrome symptoms occurring in inflammatory bowel diseases in absence of inflammation »). Nouvel usage des probiotiques (en base : diarrhée antibiotique, SII, dermatite atopique, halitose) — ici la population MICI en rémission, piège fréquent au comptoir.","src":[["WJGPT — 2025 Jun 5;16(2):101268 (page vue)","https://www.wjgnet.com/2150-5349/full/v16/i2/101268.htm"],["PubMed 40575360 — citation 2025 Jun 5","https://pubmed.ncbi.nlm.nih.gov/40575360/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Ne pas confondre « symptômes de MICI en rémission » (mucus, ballonnements, selles irrégulières = phénomène fonctionnel, où un essai probiotique est positif) et « poussée de MICI » (selles sanglantes, fièvre, douleur = avis médical urgent, pas de complément) ; vérifier avec le patient sa calprotectine avant de conseiller."},{"dom":"Allergologie","type":"Médicament","n":2,"dt":"2025","titre":"Comprimé SLIT acariens (SQ-HDM) chez l'enfant de 5-17 ans avec asthme allergique insuffisamment contrôlé : essai de phase 3 (Allergy)","subst":"SLIT acariens · SQ-HDM · asthme allergique enfant","res":"Essai randomisé de phase 3 (Allergy, Roberts et al., publication 2025 — mois exact non lisible, Wiley bloqué ; couverture HCPLive datée du 09/12/2025) : le comprimé sublingual d'immunothérapie acariens (SQ-HDM 12 SQ) chez l'enfant de 5-17 ans avec asthme allergique insuffisamment contrôlé est bien toléré, avec un profil de sécurité similaire à celui établi chez l'adulte ; le critère principal (réduction des exacerbations) est fragilisé par la chute des taux d'exacerbations liée à la période COVID, et des variations d'IgE/IgG4 spécifiques suggèrent un effet immunologique. Élargit la place pédiatrique de la SLIT (déjà en base : gouttes SLIT, SLIT vie réelle, umbrella AIT).","src":[["Wiley Allergy — essai de phase 3 SQ-HDM enfants (vu en résultats, « Roberts - 2025 - Allergy »)","https://onlinelibrary.wiley.com/doi/10.1111/all.70073"],["HCPLive — couverture datée du 9 décembre 2025","https://www.hcplive.com/view/house-dust-mite-slit-tablet-well-tolerated-in-children-allergic-asthma"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Conseil de conservation du comprimé sous la langue jusqu'à dissolution complète, premier comprimé sous supervision médicale, et coordination avec les corticoïdes inhalés — pas d'arrêt du fond."},{"dom":"Dermatologie & peau","type":"Médicament","n":2,"dt":"2026-01","titre":"Remibrutinib dans l'urticaire chronique spontanée : résultats à 52 semaines des deux essais de phase 3","subst":"remibrutinib · BTKi oral · urticaire chronique spontanée · REMARK","res":"Résultats poolés à 52 semaines des essais de phase 3 REMARK-1/2 : le remibrutinib (inhibiteur oral de BTK, Novartis) montre une efficacité durable et un profil de sécurité favorable chez les patients UCS restant symptomatiques malgré les antihistaminiques H1 de 2e génération (extrait PubMed : « sustained efficacy and a consistent, favorable long-term safety profile », JACI 2026 Jan;157, PMID 41115533). Premier traitement oral ciblé de l'UCS, approuvé par la FDA (Rhapsido, communiqué Novartis, sept. 2025).","src":[["PubMed — JACI 2026 Jan (PMID 41115533)","https://pubmed.ncbi.nlm.nih.gov/41115533/"],["JACI — Remibrutinib 52-week results","https://www.jacionline.org/article/S0091-6749(25)01033-4/fulltext"],["AJMC — FDA approves remibrutinib","https://www.ajmc.com/view/fda-approves-remibrutinib-for-chronic-spontaneous-urticaria"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'urticaire chronique reste d'abord traitée par antihistaminiques H1 de 2e génération (jusqu'à 4× la dose selon les recos EAACI) ; le remibrutinib arrive comme option orale ciblée de 2e ligne hospitalière — expliquer aux patients qu'un traitement de fond régulier vaut mieux qu'une cortisone orale en cure courte, inefficace et délétère."},{"dom":"Dermatologie & peau","type":"Médicament","n":2,"dt":"2026-04","titre":"Dupilumab dans l'urticaire chronique spontanée : essais randomisés de phase 3 LIBERTY-CSU CUPID (nouvel usage, l'indication BPCO est déjà en base)","subst":"dupilumab · LIBERTY-CSU CUPID · urticaire chronique spontanée · anti-IL-4Rα","res":"Publication poolée des essais de phase 3 LIBERTY-CSU CUPID (JAMA Dermatol 2026;162(4):350-358) : le dupilumab réduit significativement l'activité de l'urticaire et le prurit chez les patients UCS non contrôlés par antihistaminiques H1, avec amélioration de la qualité de vie (reprise du résumé de l'article et du Year in Review Dermatology Times). AMM européenne obtenue dans l'UCS modérée à sévère de l'adulte et de l'adolescent ≥ 12 ans (Revue Reso-dermatologie, 05/07/2026). NOUVELLE INDICATION : le dupilumab figure déjà en base pour la BPCO (BOULEWARD), la DA et la rhinosinusite fongique — cette entrée couvre l'UCS uniquement.","src":[["JAMA Dermatology — LIBERTY-CSU CUPID (2026;162(4))","https://doi.org/10.1001/jamadermatol.2025.6023"],["Dermatology Times — 2025 Year in Review CSU","https://www.dermatologytimes.com/view/dermatology-times-2025-year-in-review-chronic-spontaneous-urticaria"],["Reso-dermatologie — Urticaire chronique (05/07/2026)","https://www.reso-dermatologie.fr/2026/07/05/urticaire-chronique/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les patients sous dupilumab, rappeler l'administration toutes les 2 semaines en sous-cutané, la gestion des réactions au point d'injection, et qu'une conjonctivite peut survenir — orienter si œil rouge persistant."},{"dom":"Dermatologie & peau","type":"Médicament","n":5,"dt":"2025-10","titre":"Topical steroid withdrawal (TSW) : premier consensus Delphi international pour la prise en charge","subst":"dermocorticoïdes · topical steroid withdrawal · corticophobie · Delphi","res":"Étude Delphi internationale (Dermatitis, en ligne le 15/10/2025, PMID 41090229) : 12 critères de résultats validés par les experts pour définir et gérer le « topical steroid withdrawal » — état controversé d'érythème rébound après arrêt des dermocorticoïdes, distinct de la dermatite atopique elle-même. Le consensus privilégie l'arrêt des corticoïdes (topiques et systémiques) avec accompagnement et soutien psychosocial, sans stratégie unique validée. Complète la base : TOPICOP (corticophobie) et le conseil TCS des pharmaciens sont déjà enregistrés — ici, l'angle est le phénomène TSW lui-même.","src":[["PubMed — Dermatitis 2025 Oct 15 (PMID 41090229)","https://pubmed.ncbi.nlm.nih.gov/41090229/"],["Sage Journals — Delphi TSW","https://journals.sagepub.com/doi/10.1177/17103568251388635"],["NIH — TSW diagnostic criteria (communiqué)","https://www.nih.gov/news-events/news-releases/topical-steroid-withdrawal-diagnostic-criteria-defined-nih-researchers"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Face à un patient auto-diagnostiqué « TSW » venant d'internet, ne pas valider ni banaliser — orienter vers le dermatologue, ne jamais conseiller l'arrêt brutal d'un dermocorticoïde efficace, et rappeler que la règle du « doigt unité » et les durées courtes préviennent l'essentiel des problèmes."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2026-03","titre":"Pansements sulfadiazine d'argent vs pansements argent nanocristallin dans les brûlures : revue systématique et méta-analyse","subst":"brûlures · sulfadiazine d'argent · argent nanocristallin · pansements","res":"Revue systématique et méta-analyse (Journal of Clinical Nursing, en ligne le 20/03/2026, PMID 41862967, équipe du Third Military Medical University) comparant les pansements à base de sulfadiazine d'argent et les pansements argent nanocristallin dans la prise en charge locale des brûlures — les extraits permettent de confirmer le design et la date ; les conclusions détaillées sur la cicatrisation et l'infection doivent être lues dans l'article avant d'être citées en chiffres (revue identifiée via PubMed, l'abstract complet reste à ouvrir).","src":[["PubMed — J Clin Nurs 2026 Mar 20 (PMID 41862967)","https://pubmed.ncbi.nlm.nih.gov/41862967/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour une brûlure superficielle mineure, premier geste = refroidissement à l'eau tiède (pas de glace), pansement occlusif simple après avis, jamais de pommades « maison » ; les topiques à l'argent sont des choix d'équipe soignante, et toute brûlure étendue, profonde, du visage, des mains ou de l'enfant = orientation médicale immédiate."},{"dom":"Soins primaires & Officine","type":"Officine","n":2,"dt":"2026-01","titre":"Ulcère veineux de jambe en soins primaires : l'essai randomisé en grappes Ulcus Cruris Care","subst":"ulcère veineux · compression · soins primaires · disease management","res":"Essai randomisé en grappes multicentrique allemand (Ulcus Cruris Care, collection 2026 Jan, PMC12951752) évaluant une approche structurée de disease management en soins primaires pour l'ulcère veineux : l'intervention suggère un bénéfice potentiel mais ne confirme pas son efficacité sur le critère principal (extrait : « a potential benefit... does not confirm its efficacy ») — elle cible des déficits identifiés de la prise en charge ambulatoire, notamment la mise en œuvre insuffisante de la compression. Le travail de fond rappelle que la compression est la mesure la plus importante et reste sous-utilisée.","src":[["PMC — Ulcus Cruris Care trial (collection 2026 Jan)","https://pmc.ncbi.nlm.nih.gov/articles/PMC12951752/"],["PubMed — PMID 41189454","https://pubmed.ncbi.nlm.nih.gov/41189454/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour tout ulcère de jambe, vérifier la compression en place (type, pression, observance), rappeler l'élévation des jambes et la marche quotidienne, surveiller les signes d'infection et de douleur, et s'assurer que le patient suit un avis médical — un ulcère qui ne cicatrise pas en 3 mois doit être réévalué (douleur artérielle ? infection ?)."},{"dom":"Dermatologie & peau","type":"Médicament","n":4,"dt":"2025-08","titre":"Tralokinumab (anti-IL-13) : un an de traitement en vie réelle dans la dermatite atopique (cohorte monocentrique rétrospective)","subst":"tralokinumab · anti-IL-13 · dermatite atopique · vie réelle","res":"Étude rétrospective monocentrique d'un an de tralokinumab chez l'adulte atteint de dermatite atopique (Dermatology and Therapy, numéro d'août 2025, DOI 10.1007/s13555-025-01445-8) : première entrée base pour le tralokinumab (le dupilumab DA et les JAK topiques y figurent déjà) — l'article décrit l'expérience en vie réelle d'un centre ; les extraits vus confirment le design et la date d'issue (Issue date: August 2025), les chiffres d'efficacité précis sont à lire dans l'article avant citation.","src":[["Springer — Dermatol Ther (Heidelb), Issue date August 2025","https://link.springer.com/article/10.1007/s13555-025-01445-8"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le tralokinumab (Adtralza) est un anticorps anti-IL-13 injectable toutes les 2 semaines ; conseils communs aux biothérapies de la DA — conserver au frais, ne jamais interrompre sans avis, poursuite des émollients et du traitement de fond cutané, et rappeler que la réponse peut prendre plusieurs semaines."},{"dom":"Dermatologie & peau","type":"Médicament","n":3,"dt":"2025-03","titre":"Vergetures abdominales : microneedling avec plasma riche en fibrine (PRF) vs plasma riche en plaquettes (PRP) — essai comparatif randomisé","subst":"vergetures · striae distensae · microneedling · PRP · PRF","res":"Essai comparatif randomisé (Archives of Dermatological Research, 19/03/2025, 317(1):602) comparant microneedling + PRF autologue vs microneedling + PRP autologue sur vergetures abdominales : les extraits vus confirment design et date ; le verdict précis entre PRF et PRP doit être lu dans l'article avant d'être cité en chiffres. Aucun traitement des vergetures ne fait illusion : les topiques « anti-vergetures » du rayon para-pharmacie n'ont pas de preuve solide.","src":[["Springer — Arch Dermatol Res 2025 Mar 19;317(1):602","https://link.springer.com/article/10.1007/s00403-025-04135-9"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour la prévention des vergetures de grossesse, hydratation quotidienne et prise de poids régulière restent les seuls conseils fondés ; pour les vergetures installées, être honnête — les procédures (microneedling, laser) relèvent du dermatologue, avec des améliorations partielles au mieux."},{"dom":"Dermatologie & peau","type":"Médicament","n":1,"dt":"2025-08","titre":"Cicatrices hypertrophiques et chéloïdes : vêtements compressifs vs injections de triamcinolone, laser, vérapamil — revue systématique","subst":"cicatrices hypertrophiques · chéloïdes · pression · triamcinolone · laser","res":"Revue systématique PRISMA (Journal of Drugs in Dermatology, numéro d'août 2025, PMID 40773601) comparant vêtements de compression (PGT) et traitements non-PGT (triamcinolone, vérapamil, lasers) : les injections de triamcinolone donnent la plus forte réduction moyenne de sévérité sur l'échelle de Vancouver (82,2 %), devant le laser Nd:YAG (65,44 %) et le vérapamil (chiffres lus dans le résumé JDD). Complément de l'entrée base « gel de silicone + laser » (PRS GO 2026) — ici l'angle est le choix entre modalités, utile pour répondre aux questions de patients sur les cicatrices post-chirurgicales.","src":[["JDD — Systematic review (August 2025 issue)","https://jddonline.com/articles/analysis-of-therapeutic-interventions-hypertrophic-keloid-scarring-systematic-review-S1545961625P8895X/"],["PubMed — PMID 40773601","https://pubmed.ncbi.nlm.nih.gov/40773601/"],["Next Steps in Derm — synthèse 82,2 % VSS","https://nextstepsinderm.com/derm-topics/treating-keloids-and-scars-in-patients-with-skin-of-color/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La prévention reste la clé — massage régulier de la cicatrice, protection solaire stricte pendant plusieurs mois (écrans solaires déjà en base), et pour les patients à tendance chéloïdienne, éviter piercing/tatouage ; les injections de corticoïdes et le laser relèvent du dermatologue."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":2,"dt":"2025-11","titre":"Traitement hormonal de la ménopause et risque cardiovasculaire chez les femmes avec bouffées de chaleur : analyse secondaire des essais randomisés WHI (JAMA Internal Medicine)","subst":"THM · œstrogènes · progestatif · Women's Health Initiative · bouffées de chaleur · risque cardiovasculaire · timing","res":"Analyse secondaire des 2 essais randomisés de la Women's Health Initiative (CEE±MPA) chez les femmes ménopausées avec symptômes vasomoteurs : le traitement hormonal n'augmente pas significativement le risque de maladie cardiovasculaire chez les femmes plus jeunes, mais un surrisque est observé chez les femmes de plus de 70 ans (JAMA Intern Med 2025;185(11):1330-1339, PMID 40952729 — format de citation lu : « JAMA Internal Medicine 185(11):p 1330-1339, November »). Ces données confortent l'hypothèse du « timing » : initié tôt et chez la femme symptomatique de moins de 60 ans / moins de 10 ans depuis la ménopause, le THM n'est pas délétère pour le cœur.","src":[["JAMA Internal Medicine — analyse secondaire WHI","https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2838720"],["Northwestern Feinberg News — 05/12/2025","https://news.feinberg.northwestern.edu/2025/12/05/hormone-therapy-does-not-increase-cardiovascular-disease-risk-in-younger-postmenopausal-women/"],["Ovid — résumé JAMA Intern Med 185(11)","https://www.ovid.com/journals/jaim/abstract/10.1001/jamainternmed.2025.4510~menopausal-hormone-therapy-and-cardiovascular-diseases-in"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Face aux patientes inquiètes par les vieilles alertes WHI de 2002, rappeler que ces données récentes précisent le contexte — c'est l'initiation TARDIVE (plus de 70 ans ici) qui pose problème ; une femme de 50-55 ans avec bouffées de chaleur invalidantes peut être rassurée sur le plan cardiovasculaire si le THM est initié par son médecin dans la fenêtre appropriée."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":2,"dt":"2024-08","titre":"THM et cancers de l'ovaire et de l'endomètre : suivi à long terme des essais randomisés de la Women's Health Initiative (Journal of Clinical Oncology)","subst":"THM · CEE · MPA · cancer de l'ovaire · cancer de l'endomètre · Women's Health Initiative","res":"Suivi à très long terme des 2 essais randomisés WHI (Chlebowski et al., J Clin Oncol 2024;42(30):3537-3549, publié en ligne le 22 août 2024, DOI 10.1200/JCO.23.01918) : l'œstrogène équin conjugué SEUL (femmes hystérectomisées) augmente l'incidence ET la mortalité par cancer de l'ovaire vs placebo, ce que ne fait pas l'association CEE+MPA ; à l'inverse, CEE+MPA réduit significativement l'incidence du cancer de l'endomètre (conclusions lues dans les extraits : « CEE-alone increased ovarian cancer incidence and ovarian cancer mortality, while CEE plus MPA did not... CEE plus MPA significantly reduced endometrial cancer incidence »).","src":[["Journal of Clinical Oncology — JCO.23.01918","https://ascopubs.org/doi/10.1200/JCO.23.01918"],["ObG Project — 09/02/2025","https://www.obgproject.com/2025/02/09/whi-follow-up-study-menopausal-hormone-therapy-and-cancer-mortality/"],["Cancer Therapy Advisor — publié en ligne 22/08/2024","https://www.cancertherapyadvisor.com/news/hormone-therapy-risk-gynecologic-cancers/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Un THM chez une femme SANS utérus reste œstrogène seul — ces données rappellent qu'œstrogène seul et association œstrogène-progestatif n'ont pas le même profil de risque gynécologique ; ne jamais improviser un progestatif « au cas où » ni l'inverse, et renvoyer toute question de schéma au prescripteur."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":4,"dt":"2025-04","titre":"Contraception hormonale contemporaine et risque de thrombose veineuse : cohorte nationale danoise de l'ensemble des femmes de 15-49 ans (JAMA)","subst":"contraception orale · œstrogène · lévonorgestrel · thrombose veineuse · cohorte nationale · Danemark","res":"Cohorte nationale danoise (registres, femmes 15-49 ans sans antécédent de thrombose/cancer) publiée dans JAMA (mise en ligne 15 avril 2025 ; JAMA 2025;333(15):1358-1361, DOI 10.1001/jama.2024.28778) : le risque de thrombose veineuse persiste avec les contraceptifs oraux combinés contemporains — risque relatif de l'ordre de 2,9 vs non-utilisatrices pour les pilules contenant 30-40 µg d'éthinylestradiol avec lévonorgestrel (chiffre lu dans les extraits), avec des variations selon la molécule, la voie (anneau, patch) et la composition.","src":[["JAMA — 10.1001/jama.2024.28778","https://doi.org/10.1001/jama.2024.28778"],["Ovid — JAMA, en ligne le 15 avril 2025","https://www.ovid.com/journals/jama/abstract/10.1001/jama.2024.28778~contemporary-hormonal-contraception-and-risk-of-venous-thromboembolism"],["University of Copenhagen — Vol. 333, No. 15, 2025","https://researchprofiles.ku.dk/en/publications/contemporary-hormonal-contraception-and-risk-of-venous-thromboemb/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message de conseil inchangé mais données actualisées : le choix de la pilule la moins dosée en œstrogène compatible avec la tolérance reste la règle, les progestatifs seuls et les DIU restent les options les moins thrombogènes chez les femmes à risque ; toute patiente avec antécédent thrombotique personnel ou familial doit être orientée vers son médecin avant toute (ré)initiation."},{"dom":"Soins primaires & Officine","type":"Officine","n":4,"dt":"2025-08","titre":"Contraception orale sans ordonnance (Opill) : le passage en accès libre aux États-Unis améliore l'initiation contraceptive dans les populations sous-desservies (JAMA Network Open)","subst":"contraception · accès sans ordonnance · Opill · norgestrel · officine · United States","res":"Étude transversale sur données de base d'une cohorte prospective américaine (JAMA Netw Open 2025;8(8):e2527438, citation lue : « 2025;8(8):e2527438. doi:10.1001/jamanetworkopen.2025.27438 ») : après la mise en vente libre de la pilule progestative (Opill, norgestrel) aux États-Unis, l'obtention d'une contraception orale sans ordonnance améliore l'accès et l'initiation, en particulier chez les plus jeunes et les populations sous-desservies. Éclairage international utile alors que le désogestrel 75 µg est disponible sans ordonnance en France.","src":[["JAMA Network Open — 2025;8(8):e2527438","https://doi.org/10.1001/jamanetworkopen.2025.27438"],["Medscape — accès OTC et populations sous-desservies","https://www.medscape.com/viewarticle/over-counter-oral-contraceptive-access-improves-2025a1000lo5"],["Rheumatology Advisor — OCP OTC et accès à la contraception","https://www.rheumatologyadvisor.com/news/otc-oral-contraceptive-pills-improve-access-to-effective-contraception/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"L'expérience américaine conforte le rôle du comptoir comme point d'entrée de la contraception — en France, pour le désogestrel OTC, toujours faire l'entretien (antécédents thrombose/méningiome, interactions, SAIGNEMENTS inhabituels), remettre le rappel écrit et orienter vers un suivi gynécologique ; l'accès libre ne dispense pas du conseil."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":1,"dt":"2026-10","titre":"Antagonistes oraux de la GnRH versus agonistes dans l'endométriose : revue systématique et méta-analyse d'essais randomisés (Frontiers in Endocrinology)","subst":"endométriose · GnRH antagoniste · agoniste · élagoïx · rélugolix · linzagolix · méta-analyse","res":"Revue systématique et méta-analyse d'ECR (Frontiers in Endocrinology, publié le 14 octobre 2026, DOI 10.3389/fendo.2026.1979544 — date lue sur la page : « Front. Endocrinol., 14 October 2026 ») comparant les antagonistes oraux de la GnRH (élagoïx, rélugolix association, linzagolix) aux agonistes de la GnRH dans la prise en charge de l'endométriose : l'endométriose exige une gestion hormonale individualisée au long cours ; les antagonistes offrent une inhibition immédiate sans flare-up initial et un pilotage posologique de la suppression œstrogénique (extraits de l'article). Sans bousculer les règles françaises de prescription, la méta-analyse précise la place respective des deux classes sur la douleur et la tolérance.","src":[["Frontiers in Endocrinology — 14/10/2026","https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2026.1979544/full"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour une patiente sous antagoniste oral (ex. rélugolix association ou linzagolix avec add-back), insister sur la prise quotidienne à heure régulière, surveiller les signes d'ostéoporose (densité minérale osseuse à suivre par le prescripteur), les bouffées de chaleur et l'interaction avec inducteurs/inhibiteurs enzymatiques ; jamais d'arrêt brutal sans avis médical."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":3,"dt":"2025-07","titre":"Sémaglutide + metformine vs metformine seule chez la femme en surpoids/obésité avec SOPK : essai randomisé contrôlé ouvert (Reproductive Biology and Endocrinology)","subst":"SOPK · sémaglutide · metformine · cycles menstruels · grossesses spontanées · insulino-résistance","res":"Essai randomisé contrôlé ouvert, 100 femmes SOPK en surpoids/obésité (Chen et al., Reprod Biol Endocrinol 2025 Jul 26;23(1):108, citation lue : « 2025 Jul 26;23(1):108. doi: 10.1186/s12958-025-01447-3 », PMID 40713699) : vs metformine seule, l'association sémaglutide+metformine réduit le poids, améliore l'insulino-résistance et les marqueurs inflammatoires, allège les irrégularités menstruelles et augmente les taux de grossesses spontanées (conclusions lues dans l'extrait PubMed : « significantly reduced body weight, improved insulin resistance, decreased inflammatory markers, alleviated menstrual irregularities and increased natural pregnancy rates »). Usage hors AMM SOPK — pas de médicament de fond du SOPK sans prescription médicale.","src":[["PubMed — Reprod Biol Endocrinol 2025 Jul 26;23(1):108 (PMID 40713699)","https://pubmed.ncbi.nlm.nih.gov/40713699/"],["Springer — Reprod Biol Endocrinol 23, 108 (2025)","https://link.springer.com/article/10.1186/s12958-025-01447-3"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les patientes SOPK en surpoids, expliquer que la perte de poids est le traitement le plus rentable (cycles, fertilité), que la metformine reste la base et que tout GLP-1 est sur ordonnance avec un plan de contraception adapté (perte de poids rapide, fertilité qui revient) et supplément/remboursement des règles d'or (pas de grossesse sous GLP-1 en cours d'essai)."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":1,"dt":"2025-05","titre":"Agonistes du récepteur GLP-1 dans le SOPK : méta-analyse d'essais randomisés vs metformine et placebo (Scientific Reports)","subst":"SOPK · GLP-1 · agonistes GLP-1 · liraglutide · sémaglutide · poids · androgènes · méta-analyse","res":"Méta-analyse d'ECR (Lin et al., Sci Rep 2025 May 13;15:16512 — citation lue : « Sci Rep. 2025 May 13;15(1):16512 », DOI 10.1038/s41598-025-99622-4) évaluant les agonistes GLP-1 (vs metformine ou placebo) dans le SOPK : amélioration du poids, de l'homéostasie glucidique et des paramètres hormonaux (androgènes), avec un profil de sécurité compatible. La méta-analyse consolide l'intérêt métabolique des GLP-1 chez la femme SOPK en surpoids, en complément — pas en remplacement — des règles hygiéno-diététiques.","src":[["Scientific Reports — 2025 May 13;15:16512","https://www.nature.com/articles/s41598-025-99622-4"],["EPIC Research — citation Sci Rep 2025;15:16512","https://www.epicresearch.org/articles/glp-1s-lead-to-greater-weight-loss-and-a1c-improvement-than-metformin-in-patients-with-pcos/"],["DOAJ — résumé de la méta-analyse","https://doaj.org/article/1b7df778a2674f11aed70356918abb35"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Reprend les mêmes messages que l'essai sémaglutide : le SOPK est d'abord une maladie métabolique ; un GLP-1 ne se délivre que sur ordonnance, mais le pharmacien a toute sa place sur l'activité physique, l'alimentation et l'observance — et sur la prévention des grossesses non planifiées lorsque la perte de poids relance l'ovulation."},{"dom":"Gynécologie & Ménopause","type":"Médicament","n":4,"dt":"2025-06","titre":"Santé osseuse altérée dans l'insuffisance ovarienne prématurée (IOP) et la ménopause précoce : prévalence et impact du délai diagnostique (Journal of Clinical Medicine)","subst":"ménopause précoce · insuffisance ovarienne prématurée · IOP · POI · densité osseuse · ostéoporose · délai diagnostique","res":"Étude de cohorte hongroise (Debrecen) sur la santé osseuse des femmes avec IOP/ménopause précoce (J Clin Med 2025, 14(12), 4210 — date lue sur la page : « 13 June 2025 ») : prévalence élevée de santé osseuse altérée dans l'IOP et la ménopause précoce, avec un impact du délai entre les symptômes et le diagnostic — plus le diagnostic tarde, plus le capital osseux est amputé par le déficit œstrogénique prolongé. Conforté par les lignes directrices internationales : la substitution œstrogénique est indiquée jusqu'à l'âge naturel de la ménopause chez ces femmes.","src":[["MDPI — J. Clin. Med. 2025, 14(12), 4210 (13/06/2025)","https://www.mdpi.com/2077-0383/14/12/4210"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Devant une femme de moins de 40 ans avec aménorrhée/fatigue, ne pas banaliser ; si un traitement hormonal de l'IOP est délivré (œstrogène ± progestatif), insister sur l'observance au long cours (ce n'est pas une option cosmétique, c'est la protection os et cœur), la vitamine D, le calcium alimentaire, l'activité physique en charge, et alerter sur les arrêts prématurés."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-03","titre":"DoxyPEP : résultats finaux de l'essai randomisé américain (avec extension en ouvert) sur la doxycycline en prophylaxie post-exposition des IST bactériennes (Lancet Infectious Diseases)","subst":"doxycycline · DoxyPEP · prophylaxie post-exposition · IST · chlamydia · gonorrhée · syphilis · MSM · femmes transgenres","res":"Résultats finaux de l'essai multicentrique randomisé en ouvert DoxyPEP (Luetkemeyer et al., Lancet Infect Dis 2025, DOI 10.1016/S1473-3099(25)00085-4 ; publication en ligne le 1er mars 2025, date lue sur ResearchGate : « On Mar 1, 2025, Anne F Luetkemeyer and others published ») chez des hommes ayant des rapports sexuels avec des hommes et des femmes transgenres, avec l'extension en ouvert : la doxycycline en prophylaxie post-exposition (prise après rapport à risque) réduit l'incidence des IST bactériennes (chlamydia, syphilis, et dans une moindre mesure gonorrhée) ; parmi les cultures de gonocoques positives, la résistance aux tétracyclines était de 27 % sous Doxy-PEP vs 24 % sans (chiffres lus dans les extraits), sans événement indésirable grave attribué à la doxycycline. Les auteurs rappellent que le DoxyPEP doit s'inscrire dans une prévention combinée (préservatifs, PrEP VIH, vaccination, dépistage).","src":[["Lancet Infectious Diseases — PIIS1473-3099(25)00085-4","https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(25)00085-4/abstract"],["ResearchGate — publié le 1er mars 2025","https://www.researchgate.net/publication/390183944_Doxycycline_to_prevent_bacterial_sexually_transmitted_infections_in_the_USA_final_results_from_the_DoxyPEP_multicentre_open-label_randomised_controlled_trial_and_open-label_extension"],["Physicians Weekly — résistance tétracyclines 27 % vs 24 %","https://www.physiciansweekly.com/post/doxycycline-reduces-bacterial-stis-in-msm-and-transgender-women"],["EMJ Reviews — citation Lancet Infect Dis 2025","https://www.emjreviews.com/microbiology-infectious-diseases/news/doxycycline-after-sex-significantly-reduces-bacterial-sti-risk/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Sujet sensible à aborder sans jugement — le doxyPEP se délivre sur ordonnance dans un cadre de prévention combinée ; au comptoir, ce sont les messages associés qui comptent : dépistage régulier des IST, observance de la PrEP VIH le cas échéant, rappel photo-protection sous doxycycline ( photosensibilité), et jamais d'automédication d'antibiotique « au cas où »."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":1,"dt":"2026-08","titre":"DoxyPEP : revue systématique et méta-analyse avec analyse séquentielle du test (TSA) sur l'efficacité de la doxycycline post-exposition contre les IST (International Journal of Infectious Diseases)","subst":"doxycycline · DoxyPEP · revue systématique · méta-analyse · trial sequential analysis · IST · antibiorésistance","res":"Revue systématique et méta-analyse avec analyse séquentielle du test (Yamamoto et al., Int J Infect Dis, publié en ligne le 18 août 2026 — citation lue : « 2026 Aug 18:109053. doi: 10.1016/j.ijid.2026.109053 », PMID 42612786) évaluant l'efficacité de la doxycycline en prophylaxie post-exposition pour prévenir les IST bactériennes et déterminant, par TSA, si les preuves accumulées suffisent à des conclusions fiables — un niveau de lecture critique au-delà de la simple méta-analyse, particulièrement pertinent pour une intervention qui soulève la question de la sélection de résistances.","src":[["PubMed — Int J Infect Dis 2026 Aug 18:109053 (PMID 42612786)","https://pubmed.ncbi.nlm.nih.gov/42612786/"],["ScienceDirect — S1201971226006880","https://www.sciencedirect.com/science/article/pii/S1201971226006880"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Cette synthèse conforte le cadre strict du doxyPEP (populations ciblées, prescription médicale, dépistage associé) — pas d'extension d'usage libre ; toute demande de « doxy en prévention » sans ordonnance est à orienter vers le médecin ou un centre CeGIDD."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":1,"dt":"2026-05","titre":"Syphilis : revue systématique et méta-analyse en réseau des alternatives à la benzathine-pénicilline — la doxycycline reste la mieux soutenue (Sexually Transmitted Diseases)","subst":"syphilis · tréponème · benzathine-pénicilline · doxycycline · ceftriaxone · méta-analyse en réseau · pénurie","res":"Revue systématique et méta-analyse en réseau des régimes thérapeutiques alternatifs dans la syphilis infectieuse (PubMed 42096604, publié en ligne le 7 mai 2026 — citation lue : « 2026 May 7. doi: 10.1097/OLQ.0000000000002341 », journal Sexually Transmitted Diseases) : malgré un niveau de preuve globalement faible, la doxycycline est l'alternative la mieux soutenue à la benzathine-pénicilline G pour le traitement de la syphilis — donnée utile dans un contexte de résurgence de la syphilis et de tensions d'approvisionnement rapportées sur la benzathine-pénicilline.","src":[["PubMed — Sex Transm Dis 2026 May 7 (PMID 42096604)","https://pubmed.ncbi.nlm.nih.gov/42096604/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"La pénicilline IM reste le traitement de référence prescrit par le médecin ; pour un patient sous doxycycline (traitement ou alternative), insister sur la durée complète prescrite (pas d'arrêt aux premiers jours), la prise à distance du coucher avec un grand verre d'eau (œsophagite), la photoprotection, et le rappel que le(s) partenaire(s) doivent être dépistés et traités."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2026-08","titre":"Covid long : RECOVER-VITAL, le plus grand essai antiviral dans le covid long (nirmatrelvir-ritonavir 15 ou 25 jours), ne montre aucun bénéfice — l'hypothèse de persistance virale non confirmée par ce schéma (Lancet Infectious Diseases)","subst":"covid long · long COVID · nirmatrelvir · ritonavir · Paxlovid · RECOVER-VITAL · persistance virale · essai de phase 2","res":"Essai randomisé de phase 2 RECOVER-VITAL (Baden et al., Lancet Infect Dis 2026, DOI 10.1016/S1473-3099(26)00406-8, publié le 31 août 2026 — date lue sur ResearchGate : « On Aug 31, 2026, Lindsey R Baden and others published ») : le nirmatrelvir-ritonavir pendant 15 ou 25 jours n'a montré aucune preuve de bénéfice dans le covid long, dans aucun des trois phénotypes étudiés (extraits lus) ; NIH : « Antiviral drug did not improve Long COVID symptoms ».","src":[["Lancet Infectious Diseases — PIIS1473-3099(26)00406-8","https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(26)00406-8/fulltext"],["ResearchGate — publié le 31 août 2026","https://www.researchgate.net/publication/413825788_Nirmatrelvir-ritonavir_targeting_viral_persistence_in_post-COVID-19_condition_long_COVID_in_the_USA_RECOVER-VITAL_a_randomised_double-blind_placebo-controlled_phase_2_trial"],["NIH Research Matters — Antiviral drug did not improve Long COVID symptoms","https://www.nih.gov/news-events/nih-research-matters/antiviral-drug-did-not-improve-long-covid-symptoms"],["RECOVER COVID Initiative — publication","https://recovercovid.org/publications/nirmatrelvir-ritonavir-targeting-viral-persistence-post-covid-19-condition-long-covid"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Message honnête pour les patients qui demandent « un traitement du covid long » : il n'existe toujours pas de médicament validé ; ni Paxlovid ni les cures multiples trouvées en ligne ne sont soutenus par les essais — la prise en charge est symptomatique et coordonnée (médecin traitant, mais aussi vaccination à jour : le risque de covid long diminue avec la vaccination)."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":5,"dt":"2026-10","titre":"Pritelivir (Hovilpri) : premier inhibiteur de l'hélicase-primase oral approuvé par la FDA — HSV mucocutané réfractaire de l'adulte immunodéprimé (octobre 2026)","subst":"pritelivir · Hovilpri · HSV · herpès · hélicase-primase · immunodéprimé · résistance aciclovir · FDA · nouveau mécanisme antiviral","res":"La FDA a approuvé le pritelivir (Hovilpri, Asahi Kasei) — annonce des 9-10 octobre 2026 (dates lues : « Tokyo – October 10, 2026 » sur Drugs.com, « October 09, 2026 » sur Yahoo Finance) — pour le traitement des lésions mucocutanées à HSV réfractaires (avec ou sans résistance) aux antiviraux standards chez l'adulte immunodéprimé : premier représentant ORAL de la classe des inhibiteurs de l'hélicase-primase, un mécanisme distinct des nucléosidiques (aciclovir, valaciclovir) — utile précisément quand le virus est résistant à ceux-ci. Efficacité lue sur Drugs.com : « By Day 28, 63% of Hovilpri-treated participants achieved complete lesion healing compared with 34% » (essai chez l'immunodéprimé). Disponibilité américaine attendue avant fin 2026 ; pas d'AMM européenne vérifiée à ce jour.","src":[["FDA — Approves Drug to Treat Lesions Caused by Herpes Simplex Virus","https://www.fda.gov/drugs/news-events-human-drugs/fda-approves-drug-treat-lesions-caused-herpes-simplex-virus"],["Drugs.com — FDA approves Hovilpri, 10/10/2026","https://www.drugs.com/newdrugs/fda-approves-hovilpri-pritelivir-mucocutaneous-herpes-simplex-virus-hsv-lesions-6910.html"],["Yahoo Finance / Asahi Kasei — 09/10/2026","https://finance.yahoo.com/healthcare/articles/asahi-kasei-therapeutics-announces-fda-224100740.html"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pas encore de produit à délivrer en France — mais c'est un réflexe de conseil à préparer : chez les patients immunodéprimés (transplantés, chimiothérapie) dont les poussées d'herpès « ne répondent plus » au valaciclovir, il existe désormais une classe orale de recours à évoquer avec le médecin ; ne jamais banaliser un herpès étendu ou atypique chez l'immunodéprimé."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":5,"dt":"2026-04","titre":"IDVYNSO (doravirine/islatravir) : la FDA approuve le premier comprimé unique quotidien à 2 molécules NON-INSTI du VIH — avril 2026 (Merck)","subst":"doravirine · islatravir · IDVYNSO · VIH · NNRTI · NRTI · deux molécules · sans ténofovir · observance","res":"La FDA a approuvé IDVYNSO (doravirine/islatravir, Merck) — annonce datée du 21 avril 2026 (Business Wire : « 20260421493721 ») — pour remplacer le traitement antirétroviral chez les adultes VIH+ virologiquement supprimés, sans historique d'échec virologique ni mutations de résistance connues à la doravirine : premier et seul régime complet à deux molécules NON-INSTI, sans ténofovir, en une prise orale quotidienne (extraits du communiqué Merck lus : « the first and only non-INSTI, tenofovir-free, once-daily, complete two-drug regimen ») — la doravirine est un NNRTI, l'islatravir un NRTI de nouvelle génération à mécanismes multiples (inhibition de la translocation). Les données de phase 3 (CROI 2026, 3 essais) ont montré la non-infériorité vs BIC/FTC/TAF à la semaine 48 (communiqués Merck lus).","src":[["Merck — FDA Approves Once-Daily IDVYNSO","https://www.merck.com/news/fda-approves-mercks-once-daily-idvynso-doravirine-islatravir/"],["Business Wire — 21/04/2026","https://www.businesswire.com/news/home/20260421493721/en/FDA-Approves-Mercks-Once-Daily-IDVYNSO-doravirineislatravir"],["Merck — phase 3 CROI 2026 (3 essais)","https://www.merck.com/news/merck-announces-late-breaking-data-from-three-phase-3-trials-evaluating-doravirine-islatravir-dor-isl-an-investigational-once-daily-two-drug-regimen-for-the-treatment-of-adults-living-with-hiv-1/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les patients VIH+ stables, une option de simplification à deux molécules arrive — pas encore disponible en France (évaluation européenne à suivre) ; les enjeux offici(na)ux restent l'observance à heure fixe, la vérification des interactions (la doravirine est un substrat du CYP3A4 — inducteurs enzymatiques à signaler) et le rappel que toute simplification de trithérapie se fait par le prescripteur hospitalier, jamais au comptoir."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":2,"dt":"2025-05","titre":"Hépatite C : essai randomisé factoriel en ouvert comparant des options de traitement simplifiées pour soutenir l'élimination (Cooke et al., Lancet)","subst":"hépatite C · VHC · antiviraux à action directe · AAD · simplification · élimination · essai factoriel · Lancet","res":"Essai randomisé factoriel en ouvert de non-infériorité (Cooke et al., Lancet 2025 May 17;405(10491):1769-1780 — citation lue sur PubMed : « 2025 May 17;405(10491):1769-1780 », PMID 40347964, DOI 10.1016/S0140-6736(25)00097-2) comparant des options de traitement du VHC conçues pour soutenir l'objectif d'élimination (simplification des parcours de test→traitement), dans la lignée des recommandations OMS de traiter au-delà des modèles spécialisés classiques. L'OMS recommande des traitements simplifiés à l'échelle décentralisée ; cet essai en apporte la preuve d'implémentation randomisée.","src":[["PubMed — Lancet 2025 May 17;405(10491):1769-1780 (PMID 40347964)","https://pubmed.ncbi.nlm.nih.gov/40347964/"],["The Lancet — PIIS0140-6736(25)00097-2","https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(25)00097-2/fulltext"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Le pharmacien est un maillon identifié du dépistage/des soins du VHC (risque chez les usagers de drogues, tatouages, migrants de zones d'endémie, boomers) — savoir orienter vers les TRO et les centres de dépendance ; pour un patient sous AAD (8-12 semaines), l'observance jusqu'au bout est la clé de la guérison définitive et il n'y a pas de « dose oubliée à doubler »."},{"dom":"Infectiologie & Vaccins","type":"Alerte","n":5,"dt":"2026-07","titre":"Gonocoque résistant à la ceftriaxone : l'ECDC alerte sur une flambée avec transmission locale documentée dans l'UE/EEE et au Royaume-Uni (évaluation des risques du 16 juillet 2026)","subst":"gonorrhée · Neisseria gonorrhoeae · ceftriaxone · résistance · XDR · ECDC · Europe · surveillance","res":"Évaluation des risques ECDC « Upsurge in ceftriaxone-resistant Neisseria gonorrhoeae with evidence of domestic transmission in the EU/EEA and the UK » datée du 16 juillet 2026 (date lue dans les extraits : « 16 July 2026. ECDC: Stockholm; 2026 ») : depuis 2022 et jusqu'au 8 mai 2026 (données lues dans le PDF), un nombre croissant de pays européens rapportent des isolats résistants ou de sensibilité diminuée à la ceftriaxone, dont des souches MDR et XDR, avec des preuves de transmission domestique (pas seulement importée). Complément utile : la Thaïlande rapporte des souches portant penA-60 (EID, juin 2026). La zoliflodacine (déjà en base) garde son intérêt face à cette résistance.","src":[["ECDC — Risk assessment, 16 July 2026","https://www.ecdc.europa.eu/en/publications-data/risk-assessment-upsurge-ceftriaxone-resistant-neisseria-gonorrhoeae-evidence"],["ECDC — PDF de l'évaluation (données au 08/05/2026)","https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf"],["ECDC — Drug-resistant gonorrhoea on the rise in Europe","https://www.ecdc.europa.eu/en/news-events/drug-resistant-gonorrhoea-rise-europe-ecdc-warns"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Renforcer le conseil : une gonorrhée « qui ne guérit pas » après traitement doit être re-signalée au médecin (échec thérapeutique possible) ; dépistage des partenaires indispensable ; pas d'antibiothérapie probabiliste des IST au comptoir ; et rappel que la lutte passe par le préservatif et le dépistage régulier des populations exposées."},{"dom":"Infectiologie & Vaccins","type":"Alerte","n":5,"dt":"2026-04","titre":"Rapport mondial OMS sur les hépatites 2026 : progression réelle vers l'élimination mais hors trajectoire pour 2030 — les hépatites B et C tuent plus que jamais (OMS, 28 avril 2026)","subst":"OMS · hépatite B · hépatite C · rapport mondial 2026 · élimination 2030 · charge mondiale · santé publique","res":"Rapport mondial de l'OMS sur les hépatites 2026 (Global hepatitis report 2026, publié le 28 avril 2026 — date lue sur le communiqué OMS : « 28-04-2026 ») : l'évaluation la plus complète à ce jour de la charge mondiale des hépatites B et C, qui représentent ensemble plus de 95 % des décès liés aux hépatites virales (extraits lus) ; des gains mesurables sont constatés (dépistage, traitement), mais un renforcement de l'action est nécessaire pour tenir les cibles 2030 (−95 % de nouvelles infections, −80 % de mortalité pour le VHB ; l'OMS a lancé le 10 mars 2026 le premier manuel d'implémentation et classé l'hépatite D comme carcinogène le 28 juillet 2025 — dates lues dans le communiqué).","src":[["OMS — Global hepatitis report 2026","https://www.who.int/publications/i/item/9789240122383"],["OMS — communiqué du 28/04/2026","https://www.who.int/news/item/28-04-2026-efforts-to-eliminate-hepatitis-delivers-gains-but-more-action-needed-to-meet-2030-targets"],["Lancet Gastroenterology & Hepatology — commentaire du rapport","https://www.thelancet.com/journals/langas/article/PIIS2468-1253(26)00220-7/fulltext"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Les hépatites silencieuses se dépistent — réflexes d'orientation au comptoir : personnes ayant reçu des soins ou tatouages à l'étranger dans des zones d'endémie, usagers passés ou actifs de drogues IV/ intranasales, entourage familial d'un porteur ; vaccination contre l'hépatite B à jour (y compris rattrapage adulte) ; et pour les porteurs chroniques B ou C traités, l'observance et le suivi hépatique restent des points de conseil permanents."},{"dom":"Infectiologie & Vaccins","type":"Médicament","n":4,"dt":"2026-07","titre":"PrEP VIH : données vie réelle de la cohorte OPERA — aucune infection à VIH chez 315 femmes sous cabotégravir injectable, malgré des retards fréquents d'injections (AIDS 2026, Rio, 26-31 juillet)","subst":"cabotégravir · PrEP · VIH · cohorte OPERA · vie réelle · femmes · injections retardées · longue durée","res":"Analyse vie réelle de la cohorte OPERA présentée à la 26e conférence internationale sur le sida (AIDS 2026, Rio de Janeiro, 26-31 juillet 2026 — dates de la conférence lues sur AVAC : « took place in Rio de Janeiro, Brazil, and virtually from the 26-31 July 2026 ») : aucune infection à VIH n'a été observée parmi 315 femmes utilisant le cabotégravir longue durée en PrEP (extraits lus sur Contagion Live et Epividian : « no HIV infections among 315 women using long-acting cabotegravir for PrEP, despite frequent short delays in maintenance injections »), avec une satisfaction élevée des utilisatrices. Complément vie réelle aux essais HPTN 083/084 — la fenêtre d'efficacité tolère les délais courts, sans license pour l'approximation.","src":[["Contagion Live — OPERA cohort, 315 femmes","https://www.contagionlive.com/view/no-hiv-infections-cabotegravir-prep-real-world-study"],["AVAC — AIDS 2026, Rio, 26-31 juillet 2026","https://avac.org/event/aids-2026/"],["Epividian — données OPERA à AIDS 2026","https://www.epividian.com/announcements/"]],"coi":"À vérifier","fin":"Financement non lisible dans les sources consultées.","off":"Pour les patientes sous cabotégravir injectable (2 injections tous les 2 mois), le rôle offici
